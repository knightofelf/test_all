<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Big Number Bezier Gorilla Game</title>
<style>
  body { background:#0b0f19; color:#00ffcc; font-family:Courier New; text-align:center; }
  canvas { background:#050811; border:1px solid #1f2e4d; margin-top:20px; }
</style>
</head>
<body>
<h1>Big Number Bezier Gorilla Game</h1>
<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
const ctx = document.getElementById("gameCanvas").getContext("2d");

// 플레이어와 타겟
const player = { x: 80, y: 320 };
const target = { x: 700, y: 320, r: 20 };

// 아주 큰 수 입력
const big1 = "289735723509273097203740928734007230472034";
const big2 = "237498739847283479823749873298472344985";

// 제어점 계산 (큰 수 끝자리 활용)
function getControlPoints() {
  const c1 = Number(big1.slice(-5)) % 200; // 끝자리 5자리
  const c2 = Number(big2.slice(-5)) % 300; // 끝자리 5자리
  return [
    { x: 250, y: 100 + c1 },
    { x: 500, y: 100 + c2 }
  ];
}
let controls = getControlPoints();

// 3차 Bezier 계산
function cubicBezier(p0, p1, p2, p3, t) {
  const u = 1 - t;
  const tt = t*t, uu = u*u;
  const uuu = uu*u, ttt = tt*t;
  return {
    x: uuu*p0.x + 3*uu*t*p1.x + 3*u*tt*p2.x + ttt*p3.x,
    y: uuu*p0.y + 3*uu*t*p1.y + 3*u*tt*p2.y + ttt*p3.y
  };
}

// 애니메이션 루프
let t = 0;
function animate() {
  ctx.clearRect(0,0,800,400);

  // 타겟
  ctx.beginPath();
  ctx.arc(target.x,target.y,target.r,0,Math.PI*2);
  ctx.strokeStyle="#ff007f"; ctx.stroke();

  // 궤적 가이드라인
  ctx.beginPath();
  ctx.moveTo(player.x,player.y);
  ctx.bezierCurveTo(controls[0].x,controls[0].y,controls[1].x,controls[1].y,target.x,target.y);
  ctx.strokeStyle="rgba(0,255,204,0.3)";
  ctx.stroke();

  // 포탄 위치
  const bullet = cubicBezier(player,controls[0],controls[1],target,t);
  ctx.beginPath();
  ctx.arc(bullet.x,bullet.y,6,0,Math.PI*2);
  ctx.fillStyle="#00ffcc"; ctx.fill();

  // 충돌 판정
  const dx = bullet.x-target.x, dy = bullet.y-target.y;
  if(Math.sqrt(dx*dx+dy*dy)<target.r){
    ctx.fillStyle="#ff007f";
    ctx.fillText("HOLE IN ONE!", target.x-40, target.y-40);
    setTimeout(()=>{ t=0; controls=getControlPoints(); },1500);
  }

  // 진행
  if(t<1) t+=0.01;
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
