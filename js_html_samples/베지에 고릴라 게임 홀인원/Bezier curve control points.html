<canvas id="gameCanvas" width="600" height="400"></canvas>
<script>
const ctx = document.getElementById("gameCanvas").getContext("2d");

// Bezier curve control points
const p0 = {x: 50, y: 350};
const p1 = {x: 200, y: 100};
const p2 = {x: 400, y: 100};
const p3 = {x: 550, y: 350};

// Hole target
const hole = {x: 550, y: 350, r: 15};

// Bezier function
function bezier(t, p0, p1, p2, p3) {
  const x = Math.pow(1-t,3)*p0.x + 3*Math.pow(1-t,2)*t*p1.x + 3*(1-t)*Math.pow(t,2)*p2.x + Math.pow(t,3)*p3.x;
  const y = Math.pow(1-t,3)*p0.y + 3*Math.pow(1-t,2)*t*p1.y + 3*(1-t)*Math.pow(t,2)*p2.y + Math.pow(t,3)*p3.y;
  return {x,y};
}

// Draw curve and check hole
ctx.beginPath();
ctx.moveTo(p0.x, p0.y);
for (let t=0; t<=1; t+=0.01) {
  const {x,y} = bezier(t,p0,p1,p2,p3);
  ctx.lineTo(x,y);
  // Collision check
  const dx = x - hole.x, dy = y - hole.y;
  if (Math.sqrt(dx*dx+dy*dy) < hole.r) {
    ctx.fillStyle = "red";
    ctx.fillText("Hole in One!", hole.x-30, hole.y-30);
  }
}
ctx.stroke();

// Draw hole
ctx.beginPath();
ctx.arc(hole.x,hole.y,hole.r,0,Math.PI*2);
ctx.stroke();
</script>
