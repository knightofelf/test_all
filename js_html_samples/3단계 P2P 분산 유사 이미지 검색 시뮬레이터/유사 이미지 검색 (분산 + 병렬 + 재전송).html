<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>P2P 유사 이미지 검색 3단계</title>
</head>
<body>
  <h2>유사 이미지 검색 (분산 + 병렬 + 재전송)</h2>
  <input type="text" id="query" placeholder="검색어 입력">
  <button onclick="search()">검색</button>
  <div id="result"></div>

  <script>
    // 1단계: 분산 저장 (노드 시뮬레이션)
    const nodes = [
      ["사과", "바나나", "포도"],
      ["고양이", "강아지", "호랑이"],
      ["자동차", "자전거", "버스"]
    ];

    // 2단계: 병렬 검색
    function parallelSearch(query) {
      return Promise.all(nodes.map((node, idx) => {
        return new Promise((resolve, reject) => {
          // 검색 시뮬레이션 (랜덤 실패 발생)
          setTimeout(() => {
            if (Math.random() < 0.2) {
              reject(`노드 ${idx} 검색 실패`);
            } else {
              const found = node.filter(item => item.includes(query));
              resolve({node: idx, result: found});
            }
          }, 300);
        });
      }));
    }

    // 3단계: 재전송 처리
    async function search() {
      const query = document.getElementById("query").value;
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "검색 중...";

      try {
        let results = await parallelSearch(query);
        resultDiv.innerHTML = JSON.stringify(results, null, 2);
      } catch (error) {
        resultDiv.innerHTML = error + "<br>재전송 시도 중...";
        // 재전송 (실패한 경우 다시 검색)
        try {
          let retryResults = await parallelSearch(query);
          resultDiv.innerHTML = JSON.stringify(retryResults, null, 2);
        } catch (retryError) {
          resultDiv.innerHTML = "검색 실패: " + retryError;
        }
      }
    }
  </script>
</body>
</html>
