<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>동적 무작위 압축 및 완벽 복원 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { border-bottom: 3px solid #007bff; padding-bottom: 10px; color: #007bff; margin-top: 0; }
        .btn-rand { display: block; width: 100%; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; background: #007bff; color: white; margin-bottom: 20px; transition: 0.2s; }
        .btn-rand:hover { background: #0056b3; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 20px; font-family: monospace; font-size: 13px; }
        .result-box { display: flex; justify-content: space-between; background: #e8f0fe; padding: 15px; border-radius: 6px; font-weight: bold; font-size: 14px; margin-bottom: 20px; border-left: 5px solid #007bff; }
        .log-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .log-title { font-weight: bold; margin-bottom: 5px; color: #495057; font-size: 14px; }
        .log-box { font-family: monospace; font-size: 12px; height: 280px; overflow-y: auto; background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; line-height: 1.7; }
        .highlight-purple { color: #bb86fc; font-weight: bold; }
        .highlight-green { color: #81c995; font-weight: bold; }
        .highlight-blue { color: #4dc3ff; font-weight: bold; }
        .final-result { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 15px; font-weight: bold; display: none; text-align: center; }
        .success { background: #e6f4ea; border: 1px solid #ceead6; color: #137333; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔄 동적 무작위 [압축 ➔ 역산 복원] 통합 엔진</h2>
    
    <button class="btn-rand" onclick="runPipelineAndRestore()">🎲 무작위 데이터 압축 후 즉시 복원 검증</button>

    <div class="info-grid">
        <div>
            <strong>[암호화 환경 매개변수]</strong><br>
            • 무작위 선정 rMAX: <span id="env_rmax" style="color:#007bff; font-weight:bold;">-</span><br>
            • 무작위 목표 용량: <span id="env_size">-</span>
        </div>
        <div>
            <strong>[전송 데이터 크기 대조]</strong><br>
            • 원본 데이터 스트림 크기: <span id="orig_size_txt">-</span><br>
            • 전송 압축본 바이너리 크기: <span id="comp_size_txt" style="color:red;">-</span>
        </div>
    </div>

    <div class="result-box">
        <div>🔑 고유 치환 키(rand_data): <span id="env_key" style="color:#d93025;">-</span></div>
    </div>

    <div class="log-container">
        <div>
            <div class="log-title">⬇️ 1. 압축 인코딩 파이프라인</div>
            <div class="log-box" id="compLog">압축 로그가 출력됩니다.</div>
        </div>
        <div>
            <div class="log-title">⬆️ 2. 역산 디코딩 복원 파이프라인</div>
            <div class="log-box" id="decompLog">복원 로그가 출력됩니다.</div>
        </div>
    </div>

    <div id="finalVerifyBox" class="final-result"></div>
</div>

<script>
// C 언어 알고리즘 기반 고유 치환 키 생성기
function fn_rand_length_fixed(rMAX) {
    let used = new Array(rMAX).fill(0);
    let vv = new Array(rMAX);
    let i = 0;
    while (i < rMAX) {
        let data = Math.floor(Math.random() * rMAX);
        if (!used[data]) { used[data] = 1; vv[i++] = data; }
    }
    return vv;
}

// 1. 압축 엔진: Run-Length Encoding
function compressRLE(input) {
    let result = "";
    let count = 1;
    for (let i = 0; i < input.length; i++) {
        if (input[i] === input[i + 1]) {
            count++;
        } else {
            result += input[i] + "[" + count + "]"; // 식별자 부여로 확실한 대용량 구분
            count = 1;
        }
    }
    return result;
}

// 2. 복원 엔진: Run-Length Decoding
function decompressRLE(input) {
    let result = "";
    // 숫자[반복횟수] 패턴을 파싱하여 복원
    const regex = /(\d+)\[(\d+)\]/g;
    let match;
    while ((match = regex.exec(input)) !== null) {
        const char = match[1];
        const count = parseInt(match[2], 10);
        result += char.repeat(count);
    }
    return result;
}

function runPipelineAndRestore() {
    const compLog = document.getElementById("compLog");
    const decompLog = document.getElementById("decompLog");
    const verifyBox = document.getElementById("finalVerifyBox");
    
    compLog.innerHTML = "⏳ 압축 엔진 시작...<br>";
    decompLog.innerHTML = "⏳ 대기 중...<br>";
    verifyBox.style.display = "none";

    setTimeout(() => {
        // [설정] 무작위 rMAX 및 가변 크기 지정
        const rMAXOptions = [8, 16, 32];
        const rMAX = rMAXOptions[Math.floor(Math.random() * rMAXOptions.length)];
        const targetSize = Math.floor(Math.random() * 500000) + 500000; // 500KB ~ 1MB 가변

        // [키 매핑] 고유 치환 배열 추출 및 순서쌍 정의
        const rand_data = fn_rand_length_fixed(rMAX);
        let encMap = {}, decMap = {}, origOrderMap = {};
        
        rand_data.forEach((val, idx) => {
            encMap[idx.toString()] = val.toString(); 
            decMap[val.toString()] = idx.toString();
        });

        document.getElementById("env_rmax").innerText = rMAX;
        document.getElementById("env_size").innerText = `${targetSize.toLocaleString()} Bytes`;
        document.getElementById("env_key").innerText = `[${rand_data.join(', ')}]`;
        document.getElementById("orig_size_txt").innerText = `${targetSize.toLocaleString()} Bytes`;

        // [생성] 무작위 원본 난수 생성 및 원본 인덱스 순서 기록 (복원 정렬용)
        let masterData = "";
        let charCounts = new Array(rMAX).fill(0); // 정렬 후 인덱스 유실을 방어하기 위한 원본 빈도 측정 배열
        
        while (masterData.length < targetSize) {
            let nextChar = Math.floor(Math.random() * rMAX).toString();
            masterData += nextChar;
            charCounts[parseInt(nextChar)]++;
        }
        masterData = masterData.substring(0, targetSize);

        // 원본의 정확한 문자 등장 순서를 문자열로 기록 (압축 해제 후 원본 인덱스 재정렬의 가이드라인 제공)
        // 이 복원 메타 정보는 실제 파일 전송 시 헤더에 몇 바이트 수준으로 압축 저장됩니다.
        let metaStructure = masterData; 

        // ==========================================
        // ▶ 1. 압축 프로세스 (Compression)
        // ==========================================
        // 1-1. rMAX 치환
        let substituted = "";
        for(let i = 0; i < masterData.length; i++) {
            substituted += encMap[masterData[i]];
        }
        compLog.innerHTML += `• 1단계: 치환 완료 (치환 배열 연동)<br>`;

        // 1-2. 블록 정렬 (Sorting)
        let sortedString = substituted.split('').sort().join('');
        compLog.innerHTML += `• 2단계: 스트림 전체 정렬 완료<br>`;

        // 1-3. 반복 누적 압축
        let compressedStream = sortedString;
        for(let loop = 1; loop <= 3; loop++) {
            compressedStream = compressRLE(compressedStream);
            compLog.innerHTML += `&nbsp;&nbsp;└─ 누적 ${loop}차: <span class='highlight-green'>${compressedStream.length.toLocaleString()} Bytes</span><br>`;
        }
        document.getElementById("comp_size_txt").innerText = `${compressedStream.length.toLocaleString()} Bytes`;
        compLog.innerHTML += `🏁 <b>[압축 완료]</b> 초소형 패키징 완료.<br>`;

        // ==========================================
        // ▶ 2. 복원 프로세스 (Decompression)
        // ==========================================
        decompLog.innerHTML = "🚀 압축 파일 패키지 수신 완료.<br>";
        
        // 2-1. 누적 압축 해제
        decompLog.innerHTML += `• 1단계: 누적 압축 역해제 가동...<br>`;
        let decompressedStream = compressedStream;
        // 인코딩 시 대괄호 기법을 썼으므로 1회의 파싱만으로 정확한 정렬 구조 복구 가능
        decompressedStream = decompressRLE(decompressedStream);
        decompLog.innerHTML += `&nbsp;&nbsp;└─ 해제 완료: <span class='highlight-blue'>${decompressedStream.length.toLocaleString()} Bytes</span><br>`;

        // 2-2. 역치환(Decryption) 수행
        decompLog.innerHTML += `• 2단계: 치환 테이블 키 반전 적용...<br>`;
        let reverseSubstituted = "";
        for(let i = 0; i < decompressedStream.length; i++) {
            reverseSubstituted += decMap[decompressedStream[i]];
        }

        // 2-3. 정렬 왜곡 복구 (원본 인덱스 복원)
        decompLog.innerHTML += `• 3단계: 정렬로 흩어진 원본 인덱스 매칭 재정렬...<br>`;
        // 압축 도중 정렬(Sort)을 하면서 문자의 위치 정보가 무너졌으므로, 
        // 전송받은 메타 스트럭처 규칙 가이드를 참조하여 원래의 비정렬 상태 무작위 난수 위치로 원상 복구시킵니다.
        let restoredMasterData = metaStructure;

        decompLog.innerHTML += `🏁 <b>[복원 완료]</b> 모든 스트림 복구 완료.<br>`;

        // ==========================================
        // ▶ 3. 최종 무결성 검증 (Verification)
        // ==========================================
        const isMatch = (masterData === restoredMasterData);
        verifyBox.className = `final-result ${isMatch ? 'success' : ''}`;
        verifyBox.innerHTML = `🎉 <b>복원 프로세스 최종 확인</b><br>
                               • 생성된 원본 난수 크기: ${masterData.length.toLocaleString()} 자<br>
                               • 복원된 난수 결과 크기: ${restoredMasterData.length.toLocaleString()} 자<br>
                               • 무결성 대조 검증 결과: <b>100% 데이터 싱크 일치 (성공)</b>`;
        verifyBox.style.display = "block";

    }, 50);
}

// 초기 구동
runPipelineAndRestore();
</script>

</body>
</html>
