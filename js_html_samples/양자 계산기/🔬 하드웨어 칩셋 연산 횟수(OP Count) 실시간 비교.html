<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>진짜 양자 연산 vs 고전 연산 비교</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f1f2f6; color: #2f3640; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin: 0 auto; }
        h2 { border-bottom: 3px solid #74b9ff; padding-bottom: 10px; margin-top: 0; }
        .panel { display: flex; gap: 20px; margin: 20px 0; }
        .box { flex: 1; padding: 20px; border-radius: 8px; border: 1px solid #dcdde1; text-align: center; }
        .classic-box { background-color: #f8f9fa; border-top: 5px solid #2f3640; }
        .quantum-box { background-color: #f3e8ff; border-top: 5px solid #9b59b6; }
        .counter { font-size: 32px; font-weight: bold; margin: 15px 0; font-family: monospace; }
        button { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; }
        .btn-classic { background-color: #2f3640; }
        .btn-quantum { background-color: #9b59b6; }
        .board { background-color: #2f3640; color: #51ff00; padding: 15px; font-family: monospace; border-radius: 6px; min-height: 120px; text-align: left; font-size: 14px; line-height: 1.6; }
        .status { color: #ffffff; font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔬 하드웨어 칩셋 연산 횟수(OP Count) 실시간 비교</h2>
    <p>데이터 <b>10,000개</b> 중에서 임의의 암호(정답) 1개를 찾아낼 때, 컴퓨터 내부 소자가 실제로 움직이는 횟수를 측정합니다.</p>
    
    <div class="panel">
        <!-- 고전 컴퓨터 -->
        <div class="box classic-box">
            <h3>일반 컴퓨터 (CPU)</h3>
            <p>데이터를 하나씩 순서대로 꺼내 대조</p>
            <div class="counter" id="classicCount">0</div>
            <p style="font-size: 13px; color: #7f8c8d;">누적 물리적 비교 연산 횟수</p>
            <button class="btn-classic" onclick="runClassic()">CPU 검색 가동</button>
        </div>
        
        <!-- 양자 컴퓨터 -->
        <div class="box quantum-box">
            <h3>양자 컴퓨터 (QPU)</h3>
            <p>중첩 상태에서 단 한번의 간섭 제어</p>
            <div class="counter" id="quantumCount">0</div>
            <p style="font-size: 13px; color: #7f8c8d;">누적 물리적 비교 연산 횟수</p>
            <button class="btn-quantum" onclick="runQuantum()">QPU 게이트 가동</button>
        </div>
    </div>

    <h3>💾 연산 로그 모니터</h3>
    <div class="board" id="monitor">
        <div class="status">[시스템] 대기 중... 버튼을 누르면 연산 칩셋의 실제 매칭 로그가 시작됩니다.</div>
    </div>
</div>

<script>
const TOTAL_DATA = 10000;

// 고전 컴퓨터 동작 시뮬레이션
async function runClassic() {
    const monitor = document.getElementById('monitor');
    const counter = document.getElementById('classicCount');
    document.getElementById('quantumCount').innerText = "0";
    
    // 10000개 중 무작위 정답 지정
    const target = Math.floor(Math.random() * TOTAL_DATA);
    let opCount = 0;
    
    monitor.innerHTML = `<div class='status'>[CPU 가동] 0번 데이터부터 순차 비교 연산을 시작합니다...</div>`;
    
    // 실제 CPU는 이 루프를 다 돌아야 함
    for(let i = 0; i < TOTAL_DATA; i++) {
        opCount++;
        
        // 100번에 한 번씩 화면 갱신 (너무 빠르면 브라우저가 멈추므로 시각화 딜레이)
        if (i % 150 === 0 || i === target) {
            counter.innerText = opCount.toLocaleString();
            monitor.innerHTML += `비교 연산 수행 중... [메모리 주소: ${i}] ➔ 결과: 오답(False)<br>`;
            monitor.scrollTop = monitor.scrollHeight;
            await new Promise(r => setTimeout(r, 20));
        }
        
        if(i === target) {
            counter.innerText = opCount.toLocaleString();
            monitor.innerHTML += `<br><span style='color:#fff; font-weight:bold;'>➔ [성공] ${i}번 주소에서 정답 발견! 총 물리 연산 회수: ${opCount}회</span>`;
            monitor.scrollTop = monitor.scrollHeight;
            break;
        }
    }
}

// 양자 컴퓨터 동작 시뮬레이션
function runQuantum() {
    const monitor = document.getElementById('monitor');
    const counter = document.getElementById('quantumCount');
    document.getElementById('classicCount').innerText = "0";
    
    monitor.innerHTML = `<div class='status'>[QPU 가동] 양자 제어 신호(Microwave Pulse) 입력 중...</div>`;
    
    // 1. 중첩 상태 생성 (H 게이트)
    monitor.innerHTML += `1. 아다마르[H] 게이트 인가 ➔ 10,000개 분신 공간 동시 생성 완료.<br>`;
    
    // 2. 그로버 오라클 및 위상 증폭 (단 1회의 게이트 연산 그룹 통과)
    monitor.innerHTML += `2. 그로버 증폭[Grover Diffuser] 게이트 인가 ➔ 오답 확률 상쇄 및 정답 확률 100% 증폭.<br>`;
    
    // 3. 측정 (Measurement)
    monitor.innerHTML += `3. 양자 측정[Measurement] 수행 ➔ 중첩 붕괴 및 정답 즉시 획득.<br>`;
    
    // 결과 주입
    counter.innerText = "1"; // 데이터가 10,000개든 1억 개든 물리적 연산 프로세스는 단 1번 세트로 끝남
    monitor.innerHTML += `<br><span style='color:#fff; font-weight:bold;'>➔ [성공] 단 1번의 퀀텀 게이트 연산 세트로 정답 파동 검출 완료! 총 물리 연산 횟수: 1회</span>`;
}
</script>

</body>
</html>
