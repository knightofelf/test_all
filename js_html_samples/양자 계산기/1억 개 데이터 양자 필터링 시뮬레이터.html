<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1억 개 데이터 양자 필터링 시뮬레이터</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f1f2f6; color: #2f3640; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin: 0 auto; }
        h2 { border-bottom: 3px solid #e67e22; padding-bottom: 10px; margin-top: 0; color: #d35400; }
        .box { background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #dcdde1; margin: 20px 0; }
        .counter-container { display: flex; justify-content: space-between; gap: 20px; margin-top: 15px; }
        .count-card { flex: 1; background: #fff; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .count-card h4 { margin: 0 0 10px 0; color: #7f8c8d; }
        .num { font-size: 26px; font-weight: bold; font-family: monospace; }
        .classic-num { color: #c0392b; }
        .quantum-num { color: #9b59b6; }
        button { width: 100%; padding: 15px; font-size: 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; background-color: #e67e22; }
        button:hover { background-color: #d35400; }
        .log { background-color: #2f3640; color: #51ff00; padding: 20px; font-family: monospace; border-radius: 6px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ 100,000,000(1억) 개 데이터 양자 필터링</h2>
    <p>1억 개의 무작위 공간 중 숨겨진 단 하나의 타겟을 찾아낼 때, 물리적 연산 횟수의 격차를 수학적으로 증명합니다.</p>
    
    <button onclick="runOneHundredMillionSimulation()">1억 개 대상 양자 간섭 연산 시작</button>

    <div class="counter-container">
        <div class="count-card">
            <h4>일반 컴퓨터 예상 대조 횟수</h4>
            <div class="num classic-num" id="classicVal">0회</div>
            <p style="font-size:12px; color:#95a5a6; margin:5px 0 0 0;">(평균 5천만 번, 최대 1억 번 대조)</p>
        </div>
        <div class="count-card">
            <h4>양자 컴퓨터 물리 게이트 회전 횟수</h4>
            <div class="num quantum-num" id="quantumVal">0회</div>
            <p style="font-size:12px; color:#95a5a6; margin:5px 0 0 0;">(수학적 상쇄 간섭 주기 공식)</p>
        </div>
    </div>

    <div class="box">
        <h3>📊 1억 차원 퀀텀 메커니즘 로그</h3>
        <div class="log" id="logBox">버튼을 누르면 1억 개 차원의 파동 에너지 제어 연산이 시작됩니다.</div>
    </div>
</div>

<script>
function runOneHundredMillionSimulation() {
    const N = 100000000; // 1억 개 데이터
    const logBox = document.getElementById('logBox');
    
    // 1억 개 중 임의의 정답 인덱스 가상 지정 (예: 74,123,456번 방)
    const targetIdx = Math.floor(Math.random() * (N - 100000)) + 50000;
    
    logBox.innerText = `[1억 차원 양자 회로 가동]\n`;
    logBox.innerText += `1. 27개의 큐비트에 H 게이트 인가 (2^27 = 134,217,728 차원의 중첩 공간 형성)\n`;
    
    // 초기 1억 개 상태의 파동 진폭은 모두 동일하게 1 / sqrt(N) 임
    let initialAmplitude = 1 / Math.sqrt(N);
    logBox.innerText += `   -> 1억 개의 모든 방이 동시에 같은 에너지 진폭(${initialAmplitude.toFixed(8)})으로 중첩 완료.\n\n`;

    // 그로버 알고리즘의 최적 회전 횟수 공식 계산: (pi / 4) * sqrt(N)
    const optimalSteps = Math.floor((Math.PI / 4) * Math.sqrt(N));
    
    document.getElementById('classicVal').innerText = "최대 " + N.toLocaleString() + " 회";
    document.getElementById('quantumVal').innerText = optimalSteps.toLocaleString() + " 회";

    logBox.innerText += `2. 파동 간섭 거름망(Diffusion) 일괄 계산 시작...\n`;
    logBox.innerText += `   - 일반 CPU: 정답을 만날 때까지 전기를 가해 1억 번 대조 처리를 반복해야 함.\n`;
    logBox.innerText += `   - 양자 QPU: 일일이 대조하지 않고, 전체 1억 차원 파동을 동시에 누르는 게이트파를 동기화 인가.\n\n`;

    // 1억 차원 행렬 연산을 컴퓨터 메모리 붕괴 없이 수학적으로 정밀 추적 (Grover 수학적 공식 모델링)
    // 매 회전마다 정답 파동은 커지고, 오답 파동은 작아지는 수학적 궤적 계산
    let theta = Math.asin(1 / Math.sqrt(N)); // 초기 회전 각도
    let finalTargetAmplitude = Math.sin((2 * optimalSteps + 1) * theta);
    let finalOtherAmplitude = Math.cos((2 * optimalSteps + 1) * theta) / Math.sqrt(N - 1);
    
    let targetProbability = Math.pow(finalTargetAmplitude, 2) * 100;
    let otherProbability = Math.pow(finalOtherAmplitude, 2) * 100;

    logBox.innerText += `3. [연산 완료] 딱 ${optimalSteps}번의 전체 파동 회전(게이트 인가)을 거친 후 최종 진폭 상태:\n`;
    logBox.innerText += `   - 오답 방들 (나머지 99,999,999개) 각각의 관측 확률: ${otherProbability.toFixed(10)}% (사실상 0%로 완벽히 상쇄 소멸)\n`;
    logBox.innerText += `   - 숨겨진 정답 방 [주소: ${targetIdx.toLocaleString()}번]의 최종 관측 확률: ${targetProbability.toFixed(4)}% (100%로 독점 보강 증폭)\n\n`;
    
    logBox.innerText += `➔ [결론] 단 한 번도 "이 방이 정답인가?"라고 묻는 '비교 처리'를 하지 않았습니다.\n`;
    logBox.innerText += `   오직 1억 개 파동의 각도를 일괄적으로 ${optimalSteps}번 꺾어 정답만 솟구치게 유도한 뒤 낚아챘습니다.`;
}
</script>

</body>
</html>
