<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>YUV 그라데이션 색공간 생성기</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        button { padding: 10px 15px; font-weight: bold; cursor: pointer; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button:hover { background: #444; }
        .canvas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #222; padding: 10px; border-radius: 6px; text-align: center; }
        canvas { background: #000; width: 100%; height: auto; border: 1px solid #444; }
        .info { background: #222; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>🧬 YUV 그라데이션 색공간 생성 컴파일러</h2>
    <div class="info">
        • 매핑 해상도: <span id="res">-</span> | 생성 상태: <span id="st">대기 중</span>
    </div>

    <div>
        <button onclick="generateYUVSpace(1024*1024)">1MB 랜덤 난수 ➔ YUV 색공간 생성</button>
        <button onclick="generateYUVSpace(1024*1024*9)">9MB 대용량 색공간 생성 🔥</button>
    </div>

    <!-- YUV 개별 색공간 전광판 -->
    <div class="canvas-grid">
        <div class="card"><h3>1) Y (Luminance 밝기)</h3><canvas id="cvsY"></canvas></div>
        <div class="card"><h3>2) U (Chrominance 청색차)</h3><canvas id="cvsU"></canvas></div>
        <div class="card"><h3>3) V (Chrominance 적색차)</h3><canvas id="cvsV"></canvas></div>
    </div>

<script>
    function generateYUVSpace(byteSize) {
        document.getElementById('st').innerText = "색공간 연산 중...";
        
        setTimeout(() => {
            // 1. 순수 무작위 데이터 원본 소스 주입
            const srcBuf = new Uint8Array(byteSize);
            for (let i = 0; i < byteSize; i++) srcBuf[i] = Math.floor(Math.random() * 256);

            // 2. YUV 3개 영역에 데이터를 나누어 채우므로, 픽셀 수는 데이터 크기의 1/3
            const totalPixels = Math.ceil(byteSize / 3);
            const side = Math.ceil(Math.sqrt(totalPixels));
            
            const cvsY = document.getElementById('cvsY'), ctxY = cvsY.getContext('2d');
            const cvsU = document.getElementById('cvsU'), ctxU = cvsU.getContext('2d');
            const cvsV = document.getElementById('cvsV'), ctxV = cvsV.getContext('2d');
            
            cvsY.width = cvsU.width = cvsV.width = side;
            cvsY.height = cvsU.height = cvsV.height = side;

            const imgY = ctxY.createImageData(side, side), bufY = imgY.data;
            const imgU = ctxU.createImageData(side, side), bufU = imgU.data;
            const imgV = ctxV.createImageData(side, side), bufV = imgV.data;

            // 3. YUV 공간 수학 공식 인코딩 매핑 루프
            for (let i = 0; i < totalPixels; i++) {
                const p = i * 4;
                const ratio = i / totalPixels;
                
                // 3분할 난수 데이터 추출
                const rData = srcBuf[i * 3] || 0;
                const gData = srcBuf[i * 3 + 1] || 0;
                const bData = srcBuf[i * 3 + 2] || 0;

                // 💡 [YUV 색공간 주파수 정렬 공식]
                // Y(밝기)에는 오직 부드러운 선형 Lerp 수식만 매핑하여 노이즈 주파수를 완전 소멸시킵니다.
                // U, V(색차) 공간에는 완만한 Sine/Cosine 파동 흐름을 유지하며 하위 비트에 난수 수치를 격리 보호합니다.
                const valY = Math.floor(ratio * 255);
                const valU = (Math.floor(128 + 60 * Math.sin(ratio * Math.PI)) & 0xF0) | (gData & 0x0F);
                const valV = (Math.floor(128 + 60 * Math.cos(ratio * Math.PI)) & 0xF0) | (bData & 0x0F);

                // 화면 확인용 그라데이션 픽셀 데이터 바인딩 (R, G, B 채널에 동치 주입하여 흑백/단색 광원 맵으로 가시화)
                bufY[p] = bufY[p+1] = bufY[p+2] = (valY & 0xF0) | (rData & 0x0F); bufY[p+3] = 255;
                bufU[p] = bufU[p+1] = bufU[p+2] = valU; bufU[p+3] = 255;
                bufV[p] = bufV[p+1] = bufV[p+2] = valV; bufV[p+3] = 255;
            }

            ctxY.putImageData(imgY, 0, 0);
            ctxU.putImageData(imgU, 0, 0);
            ctxV.putImageData(imgV, 0, 0);

            document.getElementById('res').innerText = `${side}px × ${side}px`;
            document.getElementById('st').innerText = `✅ YUV 독립 색공간 빌드 성공 (${(byteSize/(1024*1024)).toFixed(1)}MB)`;
        }, 30);
    }
</script>
</body>
</html>
