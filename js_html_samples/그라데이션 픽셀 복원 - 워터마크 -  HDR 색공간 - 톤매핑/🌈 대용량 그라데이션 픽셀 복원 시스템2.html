<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그라데이션 밀도 차이 시각화 시스템</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #111; color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; }
        .btn-group { margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-gen { background: #4caf50; color: white; }
        .btn-vis { background: #00bcd4; color: white; }
        .btn-res { background: #e91e63; color: white; }
        button:hover { filter: brightness(1.2); }
        .status-box { background: #222; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-family: monospace; line-height: 1.6; }
        .canvas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #222; padding: 15px; border-radius: 8px; text-align: center; }
        
        /* ⭐️ 핵심 변경 항목: 브라우저가 이미지를 강제로 부드럽게 늘리지 못하도록 차단 */
        canvas { 
            background: #000; 
            width: 400px; 
            height: 400px; 
            display: block; 
            margin: 10px auto 0; 
            
            /* 이 옵션을 넣으면 1KB일 때 픽셀 하나하나가 거대한 사각형 블록으로 보입니다 */
            image-rendering: pixelated; 
            image-rendering: crisp-edges;
        }
        .highlight { color: #00bcd4; font-weight: bold; }
        .success { color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌈 그라데이션 밀도 확인 및 픽셀 복원 시스템</h2>
    <p>데이터 크기에 따라 <b>픽셀의 촘촘함(밀도)</b>이 어떻게 바뀌는지 눈으로 확인해 보세요.</p>

    <div class="status-box">
        <div>• 현재 데이터 크기: <span id="dataSizeStatus" class="highlight">0 Bytes</span></div>
        <div>• 실제 해상도 크기: <span id="resolutionStatus" class="highlight">-</span></div>
        <div>• 픽셀 복원 검증 상태: <span id="resStatus">-</span></div>
    </div>

    <div class="btn-group">
        <button class="btn-gen" onclick="generateGradientData(1024)">1) 1KB 데이터 (32 x 32 픽셀 블록)</button>
        <button class="btn-gen" onclick="generateGradientData(102400)">100KB 데이터 (320 x 320 픽셀)</button>
        <button class="btn-gen" onclick="generateGradientData(1024 * 1024)">1MB 데이터 (1024 x 1024 초정밀 픽셀)</button>
    </div>

    <div class="btn-group">
        <button class="btn-vis" onclick="visualizeGradient()">2. 그라데이션 밀도 시각화 🎨</button>
        <button class="btn-res" onclick="restoreFromGradient()">3. 이 상태에서 그대로 픽셀 복원 🔍</button>
    </div>

    <div class="canvas-grid">
        <div class="card">
            <h3>데이터 밀도 전광판</h3>
            <p style="font-size:12px; color:#aaa;">1KB는 거친 타일처럼 보이고, 1MB는 부드러운 고화질로 보입니다.</p>
            <canvas id="gradientCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    let originalData = [];

    function generateGradientData(size) {
        originalData = [];
        const buffer = new Uint8Array(size);
        for (let i = 0; i < size; i++) {
            buffer[i] = Math.floor((i / size) * 256); 
        }
        originalData = Array.from(buffer);
        
        const side = Math.ceil(Math.sqrt(size));
        let sizeText = size >= 1024 * 1024 ? (size / (1024*1024)).toFixed(0) + " MB" : (size / 1024).toFixed(0) + " KB";
        
        document.getElementById('dataSizeStatus').innerText = `${sizeText} (${originalData.length.toLocaleString()} 개)`;
        document.getElementById('resolutionStatus').innerText = `${side}px × ${side}px 해상도`;
        document.getElementById('resStatus').innerText = "-";
    }

    function visualizeGradient() {
        if (originalData.length === 0) return alert("데이터를 먼저 생성해주세요.");

        const canvas = document.getElementById('gradientCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const side = Math.ceil(Math.sqrt(originalData.length));
        
        canvas.width = side;
        canvas.height = side;

        const imgData = ctx.createImageData(side, side);
        const dataBuffer = imgData.data;

        for (let i = 0; i < originalData.length; i++) {
            const val = originalData[i]; 
            const pixelIndex = i * 4;

            dataBuffer[pixelIndex]     = val;                                         
            dataBuffer[pixelIndex + 1] = Math.floor(Math.sin(val / 255 * Math.PI) * 150); 
            dataBuffer[pixelIndex + 2] = 255 - Math.floor(val * 0.7);                 
            dataBuffer[pixelIndex + 3] = 255;                                         
        }

        ctx.putImageData(imgData, 0, 0);
    }

    function restoreFromGradient() {
        const canvas = document.getElementById('gradientCanvas');
        const ctx = canvas.getContext('2d');
        
        if (canvas.width === 0 || originalData.length === 0) return alert("시각화된 픽셀이 없습니다.");

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const dataBuffer = imgData.data;
        let restoredArray = [];

        for (let i = 0; i < originalData.length; i++) {
            restoredArray.push(dataBuffer[i * 4]);
        }

        let isPerfect = true;
        for (let i = 0; i < originalData.length; i++) {
            if (originalData[i] !== restoredArray[i]) {
                isPerfect = false;
                break;
            }
        }

        if (isPerfect) {
            document.getElementById('resStatus').innerHTML = `<span class="success">정밀도 100% 복원 성공! ✅</span>`;
        } else {
            document.getElementById('resStatus').innerText = "복원 오류 발생 ❌";
        }
    }

    window.onload = () => { generateGradientData(1024); };
</script>

</body>
</html>
