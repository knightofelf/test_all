<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 그라데이션 시각화</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #111;
            color: #fff;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #00bcd4;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0097a7; }
        .canvas-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        canvas {
            background: #000;
            width: 100%;
            height: 250px;
            display: block;
            margin-top: 10px;
        }
    </style>
    <!-- 3D 시각화를 위한 Three.js 라이브러리 로드 -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div class="container">
    <h2>숫자 데이터 그라데이션 시각화</h2>
    <p>숫자를 쉼표(,)나 공백으로 구분하여 입력하세요. (개수 제한 없음)</p>
    <textarea id="numberInput">10, 40, 25, 75, 45, 90, 60, 120, 70, 150</textarea>
    <button onclick="visualize()">시각화 실행</button>

    <div class="canvas-container">
        <!-- 1. 선(Line) 시각화 -->
        <div class="card">
            <h3>1. 선 (Line)</h3>
            <canvas id="lineCanvas"></canvas>
        </div>
        <!-- 2. 면(Area) 시각화 -->
        <div class="card">
            <h3>2. 면 (Area)</h3>
            <canvas id="areaCanvas"></canvas>
        </div>
        <!-- 3. 3D 시각화 -->
        <div class="card">
            <h3>3. 3D 바 차트</h3>
            <div id="canvas3d" style="height: 250px; position: relative;"></div>
        </div>
    </div>
</div>

<script>
    // 3D 생성을 위한 전역 변수
    let scene, camera, renderer, cubeGroup;

    // 초기 3D 셋팅
    function init3D() {
        const container = document.getElementById('canvas3d');
        scene = new THREE.Scene();
        
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / 250, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, 250);
        container.appendChild(renderer.domElement);

        // 조명 추가
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            if(cubeGroup) cubeGroup.rotation.y += 0.01; // 천천히 회전 효과
            renderer.render(scene, camera);
        }
        animate();

        // 창 크기 조절 대응
        window.addEventListener('resize', () => {
            if(!container.clientWidth) return;
            camera.aspect = container.clientWidth / 250;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, 250);
        });
    }

    // 입력값 파싱 함수 (숫자 제한 없음)
    function getNumbers() {
        const input = document.getElementById('numberInput').value;
        // 공백이나 쉼표 기준으로 쪼개어 숫자로 변환
        return input.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
    }

    // 시각화 메인 함수
    function visualize() {
        const data = getNumbers();
        if (data.length === 0) return alert("숫자를 입력해주세요.");

        const max = Math.max(...data, 1); // 0 분할 방지
        const min = Math.min(...data, 0);

        drawLine(data, max, min);
        drawArea(data, max, min);
        draw3D(data, max, min);
    }

    // 1. 선(Line) 그리기
    function drawLine(data, max, min) {
        const canvas = document.getElementById('lineCanvas');
        const ctx = canvas.getContext('2d');
        setupCanvas(canvas, ctx);

        const { width, height, stepX, getY } = getChartMetrics(data, max, min, canvas.width, canvas.height);

        // 그라데이션 생성 (왼쪽에서 오른쪽으로 변하는 색상)
        const gradient = ctx.createLinearGradient(0, 0, width, 0);
        gradient.addColorStop(0, '#00f2fe');
        gradient.addColorStop(1, '#4facfe');

        ctx.beginPath();
        data.forEach((val, i) => {
            const x = i * stepX;
            const y = getY(val);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });

        ctx.strokeStyle = gradient;
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    // 2. 면(Area) 그리기
    function drawArea(data, max, min) {
        const canvas = document.getElementById('areaCanvas');
        const ctx = canvas.getContext('2d');
        setupCanvas(canvas, ctx);

        const { width, height, stepX, getY } = getChartMetrics(data, max, min, canvas.width, canvas.height);

        // 그라데이션 생성 (위에서 아래로 흐려지는 효과)
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, 'rgba(255, 8, 68, 0.8)');
        gradient.addColorStop(1, 'rgba(255, 178, 73, 0.1)');

        ctx.beginPath();
        ctx.moveTo(0, height); // 시작점 바닥
        
        data.forEach((val, i) => {
            ctx.lineTo(i * stepX, getY(val));
        });

        ctx.lineTo((data.length - 1) * stepX, height); // 끝점 바닥
        ctx.closePath();

        ctx.fillStyle = gradient;
        ctx.fill();
    }

    // 3. 3D 바 차트 생성하기
    function draw3D(data, max, min) {
        // 기존 3D 오브젝트 제거
        while(cubeGroup.children.length > 0){ 
            cubeGroup.remove(cubeGroup.children[0]); 
        }

        const len = data.length;
        const totalWidth = 5; // 3D 화면에 배치될 전체 가로 길이
        const stepX = len > 1 ? totalWidth / (len - 1) : totalWidth;
        const startX = -totalWidth / 2;

        data.forEach((val, i) => {
            // 정규화된 높이 값 계산 (최대 높이 3 기준)
            const normHeight = (val / max) * 3; 
            if(normHeight <= 0) return;

            // 입체 바 생성
            const geometry = new THREE.BoxGeometry(stepX * 0.7, normHeight, 0.4);
            
            // 데이터 순서에 맞는 그라데이션 색상 계산 (HSL 컬러 공간 사용)
            const color = new THREE.Color();
            color.setHSL(i / len, 1.0, 0.5); // 색상 변화 효과

            const material = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.3,
                metalness: 0.2
            });

            const cube = new THREE.Mesh(geometry, material);
            
            // 위치 지정 (Y축은 중심점이 기준이므로 높이의 절반만큼 올림)
            cube.position.x = startX + (i * stepX);
            cube.position.y = normHeight / 2 - 1.5; 
            cube.position.z = 0;

            cubeGroup.add(cube);
        });
        
        // 데이터 수에 따라 카메라 거리 동적 조절
        camera.position.z = Math.max(8, len * 0.5);
    }

    // 캔버스 크기 고해상도 최적화 셋팅
    function setupCanvas(canvas, ctx) {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = 250 * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        ctx.clearRect(0, 0, rect.width, 250);
    }

    // 차트 레이아웃 계산 유틸리티
    function getChartMetrics(data, max, min, cWidth, cHeight) {
        const width = cWidth / window.devicePixelRatio;
        const height = 250;
        const padding = 20;
        const chartHeight = height - (padding * 2);
        
        const stepX = data.length > 1 ? width / (data.length - 1) : width;
        const getY = (val) => height - padding - ((val - min) / (max - min)) * chartHeight;

        return { width, height, stepX, getY };
    }

    // 페이지 로드 시 3D 초기화 및 최초 시각화 실행
    window.onload = () => {
        init3D();
        visualize();
    };
</script>

</body>
</html>
