<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>그라데이션 색공간</title>
  <style>
    canvas { border:1px solid #ccc; margin:10px; }
  </style>
</head>
<body>
  <h2>그라데이션 색공간 구현</h2>
  <canvas id="grad1D" width="400" height="50"></canvas>
  <canvas id="grad2D" width="256" height="256"></canvas>
  <canvas id="grad3D" width="400" height="400"></canvas>

<script>
function grad1D() {
  const ctx = document.getElementById("grad1D").getContext("2d");
  let grad = ctx.createLinearGradient(0,0,400,0);
  grad.addColorStop(0,"red");
  grad.addColorStop(1,"blue");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,400,50);
}

function grad2D() {
  const ctx = document.getElementById("grad2D").getContext("2d");
  let imgData = ctx.createImageData(256,256);
  for (let y=0; y<256; y++) {
    for (let x=0; x<256; x++) {
      let i = (y*256+x)*4;
      imgData.data[i]   = x;     // R: 가로축
      imgData.data[i+1] = y;     // G: 세로축
      imgData.data[i+2] = 128;   // B: 고정
      imgData.data[i+3] = 255;
    }
  }
  ctx.putImageData(imgData,0,0);
}

function grad3D() {
  const canvas = document.getElementById("grad3D");
  const ctx = canvas.getContext("2d");
  // 간단히 RGB 큐브의 단면을 표현
  let imgData = ctx.createImageData(400,400);
  for (let y=0; y<400; y++) {
    for (let x=0; x<400; x++) {
      let i = (y*400+x)*4;
      imgData.data[i]   = x%256;     // R
      imgData.data[i+1] = y%256;     // G
      imgData.data[i+2] = (x+y)%256; // B
      imgData.data[i+3] = 255;
    }
  }
  ctx.putImageData(imgData,0,0);
}

grad1D();
grad2D();
grad3D();
</script>
</body>
</html>
