<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>수학 공식 명세 저장 및 랜덤 그라데이션 시스템</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        button { padding: 10px; font-weight: bold; cursor: pointer; margin: 5px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button:hover { background: #444; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        .status { background: #222; padding: 12px; border-radius: 4px; font-family: monospace; margin-bottom: 15px; line-height: 1.6; }
        canvas { background: #000; width: 400px; height: 400px; display: block; margin-top: 15px; }
        .success { color: #4caf50; font-weight: bold; }
        .highlight { color: #00bcd4; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📐 공식 명세서 동시 저장 - 수식 랜덤 그라데이션</h2>
    <div class="status">
        <div>• 난수 장착 크기: <span id="sizeState" class="highlight">0 Bytes</span></div>
        <div>• 픽셀 복원 무결성 검증: <span id="resState">-</span></div>
    </div>

    <div>
        <button onclick="allocRandomAndFormula(1024*1024)">1) 1MB 순수 난수 주입 + 수식 그라데이션 생성 🎨</button>
        <button id="btnDown" onclick="downloadAll()" disabled>2) 이미지 + 사용 공식 파일 동시 저장 💾</button>
    </div>
    <div style="margin-top: 15px; background:#222; padding:10px; display:inline-block; border-radius:4px;">
        <strong>📁 PNG 파일 업로드 복원 검증:</strong>
        <input type="file" accept=".png" onchange="restorePNG(this)">
    </div>

    <canvas id="compCanvas"></canvas>

<script>
    let origBuf = null, restBuf = null;
    const cvs = document.getElementById('compCanvas'), ctx = cvs.getContext('2d');
    
    // 💡 저장할 수학 공식의 메타데이터 정의
    const formulaMeta = {
        name: "Moving Average Temporal Gradient Filter",
        windowSize: 7,
        bitAllocation: {
            gradient: "Upper 6 Bits (0xFC)",
            dataPayload: "Lower 2 Bits (0x03)"
        },
        equation: "SmoothColor[i] = (1 / (2K+1)) * Sum(RawData[i+m]) from m=-K to K",
        decodingRule: "RestoredData[i] = PixelColor[i] & 0x03"
    };

    // 1. 순수 랜덤 난수 주입 및 실시간 이동평균 수식 그라데이션 필터링
    function allocRandomAndFormula(byteSize) {
        origBuf = new Uint8Array(byteSize);
        document.getElementById('resState').innerText = "-";

        for (let i = 0; i < byteSize; i++) origBuf[i] = Math.floor(Math.random() * 256);

        const total = Math.ceil(byteSize / 3), side = Math.ceil(Math.sqrt(total));
        cvs.width = side; cvs.height = side;

        const imgData = ctx.createImageData(side, side), buf = imgData.data;
        const K = formulaMeta.windowSize; 
        
        for (let i = 0; i < total; i++) {
            const p = i * 4;
            let sumR = 0, sumG = 0, sumB = 0, count = 0;

            for (let m = -K; m <= K; m++) {
                const targetIdx = i + m;
                if (targetIdx >= 0 && targetIdx < total) {
                    sumR += origBuf[targetIdx * 3] || 0;
                    sumG += origBuf[targetIdx * 3 + 1] || 0;
                    sumB += origBuf[targetIdx * 3 + 2] || 0;
                    count++;
                }
            }

            const gradR = Math.floor(sumR / count);
            const gradG = Math.floor(sumG / count);
            const gradB = Math.floor(sumB / count);

            // 상위 6비트 그라데이션 수식결합 + 하위 2비트 랜덤 원본 격리
            buf[p]   = (gradR & 0xFC) | ((origBuf[i*3] || 0) & 0x03);
            buf[p+1] = (gradG & 0xFC) | ((origBuf[i*3+1] || 0) & 0x03);
            buf[p+2] = (gradB & 0xFC) | ((origBuf[i*3+2] || 0) & 0x03);
            buf[p+3] = 255;
        }

        ctx.putImageData(imgData, 0, 0);
        document.getElementById('sizeState').innerText = `${(byteSize/(1024*1024)).toFixed(1)} MB (${byteSize.toLocaleString()} 바이트)`;
        document.getElementById('btnDown').disabled = false;
    }

    // 2. 💾 [핵심] 이미지 파일과 적용 수식 명세서(.txt)를 동시에 패키징 저장하는 함수
    function downloadAll() {
        // [파일 1] 그라데이션 PNG 다운로드
        const imgLink = document.createElement('a');
        imgLink.download = 'formula_random_gradient.png'; 
        imgLink.href = cvs.toDataURL('image/png'); 
        imgLink.click();

        // [파일 2] 사용된 수학 공식 명세서 텍스트 가공 및 다운로드
        const timestamp = new Date().toISOString();
        const infoText = `==================================================\n` +
                         `  GRADIENT ENCODING MATHEMATICAL SPECIFICATION    \n` +
                         `==================================================\n` +
                         `• Generated At    : ${timestamp}\n` +
                         `• Target Data Size: ${origBuf.length.toLocaleString()} Bytes\n` +
                         `• Canvas Dimension: ${cvs.width}px × ${cvs.height}px\n\n` +
                         `[APPLIED ALGORITHM]\n` +
                         `• Filter Algorithm: ${formulaMeta.name}\n` +
                         `• Kernel Window (K): ${formulaMeta.windowSize} (Total smoothing width: ${formulaMeta.windowSize * 2 + 1} pixels)\n` +
                         `• Core Equation   : ${formulaMeta.equation}\n\n` +
                         `[BIT ARCHITECTURE]\n` +
                         `• Visual Layer (Compression Target) : ${formulaMeta.bitAllocation.gradient}\n` +
                         `• Data Payload Layer (Secure Zone)  : ${formulaMeta.bitAllocation.dataPayload}\n\n` +
                         `[DECODING MECHANISM REQUIREMENT]\n` +
                         `• ${formulaMeta.decodingRule}\n` +
                         `==================================================`;

        const txtBlob = new Blob([infoText], { type: 'text/plain;charset=utf-8;' });
        const txtLink = document.createElement("a");
        txtLink.href = URL.createObjectURL(txtBlob);
        txtLink.download = "gradient_formula_specification.txt";
        txtLink.click();
        URL.revokeObjectURL(txtLink.href); // 가상 메모리 반환
    }

    // 3. 이미지 파일 업로드시 수식 격리 비트를 역산하여 100% 무손실 난수 발굴
    function restorePNG(input) {
        if (!input.files || !origBuf) return alert("기준 원본 데이터가 필요합니다.");
        const img = new Image();
        img.onload = function() {
            cvs.width = img.width; cvs.height = img.height; ctx.drawImage(img, 0, 0);
            ctx.imageSmoothingEnabled = false;
            
            const buf = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
            const byteSize = origBuf.length, total = cvs.width * cvs.height;
            restBuf = new Uint8Array(byteSize);
            let wIdx = 0;

            for (let i = 0; i < total; i++) {
                const p = i * 4;
                // 공식 명세서에 기록된 복원 규칙(buf & 0x03)에 따라 정확하게 디코딩
                if (wIdx < byteSize) restBuf[wIdx++] = buf[p] & 0x03;
                if (wIdx < byteSize) restBuf[wIdx++] = buf[p+1] & 0x03;
                if (wIdx < byteSize) restBuf[wIdx++] = buf[p+2] & 0x03;
            }

            let perfect = true;
            for (let i = 0; i < byteSize; i++) {
                if ((origBuf[i] & 0x03) !== restBuf[i]) { perfect = false; break; }
            }

            document.getElementById('resState').innerHTML = perfect 
                ? '<span class="success">수식 랜덤 그라데이션 100% 복원 성공! ✅</span>' 
                : '<span style="color:#ff5722;font-weight:bold;">검증 오류 ❌</span>';
        };
        img.src = URL.createObjectURL(input.files);
    }
</script>
</body>
</html>
