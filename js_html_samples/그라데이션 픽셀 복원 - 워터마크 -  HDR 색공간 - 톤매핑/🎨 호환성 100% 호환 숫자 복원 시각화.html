<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100% 화면 표시 및 픽셀 전체 복원 시스템</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #111;
            color: #fff;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .io-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: monospace;
        }
        button {
            padding: 12px 20px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            border-radius: 4px;
        }
        .btn-visualize { background: #00bcd4; }
        .btn-visualize:hover { background: #0097a7; }
        .btn-restore { background: #e91e63; }
        .btn-restore:hover { background: #c2185b; }
        
        .canvas-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        canvas {
            background: #000;
            width: 100%;
            height: 220px;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 호환성 100% 호환 숫자 복원 시각화</h2>
    <p>숫자 제한 없음. <b>[픽셀에서 숫자 복원하기]</b> 버튼을 누르면 화면 픽셀 전체를 스캔하여 원본 숫자를 추출합니다.</p>
    
    <div class="io-box">
        <div>
            <strong>입력 데이터 (숫자 입력)</strong>
            <textarea id="numberInput">30, 145, 220, 15, 85, 195, 60, 255, 110, 175</textarea>
        </div>
        <div>
            <strong>복원된 데이터 (픽셀 전체 스캔 결과)</strong>
            <textarea id="restoreOutput" readonly placeholder="픽셀 복원 버튼을 누르면 이곳에 출력됩니다."></textarea>
        </div>
    </div>

    <button class="btn-visualize" onclick="visualize()">1. 그라데이션 시각화 실행</button>
    <button class="btn-restore" onclick="restoreFromPixels()">2. 픽셀에서 숫자 복원하기 🔍</button>

    <div class="canvas-container">
        <!-- 1. 선(Line) 시각화 -->
        <div class="card">
            <h3>1. 선 (Line) 픽셀</h3>
            <canvas id="lineCanvas"></canvas>
        </div>
        <!-- 2. 면(Area) 시각화 -->
        <div class="card">
            <h3>2. 면 (Area) 픽셀</h3>
            <canvas id="areaCanvas"></canvas>
        </div>
        <!-- 3. 3D 입체 바 시각화 (호환성 보장형) -->
        <div class="card">
            <h3>3. 3D 입체 바 픽셀</h3>
            <canvas id="canvas3d"></canvas>
        </div>
    </div>
</div>

<script>
    const MAX_VAL = 255; 

    function getNumbers() {
        const input = document.getElementById('numberInput').value;
        return input.split(/[\s,]+/).map(Number).filter(n => !isNaN(n) && n >= 0);
    }

    function visualize() {
        const data = getNumbers();
        if (data.length === 0) return alert("숫자를 입력해주세요.");

        drawLine(data);
        drawArea(data);
        draw3D(data);
    }

    // 숫자를 고유 RGB 컬러 코드로 1대1 매핑 인코딩 (Red 채널 = 원본 숫자)
    function encodeColor(value) {
        const r = Math.min(255, Math.max(0, Math.round(value)));
        const g = Math.round(value * 0.3); 
        const b = 255 - r; 
        return { r, g, b, str: `rgb(${r}, ${g}, ${b})` };
    }

    // 명암 처리를 위한 색상 밝기 조절 함수 (3D 입체감 전용)
    function adjustBrightness(colorObj, factor) {
        const r = Math.min(255, Math.max(0, Math.round(colorObj.r * factor)));
        const g = Math.min(255, Math.max(0, Math.round(colorObj.g * factor)));
        const b = Math.min(255, Math.max(0, Math.round(colorObj.b * factor)));
        return `rgb(${r}, ${g}, ${b})`;
    }

    // 1. 선 (Line) 그리기
    function drawLine(data) {
        const canvas = document.getElementById('lineCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const len = data.length;
        
        canvas.width = len; 
        canvas.height = 220;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        data.forEach((val, i) => {
            ctx.fillStyle = encodeColor(val).str;
            ctx.fillRect(i, 110, 1, 5); // 중앙선 라인에 데이터 매핑 배치
        });
    }

    // 2. 면 (Area) 그리기
    function drawArea(data) {
        const canvas = document.getElementById('areaCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const len = data.length;

        canvas.width = len;
        canvas.height = 220;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        data.forEach((val, i) => {
            ctx.fillStyle = encodeColor(val).str;
            const barHeight = (val / MAX_VAL) * 190 + 5;
            ctx.fillRect(i, canvas.height - barHeight, 1, barHeight);
        });
    }

    // 3. 3D 입체 바 그리기 (2D 캔버스 기하학 연산 방식 - 100% 무조건 표시됨)
    function draw3D(data) {
        const canvas = document.getElementById('canvas3d');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const len = data.length;

        canvas.width = len * 15 + 40; // 기둥 간격과 입체 깊이를 고려한 해상도 동적 설정
        canvas.height = 220;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const barWidth = 10;
        const depth = 8; // 3D 깊이 값

        data.forEach((val, i) => {
            const colorObj = encodeColor(val);
            const barHeight = (val / MAX_VAL) * 160 + 5;
            
            // 입체 바의 시작 좌표 계산 (우측 상단 사선 방향으로 입체 투영)
            const x = 10 + i * 15;
            const y = canvas.height - barHeight - 10;

            // [3D 정면] 원본 색상 그대로 칠함 (복원용 타겟 픽셀)
            ctx.fillStyle = colorObj.str;
            ctx.fillRect(x, y, barWidth, barHeight);

            // [3D 우측면] 그림자 효과 표현을 위해 살짝 어둡게 연산
            ctx.fillStyle = adjustBrightness(colorObj, 0.7);
            ctx.beginPath();
            ctx.moveTo(x + barWidth, y);
            ctx.lineTo(x + barWidth + depth, y - depth);
            ctx.lineTo(x + barWidth + depth, y + barHeight - depth);
            ctx.lineTo(x + barWidth, y + barHeight);
            ctx.closePath();
            ctx.fill();

            // [3D 윗면 뚜껑] 하이라이트 효과 표현을 위해 살짝 밝게 연산
            ctx.fillStyle = adjustBrightness(colorObj, 1.2);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + depth, y - depth);
            ctx.lineTo(x + barWidth + depth, y - depth);
            ctx.lineTo(x + barWidth, y);
            ctx.closePath();
            ctx.fill();
        });
    }

    // ==========================================
    // [픽셀 역산 복원 시스템] 화면 전체 스캔 로직
    // ==========================================
    function restoreFromPixels() {
        let lineRestored = [];
        let areaRestored = [];
        let threedRestored = [];

        // 1. 선(Line) 픽셀 스캔 복원
        const lineCanvas = document.getElementById('lineCanvas');
        const lineCtx = lineCanvas.getContext('2d');
        if(lineCanvas.width > 0) {
            const imgData = lineCtx.getImageData(0, 110, lineCanvas.width, 1).data;
            for (let i = 0; i < imgData.length; i += 4) {
                if(imgData[i+3] > 0) lineRestored.push(imgData[i]); // Red 채널 값 복구
            }
        }

        // 2. 면(Area) 픽셀 스캔 복원
        const areaCanvas = document.getElementById('areaCanvas');
        const areaCtx = areaCanvas.getContext('2d');
        if(areaCanvas.width > 0) {
            for(let x = 0; x < areaCanvas.width; x++) {
                const columnData = areaCtx.getImageData(x, 0, 1, areaCanvas.height).data;
                for(let y = 0; y < areaCanvas.height; y++) {
                    const idx = y * 4;
                    if(columnData[idx + 3] > 0) { // 빈 공간을 지나 최초로 나타난 면의 최상단 색상 획득
                        areaRestored.push(columnData[idx]);
                        break;
                    }
                }
            }
        }

        // 3. 3D 픽셀 스캔 복원 (정면 패턴의 규칙적 좌표를 역추적 스캔)
        const threedCanvas = document.getElementById('canvas3d');
        const threedCtx = threedCanvas.getContext('2d');
        const dataLength = getNumbers().length;
        
        if(threedCanvas.width > 0 && dataLength > 0) {
            for(let i = 0; i < dataLength; i++) {
                // 각 3D 바의 정면 한가운데 좌표를 조준하여 픽셀 추출
                const targetX = 10 + (i * 15) + 3;
                const targetY = threedCanvas.height - 12; // 바닥면 근처 안전 구역 스캔
                
                const pixel = threedCtx.getImageData(targetX, targetY, 1, 1).data;
                if(pixel[3] > 0) {
                    threedRestored.push(pixel[0]); // 정면에 심어진 오리지널 Red 값 복구
                }
            }
        }

        // 출력 처리
        if(lineRestored.length === 0) {
            document.getElementById('restoreOutput').value = "복원할 픽셀 데이터가 없습니다. 시각화를 먼저 실행하세요.";
            return;
        }

        document.getElementById('restoreOutput').value = 
            `[1. 선 전체 픽셀 복원] : ${lineRestored.join(', ')}\n\n` +
            `[2. 면 전체 픽셀 복원] : ${areaRestored.join(', ')}\n\n` +
            `[3. 3D 전체 픽셀 복원] : ${threedRestored.join(', ')}`;
    }

    // 최초 로드 시 실행
    window.onload = () => {
        visualize();
    };
</script>

</body>
</html>
