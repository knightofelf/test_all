<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1MB 대용량 데이터 픽셀 인코딩 & 복원 시스템</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #111; color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; }
        .btn-group { margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-gen { background: #4caf50; color: white; }
        .btn-vis { background: #00bcd4; color: white; }
        .btn-res { background: #e91e63; color: white; }
        button:hover { filter: brightness(1.2); }
        .status-box { background: #222; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-family: monospace; line-height: 1.6; }
        .canvas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #222; padding: 15px; border-radius: 8px; text-align: center; }
        canvas { background: #000; width: 100%; max-width: 300px; height: 300px; display: block; margin: 10px auto 0; image-rendering: pixelated; }
        .highlight { color: #00bcd4; font-weight: bold; }
        .success { color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ 대용량(1KB ~ 1MB) 픽셀 완전 복원 시스템</h2>
    <p>데이터가 커지면 1차원 선/면으로는 화면을 벗어납니다. 따라서 <b>2차원 면적 픽셀 공간(바둑판)</b>에 나누어 압축 시각화합니다.</p>

    <!-- 데이터 생성 및 제어판 -->
    <div class="status-box">
        <div>• 생성된 데이터 크기: <span id="dataSizeStatus" class="highlight">0 Bytes</span></div>
        <div>• 시각화 처리 속도: <span id="visTimeStatus">-</span></div>
        <div>• 픽셀 복원 완료 상태: <span id="resStatus">-</span></div>
    </div>

    <div class="btn-group">
        <button class="btn-gen" onclick="generateData(1024)">1) 1KB 데이터 생성 (1,024개)</button>
        <button class="btn-gen" onclick="generateData(10240)">10KB 데이터 생성</button>
        <button class="btn-gen" onclick="generateData(102400)">100KB 데이터 생성</button>
        <button class="btn-gen" onclick="generateData(1024 * 1024)">1MB 데이터 생성 (1,048,576개)</button>
    </div>

    <div class="btn-group">
        <button class="btn-vis" onclick="visualizeLargeData()">2. 대용량 픽셀 시각화 실행 🎨</button>
        <button class="btn-res" onclick="restoreLargeData()">3. 픽셀 전체 스캔 복원하기 🔍</button>
    </div>

    <div class="canvas-grid">
        <!-- 대용량 2D/3D 입체 바둑판식 인코딩 공간 -->
        <div class="card">
            <h3>대용량 픽셀 매핑 (2D/3D 고밀도 면적)</h3>
            <p style="font-size:12px; color:#aaa;">1MB의 숫자가 가로세로 1024px 안에 1:1로 전부 그려집니다.</p>
            <canvas id="largeCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    let globalData = []; // 메모리에 저장될 테스트용 원본 배열

    // 1. 지정한 크기만큼의 난수 데이터(0~255)를 무제한 생성
    function generateData(size) {
        globalData = [];
        // 성능 최적화를 위해 TypedArray 사용 (대용량 고속 처리용)
        const buffer = new Uint8Array(size);
        for (let i = 0; i < size; i++) {
            buffer[i] = Math.floor(Math.random() * 256); // 0 ~ 255 사이의 랜덤 숫자
        }
        globalData = Array.from(buffer);
        
        let sizeText = size >= 1024 * 1024 ? (size / (1024*1024)).toFixed(0) + " MB" : (size / 1024).toFixed(0) + " KB";
        document.getElementById('dataSizeStatus').innerText = `${sizeText} (${globalData.length.toLocaleString()} 개의 숫자)`;
        document.getElementById('resStatus').innerText = "-";
        document.getElementById('visTimeStatus').innerText = "-";
    }

    // 2. 대용량 데이터를 2D/3D 고밀도 바둑판 평면에 초고속 인코딩 시각화
    function visualizeLargeData() {
        if (globalData.length === 0) return alert("먼저 데이터를 생성해주세요!");

        const startTime = performance.now();
        const canvas = document.getElementById('largeCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // 데이터 개수에 맞춰 정사각형 바둑판 크기(가로/세로 해상도) 계산
        // 1MB = 1,048,576개 -> 1024px * 1024px 딱 맞음
        const side = Math.ceil(Math.sqrt(globalData.length));
        canvas.width = side;
        canvas.height = side;

        // 고속 픽셀 처리를 위한 ImageData 버퍼 생성
        const imgData = ctx.createImageData(side, side);
        const dataBuffer = imgData.data;

        for (let i = 0; i < globalData.length; i++) {
            const val = globalData[i];
            const pixelIndex = i * 4;

            // [인코딩 규칙] 
            // Red 채널 = 원본 숫자 데이터 자체
            // Green/Blue = 면적으로 시각화했을 때 눈으로 확인 가능한 화려한 그라데이션 색상 연산
            dataBuffer[pixelIndex]     = val;                     // R (원본 데이터 보존)
            dataBuffer[pixelIndex + 1] = Math.floor(val * 0.5);   // G (시각용 그라데이션)
            dataBuffer[pixelIndex + 2] = 255 - val;               // B (시각용 그라데이션)
            dataBuffer[pixelIndex + 3] = 255;                     // A (투명도 100%)
        }

        // 캔버스 화면에 초고속 주입
        ctx.putImageData(imgData, 0, 0);
        
        const endTime = performance.now();
        document.getElementById('visTimeStatus').innerText = `${(endTime - startTime).toFixed(2)} ms (초고속 인코딩 완료)`;
    }

    // 3. 캔버스에 그려진 이미지 픽셀 전체를 루프 스캔하여 대용량 숫자 완전 복원
    function restoreLargeData() {
        const canvas = document.getElementById('largeCanvas');
        const ctx = canvas.getContext('2d');
        
        if (canvas.width === 0 || globalData.length === 0) {
            return alert("시각화된 픽셀이 없습니다.");
        }

        const startTime = performance.now();

        // 캔버스 면적 전체의 픽셀 이미지 데이터 추출
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const dataBuffer = imgData.data;
        
        let restoredArray = [];
        const totalTargetCount = globalData.length; // 복원해야 할 원본 개수

        // 바둑판의 전 행과 열을 초고속 픽셀 순회 스캔
        for (let i = 0; i < totalTargetCount; i++) {
            const pixelIndex = i * 4;
            const r = dataBuffer[pixelIndex]; // 인코딩되었던 Red 채널 정보 획득
            restoredArray.push(r);
        }

        const endTime = performance.now();
        const executionTime = (endTime - startTime).toFixed(2);

        // 검증 알고리즘: 원본 배열과 픽셀 복원 배열이 완벽히 일치하는지 대조
        let isPerfect = true;
        for (let i = 0; i < globalData.length; i++) {
            if (globalData[i] !== restoredArray[i]) {
                isPerfect = false;
                break;
            }
        }

        if (isPerfect) {
            document.getElementById('resStatus').innerHTML = 
                `<span class="success">정밀도 100% 복원 성공! ✅</span> (스캔 소요 시간: ${executionTime} ms)<br>` + 
                `• 검증 결과: 원본과 복원본의 데이터가 정확히 일치합니다.<br>` +
                `• 복원 데이터 샘플(앞 10개): [${restoredArray.slice(0, 10).join(', ')}...]`;
        } else {
            document.getElementById('resStatus').innerText = "복원 실패 ❌ 색상 손실이 발생했습니다.";
        }
    }

    // 초기 상태 1KB 셋팅
    window.onload = () => {
        generateData(1024);
    };
</script>

</body>
</html>
