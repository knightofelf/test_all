<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BBP Pi Digit Calculator</title>
</head>
<body>
  <h2>BBP 공식 기반 Pi 계산</h2>
  <label>계산할 자리수 (16진수): </label>
  <input type="number" id="digit" value="1000">
  <button onclick="calculatePi()">계산하기</button>
  <pre id="result"></pre>

  <script>
    // BBP 공식 구현
    function piDigitBBP(n) {
      let sum = 0;
      for (let k = 0; k <= n; k++) {
        sum += (1 / Math.pow(16, k)) *
          (4 / (8 * k + 1) - 2 / (8 * k + 4) - 1 / (8 * k + 5) - 1 / (8 * k + 6));
      }
      return sum;
    }

    function calculatePi() {
      const n = parseInt(document.getElementById("digit").value);
      const piApprox = piDigitBBP(n);
      document.getElementById("result").textContent =
        `Pi 근사값 (자리수 ${n}까지):\n${piApprox}`;
    }
  </script>
</body>
</html>
