<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>TurboQuant Demo</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .box { margin-top: 10px; padding: 10px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>터보 퀀트 시뮬레이션 (JS + HTML)</h2>
  
  <button onclick="runTurboQuant()">실행하기</button>
  
  <div class="box" id="original"></div>
  <div class="box" id="compressed"></div>
  <div class="box" id="decompressed"></div>
  
  <script>
    // 간단한 양자화 함수 (예: 3비트 → 0~7 범위)
    function quantize(arr, bits=3) {
      const levels = Math.pow(2, bits);
      const maxVal = Math.max(...arr);
      return arr.map(v => Math.round((v / maxVal) * (levels - 1)));
    }

    // 복원 함수
    function dequantize(arr, bits=3, maxVal=100) {
      const levels = Math.pow(2, bits);
      return arr.map(q => Math.round((q / (levels - 1)) * maxVal));
    }

    function runTurboQuant() {
      // 예시 데이터
      const data = Array.from({length: 10}, () => Math.floor(Math.random() * 100));
      
      // 압축
      const compressed = quantize(data, 3);
      
      // 복원
      const decompressed = dequantize(compressed, 3, Math.max(...data));
      
      // 출력
      document.getElementById("original").innerText = "원본 데이터: " + data.join(", ");
      document.getElementById("compressed").innerText = "압축 데이터(3비트): " + compressed.join(", ");
      document.getElementById("decompressed").innerText = "복원 데이터: " + decompressed.join(", ");
    }
  </script>
</body>
</html>
