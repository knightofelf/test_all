<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>일반 vs 상태 분기 효율 테스트</title>
</head>
<body>
  <h2>연산 효율 비교</h2>
  <button onclick="testNormal()">일반 연산 테스트</button>
  <button onclick="testState()">상태 분기 연산 테스트</button>
  <pre id="output"></pre>

  <script>
    // 일반 연산
    function normalCalc(a, b, op) {
      if (op === "+") return a + b;
      if (op === "-") return a - b;
      if (op === "*") return a * b;
      if (op === "/") return b !== 0 ? a / b : "Error";
    }

    // 상태 분기 연산
    function stateCalc(a, b, op) {
      switch(op) {
        case "ADD": return a + b;
        case "SUB": return a - b;
        case "MUL": return a * b;
        case "DIV": return b !== 0 ? a / b : "Error";
      }
    }

    const iterations = 1e7; // 1천만 번 반복

    function testNormal() {
      let result;
      const start = performance.now();
      for (let i = 0; i < iterations; i++) {
        result = normalCalc(10, 5, "+");
      }
      const end = performance.now();
      document.getElementById("output").innerText =
        `일반 연산 시간: ${(end - start).toFixed(4)} ms\n결과 값: ${result}`;
    }

    function testState() {
      let result;
      const start = performance.now();
      for (let i = 0; i < iterations; i++) {
        result = stateCalc(10, 5, "ADD");
      }
      const end = performance.now();
      document.getElementById("output").innerText =
        `상태 분기 연산 시간: ${(end - start).toFixed(4)} ms\n결과 값: ${result}`;
    }
  </script>
</body>
</html>
