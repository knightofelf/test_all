<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>기준점 생성 및 복원</title>
</head>
<body>
  <h2>기준점 생성 → 점 생성 → 기준점 복원</h2>
  <button onclick="run0()">실행</button>
  <pre id="log"></pre>

  <script>
    function degToRad(deg) {
      return deg * Math.PI / 180;
    }

    function randomBigIntWithDigits(digits) {
      let result = '';
      result += Math.floor(Math.random() * 9 + 1);
      for (let i = 1; i < digits; i++) {
        result += Math.floor(Math.random() * 10);
      }
      return BigInt(result);
    }

    function generatePointFromCenter(x0, y0, angleDeg, distance) {
      const rad = degToRad(angleDeg);
      const dx = BigInt(Math.round(Math.cos(rad) * Number(distance)));
      const dy = BigInt(Math.round(Math.sin(rad) * Number(distance)));
      return {
        x: x0 + dx,
        y: y0 + dy,
        dx: -dx,
        dy: -dy,
        angle: angleDeg,
        distance
      };
    }

    function findIntersection(p1, v1, p2, v2) {
      const a = v1.dx;
      const b = -v2.dx;
      const c = p2.x - p1.x;
      const d = v1.dy;
      const e = -v2.dy;
      const f = p2.y - p1.y;

      const denominator = a * e - b * d;
      if (denominator === 0n) return null;

      const t1 = (c * e - b * f) / denominator;
      const x0 = p1.x + t1 * v1.dx;
      const y0 = p1.y + t1 * v1.dy;

      return { x: x0, y: y0, debug: { t1, denominator } };
    }

    function run0() {
      for (let i = 1; i < 1000; i++) {
	run();
      }
    }

      const x0 = randomBigIntWithDigits(1000000);
      const y0 = randomBigIntWithDigits(1000000);

    function run() {
      const log = document.getElementById("log");
      log.textContent = "";

      // 1️⃣ 기준점 생성

      // 2️⃣ 기준점 기준으로 점 2개 생성
      const angle1 = Math.floor(Math.random() * 360);
      const angle2 = Math.floor(Math.random() * 360);
      const dist1 = 10n ** 12n;
      const dist2 = 15n * 10n ** 12n;

      const p1 = generatePointFromCenter(x0, y0, angle1, dist1);
      const p2 = generatePointFromCenter(x0, y0, angle2, dist2);

      // 3️⃣ 점 2개로 기준점 복원
      const restored = findIntersection(p1, { dx: p1.dx, dy: p1.dy }, p2, { dx: p2.dx, dy: p2.dy });

      if (restored) {
        const tolerance = 10n ** 6n;
        const matchX = (x0 > restored.x ? x0 - restored.x : restored.x - x0) <= tolerance;
        const matchY = (y0 > restored.y ? y0 - restored.y : restored.y - y0) <= tolerance;
      } else {
      }

     log.textContent = "1";
    }

  </script>
</body>
</html>
