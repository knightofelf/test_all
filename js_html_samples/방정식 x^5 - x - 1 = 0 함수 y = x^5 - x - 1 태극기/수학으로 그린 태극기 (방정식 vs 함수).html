<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학으로 그린 태극기 (방정식 vs 함수)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #111111;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .description {
            color: #666;
            margin-bottom: 35px;
            font-size: 15px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            flex: 1;
            min-width: 450px;
            max-width: 520px;
        }
        h2 {
            font-size: 20px;
            margin: 0 0 8px 0;
            color: #222;
        }
        .formula {
            font-family: 'Consolas', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #0066cc;
            margin-bottom: 20px;
            background: #f4f7fa;
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
        }
        canvas {
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>수학 공식으로 구현한 태극기</h1>
    <p class="description">방정식의 근(Point)과 함수의 궤적(Curve)을 시각적으로 투영한 디자인</p>

    <div class="container">
        <!-- 1. 방정식 기반 태극기 -->
        <div class="card">
            <h2>1. 방정식 기반 태극기</h2>
            <div class="formula">x⁵ - x - 1 = 0</div>
            <canvas id="equationCanvas" width="500" height="333"></canvas>
        </div>

        <!-- 2. 함수 기반 태극기 -->
        <div class="card">
            <h2>2. 함수 기반 태극기</h2>
            <div class="formula">y = x⁵ - x - 1</div>
            <canvas id="functionCanvas" width="500" height="333"></canvas>
        </div>
    </div>

    <script>
        // 대한민국 국기법 기준 규격 비율을 적용한 기본 태극기 베이스 렌더링 함수
        function drawBaseFlag(ctx, w, h) {
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const r = h / 4; 

            // 사괘(건곤감리) 그리기 서브 시스템
            function drawGwae(gwaeType, angle) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle * Math.PI / 180);
                
                // 중심에서 괘까지의 표준 거리
                ctx.translate(0, -(r + r / 4));

                const gw = r * 0.66;  
                const gh = r * 0.1;   
                const gap = r * 0.03; 
                const centerGap = r * 0.05;

                ctx.fillStyle = "#000000";

                for (let i = 0; i < 3; i++) {
                    const yPos = i * (gh + gap);
                    if (gwaeType[i] === '1') {
                        // 끊어진 괘 (이효)
                        const halfW = (gw - centerGap) / 2;
                        ctx.fillRect(-gw / 2, yPos, halfW, gh);
                        ctx.fillRect(centerGap / 2, yPos, halfW, gh);
                    } else {
                        // 연결된 괘 (일효)
                        ctx.fillRect(-gw / 2, yPos, gw, gh);
                    }
                }
                ctx.restore();
            }

            // 정확한 배치 각도 적용 (-33.7도축 기준 수직 교차 대각선)
            drawGwae(['0','0','0'], -146.3); // 건 (좌상)
            drawGwae(['1','1','1'], 146.3);  // 곤 (우하)
            drawGwae(['1','0','1'], -33.7);   // 감 (우상)
            drawGwae(['0','1','0'], 33.7);    // 리 (좌하)
        }

        // [1] 방정식 태극기 그리기: 실근의 좌표 타겟팅
        function drawEquationFlag() {
            const canvas = document.getElementById('equationCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const r = h / 4;

            drawBaseFlag(ctx, w, h);

            // 전통 태극 문양 원형 생성
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-33.7 * Math.PI / 180);

            ctx.fillStyle = "#CD2E3A";
            ctx.beginPath();
            ctx.arc(0, 0, r, Math.PI, 0, false);
            ctx.fill();

            ctx.fillStyle = "#0047A0";
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI, false);
            ctx.fill();

            ctx.fillStyle = "#CD2E3A";
            ctx.beginPath();
            ctx.arc(r/2, 0, r/2, 0, Math.PI, false);
            ctx.fill();

            ctx.fillStyle = "#0047A0";
            ctx.beginPath();
            ctx.arc(-r/2, 0, r/2, 0, Math.PI, true);
            ctx.fill();
            ctx.restore();

            // 방정식 해를 표현하기 위한 좌표축 레이아웃
            ctx.strokeStyle = "rgba(0, 0, 0, 0.15)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(cx - r - 30, cy); ctx.lineTo(cx + r + 30, cy);
            ctx.moveTo(cx, cy - r - 20); ctx.lineTo(cx, cy + r + 20);
            ctx.stroke();

            // x^5 - x - 1 = 0 의 실제 수치해 (x ≒ 1.1673)
            const rootX = 1.167304;
            const scale = r / 1.5; 
            const targetX = cx + (rootX * scale);

            // 실근 위치를 겨냥하는 스나이퍼 조준선(Targeting) 효과
            ctx.strokeStyle = "#ff2d55";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(targetX, cy, 10, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.fillStyle = "#ff2d55";
            ctx.beginPath();
            ctx.arc(targetX, cy, 4, 0, Math.PI * 2);
            ctx.fill();

            // 해 설명 정보 텍스트박스 출력
            ctx.fillStyle = "#222222";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText("실근 x ≒ 1.1673", targetX - 42, cy - 18);
        }

        // [2] 함수 태극기 그리기: 5차 함수 곡선(y = x⁵ - x - 1) 융합
        function drawFunctionFlag() {
            const canvas = document.getElementById('functionCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const r = h / 4;

            drawBaseFlag(ctx, w, h);

            // 태극 원형 내부 공간에만 곡선 함수를 채우기 위한 클리핑 영역 정의
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();

            // 5차 다항함수 원형 정의 및 그래픽 스케일 매핑용 수식
            function f(x) {
                return Math.pow(x, 5) - x;
            }

            const rangeX = 1.4; 
            const scaleX = r / rangeX;
            const scaleY = r / 1.2; 

            // 상단 빨간색 영역 채우기 (그래프 곡선 위쪽)
            ctx.fillStyle = "#CD2E3A";
            ctx.beginPath();
            ctx.moveTo(cx - r, cy - r);
            for (let px = cx - r; px <= cx + r; px++) {
                let x = (px - cx) / scaleX;
                let y = f(x) - 0.15; // 태극 균형을 위한 오프셋 조정
                let py = cy - (y * scaleY);
                ctx.lineTo(px, py);
            }
            ctx.lineTo(cx + r, cy - r);
            ctx.closePath();
            ctx.fill();

            // 하단 파란색 영역 채우기 (그래프 곡선 아래쪽)
            ctx.fillStyle = "#0047A0";
            ctx.beginPath();
            ctx.moveTo(cx - r, cy + r);
            for (let px = cx - r; px <= cx + r; px++) {
                let x = (px - cx) / scaleX;
                let y = f(x) + 0.15;
                let py = cy - (y * scaleY);
                ctx.lineTo(px, py);
            }
            ctx.lineTo(cx + r, cy + r);
            ctx.closePath();
            ctx.fill();

            // 함수 궤적 자체를 뚜렷하게 보여주는 메인 곡선(S자) 드로잉
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let px = cx - r; px <= cx + r; px++) {
                let x = (px - cx) / scaleX;
                let y = f(x); 
                let py = cy - (y * scaleY);
                if (px === cx - r) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // 수학적 배경을 강조하기 위한 백그라운드 모눈 격자선 효과
            ctx.strokeStyle = "rgba(255,255,255,0.25)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
            ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
            ctx.stroke();

            ctx.restore();

            // 태극 원형 테두리 라인 마감
            ctx.strokeStyle = "rgba(0,0,0,0.08)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
        }

        // 브라우저 윈도우 로드가 완료되면 즉시 드로잉 스크립트 실행
        window.addEventListener('DOMContentLoaded', () => {
            drawEquationFlag();
            drawFunctionFlag();
        });
    </script>
</body>
</html>
