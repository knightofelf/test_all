<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수압 엘리베이터 원리 시뮬레이션</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; background:#eef; }
    .system { display:flex; gap:40px; align-items:flex-end; }
    .shaft {
      width:200px; height:400px; border:4px solid #333; position:relative; background:#ddd;
    }
    .car {
      width:180px; height:80px; background:#4a90e2; position:absolute; bottom:0; left:10px;
      display:flex; justify-content:center; align-items:center; color:#fff; font-weight:bold;
      transition: bottom 2s ease;
    }
    .cylinder {
      width:60px; height:400px; background:#ccc; position:relative;
    }
    .piston {
      width:60px; height:100px; background:#999; position:absolute; bottom:0;
      transition: bottom 2s ease;
    }
    .oil {
      width:60px; height:0; background:#f5a623; position:absolute; bottom:0;
      transition: height 2s ease;
    }
    .controls { display:flex; flex-direction:column; gap:10px; }
    button { padding:10px; font-size:16px; }
  </style>
</head>
<body>
  <div class="system">
    <!-- 승강로 -->
    <div class="shaft">
      <div class="car" id="car">엘리베이터</div>
    </div>
    <!-- 실린더 + 오일 -->
    <div class="cylinder">
      <div class="oil" id="oil"></div>
      <div class="piston" id="piston"></div>
    </div>
    <!-- 제어 버튼 -->
    <div class="controls">
      <button onclick="pump()">펌프 작동(상승)</button>
      <button onclick="valve()">밸브 개방(하강)</button>
    </div>
  </div>

  <script>
    const car = document.getElementById("car");
    const piston = document.getElementById("piston");
    const oil = document.getElementById("oil");

    function pump() {
      // 오일이 채워지며 피스톤 상승 → 카 상승
      oil.style.height = "200px";
      piston.style.bottom = "200px";
      car.style.bottom = "200px";
    }

    function valve() {
      // 오일 배출 → 피스톤 하강 → 카 하강
      oil.style.height = "0px";
      piston.style.bottom = "0px";
      car.style.bottom = "0px";
    }
  </script>
</body>
</html>
