<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>소수점 1자리 비교</title>
</head>
<body>
  <div id="result1"></div>
  <div id="result2"></div>
  <div id="result3"></div>

  <script>
    let a = 1.1;
    let b = 0.1;
    let c = 1.2;

    // 계산
    let sum = a + b;

    // 소수점 1자리까지 반올림 (숫자)
    let roundedSum = Math.round(sum * 10) / 10;
    let roundedC   = Math.round(c * 10) / 10;

    // 출력
    document.getElementById("result1").innerText = "반올림된 sum = " + roundedSum;

    // == 비교
    document.getElementById("result2").innerText = "roundedSum == roundedC → " + (roundedSum == roundedC);

    // > 비교
    document.getElementById("result3").innerText = "roundedSum > roundedC → " + (roundedSum > roundedC);
  </script>
</body>
</html>
