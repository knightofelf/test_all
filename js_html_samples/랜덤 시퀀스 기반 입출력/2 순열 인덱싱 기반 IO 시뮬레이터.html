<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>순열 인덱싱 기반 I/O 시뮬레이터</title>
</head>
<body>
<h2>랜덤 시퀀스 기반 I/O 성능 테스트</h2>
<button onclick="runTest()">성능 테스트 실행</button>

<p id="randSeq"></p>
<p id="writeResult"></p>
<p id="readResult"></p>
<p id="perf"></p>

<script>
const rMAX = 8;
let randSeq = [];
let buffer = [];

// 랜덤 시퀀스 생성
function generateRandSeq() {
    let used = Array(rMAX).fill(false);
    randSeq = [];
    while (randSeq.length < rMAX) {
        let n = Math.floor(Math.random() * rMAX);
        if (!used[n]) {
            used[n] = true;
            randSeq.push(n);
        }
    }
    return randSeq;
}

// 데이터 쓰기 (랜덤 시퀀스 순서대로)
function writeData(dataSize) {
    buffer = [];
    for (let i = 0; i < dataSize; i++) {
        let idx = randSeq[i % rMAX];
        buffer.push("DATA" + idx);
    }
}

// 데이터 읽기 (랜덤 시퀀스 순서대로)
function readData() {
    let readOut = buffer.map((val, idx) => `[${randSeq[idx % rMAX]}] ${val}`);
    return readOut;
}

// 성능 테스트 실행
function runTest() {
    let seq = generateRandSeq();
    document.getElementById("randSeq").innerText = "랜덤 시퀀스: " + seq.join(", ");

    let dataSize = 100000; // 테스트용 데이터 크기
    let t1 = performance.now();
    writeData(dataSize);
    let t2 = performance.now();
    let readOut = readData();
    let t3 = performance.now();

    document.getElementById("writeResult").innerText = "쓰기 완료 (데이터 크기: " + dataSize + ")";
    document.getElementById("readResult").innerText = "읽기 샘플: " + readOut.slice(0, 10).join(" | ");
    document.getElementById("perf").innerText =
        "쓰기 시간: " + (t2 - t1).toFixed(2) + " ms, " +
        "읽기 시간: " + (t3 - t2).toFixed(2) + " ms";
}
</script>
</body>
</html>
