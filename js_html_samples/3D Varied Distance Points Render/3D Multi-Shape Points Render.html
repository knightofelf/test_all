<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D Multi-Shape Points Render</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030305; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- 로컬에 다운로드한 three.min.js 로드 -->

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  
  <script>
    if (typeof THREE === 'undefined') {
      document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:20%;'>three.min.js 파일이 같은 폴더에 있는지 확인해주세요!</h2>";
    } else {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const numPoints = 2000; // 형태를 뚜렷하게 하기 위해 점 개수 증가
      const geometry = new THREE.BufferGeometry();
      const positions = [];

      for (let i = 0; i < numPoints; i++) {
        
        // ==========================================
        // [방법 1] DNA 이중나선 (Double Helix) 모양
        // 거리를 고정하고 높이에 따라 각도를 꼬아주며 두 개의 가닥을 만듭니다.
        // ------------------------------------------
        const t = (i / numPoints) * 30 - 15; // -15부터 15까지의 높이(y)값
        const angle = t * 1.5; // 높이에 따라 회전하는 각도
        const r = 5; // 나선의 반지름
        const strand = (i % 2 === 0) ? 0 : Math.PI; // 180도 대칭되는 두 가닥 생성
        
        const x = r * Math.cos(angle + strand) + (Math.random() - 0.5) * 0.4;
        const y = t; // y축을 따라 길게 배치
        const z = r * Math.sin(angle + strand) + (Math.random() - 0.5) * 0.4;
        positions.push(x, y, z);
        // ==========================================


        // ==========================================
        // [방법 2] 사각 피라미드 (Pyramid) 모양 (확인하려면 아래 주석 해제)
        // 높이(y)가 올라갈수록 밑면의 테두리 거리(r)를 줄여 뾰족하게 만듭니다.
        // ------------------------------------------
        /*
        const y = Math.random() * 16 - 8; // 높이 (-8 ~ 8)
        const scale = (8 - y) / 16; // 꼭대기(y=8)로 갈수록 크기가 0에 수렴하도록 비율 계산
        const side = Math.floor(Math.random() * 4); // 4개의 면 무작위 선택
        const offset = (Math.random() - 0.5) * 14 * scale;
        
        let x = 0, z = 0;
        const maxDist = 7 * scale; // 높이에 따라 줄어드는 사각형 반지름
        
        if (side === 0) { x = maxDist; z = offset; }
        else if (side === 1) { x = -maxDist; z = offset; }
        else if (side === 2) { x = offset; z = maxDist; }
        else { x = offset; z = -maxDist; }
        
        positions.push(x, y, z);
        */
        // ==========================================


        // ==========================================
        // [방법 3] 3D 로즈 꽃 / 토네이도 (Rose / Tornado) 모양 (확인하려면 아래 주석 해제)
        // 수평 각도(theta)와 수직 각도(phi)의 비율을 비틀어 패턴을 만듭니다.
        // ------------------------------------------
        /*
        const theta = Math.random() * 2 * Math.PI;
        const phi = (Math.random() - 0.5) * Math.PI;
        // 특정 주기(여기서는 4배수)로 반지름 r이 수축과 팽창을 반복하게 만듦
        const r = 10 * Math.sin(theta * 4) * Math.cos(phi * 2); 
        
        const x = r * Math.cos(phi) * Math.cos(theta);
        const y = r * Math.sin(phi);
        const z = r * Math.cos(phi) * Math.sin(theta);
        positions.push(x, y, z);
        */
        // ==========================================


        // ==========================================
        // [방법 4] 물방울 / 눈물 (Teardrop) 모양 (확인하려면 아래 주석 해제)
        // 위쪽(북극)으로 갈수록 반지름 r을 급격히 줄여 뾰족한 꼬리를 만듭니다.
        // ------------------------------------------
        /*
        const theta = Math.random() * 2 * Math.PI;
        const phi = (Math.random() - 0.5) * Math.PI; // -π/2 ~ π/2
        // 사인 함수를 변형하여 위쪽은 뾰족하고 아래쪽은 둥글게 거리 조절
        const r = 8 * Math.pow(Math.sin((phi + Math.PI/2) / 2), 2); 
        
        const x = r * Math.cos(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * 2; // 세로로 살짝 늘려줌
        const z = r * Math.cos(phi) * Math.sin(theta);
        positions.push(x, y, z);
        */
        // ==========================================
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

      // 신비로운 연보라/사안(Cyan) 색상으로 설정
      const material = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.15, transparent: true, opacity: 0.8 });
      const points = new THREE.Points(geometry, material);
      scene.add(points);

      camera.position.z = 30;

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        points.rotation.y += 0.006; 
        points.rotation.x += 0.002; 
        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
