<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D Varied Distance Points Render</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #050505; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- ⭐️ 같은 폴더에 다운로드한 로컬 three.min.js 파일을 불러옵니다 -->

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  
  <script>
    // 라이브러리가 정상 로드되었는지 확인 후 실행
    if (typeof THREE === 'undefined') {
      document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:20%;'>three.min.js 파일이 HTML 파일과 같은 폴더에 있는지 확인해주세요!</h2>";
    } else {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const center = { x: 0, y: 0, z: 0 };
      const numPoints = 1500; 
      const geometry = new THREE.BufferGeometry();
      const positions = [];

      for (let i = 0; i < numPoints; i++) {
        const theta = Math.random() * 2 * Math.PI;
        const phi = (Math.random() - 0.5) * Math.PI;

        let r = 10; 

        // [방법 1] 3D 하트 (Heart) 모양
        const x_temp = Math.cos(phi) * Math.cos(theta);
        const y_temp = Math.cos(phi) * Math.sin(theta);
        const z_temp = Math.sin(phi);
        r = 8 * (1 - Math.sin(phi)) * (1 + 0.3 * Math.sin(theta)); 

        const x = center.x + r * x_temp;
        const y = center.y + r * y_temp;
        const z = center.z + r * z_temp;
        positions.push(x, y, z);
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({ color: 0xff3366, size: 0.15, transparent: true, opacity: 0.8 });
      const points = new THREE.Points(geometry, material);
      scene.add(points);

      camera.position.z = 30;

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        points.rotation.y += 0.005; 
        points.rotation.x += 0.002; 
        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
