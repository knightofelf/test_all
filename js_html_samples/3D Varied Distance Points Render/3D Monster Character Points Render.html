<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D Monster Character Points Render</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #080810; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- 로컬에 다운로드한 three.min.js 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  
  <script>
    if (typeof THREE === 'undefined') {
      document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:20%;'>three.min.js 파일이 같은 폴더에 있는지 확인해주세요!</h2>";
    } else {
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const numPoints = 4000; // 정교한 캐릭터 전신 표현을 위해 점 개수 대폭 증가
      const geometry = new THREE.BufferGeometry();
      const positions = [];

      for (let i = 0; i < numPoints; i++) {
        // 무작위 점 분배를 위한 구면 좌표계 변수들
        const theta = Math.random() * 2 * Math.PI;
        const phi = (Math.random() - 0.5) * Math.PI;
        
        let x = 0, y = 0, z = 0;

        // 확률(i % 10)에 따라 캐릭터의 각 신체 부위 중심점과 거리를 다르게 배치
        const part = i % 10;

        if (part === 0 || part === 1 || part === 2) {
          // 1. 머리 (Head) - 상단에 위치한 기본 구형태
          const r = 4.5;
          x = r * Math.cos(phi) * Math.cos(theta);
          y = 3 + r * Math.sin(phi); // y축으로 3만큼 올림
          z = r * Math.cos(phi) * Math.sin(theta);

        } else if (part === 3 || part === 4 || part === 5) {
          // 2. 몸통 (Body) - 하단에 위치하고 가로/세로 비율 변형
          const r = 5;
          x = r * Math.cos(phi) * Math.cos(theta) * 0.9;  // 약간 슬림하게
          y = -3 + r * Math.sin(phi) * 1.2;              // 세로로 길쭉하게 배치
          z = r * Math.cos(phi) * Math.sin(theta) * 0.9;

        } else if (part === 6) {
          // 3. 오른쪽 긴 귀 (Right Ear) - 오른쪽 대각선 위로 길쭉하게 뻗음
          const r = 1.2;
          const length = Math.random() * 4; // 귀의 길이 조절
          x = 3 + length * 0.7 + r * Math.cos(phi) * Math.cos(theta);
          y = 6 + length * 1.2 + r * Math.sin(phi);
          z = r * Math.cos(phi) * Math.sin(theta);

        } else if (part === 7) {
          // 4. 왼쪽 긴 귀 (Left Ear) - 왼쪽 대각선 위로 길쭉하게 뻗음
          const r = 1.2;
          const length = Math.random() * 4;
          x = -3 - length * 0.7 + r * Math.cos(phi) * Math.cos(theta);
          y = 6 + length * 1.2 + r * Math.sin(phi);
          z = r * Math.cos(phi) * Math.sin(theta);

        } else if (part === 8) {
          // 5. 양팔 (Arms) - 좌우로 튀어나온 짧고 귀여운 팔
          const isLeft = (Math.random() > 0.5);
          const r = 1.0;
          const length = Math.random() * 2.5;
          x = (isLeft ? -4.5 - length : 4.5 + length) + r * Math.cos(phi) * Math.cos(theta);
          y = -2 + r * Math.sin(phi);
          z = length * 0.5 + r * Math.cos(phi) * Math.sin(theta); // 약간 앞쪽을 향하게 함

        } else {
          // 6. 양발 (Feet) - 바닥에 지탱하는 납작한 발 모양
          const isLeft = (Math.random() > 0.5);
          const r = 1.3;
          x = (isLeft ? -2.5 : 2.5) + r * Math.cos(phi) * Math.cos(theta) * 1.4; // 옆으로 넓게
          y = -8 + r * Math.sin(phi) * 0.6; // 위아래로 납작하게 누름
          z = 1 + r * Math.cos(phi) * Math.sin(theta) * 1.5; // 앞쪽으로 길게 뻗음
        }

        positions.push(x, y, z);
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

      // 피카츄 스타일의 화사한 네온 옐로우(노란색) 색상 적용
      const material = new THREE.PointsMaterial({ color: 0xffdf00, size: 0.14, transparent: true, opacity: 0.9 });
      const points = new THREE.Points(geometry, material);
      scene.add(points);

      camera.position.z = 25;

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        // 전신 실루엣이 완전히 한 바퀴 돌며 보이도록 세팅
        points.rotation.y += 0.005; 
        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
