<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CIELab 색채계 시각화</title>
  <style>
    canvas { border: 1px solid #333; }
  </style>
</head>
<body>
  <h2>CIELab 색채계 시각화</h2>
  <canvas id="labCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById("labCanvas");
    const ctx = canvas.getContext("2d");

    // a*: -128 ~ +127 (좌우축), b*: -128 ~ +127 (상하축)
    const size = 400;
    const center = size / 2;

    function labToRgb(L, a, b) {
      // Lab → XYZ
      let y = (L + 16) / 116;
      let x = a / 500 + y;
      let z = y - b / 200;

      const refX = 0.95047, refY = 1.00000, refZ = 1.08883;

      function fInv(t) {
        return t ** 3 > 0.008856 ? t ** 3 : (t - 16/116) / 7.787;
      }

      x = refX * fInv(x);
      y = refY * fInv(y);
      z = refZ * fInv(z);

      // XYZ → Linear RGB
      let r = x *  3.2406 + y * -1.5372 + z * -0.4986;
      let g = x * -0.9689 + y *  1.8758 + z *  0.0415;
      let bl = x *  0.0557 + y * -0.2040 + z *  1.0570;

      function gammaCorrect(c) {
        return c <= 0.0031308 ? 12.92 * c : 1.055 * (c ** (1/2.4)) - 0.055;
      }

      r = Math.min(Math.max(0, gammaCorrect(r)), 1);
      g = Math.min(Math.max(0, gammaCorrect(g)), 1);
      bl = Math.min(Math.max(0, gammaCorrect(bl)), 1);

      return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(bl*255)})`;
    }

    // 시각화: L* 고정(예: 60), a*, b* 평면에 색상 표시
    const L = 60;
    for (let a = -128; a <= 127; a += 4) {
      for (let b = -128; b <= 127; b += 4) {
        const color = labToRgb(L, a, b);
        ctx.fillStyle = color;
        ctx.fillRect(center + a, center - b, 4, 4);
      }
    }
  </script>
</body>
</html>
