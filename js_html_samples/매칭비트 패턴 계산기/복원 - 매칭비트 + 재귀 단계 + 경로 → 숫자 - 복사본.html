<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>매칭비트 역방향 계산기</title>
</head>
<body>
  <h2>매칭비트 + 재귀 단계 + 경로 → 숫자</h2>
  <label>매칭비트 값: <input id="bitValue" type="text" value="1"></label>
  <label>재귀 단계: <input id="level" type="number" value="16"></label>
  <label>경로 문자열: <input id="path" type="text" value="우좌우우좌좌우좌좌좌좌좌좌우우"></label>
  <button onclick="calcNumber()">계산</button>
  <pre id="output"></pre>

  <script>
    function getMatchBit(n) {
      if (n === 0) return "0";
      if (n % 2 === 1) return "1";
      const trailingZeros = n.toString(2).match(/0+$/)[0].length;
      return "1" + "0".repeat(trailingZeros);
    }

    function calcNumber() {
      const bitValue = document.getElementById("bitValue").value.trim();
      const level = parseInt(document.getElementById("level").value);
      const path = document.getElementById("path").value.trim();

      let start = 2 ** (level - 1);
      let end = 2 ** level - 1;

      for (let dir of path) {
        const mid = (start + end) / 2;
        if (dir === "좌") {
          end = Math.floor(mid);
        } else if (dir === "우") {
          start = Math.ceil(mid);
        }
      }

      const result = start; // 최종 숫자
      const match = getMatchBit(result);

      if (match === bitValue) {
        document.getElementById("output").textContent =
          `매칭비트:${bitValue}, 재귀 단계:${level}, 경로:${path} → 숫자:${result}`;
      } else {
        document.getElementById("output").textContent =
          `조건 불일치: 계산된 숫자=${result}, 매칭비트=${match}`;
      }
    }
  </script>
</body>
</html>
