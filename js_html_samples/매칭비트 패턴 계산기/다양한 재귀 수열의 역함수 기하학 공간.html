<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>다양한 재귀 수열의 역함수 기하학 공간</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #fdfdfd; }
    .controls { background: #f0f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    canvas { border: 1px solid #ccc; background: #111116; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
    .desc { width: 350px; line-height: 1.6; font-size: 14px; }
    select, input, button { padding: 6px 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    h3 { margin-top: 0; color: #333; }
    .badge { inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; color: white; font-weight: bold; }
  </style>
</head>
<body>
  <h2>🌌 재귀 수열의 공간 역전 (역함수 기하학)</h2>
  
  <div class="controls">
    <label>⚡ 수열 선택: 
      <select id="sequenceType" onchange="updateDescription()">
        <option value="bitmatch">1. 비트매칭 재귀 수열 (기존 삼각형)</option>
        <option value="collatz">2. 콜라츠 추측 추적 수열 (성운/은하 형태)</option>
        <option value="fibonacci">3. 피보나치 수열 (부메랑/빗살 형태)</option>
      </select>
    </label>
    <label>🔢 탐색 범위 끝: <input id="end" type="number" value="1000"></label>
    <button onclick="runVisualization()">공간 시각화</button>
  </div>

  <div class="container">
    <canvas id="graphCanvas" width="600" height="600"></canvas>
    <div class="desc">
      <h3>💡 구조 해석 공간</h3>
      <div id="explainText">수열을 선택하고 버튼을 눌러보세요. 수열마다 완전히 다른 기하학적 형태가 펼쳐집니다. 기본 배경을 우주 느낌(블랙)으로 변경하여 점들의 밀도를 극대화했습니다.</div>
    </div>
  </div>

  <script>
    // 1. 비트매칭 수열 계산
    function getMatchBit(n) {
      if (n === 0) return 0;
      if (n % 2 === 1) return 1;
      let count = 0;
      while (n % 2 === 0) { count++; n /= 2; }
      return Math.pow(10, count);
    }

    // 2. 콜라츠 수열 계산 (1이 될 때까지 걸리는 재귀 횟수/스텝)
    function getCollatzSteps(n) {
      if (n <= 1) return 0;
      let steps = 0;
      let temp = n;
      while (temp > 1) {
        if (temp % 2 === 0) temp /= 2;
        else temp = 3 * temp + 1;
        steps++;
      }
      return steps;
    }

    // 3. 피보나치 수열 배열 생성 계산
    function getFibonacciValue(n) {
      if (n === 0) return 0;
      if (n === 1) return 1;
      let a = 0, b = 1, temp;
      for (let i = 2; i <= n; i++) {
        temp = a + b;
        a = b;
        b = temp;
      }
      return b;
    }

    function updateDescription() {
      const type = document.getElementById("sequenceType").value;
      const desc = document.getElementById("explainText");
      if (type === "bitmatch") {
        desc.innerHTML = "<b>📐 직각삼각형 구조</b><br>이진법 자릿수가 고정된 격자 칸막이 역할을 하여, $y=x$ 대칭선을 중심으로 두 개의 직각삼각형이 맞물린 프랙탈 데칼코마니 격자가 완성됩니다.";
      } else if (type === "collatz") {
        desc.innerHTML = "<b>🌌 우주 성운(Nebula) 구조</b><br>숫자가 커질 때 연산 횟수(Y축)가 무작위로 치솟는 것처럼 보이지만, 역함수로 눕혀서 보면 특정 스텝(X축) 라인에 별무리가 흩뿌려진 듯한 <b>구름/은하수 무늬</b>가 나타납니다. 카오스 속의 숨겨진 질서입니다. (추천 범위: 1000 ~ 5000)";
      } else if (type === "fibonacci") {
        desc.innerHTML = "<b>🪃 부메랑 / 빗살무늬 구조</b><br>피보나치는 값이 기하급수적으로 폭발합니다. 로그 공간에서 역함수를 취하면 완벽하게 정렬된 직선들이 부메랑이나 빗살처럼 꺾여 나가는 곡선 궤적을 그리게 됩니다. 황금비율의 전개 방향을 보여줍니다. (추천 범위: 40 ~ 80)";
      }
    }

    function runVisualization() {
      const type = document.getElementById("sequenceType").value;
      const end = parseInt(document.getElementById("end").value);
      let dataPoints = [];

      if (type === "bitmatch") {
        for (let n = 1; n <= end; n++) {
          dataPoints.push({ x: n, y: getMatchBit(n) });
        }
      } else if (type === "collatz") {
        for (let n = 1; n <= end; n++) {
          dataPoints.push({ x: n, y: getCollatzSteps(n) });
        }
      } else if (type === "fibonacci") {
        for (let n = 1; n <= Math.min(end, 100); n++) { // 피보나치는 너무 크면 무한대 발산하므로 제한
          dataPoints.push({ x: n, y: getFibonacciValue(n) });
        }
      }

      drawSpace(dataPoints);
    }

    function drawSpace(data) {
      const canvas = document.getElementById("graphCanvas");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const padding = 60;

      ctx.clearRect(0, 0, width, height);

      function logScale(val) {
        return val <= 0 ? 0 : Math.log10(val);
      }

      const maxX = Math.max(...data.map(d => d.x), 1);
      const maxY = Math.max(...data.map(d => d.y), 1);
      const maxLog = Math.max(logScale(maxX), logScale(maxY));

      function getPos(xVal, yVal) {
        const logX = logScale(xVal);
        const logY = logScale(yVal);
        const x = padding + (logX / maxLog) * (width - 2 * padding);
        const y = height - padding - (logY / maxLog) * (height - 2 * padding);
        return { x, y };
      }

      // 배경 격자선 그리기 (어두운 테마용)
      ctx.strokeStyle = "#222230";
      ctx.lineWidth = 1;
      for (let i = 0; i <= Math.ceil(maxLog); i++) {
        const val = Math.pow(10, i);
        const pos = getPos(val, val);
        ctx.beginPath(); ctx.moveTo(pos.x, padding); ctx.lineTo(pos.x, height - padding); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(padding, pos.y); ctx.lineTo(width - padding, pos.y); ctx.stroke();

        ctx.fillStyle = "#888";
        ctx.font = "11px sans-serif";
        ctx.fillText(val.toLocaleString(), pos.x - 12, height - padding + 20);
        ctx.fillText(val.toLocaleString(), padding - 45, pos.y + 4);
      }

      // y = x 대칭 기준선
      ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(padding, height - padding);
      ctx.lineTo(width - padding, padding);
      ctx.stroke();
      ctx.setLineDash([]);

      // 축 이름
      ctx.fillStyle = "#fff";
      ctx.font = "12px sans-serif";
      ctx.fillText("X 축 (Log)", width - padding, height - padding + 35);
      ctx.fillText("Y 축 (Log)", padding - 45, padding - 15);

      // 데이터 플로팅
      data.forEach(pt => {
        if(pt.x <= 0 || pt.y <= 0) return;

        // 원본 함수: 파란색/하늘색 야광 효과
        const orig = getPos(pt.x, pt.y);
        ctx.fillStyle = "rgba(0, 191, 255, 0.6)";
        ctx.beginPath(); ctx.arc(orig.x, orig.y, 3, 0, 2 * Math.PI); ctx.fill();

        // 역함수 변환 점: 빨간색/형광 핑크 효과 (X와 Y를 뒤바꿈)
        const inv = getPos(pt.y, pt.x);
        ctx.fillStyle = "rgba(255, 0, 128, 0.6)";
        ctx.beginPath(); ctx.arc(inv.x, inv.y, 3, 0, 2 * Math.PI); ctx.fill();
      });
    }

    // 초기 실행
    updateDescription();
    runVisualization();
  </script>
</body>
</html>
