<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>매칭비트 + 재귀순서 역검색</title>
</head>
<body>
  <h2>매칭비트와 재귀순서로 숫자 찾기</h2>
  <label>매칭비트 값: <input id="bitValue" type="text" value="100"></label>
  <label>재귀 단계: <input id="level" type="number" value="5"></label>
  <label>검색 범위 끝: <input id="end" type="number" value="40"></label>
  <button onclick="findNumbers()">검색</button>
  <pre id="output"></pre>

  <script>
    function getMatchBit(n) {
      if (n === 0n) return "0";
      if (n % 2n === 1n) return "1";
      const trailingZeros = n.toString(2).match(/0+$/)[0].length;
      return "1" + "0".repeat(trailingZeros);
    }

    function getRecursionLevel(n) {
      return n.toString(2).length;
    }

    function findNumbers() {
      const bitValue = document.getElementById("bitValue").value;
      const level = parseInt(document.getElementById("level").value);
      const end = BigInt(document.getElementById("end").value);
      let result = `매칭비트=${bitValue}, 재귀 단계=${level} →\n`;

      for (let n = 0n; n <= end; n++) {
        const match = getMatchBit(n);
        const recursionLevel = getRecursionLevel(n);
        if (match === bitValue && recursionLevel === level) {
          result += `${n}\n`;
        }
      }

      document.getElementById("output").textContent = result;
    }
  </script>
</body>
</html>
