<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>타원곡선 애니메이션 그리기</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            font-family: sans-serif;
        }
        canvas {
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        #controls {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Elliptic Curve: y² = x³ - 2 (순차적 그리기)</h2>
    <canvas id="curveCanvas" width="700" height="500"></canvas>
    <div id="controls">현재 단계: <span id="status">준비 중...</span></div>

<script>
const canvas = document.getElementById('curveCanvas');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('status');

// --- 좌표계 설정 ---
const scale = 50; // 1단위당 50픽셀
const originX = canvas.width / 2 - 50; // 원점 X (약간 왼쪽으로 배치)
const originY = canvas.height / 2;     // 원점 Y (중앙)

// 수학적 좌표 -> 캔버스 픽셀 좌표 변환
function toCanvasX(x) { return originX + x * scale; }
function toCanvasY(y) { return originY - y * scale; } // Y축은 뒤집힘

// --- 기본 배경(그리드 및 축) 그리기 ---
function drawGrid() {
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    
    // 세로선
    for (let x = -5; x <= 10; x++) {
        ctx.beginPath();
        ctx.moveTo(toCanvasX(x), 0);
        ctx.lineTo(toCanvasX(x), canvas.height);
        ctx.stroke();
    }
    // 가로선
    for (let y = -5; y <= 5; y++) {
        ctx.beginPath();
        ctx.moveTo(0, toCanvasY(y));
        ctx.lineTo(canvas.width, toCanvasY(y));
        ctx.stroke();
    }

    // X, Y 메인 축
    ctx.strokeStyle = '#333333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, originY); ctx.lineTo(canvas.width, originY); // X축
    ctx.moveTo(originX, 0); ctx.lineTo(originX, canvas.height); // Y축
    ctx.stroke();

    // 텍스트 라벨링
    ctx.fillStyle = '#333333';
    ctx.font = '12px sans-serif';
    ctx.fillText('O', originX - 15, originY + 15);
    ctx.fillText('X', canvas.width - 20, originY - 10);
    ctx.fillText('Y', originX + 10, 20);
    
    // 주요 숫자 표시
    [1, 2, 3, 4, 5].forEach(n => {
        ctx.fillText(n, toCanvasX(n) - 4, originY + 15);
        ctx.fillText(n, originX - 15, toCanvasY(n) + 4);
        ctx.fillText(-n, originX - 20, toCanvasY(-n) + 4);
    });
}

// 점 그리기 함수
function drawPoint(x, y, label, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(toCanvasX(x), toCanvasY(y), 5, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(label, toCanvasX(x) + 8, toCanvasY(y) - 5);
}

// 점선 가이드라인 그리기
function drawDashedLine(x1, y1, x2, y2) {
    ctx.strokeStyle = '#999999';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(toCanvasX(x1), toCanvasY(y1));
    ctx.lineTo(toCanvasX(x2), toCanvasY(y2));
    ctx.stroke();
    ctx.setLineDash([]); // 실선으로 리셋
}

// --- 순차적 애니메이션 타임라인 ---
let currentX = Math.cbrt(2); // 시작점 (약 1.26)
const maxX = 5.0;            // 그려질 최대 X 범위
const speed = 0.03;          // 그리기 속도

function startAnimation() {
    // 1단계: 기본 그리드 그리기
    drawGrid();
    
    setTimeout(() => {
        statusText.innerText = "1단계 - 시작점 (X절편 ≒ 1.26) 표시";
        drawPoint(Math.cbrt(2), 0, " (1.26, 0)", "#ff5722");
    }, 1000);

    setTimeout(() => {
        statusText.innerText = "2단계 - 핵심 정수해 기준점 표시";
        drawDashedLine(3, 0, 3, 5);
        drawDashedLine(3, 0, 3, -5);
        drawPoint(3, 5, " (3, 5)", "#e91e63");
        drawPoint(3, -5, " (3, -5)", "#e91e63");
    }, 3000);

    setTimeout(() => {
        statusText.innerText = "3단계 - 곡선 실시간 그리기 시작 (상하 대칭)";
        animateCurve();
    }, 5500);
}

// 곡선 애니메이션 루프
function animateCurve() {
    if (currentX > maxX) {
        statusText.innerText = "완성 - y² = x³ - 2 타원곡선";
        return;
    }

    ctx.strokeStyle = '#007bef';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    let nextX = currentX + speed;

    // 현재 세그먼트의 y값 계산
    let y1 = Math.sqrt(Math.pow(currentX, 3) - 2);
    let y2 = Math.sqrt(Math.pow(nextX, 3) - 2);

    // 위쪽 곡선 그리기
    ctx.beginPath();
    ctx.moveTo(toCanvasX(currentX), toCanvasY(y1));
    ctx.lineTo(toCanvasX(nextX), toCanvasY(y2));
    ctx.stroke();

    // 아래쪽 대칭 곡선 그리기
    ctx.beginPath();
    ctx.moveTo(toCanvasX(currentX), toCanvasY(-y1));
    ctx.lineTo(toCanvasX(nextX), toCanvasY(-y2));
    ctx.stroke();

    currentX = nextX;
    requestAnimationFrame(animateCurve);
}

// 스크립트 시작
startAnimation();
</script>

</body>
</html>
