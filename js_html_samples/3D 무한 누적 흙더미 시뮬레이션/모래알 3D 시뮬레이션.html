<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>모래알 3D 시뮬레이션</title>
  <style>canvas { display:block; }</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
  // Three.js 기본 세팅
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 조명
  const light = new THREE.PointLight(0xffffff, 1);
  light.position.set(10,10,10);
  scene.add(light);

  // Cannon.js 물리 세계
  const world = new CANNON.World();
  world.gravity.set(0, -9.82, 0);

  // 바닥
  const groundBody = new CANNON.Body({
    mass: 0,
    shape: new CANNON.Plane()
  });
  world.addBody(groundBody);

  // 모래알 생성
  const particles = [];
  for(let i=0; i<200; i++){
    const radius = 0.05;
    const sphereShape = new CANNON.Sphere(radius);
    const sphereBody = new CANNON.Body({ mass: 0.01 });
    sphereBody.addShape(sphereShape);
    sphereBody.position.set(Math.random()-0.5, 2+Math.random()*2, Math.random()-0.5);
    world.addBody(sphereBody);

    const geometry = new THREE.SphereGeometry(radius, 8, 8);
    const material = new THREE.MeshPhongMaterial({color:0xc2a66d});
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    particles.push({body:sphereBody, mesh:mesh});
  }

  camera.position.z = 5;

  // 애니메이션 루프
  function animate(){
    requestAnimationFrame(animate);
    world.step(1/60);

    particles.forEach(p=>{
      p.mesh.position.copy(p.body.position);
      p.mesh.quaternion.copy(p.body.quaternion);
    });

    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
