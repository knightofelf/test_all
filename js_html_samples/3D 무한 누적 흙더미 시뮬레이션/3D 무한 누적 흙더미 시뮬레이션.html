<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 무한 누적 흙더미 시뮬레이션</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1510; font-family: sans-serif; user-select: none; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #f0e6d2;
            pointer-events: none; background: rgba(40,30,20,0.8); 
            padding: 15px; border-radius: 6px; z-index: 10000;
            border: 1px solid #543;
        }
        h3 { margin: 0 0 5px 0; font-size: 16px; color: #ffebcd; }
        p { margin: 0 0 5px 0; font-size: 12px; color: #ccc; }
        .highlight { font-weight: bold; color: #dfb76c; font-size: 14px; margin-top: 4px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>거친 흙더미 장벽 (정적 데이터 무한 누적 기술)</h3>
        <p>마우스 드래그: 화면 회전 | 마우스 휠: 확대/축소</p>
        <div id="live-count">낙하 중인 입자 (물리 연산): 0 개</div>
        <div id="static-count" class="highlight">지면 누적 병합 입자 (무한): 0 개</div>
    </div>

    <script>
        let canvas, gl, glProgram, matrixLocation, colorLocation;
        
        // [무한 구현의 핵심 데이터 분리 구조]
        let activeBodies = [];     // 현재 공중에서 떨어지며 물리 연산 중인 활성 입자들 (최대 150개 내외 유지)
        const staticVertices = []; // 바닥에 멈춰서 하나로 흡수된 '무한' 정점 버퍼 데이터 저장소
        let staticBuffer = null;   // 누적된 지형을 단 하나의 드로우콜로 그릴 WebGL 하드웨어 버퍼

        const wallRadius = 2.0;      
        const wallThickness = 0.6;   
        const sizeX = 0.08, sizeY = 0.07, sizeZ = 0.1; // 입자 크기

        let totalMergedCount = 0;   // 바닥에 흡수된 총 누적 흙 입자 수 카운터

        // 화면 회전 시점 카메라 제어 변수
        let theta = 0, phi = Math.PI / 4, radius = 6.5;
        let isDragging = false, previousMousePosition = { x: 0, y: 0 };

        function init() {
            canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.body.appendChild(canvas);
            gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

            if (!gl) {
                document.body.innerHTML = "<div style='color:white;padding:20px;'>WebGL 미지원 브라우저입니다.</div>";
                return;
            }

            window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('wheel', onWindowWheel);
            window.addEventListener('resize', onWindowResize);

            buildEmbeddedGraphics();
        }

        // --- 무한 누적용 정밀 고속 물리 충돌 엔진 ---
        function stepPhysics() {
            const dt = 0.016; 
            const remainingBodies = [];

            for (let i = 0; i < activeBodies.length; i++) {
                const b = activeBodies[i];
                
                b.vy += -9.82 * dt;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.z += b.vz * dt;

                let isSleeping = false;

                // 1) 기본 지면 안착 조건 처리
                if (b.y < b.radiusY) {
                    b.y = b.radiusY;
                    b.vy = 0; b.vx = 0; b.vz = 0;
                    b.sleepTimer += dt;
                    if(b.sleepTimer > 0.15) isSleeping = true; // 완전히 멈추면 수면 모드 진입
                }

                // 2) 떨어지는 입자 간의 충돌 및 얹힘 연산
                for (let j = 0; j < activeBodies.length; j++) {
                    if (i === j) continue;
                    const target = activeBodies[j];
                    const dx = b.x - target.x;
                    const dz = b.z - target.z;
                    const distXZ = Math.sqrt(dx * dx + dz * dz);
                    const combinedRadiusXZ = (b.radiusX + target.radiusX) * 0.85;

                    if (distXZ < combinedRadiusXZ) {
                        const overlapY = (target.y + target.radiusY + b.radiusY) - b.y;
                        if (overlapY > 0 && b.y > target.y) {
                            b.y += overlapY;
                            b.vy = 0;
                            b.vx = (b.vx + (dx / distXZ) * 0.05) * 0.1;
                            b.vz = (b.vz + (dz / distXZ) * 0.05) * 0.1;
                            
                            // 아래 받치고 있는 입자가 완전히 멈춘 상태라면 나도 수면 유도 누적
                            if(target.vy === 0 && Math.abs(b.vx) < 0.01) {
                                b.sleepTimer += dt;
                                if(b.sleepTimer > 0.2) isSleeping = true;
                            }
                        }
                    }
                }

                // ** 핵심 로직: 완전히 정착한 객체는 물리 연산 배열에서 빼고 거대한 '하나의 지형' 정점으로 병합(Merge) **
                if (isSleeping) {
                    mergeToStaticTerrain(b);
                } else {
                    remainingBodies.push(b);
                }
            }
            activeBodies = remainingBodies;
            document.getElementById('live-count').innerText = `낙하 중인 입자 (물리 연산): ${activeBodies.length} 개`;
        }
        // --- [무한 구현의 핵심] 멈춘 흙 입자를 단 하나의 정적 지형 데이터로 병합하는 함수 ---
        function mergeToStaticTerrain(b) {
            // 입자의 로컬 육면체 정점 기본 뼈대 데이터
            const baseVertices = [
                -sizeX, -sizeY,  sizeZ,  sizeX, -sizeY,  sizeZ,  sizeX,  sizeY,  sizeZ, -sizeX,  sizeY,  sizeZ,
                -sizeX, -sizeY, -sizeZ, -sizeX,  sizeY, -sizeZ,  sizeX,  sizeY, -sizeZ,  sizeX, -sizeY, -sizeZ,
                -sizeX,  sizeY, -sizeZ, -sizeX,  sizeY,  sizeZ,  sizeX,  sizeY,  sizeZ,  sizeX,  sizeY, -sizeZ,
                -sizeX, -sizeY, -sizeZ,  sizeX, -sizeY, -sizeZ,  sizeX, -sizeY,  sizeZ, -sizeX, -sizeY,  sizeZ,
                 sizeX, -sizeY, -sizeZ,  sizeX,  sizeY, -sizeZ,  sizeX,  sizeY,  sizeZ,  sizeX, -sizeY,  sizeZ,
                -sizeX, -sizeY, -sizeZ, -sizeX, -sizeY,  sizeZ, -sizeX,  sizeY,  sizeZ, -sizeX,  sizeY, -sizeZ,
            ];

            const cosX = Math.cos(b.rotX), sinX = Math.sin(b.rotX);
            const cosY = Math.cos(b.rotY), sinY = Math.sin(b.rotY);

            // 흙 입자의 회전 각도값과 고유 공간 좌표를 계산하여 하나의 정점 배열로 영구 병합
            for (let i = 0; i < baseVertices.length; i += 3) {
                let lx = baseVertices[i];
                let ly = baseVertices[i+1];
                let lz = baseVertices[i+2];

                // 고유 회전 변환 적용
                let rx = lx * cosY - lz * sinY;
                let rz = lx * sinY + lz * cosY;
                let ry = ly * cosX - rz * sinX;
                let fz = ly * sinX + rz * cosX;

                // 월드 좌표 공간(b.x, b.y, b.z)으로 복사 및 누적 저장
                staticVertices.push(rx + b.x);
                staticVertices.push(ry + b.y);
                staticVertices.push(fz + b.z);
            }

            totalMergedCount++;
            document.getElementById('static-count').innerText = `지면 누적 병합 입자 (무한): ${totalMergedCount} 개`;

            // GPU 메모리의 하드웨어 버퍼를 실시간으로 갱신 (리업로드)
            if (staticBuffer) gl.deleteBuffer(staticBuffer);
            staticBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, staticBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(staticVertices), gl.STATIC_DRAW);
        }

        // --- 공중 낙하 흙 입자 실시간 스폰 함수 ---
        function spawnSand() {
            // 낙하 중인 물리 입자는 프레임 부하를 막기 위해 최대 150개 미만으로 조절 (멈추면 계속 흡수되므로 무한 생성 가능)
            if (activeBodies.length >= 150) return;

            const angle = Math.random() * Math.PI * 2;
            const r = wallRadius + (Math.random() * wallThickness - (wallThickness / 2));
            
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const y = 5.0 + (Math.random() * 2.0); 

            const body = {
                x: x, y: y, z: z,
                vx: 0, vy: 0, vz: 0,
                radiusX: sizeX, radiusY: sizeY, radiusZ: sizeZ,
                rotX: Math.random() * Math.PI,
                rotY: Math.random() * Math.PI,
                rotZ: Math.random() * Math.PI,
                sleepTimer: 0
            };

            activeBodies.push(body);
        }

        // --- 내부 3D 하드웨어 셰이더 컴파일 파이프라인 ---
        let dynamicBuffer, positionAttributeLocation;
        function buildEmbeddedGraphics() {
            const vs = `#version 300 es
                in vec3 a_position;
                uniform mat4 u_matrix;
                void main() { gl_Position = u_matrix * vec4(a_position, 1.0); }`;

            const fs = `#version 300 es
                precision highp float;
                out vec4 outColor;
                uniform vec4 u_color;
                void main() { outColor = u_color; }`;

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            }

            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vs);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fs);
            
            glProgram = gl.createProgram();
            gl.attachShader(glProgram, vertexShader);
            gl.attachShader(glProgram, fragmentShader);
            gl.linkProgram(glProgram);

            matrixLocation = gl.getUniformLocation(glProgram, "u_matrix");
            colorLocation = gl.getUniformLocation(glProgram, "u_color");
            positionAttributeLocation = gl.getAttribLocation(glProgram, "a_position");

            // 낙하 중인 입자들을 위한 가변 드로우 버퍼 할당
            dynamicBuffer = gl.createBuffer();
        }

        // --- 메인 그래픽 렌더링 & 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            // 물리 시뮬레이션 연산
            stepPhysics();

            // 지속적으로 끊임없이 흙 입자를 위에서 공급 (무한 투하)
            if (Math.random() < 0.8) {
                for(let i = 0; i < 3; i++) spawnSand();
            }

            // WebGL 도화지 초기화
            gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
            gl.clearColor(0.12, 0.1, 0.08, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);

            gl.useProgram(glProgram);

            // 마우스 카메라 시점 변환 매핑 계산
            const cosT = Math.cos(theta); const sinT = Math.sin(theta);
            const cosP = Math.cos(phi); const sinP = Math.sin(phi);

            // ==========================================
            // [렌더링 파트 1] 하나로 병합된 무한 정적 지형 장벽 그리기 (드로우콜 1번으로 초고속 렌더링)
            // ==========================================
            if (staticBuffer && staticVertices.length > 0) {
                gl.bindBuffer(gl.ARRAY_BUFFER, staticBuffer);
                gl.enableVertexAttribArray(positionAttributeLocation);
                gl.vertexAttribPointer(positionAttributeLocation, 3, gl.FLOAT, false, 0, 0);

                // 카메라 월드-뷰 행렬 세팅
                const terrainMat = new Float32Array([
                    cosT * 0.23,             0,                       -sinT * 0.23,           0,
                    sinT * sinP * 0.23,      cosP * 0.23,             cosT * sinP * 0.23,     0,
                    sinT * cosP * 0.23,      -sinP * 0.23,            cosT * cosP * 0.23,     0,
                    0,                       -1.2 * cosP * 0.23,      -0.5 - (radius * 0.05), 1
                ]);
                gl.uniformMatrix4fv(matrixLocation, false, terrainMat);
                
                // 이미 고정 안착된 흙벽의 기본 고유 색상 (단일 연산 지정)
                gl.uniform4fv(colorLocation, new Float32Array([0.48, 0.38, 0.28, 1.0]));
                gl.drawArrays(gl.TRIANGLES, 0, staticVertices.length / 3);
            }

            // ==========================================
            // [렌더링 파트 2] 현재 공중에서 떨어지는 소량의 활성 물리 입자들 실시간 그리기
            // ==========================================
            const localBox = [
                -sizeX, -sizeY,  sizeZ,  sizeX, -sizeY,  sizeZ,  sizeX,  sizeY,  sizeZ, -sizeX,  sizeY,  sizeZ,
                -sizeX, -sizeY, -sizeZ, -sizeX,  sizeY, -sizeZ,  sizeX,  sizeY, -sizeZ,  sizeX, -sizeY, -sizeZ,
                -sizeX,  sizeY, -sizeZ, -sizeX,  sizeY,  sizeZ,  sizeX,  sizeY,  sizeZ,  sizeX,  sizeY, -sizeZ,
                -sizeX, -sizeY, -sizeZ,  sizeX, -sizeY, -sizeZ,  sizeX, -sizeY,  sizeZ, -sizeX, -sizeY,  sizeZ,
                 sizeX, -sizeY, -sizeZ,  sizeX,  sizeY, -sizeZ,  sizeX,  sizeY,  sizeZ,  sizeX, -sizeY,  sizeZ,
                -sizeX, -sizeY, -sizeZ, -sizeX, -sizeY,  sizeZ, -sizeX,  sizeY,  sizeZ, -sizeX,  sizeY, -sizeZ,
            ];

            for (let i = 0; i < activeBodies.length; i++) {
                const b = activeBodies[i];
                const cX = Math.cos(b.rotX), sX = Math.sin(b.rotX);
                const cY = Math.cos(b.rotY), sY = Math.sin(b.rotY);

                const rotViewX = b.x * cosT - b.z * sinT;
                const rotViewZ = b.x * sinT + b.z * cosT;
                const finalY = (b.y - 1.2) * cosP - rotViewZ * sinP;
                const finalZ = (b.y - 1.2) * sinP + rotViewZ * cosP;

                const mat = new Float32Array([
                    0.6 * cY * cosT,          0.6 * sX * sY * sinP,     -0.6 * sY * cosP,        0,
                    0.6 * sX * sY,            0.6 * cX * cosP,           0.6 * sX * cY,          0,
                    0.6 * cX * sY * sinT,    -0.6 * sX * sinP,           0.6 * cX * cY * cosT,   0,
                    rotViewX * 0.23,          finalY * 0.23,            -0.5 + (finalZ * 0.15) - (radius * 0.05), 1
                ]);
                gl.uniformMatrix4fv(matrixLocation, false, mat);

                // 낙하 중인 생동감을 주기 위해 실시간 입자는 살짝 더 밝은 흙 색상 부여
                gl.uniform4fv(colorLocation, new Float32Array([0.58, 0.46, 0.34, 1.0]));

                gl.bindBuffer(gl.ARRAY_BUFFER, dynamicBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(localBox), gl.STREAM_DRAW);
                gl.enableVertexAttribArray(positionAttributeLocation);
                gl.vertexAttribPointer(positionAttributeLocation, 3, gl.FLOAT, false, 0, 0);
                
                gl.drawArrays(gl.TRIANGLES, 0, 24);
            }
        }

        // --- 인터랙션 조작 보조 헬퍼 핸들러 ---
        function onMouseMove(e) {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            theta += deltaX * 0.01;
            phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, phi - deltaY * 0.01));
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onWindowWheel(e) {
            radius = Math.max(3, Math.min(25, radius + e.deltaY * 0.01));
        }

        function onWindowResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        // 지형 무한 누적 물리 시뮬레이션 엔진 가동
        init();
        animate();
    </script>
</body>
</html>
