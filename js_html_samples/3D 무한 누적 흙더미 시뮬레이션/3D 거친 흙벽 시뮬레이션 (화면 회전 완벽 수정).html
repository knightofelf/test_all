<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 거친 흙벽 시뮬레이션 (화면 회전 완벽 수정)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1510; font-family: sans-serif; user-select: none; }
        #info {
            position: absolute; top: 10px; left: 10px; color: #f0e6d2;
            pointer-events: none; background: rgba(40,30,20,0.8); 
            padding: 15px; border-radius: 6px; z-index: 10000;
            border: 1px solid #543;
        }
        h3 { margin: 0 0 5px 0; font-size: 16px; color: #ffebcd; }
        p { margin: 0 0 5px 0; font-size: 12px; color: #ccc; }
        #count { font-weight: bold; color: #dfb76c; font-size: 14px; }
    </style>
</head>
<body>
    <div id="info">
        <h3>거친 흙더미 장벽 (화면 회전 기능 복구 완료)</h3>
        <p>마우스 드래그: 화면 자유 회전 | 마우스 휠: 확대/축소</p>
        <div id="count">스폰된 흙 입자: 0 / 1200</div>
    </div>

    <script>
        let canvas, gl, glProgram, matrixLocation, colorLocation;
        const physicsBodies = [];   
        const maxParticles = 1200;  

        const wallRadius = 2.0;      
        const wallThickness = 0.6;   
        const sizeX = 0.08, sizeY = 0.07, sizeZ = 0.1; 

        // [복구 완료] 카메라 회전각 및 원근 계산 데이터
        let theta = 0;             // 좌우 회전 각도
        let phi = Math.PI / 4;     // 상하 회전 각도
        let radius = 6.5;          // 카메라와 장벽 사이의 거리
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        function init() {
            canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.body.appendChild(canvas);
            gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

            if (!gl) {
                document.body.innerHTML = "<div style='color:white;padding:20px;'>WebGL 미지원 브라우저입니다.</div>";
                return;
            }

            // 마우스 클릭 및 드래그 이벤트 수정 및 고정
            window.addEventListener('mousedown', (e) => { 
                isDragging = true; 
                previousMousePosition = { x: e.clientX, y: e.clientY }; 
            });
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('wheel', onWindowWheel);
            window.addEventListener('resize', onWindowResize);

            buildEmbeddedGraphics();
        }

        function stepPhysics() {
            const dt = 0.016; 
            for (let i = 0; i < physicsBodies.length; i++) {
                const b = physicsBodies[i];
                b.vy += -9.82 * dt;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.z += b.vz * dt;

                if (b.y < b.radiusY) {
                    b.y = b.radiusY;
                    b.vy = 0;
                    b.vx *= 0.2; 
                    b.vz *= 0.2;
                }

                for (let j = 0; j < i; j++) {
                    const target = physicsBodies[j];
                    const dx = b.x - target.x;
                    const dz = b.z - target.z;
                    const distXZ = Math.sqrt(dx * dx + dz * dz);
                    const combinedRadiusXZ = (b.radiusX + target.radiusX) * 0.85;

                    if (distXZ < combinedRadiusXZ) {
                        const overlapY = (target.y + target.radiusY + b.radiusY) - b.y;
                        if (overlapY > 0 && b.y > target.y) {
                            b.y += overlapY; 
                            b.vy = 0;
                            b.vx = (b.vx + (dx / distXZ) * 0.1) * 0.15;
                            b.vz = (b.vz + (dz / distXZ) * 0.1) * 0.15;
                        }
                    }
                }
            }
        }
        // --- 흙 입자 무작위 회전 스폰 함수 ---
        function spawnSand() {
            if (physicsBodies.length >= maxParticles) return;

            const angle = Math.random() * Math.PI * 2;
            const r = wallRadius + (Math.random() * wallThickness - (wallThickness / 2));
            
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const y = 4.5 + (Math.random() * 2.0); 

            const body = {
                x: x, y: y, z: z,
                vx: 0, vy: 0, vz: 0,
                radiusX: sizeX, radiusY: sizeY, radiusZ: sizeZ,
                rotX: Math.random() * Math.PI,
                rotY: Math.random() * Math.PI,
                rotZ: Math.random() * Math.PI
            };

            physicsBodies.push(body);
            document.getElementById('count').innerText = `스폰된 흙 입자: ${physicsBodies.length} / ${maxParticles}`;
        }

        // --- 내부 3D 하드웨어 셰이더 컴파일 파이프라인 ---
        function buildEmbeddedGraphics() {
            const vs = `#version 300 es
                in vec4 a_position;
                uniform mat4 u_matrix;
                void main() { gl_Position = u_matrix * a_position; }`;

            const fs = `#version 300 es
                precision highp float;
                out vec4 outColor;
                uniform vec4 u_color;
                void main() { outColor = u_color; }`;

            function createShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            }

            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vs);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fs);
            
            glProgram = gl.createProgram();
            gl.attachShader(glProgram, vertexShader);
            gl.attachShader(glProgram, fragmentShader);
            gl.linkProgram(glProgram);

            matrixLocation = gl.getUniformLocation(glProgram, "u_matrix");
            colorLocation = gl.getUniformLocation(glProgram, "u_color");

            const positionAttributeLocation = gl.getAttribLocation(glProgram, "a_position");
            const vao = gl.createVertexArray();
            gl.bindVertexArray(vao);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            
            const vertices = new Float32Array([
                -sizeX, -sizeY,  sizeZ,  sizeX, -sizeY,  sizeZ,  sizeX,  sizeY,  sizeZ, -sizeX,  sizeY,  sizeZ,
                -sizeX, -sizeY, -sizeZ, -sizeX,  sizeY, -sizeZ,  sizeX,  sizeY, -sizeZ,  sizeX, -sizeY, -sizeZ,
                -sizeX,  sizeY, -sizeZ, -sizeX,  sizeY,  sizeZ,  sizeX,  sizeY,  sizeZ,  sizeX,  sizeY, -sizeZ,
                -sizeX, -sizeY, -sizeZ,  sizeX, -sizeY, -sizeZ,  sizeX, -sizeY,  sizeZ, -sizeX, -sizeY,  sizeZ,
                 sizeX, -sizeY, -sizeZ,  sizeX,  sizeY, -sizeZ,  sizeX,  sizeY,  sizeZ,  sizeX, -sizeY,  sizeZ,
                -sizeX, -sizeY, -sizeZ, -sizeX, -sizeY,  sizeZ, -sizeX,  sizeY,  sizeZ, -sizeX,  sizeY, -sizeZ,
            ]);
            gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
            gl.enableVertexAttribArray(positionAttributeLocation);
            gl.vertexAttribPointer(positionAttributeLocation, 3, gl.FLOAT, false, 0, 0);
        }

        // --- 메인 그래픽 렌더링 & 애니메이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            stepPhysics();

            if (physicsBodies.length < maxParticles && Math.random() < 0.6) {
                for(let i = 0; i < 3; i++) spawnSand();
            }

            gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
            gl.clearColor(0.12, 0.1, 0.08, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);

            gl.useProgram(glProgram);

            // ** [회전 기능 복구] 마우스 조작 각도를 삼각함수 시점 변환 행렬에 실시간 대입 **
            const cosT = Math.cos(theta);
            const sinT = Math.sin(theta);
            const cosP = Math.cos(phi);
            const sinP = Math.sin(phi);

            for (let i = 0; i < physicsBodies.length; i++) {
                const b = physicsBodies[i];
                
                const cX = Math.cos(b.rotX), sX = Math.sin(b.rotX);
                const cY = Math.cos(b.rotY), sY = Math.sin(b.rotY);

                // 마우스 드래그 좌표에 대응해 모든 흙 입자의 상대적 공간 배치를 다시 계산 (월드-뷰 결합 변환)
                const worldX = b.x;
                const worldY = b.y - 1.2;
                const worldZ = b.z;

                // 회전축 투영 공식 적용
                const rotViewX = worldX * cosT - worldZ * sinT;
                const rotViewZ = worldX * sinT + worldZ * cosT;
                const finalY = worldY * cosP - rotViewZ * sinP;
                const finalZ = worldY * sinP + rotViewZ * cosP;

                const mat = new Float32Array([
                    0.6 * cY * cosT,          0.6 * sX * sY * sinP,     -0.6 * sY * cosP,        0,
                    0.6 * sX * sY,            0.6 * cX * cosP,           0.6 * sX * cY,          0,
                    0.6 * cX * sY * sinT,    -0.6 * sX * sinP,           0.6 * cX * cY * cosT,   0,
                    rotViewX * 0.23,          finalY * 0.23,            -0.5 + (finalZ * 0.15) - (radius * 0.05), 1
                ]);
                
                gl.uniformMatrix4fv(matrixLocation, false, mat);
                
                const colorTone = 0.38 + (i % 6) * 0.06;
                gl.uniform4fv(colorLocation, new Float32Array([
                    0.56 * colorTone, 
                    0.44 * colorTone, 
                    0.32 * colorTone, 
                    1.0
                ]));
                
                gl.drawArrays(gl.TRIANGLES, 0, 24);
            }
        }

        // --- 마우스 인터랙션 유틸리티 함수 부 ---
        function onMouseMove(e) {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            
            // 드래그 거리에 비례하여 회전각 갱신
            theta += deltaX * 0.01;
            phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, phi - deltaY * 0.01));
            
            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function onWindowWheel(e) {
            // 마우스 휠 조작으로 화면 확대/축소 범위 제어
            radius = Math.max(3, Math.min(25, radius + e.deltaY * 0.01));
        }

        function onWindowResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        init();
        animate();
    </script>
</body>
</html>
