<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비트 재귀수열 삼각형</title>
  <style>
    body { font-family: monospace; background: #f4f4f4; padding: 20px; }
    .triangle { line-height: 1.6; }
    .level { margin: 5px 0; }
    .bit { display: inline-block; margin: 0 5px; }
  </style>
</head>
<body>
  <h2>비트 재귀수열 삼각형</h2>
  <label>최대 숫자 입력: <input type="number" id="maxNum" value="15"></label>
  <button onclick="generateTriangle()">생성</button>

  <div id="output" class="triangle"></div>

  <script>
    function generateTriangle() {
      const maxNum = parseInt(document.getElementById("maxNum").value, 10);
      const output = document.getElementById("output");
      output.innerHTML = "";

      let level = 0;
      let start = 1;

      while (start <= maxNum) {
        const end = Math.min(start * 2 - 1, maxNum);
        const div = document.createElement("div");
        div.className = "level";

        for (let i = start; i <= end; i++) {
          const bit = i.toString(2); // 이진수 변환
          const span = document.createElement("span");
          span.className = "bit";
          span.textContent = bit;
          div.appendChild(span);
        }

        output.appendChild(div);
        start *= 2;
        level++;
      }
    }

    // 초기 실행
    generateTriangle();
  </script>
</body>
</html>
