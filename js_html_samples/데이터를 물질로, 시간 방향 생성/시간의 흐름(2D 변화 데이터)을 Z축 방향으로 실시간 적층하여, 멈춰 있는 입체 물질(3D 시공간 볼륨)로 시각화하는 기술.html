<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Data to 3D Time-Space Volume (No External Libs)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: sans-serif; }
        #canvas2d { position: absolute; top: 10px; left: 10px; border: 1px solid #555; width: 150px; height: 150px; z-index: 10; background: #000; }
        #info { position: absolute; bottom: 10px; left: 10px; z-index: 10; font-size: 13px; pointer-events: none; line-height: 1.6; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 6px; border: 1px solid #333; }
        #webgl-canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <!-- 좌상단: 실시간 2D 데이터 생성 뷰 -->
    <canvas id="canvas2d" width="64" height="64"></canvas>
    <!-- 메인: 외부 라이브러리 없는 순수 하드웨어 가속 3D 뷰 -->
    <canvas id="webgl-canvas"></canvas>
    
    <div id="info">
        <strong>✅ 인터넷 무관 / 완전 독립형 3D 가시화</strong><br>
        - 외부 라이브러리(Three.js 등)를 전혀 쓰지 않는 순수 WebGL 코드입니다.<br>
        - 추적 방지 보안 필터나 인터넷 차단 환경에서도 완벽히 작동합니다.<br>
        - 2D 데이터 단면이 Z축(시간 축) 방향으로 계속 누적되며 회전합니다.
    </div>

    <script>
        // --- 1. 기본 설정 및 데이터 배열 ---
        const canvas2d = document.getElementById('canvas2d');
        const ctx2d = canvas2d.getContext('2d');
        const w2d = canvas2d.width, h2d = canvas2d.height;

        const glCanvas = document.getElementById('webgl-canvas');
        const gl = glCanvas.getContext('webgl');

        if (!gl) {
            alert('이 브라우저는 WebGL을 지원하지 않습니다.');
        }

        // 3D 공간에 보관할 점(Voxel) 데이터 배열
        const MAX_LAYERS = 60; 
        let voxelData = []; // {x, y, z, r, g, b} 객체 배열
        let timeStep = 0;

        // --- 2. 순수 WebGL 셰이더 소스 컴파일 (GPU 직접 제어) ---
        const vsSource = `
            attribute vec4 aPosition;
            attribute vec4 aColor;
            varying vec4 vColor;
            uniform mat4 uMatrix;
            void main() {
                gl_Position = uMatrix * aPosition;
                gl_PointSize = 4.0; // 물질 입자 크기
                vColor = aColor;
            }
        `;
        const fsSource = `
            precision mediump float;
            varying vec4 vColor;
            void main() {
                gl_FragColor = vColor;
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }
        const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        gl.useProgram(program);

        const aPosition = gl.getAttribLocation(program, 'aPosition');
        const aColor = gl.getAttribLocation(program, 'aColor');
        const uMatrix = gl.getUniformLocation(program, 'uMatrix');

        const positionBuffer = gl.createBuffer();
        const colorBuffer = gl.createBuffer();

        // --- 3. 실시간 2D 노이즈 파동 데이터 스트리밍 ---
        function generate2DData(t) {
            ctx2d.clearRect(0, 0, w2d, h2d);
            const imgData = ctx2d.createImageData(w2d, h2d);
            
            for (let y = 0; y < h2d; y++) {
                for (let x = 0; x < w2d; x++) {
                    const idx = (y * w2d + x) * 4;
                    const cx = x - w2d / 2;
                    const cy = y - h2d / 2;
                    const dist = Math.sqrt(cx * cx + cy * cy);
                    
                    // 수학적 파동 매트릭스 계산
                    const value = Math.sin(dist * 0.3 - t * 0.08) * Math.cos(x * 0.05) * Math.sin(y * 0.05);
                    
                    if (value > 0.18) { 
                        imgData.data[idx] = Math.floor(100 + dist * 2.5); // R
                        imgData.data[idx + 1] = Math.floor(130 + Math.sin(t*0.1)*50); // G
                        imgData.data[idx + 2] = 255; // B
                        imgData.data[idx + 3] = 255;
                    } else {
                        imgData.data[idx + 3] = 0;
                    }
                }
            }
            ctx2d.putImageData(imgData, 0, 0);
        }

        // --- 4. 2D 픽셀을 전역 3D 공간(Z축 시간 방향)에 인젝션 ---
        function append3DLayer(zOffset) {
            const imgData = ctx2d.getImageData(0, 0, w2d, h2d).data;
            const sample = 2; // 성능 확보용 샘플링 간격
            
            // 기존에 이 Z축 영역에 있던 오래된 데이터 평면 제거
            voxelData = voxelData.filter(v => v.z !== zOffset);

            for (let y = 0; y < h2d; y += sample) {
                for (let x = 0; x < w2d; x += sample) {
                    const idx = (y * w2d + x) * 4;
                    if (imgData[idx + 3] > 0) {
                        // WebGL 좌표계(-1.0 ~ 1.0)에 맞게 정규화 수치 변환
                        voxelData.push({
                            x: (x - w2d / 2) / (w2d / 2) * 0.6,
                            y: (y - h2d / 2) / (h2d / 2) * 0.6,
                            z: (zOffset - MAX_LAYERS / 2) / (MAX_LAYERS / 2) * 0.8,
                            r: imgData[idx] / 255,
                            g: imgData[idx + 1] / 255,
                            b: imgData[idx + 2] / 255
                        });
                    }
                }
            }
        }

        // --- 5. 단순 3D 회전 변환 행렬 연산 함수 (라이브러리 미사용) ---
        function getRotationMatrix(angleX, angleY) {
            const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
            
            // Y축 회전 행렬 * X축 회전 행렬 연산 결과식
            return [
                cosY,        0,     -sinY,       0,
                sinX*sinY,  cosX,  sinX*cosY,    0,
                cosX*sinY, -sinX,  cosX*cosY,    0,
                0,           0,      0,          1
            ];
        }

        // --- 6. 고속 애니메이션 및 화면 출력 루프 ---
        function animate() {
            requestAnimationFrame(animate);
            timeStep++;

            // 1) 2D 단면 및 3D 적층 제어
            generate2DData(timeStep);
            append3DLayer(timeStep % MAX_LAYERS);

            // 2) 캔버스 크기 맞춤 리사이징
            if (glCanvas.width !== window.innerWidth || glCanvas.height !== window.innerHeight) {
                glCanvas.width = window.innerWidth;
                glCanvas.height = window.innerHeight;
                gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
            }

            gl.clearColor(0.02, 0.02, 0.02, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);

            // 3) GPU 전송용 데이터 플랫화(Flattening)
            const positions = [];
            const colors = [];
            for (let i = 0; i < voxelData.length; i++) {
                const v = voxelData[i];
                positions.push(v.x, v.y, v.z);
                colors.push(v.r, v.g, v.b, 1.0);
            }

            // 4) 버퍼에 밀어 넣기 및 그리기 명령
            if (positions.length > 0) {
                gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STREAM_DRAW);
                gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(aPosition);

                gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STREAM_DRAW);
                gl.vertexAttribPointer(aColor, 4, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(aColor);

                // 자동 회전 각도 행렬 연산 후 유니폼 주입
                const matrix = getRotationMatrix(0.4, timeStep * 0.01);
                gl.uniformMatrix4fv(uMatrix, false, matrix);

                gl.drawArrays(gl.POINTS, 0, positions.length / 3);
            }
        }

        // 즉시 무조건 구동
        animate();
    </script>
</body>
</html>
