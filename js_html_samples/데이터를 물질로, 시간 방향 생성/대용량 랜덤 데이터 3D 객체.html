<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대용량 랜덤 데이터 3D 객체</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 대량의 랜덤 데이터 생성 (약 1MB 정도)
    const numPoints = 100000; // 10만 개 점
    const positions = new Float32Array(numPoints * 3); // x,y,z 좌표

    for (let i = 0; i < numPoints; i++) {
      positions[i*3]   = Math.random() * 100 - 50; // x
      positions[i*3+1] = Math.random() * 100 - 50; // y
      positions[i*3+2] = Math.random() * 100 - 50; // z
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.05 });
    const pointCloud = new THREE.Points(geometry, material);
    scene.add(pointCloud);

    camera.position.z = 150;

    function animate() {
      requestAnimationFrame(animate);
      pointCloud.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
