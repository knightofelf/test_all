<!DOCTYPE html>
<html>
<head>
  <title>비닐하우스 재해 시뮬레이터</title>
  <style>
    canvas { background:#eef; display:block; margin:auto; }
  </style>
</head>
<body>
  <h2>비닐하우스 재해 시뮬레이터</h2>
  바람: <input type="range" id="wind" min="0" max="40"><br>
  비: <input type="range" id="rain" min="0" max="100"><br>
  눈: <input type="range" id="snow" min="0" max="100"><br>
  <button onclick="typhoon()">태풍 모드</button>
  <button onclick="rainstorm()">폭우 모드</button>
  <button onclick="snowstorm()">폭설 모드</button>
  <canvas id="sim" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("sim");
    const ctx = canvas.getContext("2d");

    // 구조물 내력 (예: 500 kg/m2)
    const strength = 500;

    // 환경 변수
    let windSpeed = 0;
    let rainLoad = 0;
    let snowLoad = 0;

    function calcLoad(){
      let windLoad = 0.5 * 1.225 * Math.pow(windSpeed,2); // 바람 압력
      let totalLoad = windLoad + rainLoad + snowLoad;
      return totalLoad;
    }

    function drawHouse(load){
      ctx.clearRect(0,0,600,400);

      // 본체
      ctx.fillStyle = "green";
      ctx.fillRect(200,200,200,100);

      // 지붕 (하중에 따라 처짐)
      ctx.beginPath();
      ctx.moveTo(200,200);
      ctx.lineTo(300,150 + load/50); 
      ctx.lineTo(400,200);
      ctx.closePath();
      ctx.fillStyle = "lightgray";
      ctx.fill();

      // 눈 효과
      for(let i=0;i<snowLoad;i+=10){
        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(250+Math.random()*100,150+Math.random()*20,3,0,Math.PI*2);
        ctx.fill();
      }

      // 비 효과
      for(let i=0;i<rainLoad;i+=10){
        ctx.fillStyle="blue";
        ctx.fillRect(Math.random()*600, Math.random()*200, 2, 10);
      }
    }

    function update(){
      let load = calcLoad();
      if(load > strength){
        alert("비닐하우스 붕괴 발생!");
      }
      drawHouse(load);
      requestAnimationFrame(update);
    }

    // 모드 실행
    function typhoon(){ windSpeed = 30; }
    function rainstorm(){ rainLoad = 200; }
    function snowstorm(){ snowLoad = 300; }

    update();
  </script>
</body>
</html>
