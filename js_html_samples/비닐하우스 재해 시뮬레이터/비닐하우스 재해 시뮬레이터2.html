<!DOCTYPE html>
<html>
<head>
  <title>비닐하우스 재해 시뮬레이터</title>
  <style>
    canvas { background:#eef; display:block; margin:auto; }
  </style>
</head>
<body>
  <h2>비닐하우스 재해 시뮬레이터</h2>
  바람: <input type="range" id="wind" min="0" max="100"><br>
  비: <input type="range" id="rain" min="0" max="100"><br>
  눈: <input type="range" id="snow" min="0" max="100"><br>
  <canvas id="sim" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("sim");
    const ctx = canvas.getContext("2d");
    const windInput = document.getElementById("wind");
    const rainInput = document.getElementById("rain");
    const snowInput = document.getElementById("snow");

    function drawHouse(wind, rain, snow) {
      ctx.clearRect(0,0,600,400);

      // 본체
      ctx.fillStyle = "green";
      ctx.fillRect(200,200,200,100);

      // 지붕 (바람에 따라 흔들림)
      ctx.beginPath();
      ctx.moveTo(200,200);
      ctx.lineTo(300+wind/5,150+snow/10); // 눈 무게로 처짐
      ctx.lineTo(400,200);
      ctx.closePath();
      ctx.fillStyle = "lightgray";
      ctx.fill();

      // 비 효과
      for(let i=0;i<rain;i+=5){
        ctx.fillStyle="blue";
        ctx.fillRect(Math.random()*600, Math.random()*200, 2, 10);
      }

      // 눈 효과
      for(let i=0;i<snow;i+=5){
        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(250+Math.random()*100,150+Math.random()*20,3,0,Math.PI*2);
        ctx.fill();
      }
    }

    function animate() {
      let wind = windInput.value;
      let rain = rainInput.value;
      let snow = snowInput.value;
      drawHouse(wind, rain, snow);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
