<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Syntax Highlight 압축 & 재그룹화</title>
<style>
  pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
  .keyword { color: #007acc; font-weight: bold; }
  .string { color: #a31515; }
  .number { color: #098658; }
</style>
</head>
<body>
<h2>압축 시뮬레이션 (재그룹화 + Brotli)</h2>
<pre id="code">
<span class="keyword">for</span> (let i = <span class="number">0</span>; i &lt; <span class="number">10</span>; i++) {
  console.log(<span class="string">'Hello'</span>);
}
</pre>

<script type="module">
// Brotli 라이브러리 불러오기 (npm 패키지 brotli-wasm 사용 가능)
import { compress } from "https://cdn.jsdelivr.net/npm/brotli-wasm@1.0.0/+esm";

// 1️⃣ 원본 데이터 추출
const rawHTML = document.getElementById('code').innerHTML;

// 2️⃣ 재그룹화: 토큰별 분류
const groups = { keyword: [], string: [], number: [], other: [] };
rawHTML.split(/(<[^>]+>)/g).forEach(token => {
  if (token.includes('keyword')) groups.keyword.push(token);
  else if (token.includes('string')) groups.string.push(token);
  else if (token.includes('number')) groups.number.push(token);
  else groups.other.push(token);
});

// 3️⃣ 그룹별 압축 (Brotli)
function compressGroup(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  const compressed = compress(data);
  return compressed.length; // 압축된 크기 반환
}

const compressedSizes = {
  keyword: compressGroup(groups.keyword.join('')),
  string: compressGroup(groups.string.join('')),
  number: compressGroup(groups.number.join('')),
  other: compressGroup(groups.other.join(''))
};

// 4️⃣ 패킷 구성
const packet = {
  meta: { version: 1.0, type: 'highlighted-code' },
  sizes: compressedSizes
};

console.log("압축 패킷:", packet);
</script>
</body>
</html>
