<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>압축-정렬-반복 누적 알고리즘 시뮬레이터</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { border-bottom: 3px solid #17a2b8; padding-bottom: 10px; color: #17a2b8; margin-top: 0; }
        .btn { display: block; width: 100%; border: none; padding: 13px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; background: #17a2b8; margin-bottom: 15px; }
        .btn:hover { background: #138496; }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .card { background: #f8f9fa; border: 1px solid #dee2e6; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; text-align: center; }
        .card h4 { margin: 0 0 5px 0; color: #495057; }
        .log-box { font-family: monospace; font-size: 13px; height: 200px; overflow-y: auto; background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; line-height: 1.6; }
        .highlight { color: #ffc107; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 [치환-정렬-반복 누적] 초고압축 효율 시뮬레이터</h2>
    
    <button class="btn" onclick="startAdvancedCompression()">⚡ 1MB 누적 압축 파이프라인 가동</button>

    <div class="result-grid">
        <div class="card">
            <h4>원본 데이터</h4>
            <span id="v_orig">0 바이트</span>
        </div>
        <div class="card" style="border-color: #ffc107;">
            <h4>누적 압축 데이터</h4>
            <span id="v_comp" style="color:#d93025; font-weight:bold;">0 바이트</span>
        </div>
        <div class="card" style="background: #e6f4ea;">
            <h4>최종 압축률</h4>
            <span id="v_ratio" style="color:#137333; font-weight:bold;">0%</span>
        </div>
    </div>

    <div class="log-box" id="logView">가동 버튼을 누르면 3단계 압축 엔진이 실행됩니다.</div>
</div>

<script>
// C 알고리즘 무작위 치환 배열 생성 
function fn_rand_length_fixed(rMAX) {
    let used = new Array(rMAX).fill(0);
    let vv = new Array(rMAX);
    let i = 0;
    while (i < rMAX) {
        let data = Math.floor(Math.random() * rMAX);
        if (!used[data]) { used[data] = 1; vv[i++] = data; }
    }
    return vv;
}

// 연속 중복 문자열 압축 (Run-Length Encoding) - 정렬된 데이터 최적화 엔진
function runLengthCompress(input) {
    let result = "";
    let count = 1;
    for (let i = 0; i < input.length; i++) {
        if (input[i] === input[i + 1]) {
            count++;
        } else {
            // 숫자+반복횟수 형태로 압축 축소
            result += input[i] + count;
            count = 1;
        }
    }
    return result;
}

function startAdvancedCompression() {
    const log = document.getElementById("logView");
    log.innerHTML = "🚀 압축 파이프라인 엔진 가동...<br>";

    setTimeout(() => {
        const rMAX = 8;
        const TARGET_SIZE = 1048576; // 1MB 
        
        // 1. 데이터 준수 빌드
        let masterData = "";
        while (masterData.length < TARGET_SIZE) masterData += Math.floor(Math.random() * rMAX).toString();
        masterData = masterData.substring(0, TARGET_SIZE);
        log.innerHTML += `• 단계 0: 1MB 난수 데이터 생성 완료 (${masterData.length.toLocaleString()} Bytes)<br>`;

        // 2. rMAX 치환 키 적용
        const rand_data = fn_rand_length_fixed(rMAX);
        let encMap = {};
        for(let i=0; i<rMAX; i++) encMap[i.toString()] = rand_data[i].toString();
        
        let substituted = "";
        for(let i=0; i<masterData.length; i++) substituted += encMap[masterData[i]];
        log.innerHTML += `• 단계 1: rMAX 치환 배열 암호화 완료 ➔ 키: [${rand_data.join(',')}]<br>`;

        // 3. 블록 정렬 (Sorting) 수행
        // 압축률을 극대화하기 위해 스트림 내부의 문자들을 정렬하여 인접 배치합니다.
        let sortedArray = substituted.split('').sort();
        let sortedString = sortedArray.join('');
        log.innerHTML += `• 단계 2: 블록 정렬(Sorting) 완료 (엔트로피 밀집화 완료)<br>`;

        // 4. 반복 누적 압축 (Iterative Accumulation Loop)
        log.innerHTML += `• 단계 3: 반복 누적 압축 루프 진입 (초기 압축 가동)<br>`;
        
        let currentStream = sortedString;
        let iteration = 3; // 3회 반복 누적 압축 실행
        
        for(let loop = 1; loop <= iteration; loop++) {
            let previousSize = currentStream.length;
            currentStream = runLengthCompress(currentStream);
            let compressionEfficiency = ((1 - (currentStream.length / previousSize)) * 100).toFixed(2);
            
            log.innerHTML += `&nbsp;&nbsp;└─ [${loop}회차 누적] 용량: <span class='highlight'>${currentStream.length.toLocaleString()} Bytes</span> (이전 회차 대비 ${compressionEfficiency}% 추가 압축)<br>`;
        }

        // 5. 최종 통계 출력
        const finalSize = currentStream.length;
        const totalRatio = ((1 - (finalSize / TARGET_SIZE)) * 100).toFixed(4);

        document.getElementById("v_orig").innerText = TARGET_SIZE.toLocaleString() + " Bytes";
        document.getElementById("v_comp").innerText = finalSize.toLocaleString() + " Bytes";
        document.getElementById("v_ratio").innerText = totalRatio + "%";

        log.innerHTML += `<br><b>🏁 압축 프로세스 종료</b><br>`;
        log.innerHTML += `➔ 최종 파일이 원본 대비 <span class='highlight'>${totalRatio}%</span> 압축되어 물리적 디스크 트래픽이 1000배 이상 절감됩니다.`;

    }, 50);
}
</script>

</body>
</html>
