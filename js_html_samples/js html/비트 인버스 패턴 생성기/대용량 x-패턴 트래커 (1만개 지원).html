<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대용량 x-패턴 트래커 (1만개 지원)</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 95%;
            max-width: 1400px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            width: 100%;
        }
        textarea {
            background-color: #222;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            font-size: 14px;
            font-family: inherit;
            width: 80%;
            height: 60px;
            resize: vertical;
            box-sizing: border-box;
        }
        .btn-group {
            width: 20%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            background-color: #222;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 8px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            height: 100%;
        }
        button:hover {
            background-color: #00ff66;
            color: #121212;
        }
        pre {
            background-color: #1a1a1a;
            border: 1px dashed #00ff66;
            padding: 20px;
            overflow: auto;
            font-size: 12px;
            line-height: 1.2;
            white-space: pre;
            max-height: 650px;
        }
        .summary-box {
            background-color: #1a1a1a;
            border: 1px solid #00ff66;
            padding: 15px;
            margin-top: 15px;
            font-size: 14px;
            border-top: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>대용량 x-패턴 트래커 (숫자 제외 & 최종 정보 표시)</h2>
    <div class="controls">
        <textarea id="bitInput" placeholder="2진수 비트를 입력하세요. (우측 버튼으로 1만개 자동 생성 가능)"></textarea>
        <div class="btn-group">
            <button onclick="generateRandomBits(10000)">1만개 비트 무작위 생성</button>
            <button onclick="runPattern()">패턴 생성 시작</button>
            <!-- [추가] 파일 내보내기 전용 컴포넌트 버튼 배치 -->
            <button onclick="downloadAsTextFile()" style="background-color: #00ff66; color: #121212; font-weight: bold;">💾 결과 파일 저장 (.txt)</button>
        </div>
    </div>
    <pre id="output">여기에 패턴 맵이 출력됩니다.</pre>
    <div id="summary" class="summary-box">여기에 마지막 줄 정보가 표시됩니다.</div>
</div>

<script>
// 전역 캐시 배열 변수 선언 (파일 다운로드용 메모리 백업 공간)
let globalResultLines = [];

// 2진수 비트 생성 함수
function generateRandomBits(count) {
    let res = "";
    for(let i=0; i<count; i++) {
        res += Math.random() > 0.5 ? "1" : "0";
    }
    document.getElementById('bitInput').value = res;
}

function runPattern() {
    const input = document.getElementById('bitInput').value.trim();
    if (!input) {
        alert("비트를 먼저 입력하거나 생성해주세요.");
        return;
    }
    
    if (!/^[01]+$/.test(input)) {
        alert("0과 1로 구성된 2진수만 입력 가능합니다.");
        return;
    }

    document.getElementById('output').textContent = "패턴 연산 중... 잠시만 기다려주세요.";
    document.getElementById('summary').innerHTML = "연산 중...";

    setTimeout(() => {
        let resultLines = [];
        let bitTracker = input.split(''); // 내부 비트 계산용 원본 데이터 배열 유지
        const len = bitTracker.length;

        // 1행: 숫자 배열을 그대로 문자열로 추가
        resultLines.push(bitTracker.join(''));

        let leftBoundary = 0;
        let rightBoundary = len - 1;
        let rowCount = 1;

        // 마지막 정보를 담을 객체
        let lastInfo = {
            row: 1,
            leftXIdx: -1,
            rightXIdx: -1,
            totalRows: 1
        };

        // 수렴할 때까지 추적 연산
        while (leftBoundary <= rightBoundary) {
            // 바로 윗줄(현재 bitTracker 상태)에서 처음 등장하는 '1'의 인덱스 검색
            let targetIdx = -1;
            for (let i = leftBoundary; i <= rightBoundary; i++) {
                if (bitTracker[i] === '1') {
                    targetIdx = i;
                    break;
                }
            }

            // 범위 내에 더 이상 '1'이 없으면 종료
            if (targetIdx === -1) break;

            // 시각화용 새 라인은 전부 공백(' ')으로 채움 (숫자 완전 배제)
            let visualLineArr = new Array(len).fill(' ');

            let currentLeftX = targetIdx;
            let currentRightX = rightBoundary - (currentLeftX - leftBoundary);

            if (currentLeftX > currentRightX) break;

            // 1) 내부 계산용 비트배열만 실제 인버스(반전) 수행
            for (let i = currentLeftX; i <= currentRightX; i++) {
                bitTracker[i] = bitTracker[i] === '1' ? '0' : '1';
            }

            // 2) 시각화 배열에는 x만 정확히 마킹
            visualLineArr[currentLeftX] = 'x';
            visualLineArr[currentRightX] = 'x';

            // 마지막 유효했던 행의 정보 기록 업데이트
            lastInfo.row = rowCount + 1;
            lastInfo.leftXIdx = currentLeftX;
            lastInfo.rightXIdx = currentRightX;

            // 우측 날개 패턴 결합
            let mainPattern = visualLineArr.join('');
            let outerRightWing = " ".repeat(rowCount * 2) + "x" + " ".repeat(rowCount * 4) + "x";
            
            resultLines.push(mainPattern + outerRightWing);

            // 다음 행 추적을 위해 범위를 안쪽으로 압축
            leftBoundary = currentLeftX + 1;
            rightBoundary = currentRightX - 1;
            rowCount++;
        }

        // 마지막 줄 바닥 지지대 행 생성 (숫자 없이 오직 공백과 x로만 연결)
        let groundLeft = new Array(len).fill(' ');
        for(let i=0; i<len; i+=3) {
            if(i < len) groundLeft[i] = 'x';
            if(i+1 < len) groundLeft[i+1] = 'x';
        }
        let finalGroundStr = groundLeft.join('') + " ".repeat(rowCount * 2) + "xx";
        resultLines.push(finalGroundStr);

        // 파일 내보내기용 전역 변수 동기화 바인딩
        globalResultLines = resultLines;
        lastInfo.totalRows = resultLines.length;

        // 1. 아스키 아트 캔버스 출력
        document.getElementById('output').textContent = resultLines.join('\n');

        // 2. 하단 마지막 아래 좌표와 최종 결과값 정보 출력
        let summaryHTML = `
            <strong>📊 최종 수렴 정보 (마지막 줄 분석 결과)</strong><br>
            <ul>
                <li><strong>총 출력 라인 수:</strong> ${lastInfo.totalRows} 줄</li>
                <li><strong>최종 소멸 직전 행 번호:</strong> ${lastInfo.row} 번째 줄</li>
                <li><strong>최지막 좌측 x 인덱스 좌표:</strong> <span style="color:#ff0055">${lastInfo.leftXIdx}</span> (0부터 시작)</li>
                <li><strong>최지막 우측 x 인덱스 좌표:</strong> <span style="color:#ff0055">${lastInfo.rightXIdx}</span></li>
                <li><strong>최종 수렴 구간 폭:</strong> ${Math.abs(lastInfo.rightXIdx - lastInfo.leftXIdx) + 1} 비트 영역</li>
            </ul>
        `;
        document.getElementById('summary').innerHTML = summaryHTML;

    }, 50);
}

// [추가] 렌더링된 전체 텍스트 라인을 결합하여 .txt 텍스트 문서로 로컬 하드에 즉시 저장하는 함수
function downloadAsTextFile() {
    if (globalResultLines.length === 0) {
        alert("다운로드할 데이터가 없습니다. 먼저 패턴 연산을 수행해 주세요.");
        return;
    }
    
    // 개행 문자로 모든 줄을 순치 결합하여 단일 대형 파일 구조화
    const fileContent = globalResultLines.join('\n');
    
    // 유니코드 변환용 Blob 스트림 생성
    const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
    const blobUrl = URL.createObjectURL(blob);
    
    // 가상의 가상 앵커 링크 요소를 빌드하여 강제 클릭 다운로드 펌핑
    const downloadAnchor = document.createElement("a");
    downloadAnchor.href = blobUrl;
    downloadAnchor.download = `x_pattern_track_${globalResultLines.length}_lines.txt`;
    downloadAnchor.style.display = 'none';
    
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    
    // 다 가동된 임시 Node 오브젝트 및 버퍼 안전 해제 폐기
    document.body.removeChild(downloadAnchor);
    URL.revokeObjectURL(blobUrl);
}

// 최초 로딩 예시
window.onload = function() {
    document.getElementById('bitInput').value = "11011000011110011";
    runPattern();
};
</script>

</body>
</html>
