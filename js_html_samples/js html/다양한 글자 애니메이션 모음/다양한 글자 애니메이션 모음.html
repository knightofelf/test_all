<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다양한 글자 애니메이션 모음</title>
  <style>
    /* 기본 스타일 리셋 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 3rem;
    }
    .container {
      text-align: center;
      padding: 20px;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 80%;
      max-width: 600px;
      background: #1e293b;
    }
    h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; }
    .text-box { font-size: 2rem; font-weight: bold; min-height: 50px; }

    /* 효과 1: 타이핑 커서 스타일 */
    .typing-cursor {
      border-right: 3px solid #38bdf8;
      animation: blink 0.75s step-end infinite;
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }

    /* 효과 2: 한 글자씩 위로 올라오며 등장 */
    .fade-up-char {
      display: inline-block;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.5s ease forwards;
    }
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 효과 3: 네온 발광 파도 효과 */
    .wave-char {
      display: inline-block;
      animation: wave 1.5s ease-in-out infinite;
    }
    @keyframes wave {
      0%, 100% { transform: translateY(0); text-shadow: none; }
      50% { 
        transform: translateY(-10px); 
        color: #a855f7;
        text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7;
      }
    }
  </style>
</head>
<body>

  <!-- 효과 1: 타자기 효과 -->
  <div class="container">
    <h2>1. Typing Effect</h2>
    <div class="text-box">
      <span id="typing-text"></span><span class="typing-cursor"></span>
    </div>
  </div>

  <!-- 효과 2: 글자별 순차 페이드업 효과 -->
  <div class="container">
    <h2>2. Sequential Fade-Up</h2>
    <div class="text-box" id="fade-up-text">순차적으로 올라오는 텍스트</div>
  </div>

  <!-- 효과 3: 네온 웨이브 효과 -->
  <div class="container">
    <h2>3. Neon Wave Effect</h2>
    <div class="text-box" id="wave-text">출렁이는 네온 텍스트</div>
  </div>

  <!-- 효과 4: 무작위 글자 셔플 효과 -->
  <div class="container">
    <h2>4. Matrix Shuffle Effect</h2>
    <div class="text-box" id="shuffle-text" data-value="MATRIX CODE">MATRIX CODE</div>
  </div>

  <script>
    // --- 1. 타자기 효과 (Typing Effect) ---
    const typingElement = document.getElementById('typing-text');
    const words = ["안녕하세요!", "JavaScript 애니메이션입니다.", "멋진 웹사이트를 만들어보세요."];
    let wordIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function type() {
      const currentWord = words[wordIndex];
      if (isDeleting) {
        typingElement.textContent = currentWord.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typingElement.textContent = currentWord.substring(0, charIndex + 1);
        charIndex++;
      }

      let typeSpeed = isDeleting ? 50 : 150;

      if (!isDeleting && charIndex === currentWord.length) {
        typeSpeed = 2000; // 단어 완성 후 대기 시간
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        typeSpeed = 500; // 다음 단어 시작 전 대기 시간
      }

      setTimeout(type, typeSpeed);
    }
    type();


    // --- 2. 순차 페이드업 효과 (Sequential Fade-Up) ---
    const fadeUpTarget = document.getElementById('fade-up-text');
    const fadeUpChars = fadeUpTarget.textContent.split("");
    fadeUpTarget.textContent = ""; // 기존 텍스트 비우기

    fadeUpChars.forEach((char, index) => {
      const span = document.createElement('span');
      span.textContent = char === " " ? "\u00A0" : char; // 공백 처리
      span.classList.add('fade-up-char');
      span.style.animationDelay = `${index * 0.08}s`; // 글자별 지연 시간 설정
      fadeUpTarget.appendChild(span);
    });


    // --- 3. 네온 웨이브 효과 (Neon Wave Effect) ---
    const waveTarget = document.getElementById('wave-text');
    const waveChars = waveTarget.textContent.split("");
    waveTarget.textContent = "";

    waveChars.forEach((char, index) => {
      const span = document.createElement('span');
      span.textContent = char === " " ? "\u00A0" : char;
      span.classList.add('wave-char');
      span.style.animationDelay = `${index * 0.1}s`;
      waveTarget.appendChild(span);
    });


    // --- 4. 무작위 글자 셔플 효과 (Matrix Shuffle) ---
    const shuffleTarget = document.getElementById('shuffle-text');
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ알파벳코딩기술애니메이션";
    
    function shuffleAnimation() {
      let iteration = 0;
      const originalText = shuffleTarget.dataset.value;
      
      const interval = setInterval(() => {
        shuffleTarget.textContent = originalText
          .split("")
          .map((letter, index) => {
            if(index < iteration) {
              return originalText[index]; // 확정된 글자 반환
            }
            return letters[Math.floor(Math.random() * letters.length)]; // 무작위 글자 반환
          })
          .join("");
        
        if(iteration >= originalText.length) {
          clearInterval(interval);
        }
        iteration += 1 / 3; // 숫자가 낮을수록 셔플이 오래 지속됨
      }, 30);
    }
    
    // 마우스를 올릴 때마다 셔플 실행 (원할 때 호출 가능)
    shuffleTarget.addEventListener('mouseover', shuffleAnimation);
    // 최초 1회 자동 실행
    shuffleAnimation();
  </script>
</body>
</html>
