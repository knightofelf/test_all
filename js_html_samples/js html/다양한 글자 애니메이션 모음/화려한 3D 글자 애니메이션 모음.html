<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화려한 3D 글자 애니메이션 모음</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 4rem;
      padding: 50px 0;
      perspective: 1000px; /* 전역 3D 깊이감 설정 */
    }
    .container {
      text-align: center;
      padding: 30px;
      border: 1px solid #1e293b;
      border-radius: 16px;
      width: 80%;
      max-width: 600px;
      background: #111827;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { font-size: 0.9rem; color: #64748b; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; }
    .text-box { font-size: 2.5rem; font-weight: 900; min-height: 70px; display: flex; justify-content: center; align-items: center; }

    /* ==========================================
       효과 1: 3D 글자 뒤집기 (3D Flip)
       ========================================== */
    .flip-char {
      display: inline-block;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      animation: flip3D 3s ease-in-out infinite;
    }
    @keyframes flip3D {
      0%, 10% { transform: rotateX(0deg); color: #38bdf8; }
      40%, 60% { transform: rotateX(180deg); color: #f43f5e; }
      90%, 100% { transform: rotateX(360deg); color: #38bdf8; }
    }

    /* ==========================================
       효과 2: 마우스 추적 3D 입체 텍스트 (조명 효과)
       ========================================== */
    #depth-text {
      color: #ffffff;
      text-transform: uppercase;
      transition: transform 0.1s ease;
      cursor: pointer;
      /* 초기 3D 텍스트 섀도우 값 */
      text-shadow: 
        1px 1px 0px #3b82f6,
        2px 2px 0px #3b82f6,
        3px 3px 0px #2563eb,
        4px 4px 0px #1d4ed8,
        5px 5px 10px rgba(0,0,0,0.6);
    }

    /* ==========================================
       효과 3: 3D 텍스트 큐브 회전 (Text Cube)
       ========================================== */
    .cube-wrapper {
      perspective: 1000px;
      height: 60px;
      width: 300px;
    }
    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 8s infinite ease-in-out;
    }
    .cube-face {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      border-radius: 8px;
    }
    /* 큐브의 4개 면 배치 (앞, 위, 뒤, 아래) */
    .face-front  { background: #059669; transform: rotateX(0deg) translateZ(30px); }
    .face-top    { background: #d97706; transform: rotateX(90deg) translateZ(30px); }
    .face-back   { background: #dc2626; transform: rotateX(180deg) translateZ(30px); }
    .face-bottom { background: #2563eb; transform: rotateX(-90deg) translateZ(30px); }

    @keyframes rotateCube {
      0%, 20%   { transform: rotateX(0deg); }
      25%, 45%  { transform: rotateX(-90deg); }
      50%, 70%  { transform: rotateX(-180deg); }
      75%, 95%  { transform: rotateX(-270deg); }
      100%      { transform: rotateX(-360deg); }
    }

    /* ==========================================
       효과 4: 3D 공간 분산 및 결합 (Explosion)
       ========================================== */
    .scatter-char {
      display: inline-block;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }
    /* 부모 상자에 마우스를 올리면 글자들이 3D 공간으로 흩어짐 */
    #scatter-container:hover .scatter-char {
      transform: 
        translate3d(var(--tx), var(--ty), var(--tz)) 
        rotateX(var(--rx)) 
        rotateY(var(--ry));
      opacity: 0.3;
      color: #ec4899;
      filter: blur(2px);
    }
  </style>
</head>
<body>

  <!-- 효과 1: 3D 글자 개별 뒤집기 -->
  <div class="container">
    <h2>1. 3D Individual Flip</h2>
    <div class="text-box" id="flip-text">3D FLIP ANIMATION</div>
  </div>

  <!-- 효과 2: 마우스 반응형 3D 입체 텍스트 -->
  <div class="container" id="depth-container">
    <h2>2. Interactive 3D Depth (Move Mouse)</h2>
    <div class="text-box">
      <div id="depth-text">INTERACTIVE</div>
    </div>
  </div>

  <!-- 효과 3: 3D 텍스트 큐브 회전 -->
  <div class="container">
    <h2>3. 3D Text Cube Rotation</h2>
    <div class="text-box">
      <div class="cube-wrapper">
        <div class="cube">
          <div class="cube-face face-front">HTML5 / CSS3</div>
          <div class="cube-face face-top">JAVASCRIPT</div>
          <div class="cube-face face-back">3D ANIMATION</div>
          <div class="cube-face face-bottom">CREATIVE WEB</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 효과 4: 3D 공간 분산 효과 -->
  <div class="container" id="scatter-container">
    <h2>4. 3D Scatter & Assemble (Hover Mouse)</h2>
    <div class="text-box" id="scatter-text">EXPLOSION</div>
  </div>

  <script>
    // --- 1. 3D 글자 개별 뒤집기 (3D Flip) ---
    const flipTarget = document.getElementById('flip-text');
    const flipChars = flipTarget.textContent.split("");
    flipTarget.textContent = "";

    flipChars.forEach((char, index) => {
      const span = document.createElement('span');
      span.textContent = char === " " ? "\u00A0" : char;
      span.classList.add('flip-char');
      // 글자마다 지연 시간을 주어 물결치듯 뒤집히게 설정
      span.style.animationDelay = `${index * 0.1}s`;
      flipTarget.appendChild(span);
    });


    // --- 2. 마우스 반응형 3D 입체 텍스트 (Interactive Depth) ---
    const depthContainer = document.getElementById('depth-container');
    const depthText = document.getElementById('depth-text');

    depthContainer.addEventListener('mousemove', (e) => {
      const rect = depthContainer.getBoundingClientRect();
      // 컨테이너 중심 기준 마우스 상대 좌표 계산 (-1 ~ 1 범위)
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;

      // 텍스트 자체 기울기 3D 회전
      depthText.style.transform = `rotateY(${x * 40}deg) rotateX(${-y * 40}deg)`;

      // 마우스 반대 방향으로 그림자 깊이를 길게 주어 입체감 극대화
      const shadowX = -x * 30;
      const shadowY = -y * 30;
      
      let shadowStyle = '';
      for (let i = 1; i <= 8; i++) {
        const factor = i / 8;
        shadowStyle += `${shadowX * factor}px ${shadowY * factor}px 0px rgba(59, 130, 246, ${1 - factor * 0.5}), `;
      }
      shadowStyle += `${shadowX}px ${shadowY}px 15px rgba(0,0,0,0.5)`;
      depthText.style.textShadow = shadowStyle;
    });

    // 마우스가 나가면 원래대로 복원
    depthContainer.addEventListener('mouseleave', () => {
      depthText.style.transform = `rotateY(0deg) rotateX(0deg)`;
      depthText.style.textShadow = `
        1px 1px 0px #3b82f6,
        2px 2px 0px #3b82f6,
        3px 3px 0px #2563eb,
        4px 4px 0px #1d4ed8,
        5px 5px 10px rgba(0,0,0,0.6)
      `;
    });


    // --- 4. 3D 공간 분산 효과 (3D Scatter) ---
    const scatterTarget = document.getElementById('scatter-text');
    const scatterChars = scatterTarget.textContent.split("");
    scatterTarget.textContent = "";

    scatterChars.forEach((char) => {
      const span = document.createElement('span');
      span.textContent = char === " " ? "\u00A0" : char;
      span.classList.add('scatter-char');

      // CSS 변수(Custom Properties)를 이용해 각 글자마다 무작위 3D 축 좌표 및 회전 값 부여
      // 마우스를 올렸을 때(Hover) 이 값만큼 날아갑니다.
      const randomX = (Math.random() - 0.5) * 200; // -100px ~ 100px
      const randomY = (Math.random() - 0.5) * 200; // -100px ~ 100px
      const randomZ = (Math.random() * 300) + 100;  // 100px ~ 400px (앞으로 튀어나옴)
      const randomRotX = (Math.random() - 0.5) * 360; 
      const randomRotY = (Math.random() - 0.5) * 360; 

      span.style.setProperty('--tx', `${randomX}px`);
      span.style.setProperty('--ty', `${randomY}px`);
      span.style.setProperty('--tz', `${randomZ}px`);
      span.style.setProperty('--rx', `${randomRotX}deg`);
      span.style.setProperty('--ry', `${randomRotY}deg`);

      scatterTarget.appendChild(span);
    });
  </script>
</body>
</html>
