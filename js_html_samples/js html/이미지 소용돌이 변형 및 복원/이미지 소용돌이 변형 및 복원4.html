<!DOCTYPE html>
<html>
<head>
    <title>로컬 이미지 소용돌이 복구 테스트</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; }
        canvas { border: 2px solid #333; margin-top: 10px; max-width: 100%; height: auto; }
        .controls { background: #eee; padding: 15px; border-radius: 8px; display: inline-block; }
        button { padding: 8px 15px; margin: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>이미지 소용돌이 변형 & 복원 (로컬 파일용)</h2>
    
    <div class="controls">
        <!-- 로컬 파일 선택 -->
        <input type="file" id="upload" accept="image/*"><br><br>
        <button onclick="transform(5)">변형 (Swirl +)</button>
        <button onclick="transform(-5)">복원 (Restore -)</button>
        <button onclick="reset()">초기화</button>
    </div>
    <br>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const upload = document.getElementById('upload');
        let originalImageData = null;

        // 파일 업로드 처리
        upload.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

function transform(strength) {
    if (!originalImageData) return alert("이미지를 먼저 업로드하세요!");
    
    const width = canvas.width;
    const height = canvas.height;
    const sourceData = ctx.getImageData(0, 0, width, height);
    const targetData = ctx.createImageData(width, height);
    
    const src = sourceData.data;
    const dst = targetData.data;
    const centerX = width / 2;
    const centerY = height / 2;
    const maxRadius = Math.sqrt(centerX**2 + centerY**2); 

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const dx = x - centerX;
            const dy = y - centerY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            const angle = strength * (maxRadius - distance) / maxRadius;
            const sinA = Math.sin(angle);
            const cosA = Math.cos(angle);

            // 1. 소수점 좌표를 그대로 유지 (floor 제거)
            const srcX = centerX + dx * cosA + dy * sinA;
            const srcY = centerY - dx * sinA + dy * cosA;

            const idx = (y * width + x) * 4;

            if (srcX >= 0 && srcX < width - 1 && srcY >= 0 && srcY < height - 1) {
                // 2. 주변 4개 픽셀 좌표 구하기
                const x0 = Math.floor(srcX);
                const x1 = x0 + 1;
                const y0 = Math.floor(srcY);
                const y1 = y0 + 1;

                // 3. 가중치(비율) 계산
                const wx = srcX - x0;
                const wy = srcY - y0;

                for (let i = 0; i < 4; i++) { // R, G, B, A 채널 반복
                    const p00 = src[(y0 * width + x0) * 4 + i];
                    const p10 = src[(y0 * width + x1) * 4 + i];
                    const p01 = src[(y1 * width + x0) * 4 + i];
                    const p11 = src[(y1 * width + x1) * 4 + i];

                    // 4. 주변색 섞기 (이선형 보간)
                    dst[idx + i] = (1 - wx) * (1 - wy) * p00 +
                                   wx * (1 - wy) * p10 +
                                   (1 - wx) * wy * p01 +
                                   wx * wy * p11;
                }
            }
        }
    }
    ctx.putImageData(targetData, 0, 0);
}


        function reset() {
            if (originalImageData) ctx.putImageData(originalImageData, 0, 0);
        }
    </script>
</body>
</html>
