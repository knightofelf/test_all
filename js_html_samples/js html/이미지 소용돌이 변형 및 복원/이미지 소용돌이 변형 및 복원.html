<!DOCTYPE html>
<html>
<head>
    <title>JS 소용돌이 변형 & 복원</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f0f0; }
        canvas { border: 1px solid #ccc; background: white; max-width: 90vw; }
        .controls { margin: 20px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>이미지 소용돌이 변형 및 복원</h2>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <button onclick="transform(5)">변형 (Swirl +5)</button>
        <button onclick="transform(-5)">복원 (Restore -5)</button>
        <button onclick="reset()">초기화</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let originalImageData = null;

        // 샘플 이미지 로드 (자리 표시용 색상 박스 생성)
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = 'https://blogpfthumb-phinf.pstatic.net/MjAxODA4MDRfMjA5/MDAxNTMzMzYwMzYyOTYw.pfw1N_Y6ssP1f6ni7EQrbjDVsL4KnAp40x7tvSVJQFYg.i8eL8RUmw2jkA23smsQCBn9SOI7Q4ItJVRIB8MbyA1gg.JPEG.shintx/20770488_1849964578655088_152000477365414417_n.jpg?type=w3840'; // 랜덤 이미지 서비스
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        };

        function transform(strength) {
            const width = canvas.width;
            const height = canvas.height;
            const sourceData = ctx.getImageData(0, 0, width, height);
            const targetData = ctx.createImageData(width, height);
            
            const src = sourceData.data;
            const dst = targetData.data;
            
            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = Math.sqrt(centerX**2 + centerY**2);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const dx = x - centerX;
                    const dy = y - centerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxRadius) {
                        // 소용돌이 수학 공식: 중심에 가까울수록 회전각이 큼
                        const angle = strength * (maxRadius - distance) / maxRadius;
                        const sinA = Math.sin(angle);
                        const cosA = Math.cos(angle);

                        // 역방향 좌표 추적 (Sampling)
                        const srcX = Math.floor(centerX + dx * cosA + dy * sinA);
                        const srcY = Math.floor(centerY - dx * sinA + dy * cosA);

                        if (srcX >= 0 && srcX < width && srcY >= 0 && srcY < height) {
                            const targetIdx = (y * width + x) * 4;
                            const srcIdx = (srcY * width + srcX) * 4;

                            dst[targetIdx] = src[srcIdx];
                            dst[targetIdx + 1] = src[srcIdx + 1];
                            dst[targetIdx + 2] = src[srcIdx + 2];
                            dst[targetIdx + 3] = src[srcIdx + 3];
                        }
                    } else {
                        // 반경 밖은 그대로 복사
                        const idx = (y * width + x) * 4;
                        dst[idx] = src[idx];
                        dst[idx+1] = src[idx+1];
                        dst[idx+2] = src[idx+2];
                        dst[idx+3] = src[idx+3];
                    }
                }
            }
            ctx.putImageData(targetData, 0, 0);
        }

        function reset() {
            ctx.putImageData(originalImageData, 0, 0);
        }
    </script>
</body>
</html>
