<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS 1MB 데이터 생성기</title>
    <!-- ZIP 다운로드를 위한 오픈소스 라이브러리 추가 -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; padding: 30px; background-color: #f5f5f5; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background-color: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; color: #28a745; }
        .info { font-size: 13px; color: #666; margin-top: 20px; text-align: left; background: #eee; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>TTS G2P 데이터 생성기</h2>
    <p>버튼을 누르면 총합 1MB 크기의 랜덤 <br><strong>phone / tone / word2ph</strong> 파일이 생성됩니다.</p>
    <button onclick="generateAndDownload()">1MB 데이터 생성 및 다운로드 (ZIP)</button>
    <div id="status"></div>

    <div class="info">
        <strong>생성 포맷 안내:</strong>
        <ul>
            <li><strong>phone.txt</strong>: 랜덤 음소 단위 배치 (공백 구분)</li>
            <li><strong>tone.txt</strong>: 음소 매핑 0/1 랜덤 성조 정보</li>
            <li><strong>word2ph.json</strong>: 가상 단어별 음소 개수 JSON 데이터</li>
        </ul>
    </div>
</div>

<script>
function generateAndDownload() {
    const statusDiv = document.getElementById('status');
    statusDiv.style.color = '#007bff';
    statusDiv.innerText = "데이터 계산 및 ZIP 압축 중...";

    const phones = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ', 'ㅏ', 'ㅑ', 'ㅓ', '여', 'ㅗ', 'ㅛ', 'ㅜ', 'ㅠ', 'ㅡ', 'ㅣ', 'æ', 'p', 'l', 'k', 't', 's'];
    
    let phoneLines = [];
    let toneLines = [];
    let word2phArray = [];
    
    // 누적 바이트 수 체크 (한글 유니코드는 문자당 약 3바이트 연산 처리 감안하여 타겟 세팅)
    // 3개 파일의 문자열 데이터 총합이 1024 * 1024 bytes가 될 때까지 무한 루프 생성
    let currentSize = 0;
    const targetSize = 1024 * 1024; // 정확히 1MB (1,048,576 bytes)
    let index = 0;

    while (currentSize < targetSize) {
        // 단어 2개 분량의 무작위 음소 개수 설정
        const w1Len = Math.floor(Math.random() * 3) + 2; // 2~4개
        const w2Len = Math.floor(Math.random() * 3) + 2; // 2~4개
        
        let p1 = Array.from({length: w1Len}, () => phones[Math.floor(Math.random() * phones.length)]);
        let p2 = Array.from({length: w2Len}, () => phones[Math.floor(Math.random() * phones.length)]);
        
        let t1 = Array.from({length: w1Len}, () => Math.floor(Math.random() * 2));
        let t2 = Array.from({length: w2Len}, () => Math.floor(Math.random() * 2));
        
        let phoneStr = p1.concat(p2).join(" ");
        let toneStr = t1.concat(t2).join(" ");
        let jsonItem = { "text": `word_${index}`, "word2ph": [w1Len, w2Len] };
        
        phoneLines.push(phoneStr);
        toneLines.push(toneStr);
        word2phArray.push(jsonItem);
        
        // 현재까지 쌓인 데이터 크기 실시간 계산 (UTF-8 인코딩 바이트 기준)
        let tempPhoneText = phoneLines.join("\n");
        let tempToneText = toneLines.join("\n");
        let tempJsonText = JSON.stringify(word2phArray);
        
        currentSize = new Blob([tempPhoneText]).size + new Blob([tempToneText]).size + new Blob([tempJsonText]).size;
        index++;
    }

    // 최종 문자열 데이터 확정
    const finalPhoneText = phoneLines.join("\n");
    const finalToneText = toneLines.join("\n");
    const finalJsonText = JSON.stringify(word2phArray, null, 2);

    // JSZip을 사용하여 브라우저 메모리 안에서 단일 zip 압축 파일 구축
    const zip = new JSZip();
    zip.file("phone.txt", finalPhoneText);
    zip.file("tone.txt", finalToneText);
    zip.file("word2ph.json", finalJsonText);

    // 사용자 컴퓨터로 다운로드 트리거 실행
    zip.generateAsync({type:"blob"}).then(function(content) {
        const element = document.createElement('a');
        element.href = URL.createObjectURL(content);
        element.download = "tts_g2p_1mb_dataset.zip";
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
        
        statusDiv.style.color = '#28a745';
        statusDiv.innerText = "다운로드 완료! (총 용량: " + (currentSize / (1024 * 1024)).toFixed(2) + " MB)";
    });
}
</script>

</body>
</html>
