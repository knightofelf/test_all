<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Byte Difference Demo</title>
</head>
<body>
<script>
let data = [
  [0x3A, 0xF7],
  [0x91, 0x0C],
  [0x5E, 0xA2],
  [0x7B, 0x44]
];

data.forEach((row, i) => {
  let [a, b] = row;
  let mirror = [b, a];
  let diff = [a - b, b - a];
  console.log(`Row ${i+1}: Original=[${a.toString(16)},${b.toString(16)}], Mirror=[${mirror[0].toString(16)},${mirror[1].toString(16)}], Diff=[${diff[0]},${diff[1]}]`);
});
</script>
</body>
</html>
