<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Original vs Mirror Graph</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h3>원본과 대칭 값 비교 그래프</h3>
<canvas id="chart" width="600" height="400"></canvas>

<script>
const size = 16;
let data = [];

// 랜덤 32바이트 생성
for (let i = 0; i < size*2; i++) {
  data.push(Math.floor(Math.random() * 256));
}

// 원본 값 좌표 (인덱스별)
let originalPoints = data.map((val, idx) => {
  return {x: idx, y: val};
});

// 대칭 값 좌표 (역순)
let mirrorPoints = data.map((val, idx) => {
  let mirrorVal = data[data.length - 1 - idx];
  return {x: idx, y: mirrorVal};
});

// Chart.js로 라인 그래프 그리기
const ctx = document.getElementById("chart").getContext("2d");
new Chart(ctx, {
  type: 'line',
  data: {
    datasets: [
      {
        label: 'Original',
        data: originalPoints,
        borderColor: 'blue',
        backgroundColor: 'blue',
        fill: false,
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: 'blue'
      },
      {
        label: 'Mirror',
        data: mirrorPoints,
        borderColor: 'red',
        backgroundColor: 'red',
        fill: false,
        tension: 0.3,
        pointRadius: 3,
        pointBackgroundColor: 'red'
      }
    ]
  },
  options: {
    responsive: false,
    scales: {
      x: {
        type: 'linear',
        position: 'bottom',
        title: {display: true, text: 'Byte Index'}
      },
      y: {
        title: {display: true, text: 'Value'}
      }
    }
  }
});
</script>
</body>
</html>
