<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D Viewer Toggle Example</title>
  <style>
    body { margin:0; overflow:hidden; background:#05050a; }
    canvas { display:block; }
    #controls { position:fixed; top:10px; left:10px; z-index:10; }
    button { margin:5px; padding:8px 12px; }
  </style>
</head>
<body>
<div id="controls">
  <button id="startBtn">GPU ON</button>
  <button id="stopBtn">GPU OFF</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,0,10);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  const geometry = new THREE.BoxGeometry(2,2,2);
  const material = new THREE.MeshNormalMaterial();
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);

  let running = true;

  function animate(){
    if (!running) return;
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  document.getElementById("stopBtn").onclick = ()=>{ running = false; };
  document.getElementById("startBtn").onclick = ()=>{
    if (!running){
      running = true;
      animate();
    }
  };

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
