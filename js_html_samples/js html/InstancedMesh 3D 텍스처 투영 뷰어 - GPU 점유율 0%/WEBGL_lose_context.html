<canvas id="glcanvas"></canvas>
<script>
  // WebGL 컨텍스트 가져오기
  const canvas = document.getElementById("glcanvas");
  const gl = canvas.getContext("webgl");

  if (gl) {
    // loseContext 확장 가져오기
    const ext = gl.getExtension("WEBGL_lose_context");
    if (ext) {
      // GPU 자원 해제 (컨텍스트 끊기)
      ext.loseContext();

      // 일정 시간 후 복구 가능
      setTimeout(() => {
        ext.restoreContext();
        console.log("WebGL 컨텍스트 복구 완료");
      }, 3000); // 3초 후 복구
    } else {
      console.log("WEBGL_lose_context 확장을 지원하지 않습니다.");
    }
  } else {
    console.log("WebGL 컨텍스트를 가져올 수 없습니다.");
  }
</script>
