<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>메모리 효율 해시 테이블</title>
</head>
<body>
  <h2>해시 테이블 예제</h2>
  <input id="key" placeholder="키 입력">
  <input id="value" placeholder="값 입력">
  <button onclick="addItem()">추가</button>
  <button onclick="showTable()">보기</button>

  <pre id="output"></pre>

  <script>
    class HashTable {
      constructor(size = 10) {
        this.table = new Array(size);
      }

      // 간단한 해시 함수
      hash(key) {
        let hashValue = 0;
        for (let char of key) {
          hashValue += char.charCodeAt(0);
        }
        return hashValue % this.table.length;
      }

      // 데이터 추가
      set(key, value) {
        const index = this.hash(key);
        if (!this.table[index]) {
          this.table[index] = [];
        }
        this.table[index].push([key, value]);
      }

      // 데이터 조회
      get(key) {
        const index = this.hash(key);
        const bucket = this.table[index];
        if (!bucket) return null;
        for (let [storedKey, storedValue] of bucket) {
          if (storedKey === key) return storedValue;
        }
        return null;
      }

      // 전체 테이블 출력
      display() {
        return this.table.map((bucket, i) => `${i}: ${JSON.stringify(bucket)}`).join('\n');
      }
    }

    const hashTable = new HashTable();

    function addItem() {
      const key = document.getElementById('key').value;
      const value = document.getElementById('value').value;
      hashTable.set(key, value);
      document.getElementById('key').value = '';
      document.getElementById('value').value = '';
    }

    function showTable() {
      document.getElementById('output').textContent = hashTable.display();
    }
  </script>
</body>
</html>
