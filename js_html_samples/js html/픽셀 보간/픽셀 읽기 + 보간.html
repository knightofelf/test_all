<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>픽셀 읽기 + 보간</title>
  <style>
    canvas { border: 1px solid black; margin: 10px; }
  </style>
</head>
<body>
  <h3>이미지 파일 선택 후 픽셀 보간</h3>
  <input type="file" id="fileInput" accept="image/*">
  <br>
  <canvas id="original" width="300" height="300"></canvas>
  <canvas id="nearest" width="300" height="300"></canvas>
  <canvas id="bilinear" width="300" height="300"></canvas>

  <script>
    const fileInput = document.getElementById("fileInput");

    fileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const origCtx = document.getElementById("original").getContext("2d");
        const nearestCtx = document.getElementById("nearest").getContext("2d");
        const bilinearCtx = document.getElementById("bilinear").getContext("2d");

        // 원본 출력
        origCtx.drawImage(img, 0, 0, 300, 300);

        // 축소된 버전 생성 (예: 1/4 크기)
        let smallCanvas = document.createElement("canvas");
        smallCanvas.width = img.width / 4;
        smallCanvas.height = img.height / 4;
        let smallCtx = smallCanvas.getContext("2d");
        smallCtx.drawImage(img, 0, 0, smallCanvas.width, smallCanvas.height);

        // 최근접 보간 (Nearest Neighbor)
        nearestCtx.imageSmoothingEnabled = false;
        nearestCtx.drawImage(smallCanvas, 0, 0, 300, 300);

        // 양선형 보간 (Bilinear)
        bilinearCtx.imageSmoothingEnabled = true;
        bilinearCtx.drawImage(smallCanvas, 0, 0, 300, 300);
      };
    });
  </script>
</body>
</html>
