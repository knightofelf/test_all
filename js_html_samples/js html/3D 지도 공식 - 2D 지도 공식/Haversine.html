<!DOCTYPE html>
<html>
<head>
  <title>지구 지도 거리 계산</title>
</head>
<body>
  <h2>위도·경도 거리 계산기 (Haversine)</h2>
  <label>위도1: <input id="lat1" type="number" step="any"></label>
  <label>경도1: <input id="lon1" type="number" step="any"></label><br><br>
  <label>위도2: <input id="lat2" type="number" step="any"></label>
  <label>경도2: <input id="lon2" type="number" step="any"></label><br><br>
  <button onclick="calcDistance()">계산</button>
  <p id="result"></p>

  <script>
    function toRad(value) {
      return value * Math.PI / 180;
    }

    function calcDistance() {
      let lat1 = parseFloat(document.getElementById("lat1").value);
      let lon1 = parseFloat(document.getElementById("lon1").value);
      let lat2 = parseFloat(document.getElementById("lat2").value);
      let lon2 = parseFloat(document.getElementById("lon2").value);

      let R = 6371; // 지구 반지름 (km)
      let dLat = toRad(lat2 - lat1);
      let dLon = toRad(lon2 - lon1);

      let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon/2) * Math.sin(dLon/2);

      let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      let d = R * c;

      document.getElementById("result").innerText = "두 지점 간 거리: " + d.toFixed(2) + " km";
    }
  </script>
</body>
</html>
