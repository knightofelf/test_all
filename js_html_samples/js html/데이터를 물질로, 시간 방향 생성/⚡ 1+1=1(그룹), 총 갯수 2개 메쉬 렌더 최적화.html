<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fused Double Buffer 3D Time-Space Volume</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: sans-serif; }
        #canvas2d { position: absolute; top: 10px; left: 10px; border: 1px solid #555; width: 120px; height: 120px; z-index: 10; background: #000; }
        #info { position: absolute; bottom: 10px; left: 10px; z-index: 10; font-size: 13px; pointer-events: none; line-height: 1.6; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 6px; border: 1px solid #333; }
        #webgl-canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <canvas id="canvas2d" width="64" height="64"></canvas>
    <canvas id="webgl-canvas"></canvas>
    
    <div id="info">
        <strong>⚡ 1+1=1(그룹), 총 갯수 2개 메쉬 렌더 최적화</strong><br>
        - 전체 데이터 공간을 단 2개의 통합 그룹(버퍼)으로 분할했습니다.<br>
        - 매 프레임 한쪽 버퍼만 통째로 리프레시하여 GPU 호출을 극소화했습니다.
    </div>

    <script>
        const canvas2d = document.getElementById('canvas2d');
        const ctx2d = canvas2d.getContext('2d');
        const w2d = canvas2d.width, h2d = canvas2d.height;

        const glCanvas = document.getElementById('webgl-canvas');
        const gl = glCanvas.getContext('webgl');

        if (!gl) alert('WebGL 미지원 브라우저');

        // 총 적층 레이어 수와 버퍼 구조 정의
        const MAX_LAYERS = 60; 
        const HALF_LAYERS = MAX_LAYERS / 2; // 30레이어씩 반으로 분할

        // [핵심] 1+1 = 총 2개의 데이터 그룹만 운영 (더블 버퍼 구조)
        // 개별 점마다 그리지 않고 30개 레이어를 통째로 묶어 딱 1개의 배열(그룹)로 연산합니다.
        let groupA = []; // 전반부 시간 데이터 그룹 (갯수 1)
        let groupB = []; // 후반부 시간 데이터 그룹 (갯수 1)
        
        let timeStep = 0;

        // 셰이더 소스
        const vsSource = `
            attribute vec4 aPosition;
            attribute vec4 aColor;
            varying vec4 vColor;
            uniform mat4 uMatrix;
            void main() {
                gl_Position = uMatrix * aPosition;
                gl_PointSize = 8.0; 
                vColor = aColor;
            }
        `;
        const fsSource = `
            precision mediump float;
            varying vec4 vColor;
            void main() { gl_FragColor = vColor; }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }
        const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vs); gl.attachShader(program, fs);
        gl.linkProgram(program); gl.useProgram(program);

        const aPosition = gl.getAttribLocation(program, 'aPosition');
        const aColor = gl.getAttribLocation(program, 'aColor');
        const uMatrix = gl.getUniformLocation(program, 'uMatrix');

        // 그룹별 고정 GPU 바인딩 버퍼 생성
        const bufferAPos = gl.createBuffer(); const bufferACol = gl.createBuffer();
        const bufferBPos = gl.createBuffer(); const bufferBCol = gl.createBuffer();

        // 2D 데이터 생성
        function generate2DData(t) {
            ctx2d.clearRect(0, 0, w2d, h2d);
            const imgData = ctx2d.createImageData(w2d, h2d);
            
            for (let y = 0; y < h2d; y++) {
                for (let x = 0; x < w2d; x++) {
                    const idx = (y * w2d + x) * 4;
                    const cx = x - w2d / 2;
                    const cy = y - h2d / 2;
                    const dist = Math.sqrt(cx * cx + cy * cy);
                    
                    const value = Math.sin(dist * 0.3 - t * 0.08) * Math.cos(x * 0.05) * Math.sin(y * 0.05);
                    
                    if (value > 0.22) { 
                        imgData.data[idx] = Math.floor(100 + dist * 2.5);
                        imgData.data[idx + 1] = Math.floor(130 + Math.sin(t*0.1)*50);
                        imgData.data[idx + 2] = 255;
                        imgData.data[idx + 3] = 255;
                    }
                }
            }
            ctx2d.putImageData(imgData, 0, 0);
        }

        // 수집된 2D 평면을 대상 그룹에 한 번에 융합(Merge) 적층하는 함수
        function pushToGroup(targetGroup, zOffset) {
            const imgData = ctx2d.getImageData(0, 0, w2d, h2d).data;
            const sample = 4; 

            // 현재 Z축 타임라인에 기존 데이터가 있었다면 초기화 후 덮어쓰기
            for (let i = targetGroup.length - 1; i >= 0; i--) {
                if (targetGroup[i].z === zOffset) {
                    targetGroup.splice(i, 1);
                }
            }

            // 하나의 거대한 그룹 배열 속으로 데이터를 통합 주입
            for (let y = 0; y < h2d; y += sample) {
                for (let x = 0; x < w2d; x += sample) {
                    const idx = (y * w2d + x) * 4;
                    if (imgData[idx + 3] > 0) {
                        targetGroup.push({
                            x: (x - w2d / 2) / (w2d / 2) * 0.6,
                            y: (y - h2d / 2) / (h2d / 2) * 0.6,
                            z: (zOffset - MAX_LAYERS / 2) / (MAX_LAYERS / 2) * 0.8,
                            r: imgData[idx] / 255,
                            g: imgData[idx + 1] / 255,
                            b: imgData[idx + 2] / 255
                        });
                    }
                }
            }
        }

        function getRotationMatrix(angleX, angleY) {
            const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
            return [
                cosY,        0,     -sinY,       0,
                sinX*sinY,  cosX,  sinX*cosY,    0,
                cosX*sinY, -sinX,  cosX*cosY,    0,
                0,           0,      0,          1
            ];
        }

        // 배열 데이터를 GPU 전송용 단일 Float32 패키지로 압축 변환하는 매퍼
        function flattenGroup(group) {
            const pos = [], col = [];
            for (let i = 0; i < group.length; i++) {
                pos.push(group[i].x, group[i].y, group[i].z);
                col.push(group[i].r, group[i].g, group[i].b, 1.0);
            }
            return { pos: new Float32Array(pos), col: new Float32Array(col), count: group.length };
        }

        // 상태 플래그 (어느 버퍼를 리프레시할지 결정)
        let updateBufferA = true;

        function animate() {
            requestAnimationFrame(animate);
            timeStep++;

            generate2DData(timeStep);

            // 전체 타임 루프의 흐름 인덱스 계산
            const currentZ = timeStep % MAX_LAYERS;

            // [1+1=1 구조의 핵심 분기]
            // 전반부 타임존(0~29)이면 GroupA 메쉬에 누적, 후반부(30~59)이면 GroupB 메쉬에 누적
            if (currentZ < HALF_LAYERS) {
                pushToGroup(groupA, currentZ);
                updateBufferA = true; // A그룹 융합 데이터 가공 신호
            } else {
                pushToGroup(groupB, currentZ);
                updateBufferA = false; // B그룹 융합 데이터 가공 신호
            }

            // 화면 크기 최적화 리사이즈
            if (glCanvas.width !== window.innerWidth || glCanvas.height !== window.innerHeight) {
                glCanvas.width = window.innerWidth; glCanvas.height = window.innerHeight;
                gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
            }

            gl.clearColor(0.02, 0.02, 0.02, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);

            // 공통 회전 매트릭스 연산 후 셰이더 주입
            const matrix = getRotationMatrix(0.5, timeStep * 0.008);
            gl.uniformMatrix4fv(uMatrix, false, matrix);

            // --- 데이터 가공 및 업로드 스테이지 ---
            // 매 프레임 모든 점을 새로 계산하지 않고, 데이터 변경이 일어난 "단 1개의 그룹"만 GPU에 재전송
            if (updateBufferA && groupA.length > 0) {
                const dataA = flattenGroup(groupA);
                gl.bindBuffer(gl.ARRAY_BUFFER, bufferAPos);
                gl.bufferData(gl.ARRAY_BUFFER, dataA.pos, gl.STREAM_DRAW);
                gl.bindBuffer(gl.ARRAY_BUFFER, bufferACol);
                gl.bufferData(gl.ARRAY_BUFFER, dataA.col, gl.STREAM_DRAW);
                bufferAPos.count = dataA.count;
            } else if (!updateBufferA && groupB.length > 0) {
                const dataB = flattenGroup(groupB);
                gl.bindBuffer(gl.ARRAY_BUFFER, bufferBPos);
                gl.bufferData(gl.ARRAY_BUFFER, dataB.pos, gl.STREAM_DRAW);
                gl.bindBuffer(gl.ARRAY_BUFFER, bufferBCol);
                gl.bufferData(gl.ARRAY_BUFFER, dataB.col, gl.STREAM_DRAW);
                bufferBPos.count = dataB.count;
            }

            // --- 드로우 콜 스테이지 (렌더 갯수 = 단 2번 호출) ---
            // 1번 그룹(전반부 시공간 물질) 그리기
            if (bufferAPos.count > 0) {
                gl.bindBuffer(gl.ARRAY_BUFFER, bufferAPos);
                gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(aPosition);

                gl.bindBuffer(gl.ARRAY_BUFFER, bufferACol);
                gl.vertexAttribPointer(aColor, 4, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(aColor);

                gl.drawArrays(gl.POINTS, 0, bufferAPos.count);
            }

            // 2번 그룹(후반부 시공간 물질) 그리기
            if (bufferBPos.count > 0) {
                gl.bindBuffer(gl.ARRAY_BUFFER, bufferBPos);
                gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(aPosition);

                gl.bindBuffer(gl.ARRAY_BUFFER, bufferBCol);
                gl.vertexAttribPointer(aColor, 4, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(aColor);

                gl.drawArrays(gl.POINTS, 0, bufferBPos.count);
            }
        }

        animate();
    </script>
</body>
</html>
