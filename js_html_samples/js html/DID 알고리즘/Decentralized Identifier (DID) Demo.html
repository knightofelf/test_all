<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>DID Demo</title>
</head>
<body>
  <h2>Decentralized Identifier (DID) Demo</h2>
  <pre id="didDoc"></pre>

  <script>
    // 간단한 DID 생성 함수
    function createDID(method, identifier) {
      return `did:${method}:${identifier}`;
    }

    // 예시 DID Document
    const did = createDID("example", "123456789abcdefghi");
    const didDocument = {
      "@context": "https://www.w3.org/ns/did/v1",
      id: did,
      authentication: [{
        type: "Ed25519VerificationKey2018",
        publicKey: "z6Mki...abc123"
      }],
      service: [{
        id: "#p2p-auth",
        type: "MultiPathAuth",
        serviceEndpoint: [
          "https://node1.example.com",
          "https://node2.example.com",
          "https://node3.example.com"
        ]
      }]
    };

    // 화면에 출력
    document.getElementById("didDoc").textContent = JSON.stringify(didDocument, null, 2);
  </script>
</body>
</html>
