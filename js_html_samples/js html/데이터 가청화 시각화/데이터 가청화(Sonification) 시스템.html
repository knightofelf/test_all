<!DOCTYPE html>
<html>
<head>
  <title>데이터 가청화 시스템</title>
</head>
<body>
  <button id="start">Start Sonification</button>
  <script>
    const data = [0.1, 0.5, 0.9, 0.3, 0.7]; // 예시 데이터
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    document.getElementById("start").onclick = () => {
      data.forEach((value, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // 데이터 → 음높이 매핑 (100Hz ~ 1000Hz)
        osc.frequency.value = 100 + value * 900;
        // 데이터 → 볼륨 매핑
        gain.gain.value = value;

        osc.connect(gain).connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.5);
        osc.stop(audioCtx.currentTime + i * 0.5 + 0.4);
      });
    };
  </script>
</body>
</html>
