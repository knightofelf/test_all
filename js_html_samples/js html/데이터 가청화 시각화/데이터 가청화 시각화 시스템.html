<!DOCTYPE html>
<html>
<head>
  <title>데이터 가청화 시각화 시스템</title>
  <style>
    canvas { border: 1px solid #ccc; }
  </style>
</head>
<body>
  <button id="start">Start Sonification + Visualization</button>
  <canvas id="viz" width="600" height="200"></canvas>

  <script>
    const data = [0.1, 0.5, 0.9, 0.3, 0.7]; // 예시 데이터
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");

    document.getElementById("start").onclick = () => {
      data.forEach((value, i) => {
        // 🎵 사운드 생성
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 200 + value * 800; // 데이터 → 주파수
        gain.gain.value = value; // 데이터 → 볼륨
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.5);
        osc.stop(audioCtx.currentTime + i * 0.5 + 0.4);

        // 🎨 시각화
        setTimeout(() => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.beginPath();
          ctx.arc(100 + i * 80, canvas.height/2, value * 50, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 150, 255, ${value})`;
          ctx.fill();
        }, i * 500);
      });
    };
  </script>
</body>
</html>
