<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Bloom Filter Demo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; text-align: center; }
    .bit-array { display: flex; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    .bit { width: 15px; height: 15px; margin: 2px; background: #333; border-radius: 3px; }
    .bit.active { background: #00ffff; box-shadow: 0 0 5px #00ffff; }
  </style>
</head>
<body>
  <h1>🌸 Bloom Filter 시각화</h1>
  <input id="inputValue" placeholder="값 입력" />
  <button onclick="addValue()">추가</button>
  <button onclick="checkValue()">확인</button>
  <div id="result"></div>
  <div class="bit-array" id="bitArray"></div>

  <script>
    const size = 64;
    const bitArray = new Array(size).fill(0);
    const bitContainer = document.getElementById('bitArray');

    function renderBits() {
      bitContainer.innerHTML = '';
      bitArray.forEach(bit => {
        const div = document.createElement('div');
        div.className = 'bit' + (bit ? ' active' : '');
        bitContainer.appendChild(div);
      });
    }

    function hashFunctions(value) {
      const hashes = [];
      for (let i = 0; i < 3; i++) {
        let hash = 0;
        for (let j = 0; j < value.length; j++) {
          hash = (hash * 31 + value.charCodeAt(j) + i) % size;
        }
        hashes.push(hash);
      }
      return hashes;
    }

    function addValue() {
      const value = document.getElementById('inputValue').value;
      hashFunctions(value).forEach(h => bitArray[h] = 1);
      renderBits();
      document.getElementById('result').textContent = `"${value}" 추가됨`;
    }

    function checkValue() {
      const value = document.getElementById('inputValue').value;
      const exists = hashFunctions(value).every(h => bitArray[h] === 1);
      document.getElementById('result').textContent = exists
        ? `"${value}" 존재할 가능성이 높습니다`
        : `"${value}" 존재하지 않습니다`;
    }

    renderBits();
  </script>
</body>
</html>
