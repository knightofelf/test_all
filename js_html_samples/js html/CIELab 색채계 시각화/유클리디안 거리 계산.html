<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>유클리디안 거리 계산</title>
</head>
<body>
  <h2>두 점 사이의 거리 계산</h2>
  <label>점 A (x,y): <input id="ax" value="0"> , <input id="ay" value="0"></label><br>
  <label>점 B (x,y): <input id="bx" value="3"> , <input id="by" value="4"></label><br>
  <button onclick="calcDistance()">계산하기</button>
  <p id="result"></p>

  <script>
    function euclideanDistance(pointA, pointB) {
      let sum = 0;
      for (let i = 0; i < pointA.length; i++) {
        sum += Math.pow(pointA[i] - pointB[i], 2);
      }
      return Math.sqrt(sum);
    }

    function calcDistance() {
      const ax = parseFloat(document.getElementById("ax").value);
      const ay = parseFloat(document.getElementById("ay").value);
      const bx = parseFloat(document.getElementById("bx").value);
      const by = parseFloat(document.getElementById("by").value);

      const d = euclideanDistance([ax, ay], [bx, by]);
      document.getElementById("result").innerText = `거리: ${d.toFixed(2)}`;
    }
  </script>
</body>
</html>
