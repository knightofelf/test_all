<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>RGB → CIELab 변환</title>
</head>
<body>
  <h2>RGB → CIELab 변환기</h2>
  <label>R: <input type="number" id="r" value="255" min="0" max="255"></label>
  <label>G: <input type="number" id="g" value="0" min="0" max="255"></label>
  <label>B: <input type="number" id="b" value="0" min="0" max="255"></label>
  <button onclick="convert()">변환하기</button>

  <p id="result"></p>

  <script>
    function rgbToXyz(r, g, b) {
      // 0~255 → 0~1 정규화
      r /= 255; g /= 255; b /= 255;

      // sRGB → Linear RGB
      r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
      g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
      b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;

      // Linear RGB → XYZ (D65 기준)
      let x = r * 0.4124 + g * 0.3576 + b * 0.1805;
      let y = r * 0.2126 + g * 0.7152 + b * 0.0722;
      let z = r * 0.0193 + g * 0.1192 + b * 0.9505;

      return [x, y, z];
    }

    function xyzToLab(x, y, z) {
      // D65 기준 백색점
      let refX = 0.95047, refY = 1.00000, refZ = 1.08883;
      x /= refX; y /= refY; z /= refZ;

      function f(t) {
        return t > 0.008856 ? Math.pow(t, 1/3) : (7.787 * t) + (16/116);
      }

      let fx = f(x), fy = f(y), fz = f(z);

      let L = (116 * fy) - 16;
      let a = 500 * (fx - fy);
      let b = 200 * (fy - fz);

      return [L, a, b];
    }

    function convert() {
      let r = parseInt(document.getElementById("r").value);
      let g = parseInt(document.getElementById("g").value);
      let b = parseInt(document.getElementById("b").value);

      let [x, y, z] = rgbToXyz(r, g, b);
      let [L, a, bVal] = xyzToLab(x, y, z);

      document.getElementById("result").innerText =
        `L*: ${L.toFixed(2)}, a*: ${a.toFixed(2)}, b*: ${bVal.toFixed(2)}`;
    }
  </script>
</body>
</html>
