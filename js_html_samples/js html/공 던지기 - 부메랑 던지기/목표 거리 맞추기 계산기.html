<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목표 거리 맞추기 계산기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #007bff;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2>🎯 목표 거리 던지기 계산기</h2>
    
    <div class="input-group">
        <label for="targetDistance">🎯 목표 거리 (m):</label>
        <input type="number" id="targetDistance" placeholder="예: 30" value="30">
    </div>

    <hr>

    <div class="input-group">
        <label for="fixedAngle">1) 각도를 고정할 때 (도, °):</label>
        <input type="number" id="fixedAngle" value="45">
    </div>
    
    <div class="input-group">
        <label for="fixedVelocity">2) 속도를 고정할 때 (m/s):</label>
        <input type="number" id="fixedVelocity" value="20">
    </div>

    <div class="btn-container">
        <button onclick="calculateRequiredVelocity()">필요한 속도 구하기</button>
        <button onclick="calculateRequiredAngle()">필요한 각도 구하기</button>
    </div>

    <div id="resultBox" class="result-box" style="display:none;"></div>

    <script>
        const g = 9.81; // 중력 가속도

        // 1. 특정 거리와 각도가 주어졌을 때 필요한 '초기 속도' 계산
        function calculateRequiredVelocity() {
            const R = parseFloat(document.getElementById('targetDistance').value);
            const angleDegrees = parseFloat(document.getElementById('fixedAngle').value);
            const resultBox = document.getElementById('resultBox');

            if (isNaN(R) || isNaN(angleDegrees) || angleDegrees <= 0 || angleDegrees >= 90) {
                showResult("올바른 거리와 각도(0~90도 사이)를 입력해주세요.");
                return;
            }

            const angleRadians = angleDegrees * (Math.PI / 180);
            
            // 공식 역산: v = sqrt((R * g) / sin(2 * theta))
            const sin2Theta = Math.sin(2 * angleRadians);
            const velocity = Math.sqrt((R * g) / sin2Theta);

            showResult(`📢 <b>${angleDegrees}°</b> 각도로 <b>${R}m</b>를 날리려면:<br>➡️ 필요한 초기 속도: <b>${velocity.toFixed(2)} m/s</b>`);
        }

        // 2. 특정 거리와 속도가 주어졌을 때 필요한 '던지는 각도' 계산
        function calculateRequiredAngle() {
            const R = parseFloat(document.getElementById('targetDistance').value);
            const v = parseFloat(document.getElementById('fixedVelocity').value);
            const resultBox = document.getElementById('resultBox');

            if (isNaN(R) || isNaN(v) || v <= 0) {
                showResult("올바른 거리와 속도를 입력해주세요.");
                return;
            }

            // 공식 역산: sin(2 * theta) = (R * g) / v^2
            const sin2Theta = (R * g) / Math.pow(v, 2);

            // 물리적 한계 체크 (sin 값은 1을 넘을 수 없음. 즉, 현재 속도로는 그 거리까지 도달 불가능)
            if (sin2Theta > 1) {
                showResult(`❌ 현재 속도(<b>${v} m/s</b>)로는 최대 <b>${(Math.pow(v, 2)/g).toFixed(2)}m</b>까지만 던질 수 있습니다. 더 빠른 속도를 입력하세요.`);
                return;
            }

            // 아크사인(Asin)을 이용해 2 * theta 값을 라디안으로 구함
            const angle2Radians = Math.asin(sin2Theta);
            
            // 라디안을 도(Degree) 단위로 변환 후 2로 나누어 최종 각도 산출
            const angle1 = (angle2Radians * (180 / Math.PI)) / 2;
            const angle2 = 90 - angle1; // 포물선 운동은 같은 거리에 도달하는 각도가 항상 2개 존재함 (예: 30도와 60도)

            showResult(`📢 <b>${v} m/s</b> 속도로 <b>${R}m</b>를 날리려면:<br>➡️ 필요한 각도: <b>${angle1.toFixed(1)}°</b> 또는 <b>${angle2.toFixed(1)}°</b>`);
        }

        function showResult(text) {
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = "block";
            resultBox.innerHTML = text;
        }
    </script>

</body>
</html>
