<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공 던지기 페이지 처리</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    label { display: block; margin-top: 10px; }
    input { margin-top: 5px; width: 400px; }
    button { margin-top: 15px; }
    #result { margin-top: 20px; font-weight: bold; white-space: pre-line; }
  </style>
</head>
<body>
  <h1>공 던지기 페이지 처리</h1>
  
  <label>던진 거리(큰 수 입력):
    <input type="text" id="distance" value="435123849783947584350923745">
  </label>
  
  <label>페이지 크기 (예: 4096):
    <input type="number" id="pageSize" value="4096">
  </label>
  
  <button onclick="process()">계산하기</button>
  
  <div id="result"></div>
  
  <script>
    function process() {
      const X = BigInt(document.getElementById('distance').value);
      const P = BigInt(document.getElementById('pageSize').value);
      
      const N = X / P;       // 페이지 번호
      const delta = X % P;   // 페이지 오프셋
      
      document.getElementById('result').innerText = 
        `절대 위치 X: ${X}\n` +
        `페이지 크기 P: ${P}\n` +
        `페이지 번호 N: ${N}\n` +
        `페이지 오프셋 δ: ${delta}`;
    }
  </script>
</body>
</html>
