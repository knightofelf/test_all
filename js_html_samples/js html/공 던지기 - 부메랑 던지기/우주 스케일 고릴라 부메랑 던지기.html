<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 스케일 고릴라 부메랑 던지기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', Arial, sans-serif;
            background-color: #1a1a24;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            background-color: #0c0c14;
            border: 4px solid #34495e;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .ui-panel {
            display: flex;
            gap: 15px;
            background: #2c3e50;
            padding: 15px;
            width: 774px;
            box-sizing: border-box;
            border-bottom: 2px solid #34495e;
            align-items: center;
        }
        .input-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .input-box label {
            font-size: 12px;
            font-weight: bold;
            color: #bdc3c7;
        }
        .input-box input {
            padding: 6px;
            border: none;
            border-radius: 4px;
            width: 130px;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background-color: #c0392b; }
        .physics-log {
            margin-top: 15px;
            background: #2c3e50;
            width: 774px;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            border-left: 6px solid #3498db;
            word-break: break-all;
        }
        .turn-indicator {
            font-size: 18px;
            font-weight: bold;
            color: #f1c40f;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <h2>🦍 우주 스케일 고릴라 부메랑 던지기 게임 🪃</h2>
    <p style="margin-top:-10px; color:#aaa; font-size:13px;">속도를 엄청나게 크게 입력하면 최고 높이가 우주급 BigInt 단위로 솟구칩니다!</p>

    <div id="gameContainer">
        <!-- 상단 컨트롤 UI -->
        <div class="ui-panel">
            <div id="turnText" class="turn-indicator">📢 플레이어 1 턴</div>
            <div class="input-box">
                <label>📐 각도 (도, °)</label>
                <input type="number" id="angleInput" value="45" min="0" max="90">
            </div>
            <div class="input-box">
                <label>⚡ 초기 속도 (m/s)</label>
                <input type="text" id="velocityInput" value="1000">
            </div>
            <button onclick="fireBoomerang()">던지기!</button>
        </div>
        <!-- 게임 화면 -->
        <canvas id="gameCanvas" width="774" height="400"></canvas>
    </div>

    <!-- 실시간 BigInt 물리 정보서 -->
    <div id="physicsLog" class="physics-log">
        🎯 <b>[실시간 고정밀 물리 정보서]</b> 던지기 버튼을 누르면 우주급 스케일 역학 데이터가 이곳에 정수로 출력됩니다.
    </div>

    <!-- 자바스크립트 파일 로드 -->
    <script src="game.js"></script>
</body>
</html>
