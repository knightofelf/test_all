<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초거대 속도 제로 거리 계산기 (BigInt)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 550px;
            margin: 0 auto;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #ffc107;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>🌌 큰 속도 ➡️ 0 거리 구현 계산기</h2>
    <p style="font-size: 13px; color: #555;">속도가 우주급으로 커도 각도나 중력을 조절해 거리를 0으로 만드는 물리 공식 구현입니다.</p>
    <hr>

    <div class="input-group">
        <label for="inputVelocity">⚡ 초기 속도 (m/s):</label>
        <div class="hint">예시의 초거대 속도(300억m/s) 또는 더 큰 값을 정수로 입력하세요.</div>
        <input type="text" id="inputVelocity" value="30000000000">
    </div>

    <div class="input-group">
        <label for="inputAngle">📐 던지는 각도 (도, °):</label>
        <div class="hint">0에 가까울수록(바닥 깔아던지기) 또는 90에 가까울수록(수직) 거리가 0이 됩니다.</div>
        <input type="number" id="inputAngle" value="90" min="0" max="90" step="1">
    </div>

    <div class="input-group">
        <label for="inputGravity">🪐 중력 가속도 (m/s²):</label>
        <div class="hint">일반 지구는 10(9.81), 블랙홀 수준의 초고중력은 큰 값을 입력하세요.</div>
        <input type="text" id="inputGravity" value="10">
    </div>

    <button onclick="calculateZeroDistance()">포물선 거리 연산 (정수 출력)</button>

    <div id="resultBox" class="result-box" style="display:none;"></div>

    <script>
        // 지수 표기법이나 문자열을 안전한 정수 문자열로 정제하는 함수
        function parseToExactIntegerString(inputValue) {
            let str = inputValue.trim().toLowerCase();
            if (!str) return null;

            if (str.includes('e')) {
                let [base, expStr] = str.split('e');
                let exp = parseInt(expStr, 10);
                if (isNaN(exp)) return null;

                let dotIdx = base.indexOf('.');
                if (dotIdx !== -1) {
                    let integerPart = base.substring(0, dotIdx);
                    let fractionalPart = base.substring(dotIdx + 1);
                    if (exp >= fractionalPart.length) {
                        return integerPart + fractionalPart + '0'.repeat(exp - fractionalPart.length);
                    } else {
                        return integerPart + fractionalPart.substring(0, exp);
                    }
                } else {
                    return base + '0'.repeat(exp);
                }
            }

            let dotIdx = str.indexOf('.');
            if (dotIdx !== -1) return str.substring(0, dotIdx);
            return str;
        }

        function calculateZeroDistance() {
            const velocityInput = document.getElementById('inputVelocity').value;
            const angleInput = parseInt(document.getElementById('inputAngle').value, 10);
            const gravityInput = document.getElementById('inputGravity').value;

            const vStr = parseToExactIntegerString(velocityInput);
            const gStr = parseToExactIntegerString(gravityInput);

            if (!vStr || !gStr || isNaN(angleInput) || angleInput < 0 || angleInput > 90) {
                showResult("모든 입력창에 올바른 수치를 입력해주세요. (각도는 0~90도)");
                return;
            }

            // BigInt 변환 (속도와 중력 모두 거대 정수화 가능)
            const vBig = BigInt(vStr);
            const gBig = BigInt(gStr);
            
            // v^2 (속도 제곱) 연산
            const vSquaredBig = vBig * vBig;

            // 삼각함수 sin(2 * theta) 계산
            const angleRadians = angleInput * (Math.PI / 180);
            const sin2Theta = Math.sin(2 * angleRadians);

            // [핵심 정수화 로직] 
            // 실수를 BigInt에 직접 곱할 수 없으므로, 1,000,000을 곱해 정수형 배율(Scale)을 만듭니다.
            const scale = 1000000;
            const scaledSin = BigInt(Math.round(sin2Theta * scale));

            // 공식: R = (v^2 * sin(2theta)) / g
            // 분자를 먼저 거대 정수 곱셈한 뒤, 중력과 배율(scale)로 나누어 완벽한 정수 도출
            let distanceBig = 0n;
            if (gBig > 0n && scaledSin > 0n) {
                distanceBig = (vSquaredBig * scaledSin) / (gBig * BigInt(scale));
            }

            // 결과 화면 구성
            showResult(`
                📊 <b>입력 속도:</b> ${vBig.toLocaleString()} m/s <br>
                📐 <b>던진 각도:</b> ${angleInput}° <br>
                🪐 <b>설정 중력:</b> ${gBig.toLocaleString()} m/s² <br>
                <hr style="border: 0; border-top: 1px dashed #ccc;">
                🎯 <b>최종 비행 거리:</b> <b style="color: #d9534f; font-size: 18px;">${distanceBig.toString()}</b> m
            `);
        }

        function showResult(text) {
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = "block";
            resultBox.innerHTML = text;
        }
    </script>

</body>
</html>
