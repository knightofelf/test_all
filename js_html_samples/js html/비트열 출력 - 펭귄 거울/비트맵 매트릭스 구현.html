<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비트맵 매트릭스 구현</title>
    <style>
        /* 숫자가 들어갈 그리드 컨테이너 설정 */
        #matrix {
            display: grid;
            grid-template-columns: repeat(14, 20px); /* 첫 줄 14글자 기준 */
            gap: 2px;
            background-color: #111;
            padding: 10px;
            width: max-content;
            font-family: monospace;
        }

        /* 0과 1을 나타낼 사각형 셀 스타일 */
        .cell {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        /* 1일 때의 스타일 (밝은 녹색) */
        .active {
            background-color: #00ff00;
            color: #000;
        }

        /* 0일 때의 스타일 (어두운 녹색) */
        .inactive {
            background-color: #003300;
            color: #00ff00;
            opacity: 0.4;
        }

        /* 공백 패턴일 때의 스타일 (투명) */
        .empty {
            background-color: transparent;
        }
    </style>
</head>
<body>

    <!-- 매트릭스가 그려질 공간 -->
    <div id="matrix"></div>

    <script>
        // 1. 요청하신 문자열 패턴 배열로 정의 (공백 유지)
        const pattern = [
            "10101001011010",
            "1  0",
            "1  0",
            "100",
            "1  0",
            "110",
            "1  0"
        ];

        const matrixContainer = document.getElementById('matrix');
        const maxCols = 14; // 가장 긴 첫 번째 줄의 길이 기준

        // 2. 패턴 데이터를 순회하며 Grid Cell 생성
        pattern.forEach(row => {
            // 각 행의 글자들을 배열로 쪼갬
            const chars = row.split('');

            // 그리드 정렬을 위해 모든 행의 길이를 maxCols(14개)로 맞춤
            for (let i = 0; i < maxCols; i++) {
                const char = chars[i] || ' '; // 글자가 없으면 공백 처리
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.textContent = char;

                // 값에 따라 클래스 부여
                if (char === '1') {
                    cell.classList.add('active');
                } else if (char === '0') {
                    cell.classList.add('inactive');
                } else {
                    cell.classList.add('empty');
                }

                matrixContainer.appendChild(cell);
            }
        });
    </script>
</body>
</html>
