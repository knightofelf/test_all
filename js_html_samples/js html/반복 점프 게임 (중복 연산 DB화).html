<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>중복 연산 DB화 게임</title>
  <style>
    canvas { border: 1px solid black; }
  </style>
</head>
<body>
  <h2>반복 점프 게임 (중복 연산 DB화)</h2>
  <p>스페이스바를 눌러 점프하세요. 같은 연산은 DB에 중복 저장되지 않습니다.</p>
  <canvas id="gameCanvas" width="400" height="300"></canvas>
  <pre id="log"></pre>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const log = document.getElementById("log");

    let player = { x: 200, y: 250, hp: 10 };

    // "DB" 역할을 하는 배열
    let states = [];
    let actions = [];

    function saveState(x, y, hp) {
      let lastState = states[states.length - 1];
      if (!lastState || lastState.x !== x || lastState.y !== y || lastState.hp !== hp) {
        let stateId = states.length + 1;
        states.push({ id: stateId, x, y, hp, timestamp: Date.now() });
        return stateId;
      }
      return lastState.id;
    }

    function saveAction(playerId, actionType, stateId) {
      let lastAction = actions[actions.length - 1];
      if (lastAction && lastAction.playerId === playerId && lastAction.actionType === actionType && lastAction.stateId === stateId) {
        lastAction.repeatCount++;
      } else {
        actions.push({ id: actions.length + 1, playerId, actionType, stateId, repeatCount: 1 });
      }
      renderLog();
    }

    function jump() {
      player.y -= 50;
      let stateId = saveState(player.x, player.y, player.hp);
      saveAction("P1", "jump", stateId);
      draw();
      setTimeout(() => {
        player.y += 50;
        stateId = saveState(player.x, player.y, player.hp);
        saveAction("P1", "land", stateId);
        draw();
      }, 500);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillRect(player.x, player.y, 20, 20);
    }

    function renderLog() {
      log.textContent = "States:\n" + JSON.stringify(states, null, 2) +
                        "\n\nActions:\n" + JSON.stringify(actions, null, 2);
    }

    document.body.addEventListener("keydown", (e) => {
      if (e.code === "Space") jump();
    });

    draw();
  </script>
</body>
</html>
