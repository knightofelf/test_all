<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>일반 vs 상태 분기 연산 효율 비교</title>
</head>
<body>
  <h2>연산 효율 비교</h2>
  <button onclick="testPerformance()">효율 테스트 실행</button>
  <pre id="output"></pre>

  <script>
    // 일반 연산 (직접 연산자 사용)
    function normalCalc(a, b, op) {
      if (op === "+") return a + b;
      if (op === "-") return a - b;
      if (op === "*") return a * b;
      if (op === "/") return b !== 0 ? a / b : "Error";
    }

    // 상태 분기 연산 (switch-case)
    function stateCalc(a, b, op) {
      switch(op) {
        case "ADD": return a + b;
        case "SUB": return a - b;
        case "MUL": return a * b;
        case "DIV": return b !== 0 ? a / b : "Error";
      }
    }

    function testPerformance() {
      const iterations = 1e7; // 1천만 번 반복
      let result;

      // 일반 연산 테스트
      let start = performance.now();
      for (let i = 0; i < iterations; i++) {
        result = normalCalc(10, 5, "+");
      }
      let end = performance.now();
      const normalTime = (end - start).toFixed(4);

      // 상태 분기 연산 테스트
      start = performance.now();
      for (let i = 0; i < iterations; i++) {
        result = stateCalc(10, 5, "ADD");
      }
      end = performance.now();
      const stateTime = (end - start).toFixed(4);

      document.getElementById("output").innerText =
        `일반 연산 시간: ${normalTime} ms\n` +
        `상태 분기 연산 시간: ${stateTime} ms\n` +
        `결과 값: ${result}`;
    }
  </script>
</body>
</html>
