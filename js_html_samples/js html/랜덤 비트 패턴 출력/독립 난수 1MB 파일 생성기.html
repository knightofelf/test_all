<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>독립 난수 1MB 파일 생성기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 40px; text-align: center; background-color: #f8f9fa; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 5px; transition: background 0.2s; }
        button:hover { background-color: #218838; }
        #status { margin-top: 20px; font-size: 14px; color: #555; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h2>독립 난수 파일 생성기</h2>
    <p>하드웨어 엔트로피 기반의 독립 난수로 1MB 파일을 생성합니다.</p>
    <button onclick="generateIndependent1MB()">1MB 독립 난수 파일 다운로드</button>
    <div id="status"></div>
</div>

<script>
    function generateIndependent1MB() {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "🎲 엔트로피 수집 및 독립 난수 배열 생성 중...";

        // 1MB = Exactly 1,048,576 Bytes (0 ~ 255 범위의 독립적인 바이트 공간)
        const FILE_SIZE = 1024 * 1024; 
        const independentBuffer = new Uint8Array(FILE_SIZE);

        try {
            // OS 수준의 고유 엔트로피를 이용하여 1,048,576개의 바이트를 완전히 독립적인 값으로 채움
            // 일반 Math.random()과 달리 패턴 예측이 불가능한 암호학적 독립성을 제공합니다.
            window.crypto.getRandomValues(independentBuffer);

            // 0~255 바이너리 데이터를 물리적인 파일 블록(Blob)으로 래핑
            const blob = new Blob([independentBuffer], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            
            // 다운로드 트리거용 가상 링크 생성
            const a = document.createElement('a');
            a.href = url;
            a.download = 'independent_random_1mb.bin';
            document.body.appendChild(a);
            a.click();

            // 사용이 끝난 메모리 자원 즉시 해제
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            statusDiv.innerHTML = "<span style='color: #28a745; font-weight: bold;'>✅ 다운로드 완료!</span><br>파일명: independent_random_1mb.bin<br>크기: 1,048,576 bytes";
        } catch (error) {
            statusDiv.innerHTML = "<span style='color: #dc3545;'>❌ 오류 발생: 브라우저가 해당 보안 난수 API를 지원하지 않습니다.</span>";
            console.error(error);
        }
    }
</script>

</body>
</html>
