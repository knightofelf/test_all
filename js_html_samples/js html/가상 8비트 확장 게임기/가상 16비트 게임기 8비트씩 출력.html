<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>16비트 → 8비트 출력</title>
</head>
<body>
  <h2>가상 16비트 게임기: 8비트씩 출력</h2>
  <label>16비트 값 (0~65535): 
    <input type="number" id="val" value="43981"> <!-- 0xABCD -->
  </label><br><br>
  <button onclick="output()">출력하기</button>
  
  <h3>결과:</h3>
  <pre id="output"></pre>
  
  <script>
    function output() {
      let value = parseInt(document.getElementById("val").value);
      
      // 상위 8비트와 하위 8비트 분리
      let low = value & 0xFF;
      let high = (value >> 8) & 0xFF;
      
      document.getElementById("output").textContent =
        `16비트 값: ${value} (0x${value.toString(16).toUpperCase()})\n` +
        `상위 8비트 출력: ${high} (0x${high.toString(16).toUpperCase()})\n` +
        `하위 8비트 출력: ${low} (0x${low.toString(16).toUpperCase()})`;
    }
  </script>
</body>
</html>
