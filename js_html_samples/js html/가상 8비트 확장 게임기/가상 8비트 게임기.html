<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가상 8비트 게임기</title>
  <style>
    body { font-family: sans-serif; background: #222; color: #eee; text-align: center; }
    canvas { border: 2px solid #555; background: #000; }
    button { margin: 10px; padding: 10px; }
  </style>
</head>
<body>
  <h2>가상 8비트 게임기</h2>
  <canvas id="screen" width="256" height="240"></canvas><br>
  <button onclick="runCPU()">CPU 실행</button>
  <button onclick="drawSprite()">스프라이트 출력</button>
  
  <script>
    // 가상의 8비트 메모리 (256바이트)
    let memory = new Uint8Array(256);
    let cpuRegister = 0; // 8비트 레지스터

    // CPU 실행: 단순히 메모리 값을 더하는 예시
    function runCPU() {
      cpuRegister = (cpuRegister + 1) & 0xFF; // 8비트 오버플로우
      alert("CPU 레지스터 값: " + cpuRegister);
    }

    // 화면에 스프라이트 출력
    function drawSprite() {
      let ctx = document.getElementById("screen").getContext("2d");
      ctx.fillStyle = "lime";
      ctx.fillRect(cpuRegister, 100, 16, 16); // 레지스터 값에 따라 위치 이동
    }
  </script>
</body>
</html>
