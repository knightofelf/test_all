<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가상 16비트 게임기</title>
  <style>
    body { background:#111; color:#eee; text-align:center; }
    canvas { border:2px solid #555; background:#000; }
  </style>
</head>
<body>
  <h2>가상 16비트 게임기</h2>
  <canvas id="screen" width="256" height="240"></canvas><br>
  <button onclick="run16bit()">16비트 덧셈 실행</button>
  <button onclick="drawSprite()">스프라이트 출력</button>

  <script>
    // 16비트 레지스터 (상위/하위 8비트)
    let regHigh = 0;
    let regLow = 0;

    function run16bit() {
      // 예시: 0x1234 + 0x00FF
      let a = 0x1234;
      let b = 0x00FF;

      let aLow = a & 0xFF;
      let aHigh = (a >> 8) & 0xFF;
      let bLow = b & 0xFF;
      let bHigh = (b >> 8) & 0xFF;

      // 하위 8비트 덧셈
      let lowSum = aLow + bLow;
      let carry = 0;
      if (lowSum > 0xFF) {
        carry = 1;
        lowSum &= 0xFF;
      }

      // 상위 8비트 덧셈 + 캐리 반영
      let highSum = aHigh + bHigh + carry;
      if (highSum > 0xFF) {
        highSum &= 0xFF;
      }

      regLow = lowSum;
      regHigh = highSum;

      alert(`16비트 결과: 0x${(highSum<<8 | lowSum).toString(16).toUpperCase()}`);
    }

    function drawSprite() {
      let ctx = document.getElementById("screen").getContext("2d");
      ctx.clearRect(0,0,256,240);
      let x = regLow;   // 하위 8비트 → X좌표
      let color = `rgb(${regHigh*4},${regLow},${regHigh*2})`; // 상위 8비트 → 색상
      ctx.fillStyle = color;
      ctx.fillRect(x, 100, 20, 20);
    }
  </script>
</body>
</html>
