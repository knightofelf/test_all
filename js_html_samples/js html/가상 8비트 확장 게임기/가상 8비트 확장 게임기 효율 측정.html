<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가상 8비트 확장 게임기 효율</title>
</head>
<body>
  <h2>가상 8비트 확장 게임기 효율 측정</h2>
  <label>CPU 개수: <input type="number" id="cpuCount" value="4"></label><br><br>
  <label>작업량(연산 횟수): <input type="number" id="workload" value="1000000"></label><br><br>
  <button onclick="simulate()">효율 확인</button>
  
  <h3>결과:</h3>
  <pre id="output"></pre>
  
  <script>
    function simulate() {
      let cpuCount = parseInt(document.getElementById("cpuCount").value);
      let workload = parseInt(document.getElementById("workload").value);

      // 순차 처리 (CPU 1대가 모든 작업 수행)
      let startSeq = performance.now();
      let seqResult = 0;
      for (let i = 0; i < workload; i++) {
        seqResult = (seqResult + i) & 0xFF; // 8비트 연산
      }
      let endSeq = performance.now();
      let seqTime = endSeq - startSeq;

      // 병렬 처리 (CPU 여러 대가 작업을 나눠 수행)
      let startPar = performance.now();
      let parResult = 0;
      let chunk = Math.floor(workload / cpuCount);
      for (let c = 0; c < cpuCount; c++) {
        let local = 0;
        for (let i = 0; i < chunk; i++) {
          local = (local + i) & 0xFF;
        }
        parResult ^= local; // CPU 결과 합치기
      }
      let endPar = performance.now();
      let parTime = endPar - startPar;

      // 효율 계산
      let efficiency = (seqTime / parTime).toFixed(2);

      document.getElementById("output").textContent =
        `순차 처리 시간: ${seqTime.toFixed(2)} ms\n` +
        `병렬 처리 시간: ${parTime.toFixed(2)} ms\n` +
        `효율(배속): ${efficiency} 배\n` +
        `순차 결과: ${seqResult}, 병렬 결과: ${parResult}`;
    }
  </script>
</body>
</html>
