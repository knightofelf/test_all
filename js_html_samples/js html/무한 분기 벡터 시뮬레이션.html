<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>무한 분기 벡터 시뮬레이션</title>
  <style>
    canvas { background: #111; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <canvas id="space" width="600" height="600"></canvas>
  <script>
    const canvas = document.getElementById("space");
    const ctx = canvas.getContext("2d");

    // 시작점
    const origin = { x: canvas.width / 2, y: canvas.height / 2 };

    // 벡터를 그리는 함수
    function drawVector(x, y, dx, dy, depth) {
      if (depth <= 0) return;

      const newX = x + dx;
      const newY = y + dy;

      ctx.strokeStyle = `hsl(${Math.random() * 360}, 100%, 70%)`;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(newX, newY);
      ctx.stroke();

      // 분기: 새로운 방향으로 계속 뻗어나감
      const angle1 = Math.random() * Math.PI * 2;
      const angle2 = Math.random() * Math.PI * 2;

      const speed = 40;

      drawVector(newX, newY, Math.cos(angle1) * speed, Math.sin(angle1) * speed, depth - 1);
      drawVector(newX, newY, Math.cos(angle2) * speed, Math.sin(angle2) * speed, depth - 1);
    }

    // 실행
    drawVector(origin.x, origin.y, 0, -50, 6);
  </script>
</body>
</html>
