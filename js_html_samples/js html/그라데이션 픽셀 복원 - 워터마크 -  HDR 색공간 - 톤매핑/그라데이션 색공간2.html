<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>독립형 3D 그라데이션 색공간</title>
  <style>
    body { display:flex; flex-wrap:wrap; }
    canvas { border:1px solid #ccc; margin:5px; }
  </style>
</head>
<body>
<script>
function drawSlice(bValue) {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  const imgData = ctx.createImageData(size, size);

  for (let y=0; y<size; y++) {
    for (let x=0; x<size; x++) {
      let i = (y*size+x)*4;
      imgData.data[i]   = x;       // R: 가로축
      imgData.data[i+1] = y;       // G: 세로축
      imgData.data[i+2] = bValue;  // B: Z축 (고정값)
      imgData.data[i+3] = 255;
    }
  }
  ctx.putImageData(imgData,0,0);
  document.body.appendChild(canvas);
}

// B축(Z축)을 단계별로 잘라서 여러 슬라이스 생성
for (let b=0; b<=255; b+=51) { // 0,51,102,153,204,255 → 총 6단면
  drawSlice(b);
}
</script>
</body>
</html>
