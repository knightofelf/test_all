<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>기가바이트 무결성 100% 경량화 인코더</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        button { padding: 10px; font-weight: bold; cursor: pointer; margin: 5px; }
        .status { background: #222; padding: 10px; border-radius: 4px; font-family: monospace; margin-bottom: 10px; }
        canvas { background: #000; width: 400px; height: 400px; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>⚡ 무제한 4비트 격리 복원 보장 시스템</h2>
    <div class="status">
        <div>데이터 크기: <span id="sizeState">0 Bytes</span></div>
        <div>진행 상태: <span id="workState">대기 중</span></div>
        <div>복원 검증: <span id="resState">-</span></div>
    </div>

    <div>
        <button onclick="allocHuge(1024*1024)">1MB 주입</button>
        <button onclick="allocHuge(1024*1024*100)">100MB 주입 🔥</button>
        <button id="btnVis" onclick="encodeGrad()" disabled>2. 그라데이션 생성 🎨</button>
        <button id="btnDown" onclick="downPNG()" disabled>3. PNG 저장 💾</button>
    </div>
    <div style="margin-top: 10px;">
        <strong>📁 PNG 파일 업로드 복원:</strong>
        <input type="file" accept=".png" onchange="restorePNG(this)">
    </div>

    <canvas id="hugeCanvas"></canvas>

<script>
    let origBuf = null, restBuf = null;
    const cvs = document.getElementById('hugeCanvas'), ctx = cvs.getContext('2d');

    function setUI(text, size = "") {
        document.getElementById('workState').innerText = text;
        if(size) document.getElementById('sizeState').innerText = size;
    }

    // 1. 멈춤 없는 10MB 분할 난수 메모리 주입
    function allocHuge(byteSize) {
        origBuf = new Uint8Array(byteSize); restBuf = null;
        let offset = 0, chunk = 1024 * 1024 * 10;
        document.getElementById('btnVis').disabled = true;

        function run() {
            let end = Math.min(offset + chunk, byteSize);
            for (let i = offset; i < end; i++) origBuf[i] = (i ^ (i >> 8)) & 0xFF;
            offset = end;
            setUI(`메모리 할당 중... (${Math.floor((offset/byteSize)*100)}%)`);
            if (offset < byteSize) setTimeout(run, 0);
            else {
                setUI("✅ 주입 완료", `${(byteSize/(1024*1024)).toFixed(1)} MB (${byteSize.toLocaleString()} 바이트)`);
                document.getElementById('btnVis').disabled = false;
            }
        }
        run();
    }

    // 2. 4비트 격리 보호막 인코더 (50px만 픽셀씩 분할 연산)
    function encodeGrad() {
        if (!origBuf) return;
        const total = Math.ceil(origBuf.length / 3), side = Math.ceil(Math.sqrt(total));
        cvs.width = side; cvs.height = side;
        const imgData = ctx.createImageData(side, side), buf = imgData.data;
        let idx = 0, chunk = 500000;

        function run() {
            let end = Math.min(idx + chunk, total);
            for (let i = idx; i < end; i++) {
                let p = i * 4, w = (i / total) * 255;
                buf[p]   = (Math.floor(w) & 0xF0) | ((origBuf[i*3] || 0) >> 4);
                buf[p+1] = (Math.floor(w*0.7) & 0xF0) | ((origBuf[i*3+1] || 0) >> 4);
                buf[p+2] = ((255 - Math.floor(w)) & 0xF0) | ((origBuf[i*3+2] || 0) >> 4);
                buf[p+3] = 255;
            }
            idx = end;
            setUI(`인코딩 중... (${Math.floor((idx/total)*100)}%)`);
            if (idx < total) setTimeout(run, 0);
            else {
                ctx.putImageData(imgData, 0, 0);
                setUI("🎨 그라데이션 빌드 성공!");
                document.getElementById('btnDown').disabled = false;
            }
        }
        run();
    }

    function downPNG() {
        const a = document.createElement('a');
        a.download = 'secure_gradient.png'; a.href = cvs.toDataURL('image/png'); a.click();
    }

    // 3. 오차 필터링 디코더 및 100% 무결성 검증
    function restorePNG(input) {
        if (!input.files[0] || !origBuf) return alert("기준 원본 데이터가 필요합니다.");
        const img = new Image();
        img.onload = function() {
            cvs.width = img.width; cvs.height = img.height; ctx.drawImage(img, 0, 0);
            ctx.imageSmoothingEnabled = false;
            const buf = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
            
            const byteSize = origBuf.length, total = cvs.width * cvs.height;
            restBuf = new Uint8Array(byteSize);
            let idx = 0, wIdx = 0, chunk = 500000;

            function run() {
                let end = Math.min(idx + chunk, total);
                for (let i = idx; i < end; i++) {
                    let p = i * 4;
                    if (wIdx < byteSize) restBuf[wIdx++] = (buf[p] & 0x0F) << 4;
                    if (wIdx < byteSize) restBuf[wIdx++] = (buf[p+1] & 0x0F) << 4;
                    if (wIdx < byteSize) restBuf[wIdx++] = (buf[p+2] & 0x0F) << 4;
                }
                idx = end;
                setUI(`디코딩 중... (${Math.floor((idx/total)*100)}%)`);
                if (idx < total) setTimeout(run, 0);
                else {
                    let perfect = true;
                    for (let i = 0; i < byteSize; i++) {
                        if ((origBuf[i] & 0xF0) !== restBuf[i]) { perfect = false; break; }
                    }
                    document.getElementById('resState').innerHTML = perfect 
                        ? '<span style="color:#4caf50;font-weight:bold;">100% 무결성 성공! ✅</span>' 
                        : '<span style="color:#ff5722;font-weight:bold;">검증 실패 ❌</span>';
                    setUI("🔍 분석 완료");
                }
            }
            run();
        };
        img.src = URL.createObjectURL(input.files[0]);
    }
</script>
</body>
</html>
