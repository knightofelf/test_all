<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 그라데이션 시각화 (라이브러리 미사용 버전)</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #111;
            color: #fff;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 80px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #00bcd4;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0097a7; }
        .canvas-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        canvas {
            background: #000;
            width: 100%;
            height: 250px;
            display: block;
            margin-top: 10px;
        }
        
        /* 외부 라이브러리 없이 브라우저 자체 기능으로 구현하는 3D 무대 */
        #stage3d {
            width: 100%;
            height: 250px;
            background: #000;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            /* 3D 원근감 설정 */
            perspective: 600px; 
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 30px;
            box-sizing: border-box;
        }
        /* 3D 기둥들이 배치될 회전용 판 */
        #container3d {
            display: flex;
            align-items: flex-end;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(-20deg);
            transition: transform 0.1s linear;
            width: 90%;
            height: 80%;
            justify-content: space-between;
        }
        /* 3D 입체 바(Bar)의 기본 뼈대 */
        .cube {
            position: relative;
            transform-style: preserve-3d;
            width: 20px;
            height: 0px; /* 스크립트로 동적 변경 */
            margin: 0 auto;
        }
        /* 3D 큐브의 각 면 공통 스타일 */
        .face {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: bottom center;
        }
        /* 앞면 */
        .face.front {
            transform: translateZ(10px);
        }
        /* 뒷면 */
        .face.back {
            transform: translateZ(-10px) rotateY(180deg);
            filter: brightness(0.7);
        }
        /* 왼쪽면 */
        .face.left {
            width: 20px; /* 깊이 두께 */
            transform: translateX(-10px) rotateY(-90deg);
            filter: brightness(0.8);
        }
        /* 오른쪽면 */
        .face.right {
            width: 20px; /* 깊이 두께 */
            transform: translateX(10px) rotateY(90deg);
            filter: brightness(0.9);
        }
        /* 윗면뚜껑 */
        .face.top {
            height: 20px;
            bottom: auto;
            top: 0;
            transform: rotateX(90deg) translateZ(10px);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>숫자 데이터 그라데이션 시각화 (오프라인 무선 보증 복정판)</h2>
    <p>숫자를 쉼표(,)나 공백으로 구분하여 입력하세요. (개수 제한 없음)</p>
    <textarea id="numberInput">10, 40, 25, 75, 45, 90, 60, 120, 70, 150</textarea>
    <button onclick="visualize()">시각화 실행</button>

    <div class="canvas-container">
        <!-- 1. 선(Line) 시각화 -->
        <div class="card">
            <h3>1. 선 (Line)</h3>
            <canvas id="lineCanvas"></canvas>
        </div>
        <!-- 2. 면(Area) 시각화 -->
        <div class="card">
            <h3>2. 면 (Area)</h3>
            <canvas id="areaCanvas"></canvas>
        </div>
        <!-- 3. 3D 시각화 (순수 HTML/CSS 구현) -->
        <div class="card">
            <h3>3. 3D 바 차트</h3>
            <div id="stage3d">
                <div id="container3d"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // 입력값 파싱 함수
    function getNumbers() {
        const input = document.getElementById('numberInput').value;
        return input.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
    }

    // 시각화 제어 총괄
    function visualize() {
        const data = getNumbers();
        if (data.length === 0) return alert("숫자를 입력해주세요.");

        const max = Math.max(...data, 1);
        const min = Math.min(...data, 0);

        drawLine(data, max, min);
        drawArea(data, max, min);
        drawPure3D(data, max, min);
    }

    // 1. 선(Line) 그리기
    function drawLine(data, max, min) {
        const canvas = document.getElementById('lineCanvas');
        const ctx = canvas.getContext('2d');
        setupCanvas(canvas, ctx);
        const { width, height, stepX, getY } = getChartMetrics(data, max, min, canvas.width, canvas.height);

        const gradient = ctx.createLinearGradient(0, 0, width, 0);
        gradient.addColorStop(0, '#00f2fe');
        gradient.addColorStop(1, '#4facfe');

        ctx.beginPath();
        data.forEach((val, i) => {
            const x = i * stepX;
            const y = getY(val);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });

        ctx.strokeStyle = gradient;
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    // 2. 면(Area) 그리기
    function drawArea(data, max, min) {
        const canvas = document.getElementById('areaCanvas');
        const ctx = canvas.getContext('2d');
        setupCanvas(canvas, ctx);
        const { width, height, stepX, getY } = getChartMetrics(data, max, min, canvas.width, canvas.height);

        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, 'rgba(255, 8, 68, 0.8)');
        gradient.addColorStop(1, 'rgba(255, 178, 73, 0.1)');

        ctx.beginPath();
        ctx.moveTo(0, height);
        data.forEach((val, i) => {
            ctx.lineTo(i * stepX, getY(val));
        });
        ctx.lineTo((data.length - 1) * stepX, height);
        ctx.closePath();

        ctx.fillStyle = gradient;
        ctx.fill();
    }

    // 3. 순수 HTML/CSS 코드로 3D 바 차트 빌드 (라이브러리 완전 불필요)
    function drawPure3D(data, max, min) {
        const container = document.getElementById('container3d');
        container.innerHTML = ''; // 이전 요소 삭제

        const len = data.length;
        // 데이터가 너무 많을 경우 개별 기둥의 가로 두께를 유연하게 압축 계산
        const barWidth = Math.max(2, Math.min(30, 300 / len)); 

        data.forEach((val, i) => {
            // 최대 높이 180px 기준으로 비율 환산
            const normHeight = ((val - min) / (max - min)) * 180 + 5; 

            // 연속적인 무지개빛 그라데이션 컬러 구하기 (HSL 코드 연산)
            const hue = (i / len) * 360;
            const baseColor = `hsl(${hue}, 85%, 55%)`;

            // 3D 큐브 노드 생성
            const cube = document.createElement('div');
            cube.className = 'cube';
            cube.style.width = `${barWidth}px`;
            cube.style.height = `${normHeight}px`;

            // 입체를 구성하는 5개 면 텍스처 결합 (바닥면 제외)
            const faces = ['front', 'back', 'left', 'right', 'top'];
            faces.forEach(faceType => {
                const face = document.createElement('div');
                face.className = `face ${faceType}`;
                face.style.backgroundColor = baseColor;
                
                // 좌우 측면 두께 조절 매칭 공정
                if(faceType === 'left' || faceType === 'right' || faceType === 'top') {
                    face.style.width = `${barWidth}px`;
                    if(faceType === 'left') face.style.transform = `translateX(-${barWidth/2}px) rotateY(-90deg)`;
                    if(faceType === 'right') face.style.transform = `translateX(${barWidth/2}px) rotateY(90deg)`;
                }
                if(faceType === 'front') face.style.transform = `translateZ(${barWidth/2}px)`;
                if(faceType === 'back') face.style.transform = `translateZ(-${barWidth/2}px) rotateY(180deg)`;
                if(faceType === 'top') {
                    face.style.height = `${barWidth}px`;
                    face.style.transform = `rotateX(90deg) translateZ(${barWidth/2}px)`;
                }

                cube.appendChild(face);
            });

            container.appendChild(cube);
        });
    }

    // 2D 그래픽 보정용 세팅 유틸리티
    function setupCanvas(canvas, ctx) {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = 250 * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        ctx.clearRect(0, 0, rect.width, 250);
    }

    function getChartMetrics(data, max, min, cWidth, cHeight) {
        const width = cWidth / window.devicePixelRatio;
        const height = 250;
        const padding = 20;
        const chartHeight = height - (padding * 2);
        const stepX = data.length > 1 ? width / (data.length - 1) : width;
        const getY = (val) => height - padding - ((val - min) / (max - min)) * chartHeight;
        return { width, height, stepX, getY };
    }

    // 무대 자동 회전 애니메이션 로직 구현
    let angle = -20;
    function rotateLoop() {
        angle += 0.5;
        const container = document.getElementById('container3d');
        if(container) {
            container.style.transform = `rotateX(-25deg) rotateY(${angle}deg)`;
        }
        requestAnimationFrame(rotateLoop);
    }

    // 초기 구동 실행
    window.onload = () => {
        visualize();
        rotateLoop();
    };
</script>
