<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CPU 파이프라인 비워짐 시뮬레이션</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    table { margin: 20px auto; border-collapse: collapse; }
    td {
      width: 40px; height: 40px;
      border: 1px solid #333;
      text-align: center;
      font-weight: bold;
    }
    .on { background: #4CAF50; color: white; }
    .off { background: #ccc; }
  </style>
</head>
<body>
  <h2>CPU 파이프라인 비워짐 시뮬레이션</h2>
  <p>처음엔 모든 단계가 켜졌다가, 클럭이 흐르면서 점점 줄어듭니다.</p>
  <table id="pipeline"></table>

  <script>
    const steps = [
      [1,1,1,1], // Cycle1
      [0,1,1,1], // Cycle2
      [0,0,1,1], // Cycle3
      [0,0,0,1]  // Cycle4
    ];

    const table = document.getElementById("pipeline");

    let cycle = 0;
    function showStep() {
      if (cycle >= steps.length) return;
      const row = steps[cycle];
      const tr = document.createElement("tr");
      row.forEach(cell => {
        const td = document.createElement("td");
        td.textContent = cell;
        td.className = cell ? "on" : "off";
        tr.appendChild(td);
      });
      table.appendChild(tr);
      cycle++;
      setTimeout(showStep, 1000); // 1초마다 다음 사이클 표시
    }

    showStep();
  </script>
</body>
</html>
