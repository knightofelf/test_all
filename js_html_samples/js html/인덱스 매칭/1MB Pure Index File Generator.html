<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1MB Pure Index File Generator</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 30px; background-color: #f8f9fa; }
        .card { background: white; padding: 25px; border-radius: 8px; border: 1px solid #dee2e6; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        button { padding: 12px 20px; background-color: #e83e8c; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background-color: #bd2130; }
        .info { font-size: 13px; color: #6c757d; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pure Index File Generator</h2>
        <p>숫자 데이터를 제외한 오직 그룹과 행 구조 인덱스만으로 매핑된 <strong>정확히 1MB 용량</strong>의 파일을 생성합니다.</p>
        <button onclick="generate1MBIndexFile()">💾 1MB 인덱스 파일 다운로드</button>
        <div class="info">※ 정확히 1,048,576 바이트 크기로 파일 규격이 보정되어 출력됩니다.</div>
    </div>

    <script>
        function generate1MBIndexFile() {
            let fileContent = "=== F1 ~ F98 구조적 라인 인덱스 배열 리스트 ===\n\n";

            // 데이터 본문을 제외하고 순수하게 그룹과 행 인덱스 번호 구조만 순서대로 전개
            for (let fIdx = 1; fIdx <= 98; fIdx++) {
                fileContent += `[Group_Root:F${fIdx}]\n`;
                for (let lineIdx = 1; lineIdx <= 4; lineIdx++) {
                    fileContent += `  ➔ Local_Row_Idx_Mapped:${lineIdx}\n`;
                }
                fileContent += "\n";
            }

            // 정확한 1MB (1,048,576 바이트) 크기 조절을 위한 패딩 처리
            const TARGET_SIZE = 1024 * 1024; // 1,048,576 Bytes
            
            // JavaScript 문자열을 UTF-8 바이트 배열로 변환했을 때의 현재 크기 측정
            let currentBytes = new TextEncoder().encode(fileContent).length;

            if (currentBytes < TARGET_SIZE) {
                fileContent += "=== SIZE ADJUSTMENT PADDING ===\n";
                currentBytes = new TextEncoder().encode(fileContent).length;
                
                // 부족한 바이트 수만큼 정확히 '#' 기호로 패딩을 채워 넣음
                let remainingBytes = TARGET_SIZE - currentBytes;
                if (remainingBytes > 0) {
                    fileContent += "#".repeat(remainingBytes);
                }
            }

            // 최종 파일 다운로드 트리거
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "pure_index_1MB.txt");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
