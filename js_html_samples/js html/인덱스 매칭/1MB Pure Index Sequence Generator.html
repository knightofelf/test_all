<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1MB Pure Index Sequence Generator</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 30px; background-color: #f8f9fa; }
        .card { background: white; padding: 25px; border-radius: 8px; border: 1px solid #dee2e6; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        button { padding: 12px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
        .info { font-size: 13px; color: #6c757d; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pure Index Sequence Generator (1MB)</h2>
        <p>중복되는 고정 순서 패턴을 지우고, F1~F96 그룹별 <strong>순수 행 배치 규칙 인덱스</strong>만으로 채워진 1MB 파일을 생성합니다.</p>
        <button onclick="generatePureIndexFile()">💾 1MB 고유 인덱스 파일 다운로드</button>
        <div class="info">※ 하단 패딩까지 포함하여 정확히 1,048,576 바이트 규격으로 출력됩니다.</div>
    </div>

    <script>
        // 행 순열 배치 구조 (4! = 24가지 구조 정의)
        // 1234 대신 알파벳 구조(A,B,C,D)를 사용하여 고유 배치 시퀀스를 식별합니다.
        function getSequencePermutations() {
            let result = [];
            let arr = ['Row_A', 'Row_B', 'Row_C', 'Row_D'];
            function permute(current, remaining) {
                if (remaining.length === 0) { result.push(current); return; }
                for (let i = 0; i < remaining.length; i++) {
                    permute([...current, remaining[i]], remaining.filter((_, idx) => idx !== i));
                }
            }
            permute([], arr);
            return result;
        }

        function generatePureIndexFile() {
            let fileContent = "=== F1 ~ F96 순수 행 배치 구조(시퀀스 인덱스) 리스트 ===\n\n";
            
            const allSequences = getSequencePermutations(); // 24개 고유 시퀀스 확보
            let fIndex = 1;

            // F96까지 루프를 돌며 16개 기본 군집 구조와 순열 시퀀스 매칭
            for (let block = 1; block <= 16; block++) {
                for (let k = 0; k < 6; k++) {
                    if (fIndex > 96) break;

                    // 24가지 순열 중 간격을 두고 고유하게 배치 순서를 선택 (중복 순환 제거)
                    let selectedSeq = allSequences[k * 4]; 
                    
                    fileContent += `[F${fIndex}_Structure]\n`;
                    selectedSeq.forEach((rowName, lineIdx) => {
                        fileContent += `  Line_${lineIdx + 1} ➔ Mapped_To:${rowName}\n`;
                    });
                    fileContent += "\n";
                    fIndex++;
                }
            }

            // 정확한 1MB (1,048,576 바이트) 크기 맞춤 보정 로직
            const TARGET_SIZE = 1024 * 1024;
            let currentBytes = new TextEncoder().encode(fileContent).length;

            if (currentBytes < TARGET_SIZE) {
                fileContent += "=== DUMMY ALIGNMENT PADDING ===\n";
                currentBytes = new TextEncoder().encode(fileContent).length;
                
                let remainingBytes = TARGET_SIZE - currentBytes;
                if (remainingBytes > 0) {
                    fileContent += "*".repeat(remainingBytes);
                }
            }

            // 파일 다운로드 실행
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "pure_index_sequence_1MB.txt");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
