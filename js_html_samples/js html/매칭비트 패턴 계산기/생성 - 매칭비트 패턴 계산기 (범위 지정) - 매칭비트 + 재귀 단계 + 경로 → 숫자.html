<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>매칭비트 패턴 계산기 (범위 지정)</title>
</head>
<body>
  <h2>매칭비트 패턴 계산기 (범위 지정)</h2>
  <label>시작 숫자: <input id="start" type="number" value="16"></label>
  <label>끝 숫자: <input id="end" type="number" value="32"></label>
  <button onclick="generatePattern()">출력</button>
  <pre id="output"></pre>

  <script>
    function getMatchBit(n) {
      if (n === 0n) return "0";
      if (n % 2n === 1n) return "1";
      const trailingZeros = n.toString(2).match(/0+$/)[0].length;
      return "1" + "0".repeat(trailingZeros);
    }

    function getRecursionLevel(n) {
      return n.toString(2).length;
    }

    function getSymmetryPath(n) {
      let path = [];
      let level = getRecursionLevel(n);
      let start = 2 ** (level - 1);
      let end = 2 ** level - 1;

      while (level > 1) {
        const mid = (start + end) / 2;
        if (n <= mid) {
          path.push("좌");
          end = Math.floor(mid);
        } else {
          path.push("우");
          start = Math.ceil(mid);
        }
        level--;
      }
      return path.join("");
    }

    function generatePattern() {
      const start = BigInt(document.getElementById("start").value);
      const end = BigInt(document.getElementById("end").value);
      let result = "";

      for (let n = start; n <= end; n++) {
        const match = getMatchBit(n);
        const recursionLevel = getRecursionLevel(Number(n));
        const symmetryPath = getSymmetryPath(Number(n));
        result += `${n.toString().padStart(2,"0")} → ${match} (재귀 단계:${recursionLevel}, 경로:${symmetryPath})\n`;
      }

      document.getElementById("output").textContent = result;
    }
  </script>
</body>
</html>
