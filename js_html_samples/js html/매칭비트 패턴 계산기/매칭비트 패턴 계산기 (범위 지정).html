<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>매칭비트 패턴 계산기 (범위 지정)</title>
</head>
<body>
  <h2>매칭비트 패턴 계산기 (범위 지정)</h2>
  <label>시작 숫자: <input id="start" type="number" value="0"></label>
  <label>끝 숫자: <input id="end" type="number" value="40"></label>
  <button onclick="generatePattern()">출력</button>
  <pre id="output"></pre>

  <script>
    function generatePattern() {
      const start = BigInt(document.getElementById("start").value);
      const end = BigInt(document.getElementById("end").value);
      let result = "";

      for (let n = start; n <= end; n++) {
        let match;
        if (n === 0n) {
          match = "0";
        } else if (n % 2n === 1n) {
          match = "1"; // 홀수 → 항상 1
        } else {
          // 짝수 → 끝나는 0의 개수(trailing zeros)에 따라 출력
          const trailingZeros = n.toString(2).match(/0+$/)[0].length;
          match = "1" + "0".repeat(trailingZeros);
        }
        result += `${n.toString().padStart(2,"0")} → ${match}\n`;
      }

      document.getElementById("output").textContent = result;
    }
  </script>
</body>
</html>
