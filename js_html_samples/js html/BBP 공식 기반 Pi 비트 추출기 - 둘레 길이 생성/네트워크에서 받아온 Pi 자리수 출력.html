<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pi Digits Viewer</title>
</head>
<body>
  <h2>네트워크에서 받아온 Pi 자리수 출력</h2>
  <button onclick="fetchPi()">자리수 불러오기</button>
  <pre id="result"></pre>

  <script>
    async function fetchPi() {
      // 예시: PiDB 같은 API에서 특정 구간 자리수 요청
      // 실제 API 주소는 공개된 서비스에 맞게 교체 필요
      const response = await fetch("https://api.pi.delivery/v1/pi?start=1000&numberOfDigits=500");
      const data = await response.json();
      const digits = data.content;

      // 100자리 단위로 잘라서 순차 출력
      let chunkSize = 100;
      let output = "";
      for (let i = 0; i < digits.length; i += chunkSize) {
        output += digits.slice(i, i + chunkSize) + "\n";
        document.getElementById("result").textContent = output;
        await new Promise(r => setTimeout(r, 200)); // 잠시 쉬면서 출력
      }
    }
  </script>
</body>
</html>
