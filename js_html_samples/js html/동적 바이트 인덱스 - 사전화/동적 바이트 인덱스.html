<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>동적 바이트 인덱스</title>
</head>
<body>
  <h2>동적 바이트 인덱스 (10바이트 단위)</h2>
  <pre id="output"></pre>

  <script>
    // 1MB 랜덤 데이터 대신 간단히 100바이트 예시
    const data = new Uint8Array(100);
    crypto.getRandomValues(data);

    // 동적 인덱스 규칙
    // 기본: 1바이트
    // 특정 값(0xFF): 2바이트
    // 특정 패턴(00 00): 4바이트
    // 여기서는 10바이트 단위로 묶어서 효율적으로 처리
    const positions = {};
    const chunkSize = 10;

    for (let i = 0; i < data.length; i += chunkSize) {
      const chunk = data.slice(i, i + chunkSize);
      const key = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join('');
      if (!positions[key]) {
        positions[key] = [];
      }
      positions[key].push(i);
    }

    // 결과 출력
    const output = document.getElementById("output");
    for (const [key, value] of Object.entries(positions)) {
      output.textContent += `${key}: ${value.slice(0,5)}\n`;
    }
  </script>
</body>
</html>
