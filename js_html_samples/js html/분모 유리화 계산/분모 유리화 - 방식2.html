<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>분모 유리화 - 방식2</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>
<body>
  <h3>방식 2: math.js simplify 활용</h3>
  <div id="method2"></div>

  <script>
    const expr = math.parse("55 / (2*(3*sqrt(9) + 3*sqrt(3) + 5))");
    const simplified = math.simplify(expr);

    document.getElementById("method2").innerText =
      `결과: ${simplified.toString()}`;
  </script>
</body>
</html>
