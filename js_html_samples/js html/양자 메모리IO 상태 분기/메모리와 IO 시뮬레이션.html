<!DOCTYPE html>
<html>
<head>
  <title>Memory & IO Simulation</title>
</head>
<body>
  <h2>메모리와 IO 시뮬레이션</h2>
  
  <input type="text" id="inputData" placeholder="데이터 입력">
  <button onclick="writeMemory()">메모리에 저장</button>
  <button onclick="readMemory()">메모리 읽기</button>
  
  <p id="output"></p>

  <script>
    // 메모리 공간 (배열)
    let memory = [];

    function writeMemory() {
      let data = document.getElementById("inputData").value;
      memory.push(data); // 메모리에 저장
      document.getElementById("output").innerText = "저장됨: " + data;
    }

    function readMemory() {
      if (memory.length > 0) {
        let data = memory.shift(); // FIFO 방식으로 읽기
        document.getElementById("output").innerText = "읽음: " + data;
      } else {
        document.getElementById("output").innerText = "메모리가 비어있음";
      }
    }
  </script>
</body>
</html>
