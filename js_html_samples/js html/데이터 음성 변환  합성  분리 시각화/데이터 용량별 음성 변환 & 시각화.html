<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Data Sonification by Size</title>
  <style>
    canvas { border: 1px solid #333; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>데이터 용량별 음성 변환 & 시각화</h2>
  <button onclick="runDemo(100)">소량 데이터</button>
  <button onclick="runDemo(5000)">중간 데이터</button>
  <button onclick="runDemo(200000)">대용량 데이터</button>
  <canvas id="visual" width="600" height="200"></canvas>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const canvas = document.getElementById("visual");
    const ctx = canvas.getContext("2d");

    function generateData(size) {
      return Array.from({length: size}, () => Math.floor(Math.random() * 1000));
    }

    function playOscillator(data) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = data.reduce((a,b)=>a+b)/data.length;
      osc.frequency.value = freq;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      setTimeout(()=>osc.stop(), 1000); // 1초만 재생
    }

    function compressData(data) {
      // 단순 압축: 평균값만 추출
      const chunkSize = 1000;
      const compressed = [];
      for (let i=0; i<data.length; i+=chunkSize) {
        const chunk = data.slice(i, i+chunkSize);
        compressed.push(chunk.reduce((a,b)=>a+b)/chunk.length);
      }
      return compressed;
    }

    function visualize(data) {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const barWidth = canvas.width / data.length;
      data.forEach((val,i)=>{
        ctx.fillStyle = "rgb("+(val%255)+",100,150)";
        ctx.fillRect(i*barWidth, canvas.height-val%200, barWidth, val%200);
      });
    }

    function runDemo(size) {
      const data = generateData(size);
      if (size < 1000) {
        playOscillator(data);
        visualize(data);
      } else if (size < 100000) {
        for (let i=0; i<data.length; i+=1000) {
          const batch = data.slice(i, i+1000);
          playOscillator(batch);
        }
        visualize(data.slice(0,1000)); // 일부만 시각화
      } else {
        const compressed = compressData(data);
        visualize(compressed);
      }
    }
  </script>
</body>
</html>
