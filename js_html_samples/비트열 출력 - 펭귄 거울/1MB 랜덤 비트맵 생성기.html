<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1MB 랜덤 비트맵 생성기</title>
</head>
<body>
    <h2>1MB 랜덤 비트맵 파일 생성</h2>
    <p>아래 버튼을 누르면 1, 0, 공백으로 이루어진 1MB 텍스트 파일이 생성됩니다.</p>
    <button onclick="generateAndDownload1MB()">1MB 파일 생성 및 다운로드</button>

    <script>
        function generateAndDownload1MB() {
            // 정확한 1MB 크기 설정 (1024 * 1024 바이트)
            const TARGET_SIZE = 1048576; 
            
            // 패턴에 사용될 구성 요소들 (1, 0, 공백)
            const pool = ['1', '0', ' '];
            const maxCols = 14; // 한 행의 고정 길이

            let fileContent = '';
            let currentSize = 0;

            // 1MB 크기가 채워질 때까지 반복 생성
            while (currentSize < TARGET_SIZE) {
                let row = '';
                
                // 14칸짜리 한 행을 랜덤하게 조립
                for (let i = 0; i < maxCols; i++) {
                    const randomIndex = Math.floor(Math.random() * pool.length);
                    row += pool[randomIndex];
                }
                
                // 줄바꿈 추가 (\n = 1바이트)
                row += '\n'; 

                // 타겟 크기를 초과하지 않도록 남은 바이트 계산 후 잘라내기
                if (currentSize + row.length > TARGET_SIZE) {
                    const remaining = TARGET_SIZE - currentSize;
                    fileContent += row.substring(0, remaining);
                    break;
                }

                fileContent += row;
                currentSize += row.length;
            }

            // 파일 다운로드 처리 (Blob 객체 활용)
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `random_bitmap_1MB.txt`;
            
            // 다운로드 트리거
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            console.log(`생성 완료! 실제 파일 크기: ${blob.size} 바이트`);
        }
    </script>
</body>
</html>
