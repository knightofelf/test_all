<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    .fade span {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .fade span.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1 class="fade">안녕하세요 Copilot!</h1>

  <script>
    const text = document.querySelector(".fade");
    const chars = text.textContent.split("");
    text.textContent = "";
    chars.forEach(char => {
      const span = document.createElement("span");
      span.textContent = char;
      text.appendChild(span);
    });

    let i = 0;
    setInterval(() => {
      const span = text.querySelectorAll("span")[i];
      if (span) span.classList.add("show");
      i++;
    }, 200);
  </script>
</body>
</html>
