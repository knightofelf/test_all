<style>
  @keyframes rainbow {
    0% { color: red; }
    25% { color: orange; }
    50% { color: yellow; }
    75% { color: green; }
    100% { color: blue; }
  }
  .rainbow3d span {
    display: inline-block;
    transform: rotateY(90deg);
    opacity: 0;
    transition: transform 0.8s ease, opacity 0.8s ease;
  }
  .rainbow3d span.show {
    transform: rotateY(0deg);
    opacity: 1;
    animation: rainbow 2s infinite linear;
  }
</style>

<h1 class="rainbow3d">레인보우 3D 글자</h1>

<script>
  const rainbowText = document.querySelector(".rainbow3d");
  const chars2 = rainbowText.textContent.split("");
  rainbowText.textContent = "";
  chars2.forEach(c => {
    const span = document.createElement("span");
    span.textContent = c;
    rainbowText.appendChild(span);
  });

  let k = 0;
  setInterval(() => {
    const span = rainbowText.querySelectorAll("span")[k];
    if (span) span.classList.add("show");
    k++;
  }, 200);
</script>
