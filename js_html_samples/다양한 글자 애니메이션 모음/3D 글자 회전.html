<style>
  .rotate3d span {
    display: inline-block;
    transform: rotateY(90deg);
    opacity: 0;
    transition: transform 0.6s ease, opacity 0.6s ease;
  }
  .rotate3d span.show {
    transform: rotateY(0deg);
    opacity: 1;
  }
</style>

<h1 class="rotate3d">3D 글자 회전</h1>

<script>
  const rotateText = document.querySelector(".rotate3d");
  const letters = rotateText.textContent.split("");
  rotateText.textContent = "";
  letters.forEach(l => {
    const span = document.createElement("span");
    span.textContent = l;
    rotateText.appendChild(span);
  });

  let i = 0;
  setInterval(() => {
    const span = rotateText.querySelectorAll("span")[i];
    if (span) span.classList.add("show");
    i++;
  }, 200);
</script>
