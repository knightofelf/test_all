<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RSA Demo</title>
</head>
<body>
  <h2>RSA 문자열 암호화/복호화</h2>
  <input id="message" placeholder="메시지 입력">
  <button onclick="encrypt()">Encrypt</button>
  <button onclick="decrypt()">Decrypt</button>
  
  <p>암호문: <span id="cipher"></span></p>
  <p>복호문: <span id="plain"></span></p>

<script>
  const p = 61, q = 53;
  const n = p * q;              // 3233
  const phi = (p - 1) * (q - 1); // 3120
  const e = 17;                 // 공개키
  const d = 2753;               // 개인키

  function modPow(base, exp, mod) {
    let result = 1n;
    let b = BigInt(base);
    let eBig = BigInt(exp);
    let m = BigInt(mod);
    while (eBig > 0) {
      if (eBig % 2n === 1n) result = (result * b) % m;
      b = (b * b) % m;
      eBig = eBig / 2n;
    }
    return result;
  }

  let cipherArray = [];

  function encrypt() {
    const msg = document.getElementById("message").value;
    cipherArray = [];
    for (let i = 0; i < msg.length; i++) {
      const code = msg.charCodeAt(i);
      const cipher = modPow(code, e, n);
      cipherArray.push(cipher.toString());
    }
    document.getElementById("cipher").innerText = cipherArray.join(" ");
  }

  function decrypt() {
    let plain = "";
    for (let i = 0; i < cipherArray.length; i++) {
      const c = BigInt(cipherArray[i]);
      const m = Number(modPow(c, d, n));
      plain += String.fromCharCode(m);
    }
    document.getElementById("plain").innerText = plain;
  }
</script>
</body>
</html>

<!--
### 🔑 RSA 기본 흐름
1. 두 개의 큰 소수 \(p, q\) 선택  
2. \(n = p \cdot q\), \(\varphi(n) = (p-1)(q-1)\) 계산  
3. 공개키 \(e\) 선택 (보통 65537)  
4. 개인키 \(d\) 계산 (\(d \cdot e \equiv 1 \pmod{\varphi(n)}\))  
5. 암호화: \(c = m^e \mod n\)  
6. 복호화: \(m = c^d \mod n\)  
//-->
