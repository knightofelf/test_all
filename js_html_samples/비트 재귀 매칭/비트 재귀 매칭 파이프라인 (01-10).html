<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비트 재귀 매칭 파이프라인 (01-10)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --accent: #38bdf8;
            --mask: #475569;
        }
        body {
            font-family: 'Courier New', monospace;
            background-color: var(--bg);
            color: var(--text);
            padding: 30px;
        }
        h2 { color: var(--accent); margin-bottom: 20px; font-size: 22px; }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 750px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: #111827;
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td { font-size: 16px; font-weight: bold; white-space: pre; }
        .mask-char { color: var(--mask); font-weight: normal; }
        .match-val { color: #f43f5e; }
        .idx-val { color: #10b981; }
    </style>
</head>
<body>

    <h2>비트 필터링 및 재귀수열 매칭 레이어 (01 ~ 10)</h2>
    <table>
        <thead>
            <tr>
                <th>비트우측정렬</th>
                <th>재귀제외</th>
                <th>재귀수열매칭</th>
            </tr>
        </thead>
        <tbody id="pipeline-target"></tbody>
    </table>

    <script>
//비트의 최하위 활성 비트(LSB)를 추출 및 마스킹하여 동적 재귀 패턴으로 정렬·매핑하는 알고리즘 파이프라인

        // 특수문자 마스킹 가시화 HTML 변환
        function toMaskHtml(str) {
            return str.replace(/_/g, '<span class="mask-char">_</span>');
        }

        const tbody = document.getElementById('pipeline-target');
        let htmlRows = "";

        // 1부터 10까지 동적 비트 연산 루프
        for (let i = 1; i <= 140; i++) {
            // 1. 기본 2진수 변환 (최대 범위 10을 고려해 4비트 기준으로 우측정렬)
            const rawBin = i.toString(2).padStart(4, ' ');
            const rawBinTrimmed = i.toString(2); // 공백 없는 실제 비트 스트림
            const bitLength = rawBinTrimmed.length;

            // 2. 최하위 활성 비트(LSB) 위치 및 하위 0 개수 추출 (재귀 패턴 탐지)
            const lowestSetBit = i & -i;
            const trailingZeros = 31 - Math.clz32(lowestSetBit);
            
            // 3. 재귀 제외(마스킹) 문자열 연산
            // 매칭에 소모된 하위 비트 패턴 길이만큼 우측 끝을 '_'로 변환
            const matchPatternLength = trailingZeros + 1; 
            
            let filteredStr = "";
            let matchStr = "";

            // 현재 비트스트림 기반 마스킹 필터 구현
            for (let b = 0; b < bitLength; b++) {
                // 뒤에서부터 매칭 패턴 길이 안에 들어오는 영역 처리
                if (b >= bitLength - matchPatternLength) {
                    filteredStr += "_";
                    matchStr += rawBinTrimmed[b];
                } else {
                    filteredStr += rawBinTrimmed[b];
                    matchStr += "_";
                }
            }

            // 고정폭 4자리 정렬 마스킹 보정
            const finalFiltered = filteredStr.padStart(4, ' ');
            const finalMatch = matchStr.padStart(4, ' ');
            const idxStr = String(i).padStart(2, '0');

            // 테이블 로우 빌드
            htmlRows += `
                <tr>
                    <td>${rawBin}</td>
                    <td>${toMaskHtml(finalFiltered)}</td>
                    <td><span class="idx-val">${idxStr}</span> → <span class="match-val">${toMaskHtml(finalMatch)}</span></td>
                </tr>
            `;
        }

        tbody.innerHTML = htmlRows;
    </script>

</body>
</html>
