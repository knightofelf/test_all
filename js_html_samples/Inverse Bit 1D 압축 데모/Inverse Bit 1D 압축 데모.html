<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Inverse Bit 1D 압축 데모</title>
</head>
<body>
  <h2>Inverse Bit 1D 압축 데모</h2>
  <textarea id="inputBits" rows="4" cols="50">11100110011011</textarea><br>
  <button onclick="compressBits()">압축하기</button>

  <h3>결과</h3>
  <p id="output"></p>

  <script>
    function compressBits() {
      const bits = document.getElementById("inputBits").value.trim();
      let changes = [];
      for (let i = 1; i < bits.length; i++) {
        if (bits[i] !== bits[i-1]) {
          changes.push(i); // 변화 지점 기록
        }
      }
      const lastValue = bits[bits.length-1];
      const compressedLength = changes.length + 1;
      const ratio = (bits.length / compressedLength).toFixed(2);

      document.getElementById("output").innerText =
        "원본 길이: " + bits.length + "비트\n" +
        "변화 지점 수(x): " + changes.length + "\n" +
        "압축 길이: " + compressedLength + "비트\n" +
        "압축률: " + ratio + "배\n" +
        "저장 데이터: x위치=" + changes.join(",") + " / 마지막 값=" + lastValue;
    }
  </script>
</body>
</html>
