<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Inverse Bit 1D 단계별 압축 데모</title>
</head>
<body>
  <h2>Inverse Bit 1D 단계별 압축 데모</h2>
  <textarea id="inputBits" rows="4" cols="50">11100110011011</textarea><br>
  <button onclick="compressDemo()">압축하기</button>

  <h3>단계별 결과</h3>
  <pre id="steps"></pre>

  <h3>최종 압축 결과</h3>
  <pre id="output"></pre>

  <script>
    function compressDemo() {
      const bits = document.getElementById("inputBits").value.trim();
      let steps = [];
      let positions = [];
      let current = bits.split("");
      let offset = 0;

      while (current.length > 2) {
        let line = Array(offset).fill(" ").join(""); // 들여쓰기
        let left = 0;
        let right = current.length - 1;

        // 왼쪽 끝 변화 체크
        if (current[left] !== current[left+1]) {
          line += "x";
          positions.push(offset + left);
        } else {
          line += " ";
        }

        // 가운데 출력
        line += current.join("");

        // 오른쪽 끝 변화 체크
        if (current[right] !== current[right-1]) {
          line += "x";
          positions.push(offset + right);
        }

        steps.push(line);
        current = current.slice(1, current.length-1); // 양끝 제거
        offset++;
      }

      const lastValue = bits[bits.length-1];
      const compressedLength = positions.length + 1;
      const ratio = (bits.length / compressedLength).toFixed(2);

      document.getElementById("steps").innerText = steps.join("\n");
      document.getElementById("output").innerText =
        "원본 길이: " + bits.length + "비트\n" +
        "변화 지점 수(x): " + positions.length + "\n" +
        "압축 길이: " + compressedLength + "비트\n" +
        "압축률: " + ratio + "배\n" +
        "저장 데이터: x위치=" + positions.join(",") + " / 마지막 값=" + lastValue;
    }
  </script>
</body>
</html>
