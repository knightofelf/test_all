<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 텍스처 모델 투영 뷰어</title>
  <style>
    body { margin:0; overflow:hidden; background:#05050a; }
    canvas { display:block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script>
  // 기본 씬/카메라/렌더러
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,0,5);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // OrbitControls (마우스 드래그/휠 줌 지원)
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // 텍스처 로드
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = '';
  loader.load('https://threejs.org/examples/textures/uv_grid_opengl.jpg', (texture)=>{
    // 3D 모델 생성 (예: 구체)
    const geometry = new THREE.SphereGeometry(1.5, 64, 64);
    const material = new THREE.MeshBasicMaterial({ map: texture });
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    // 3겹 원 레이어 (투영 구조 표현)
    const radii = [2.5, 3.5, 4.5];
    radii.forEach(r=>{
      const ringGeo = new THREE.RingGeometry(r-0.02, r+0.02, 64);
      const ringMat = new THREE.MeshBasicMaterial({ color:0x00ffaa, side:THREE.DoubleSide });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI/2;
      scene.add(ring);
    });

    animate();
  });

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
