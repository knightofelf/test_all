<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WEBGL loseContext Test</title>
</head>
<body>
<canvas id="glcanvas" width="300" height="300"></canvas>
<button id="lose">Lose Context</button>
<button id="restore">Restore Context</button>

<script>
  const canvas = document.getElementById("glcanvas");
  const gl = canvas.getContext("webgl");

  if (!gl) {
    alert("WebGL을 지원하지 않는 환경입니다.");
  } else {
    const ext = gl.getExtension("WEBGL_lose_context");
    if (!ext) {
      alert("WEBGL_lose_context 확장을 지원하지 않습니다.");
    } else {
      document.getElementById("lose").onclick = () => {
        ext.loseContext();
        console.log("WebGL 컨텍스트 해제됨");
      };
      document.getElementById("restore").onclick = () => {
        ext.restoreContext();
        console.log("WebGL 컨텍스트 복구됨");
      };
    }
  }
</script>
</body>
</html>
