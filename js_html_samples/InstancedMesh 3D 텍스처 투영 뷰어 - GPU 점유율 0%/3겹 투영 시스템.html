<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3겹 투영 시스템</title>
  <style>body { margin:0; }</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script>
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 10;

  // 중앙 모델 (토러스)
  const modelGeo = new THREE.TorusKnotGeometry(1, 0.3, 128, 32);
  const modelMat = new THREE.MeshNormalMaterial();
  const model = new THREE.Mesh(modelGeo, modelMat);
  scene.add(model);

  // 렌더 타겟
  const renderTarget = new THREE.WebGLRenderTarget(1024, 1024);

  // 셰이더 머티리얼 (3겹 보간)
  const layerMaterial = new THREE.ShaderMaterial({
    uniforms: {
      tex: { value: renderTarget.texture },
      time: { value: 0.0 },
      r1: { value: 2.0 },
      r2: { value: 3.0 },
      r3: { value: 4.0 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tex;
      uniform float time;
      uniform float r1, r2, r3;
      varying vec2 vUv;
      void main() {
        vec4 color = texture2D(tex, vUv);
        float dist = length(vUv - 0.5);

        vec3 finalColor = color.rgb;

        if(dist < r1){
          finalColor = color.rgb;
        } else if(dist >= r1 && dist < r2){
          float f = (dist - r1)/(r2 - r1);
          finalColor = mix(color.rgb, color.rgb*0.7, f);
        } else if(dist >= r2 && dist < r3){
          float f = (dist - r2)/(r3 - r2);
          finalColor = mix(color.rgb*0.7, color.rgb*0.3, f);
        } else {
          finalColor *= 0.1; // 바깥은 희미하게
        }

        gl_FragColor = vec4(finalColor,1.0);
      }
    `
  });

  // 3겹 구 레이어
  const layerGeo = new THREE.SphereGeometry(5, 64, 64);
  const layerMesh = new THREE.Mesh(layerGeo, layerMaterial);
  scene.add(layerMesh);

  function animate(t){
    requestAnimationFrame(animate);
    model.rotation.x += 0.01;
    model.rotation.y += 0.01;

    // 모델을 렌더 타겟에 렌더링
    renderer.setRenderTarget(renderTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);

    // 메인 장면 렌더링
    layerMaterial.uniforms.time.value = t*0.001;
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
