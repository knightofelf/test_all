<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 텍스처 모델 투영 뷰어</title>
  <style>
    body { margin:0; overflow:hidden; background:#05050a; }
    canvas { display:block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,0,20);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // 텍스처 URL 목록 (임의로 10개)
  const textureUrls = [
    "https://threejs.org/examples/textures/brick_diffuse.jpg",
    "https://threejs.org/examples/textures/uv_grid_opengl.jpg",
    "https://threejs.org/examples/textures/brick_bump.jpg",
    "https://threejs.org/examples/textures/brick_roughness.jpg",
    "https://threejs.org/examples/textures/brick_specular.jpg",
    "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",
    "https://threejs.org/examples/textures/planets/jupiter.jpg",
    "https://threejs.org/examples/textures/planets/mars_1k_color.jpg",
    "https://threejs.org/examples/textures/planets/moon_1024.jpg",
    "https://threejs.org/examples/textures/planets/saturn.jpg"
  ];

  const loader = new THREE.TextureLoader();
  const group = new THREE.Group();

  textureUrls.forEach((url, i)=>{
    loader.load(url, (texture)=>{
      const geo = new THREE.SphereGeometry(1.5, 32, 32);
      const mat = new THREE.MeshBasicMaterial({ map: texture });
      const mesh = new THREE.Mesh(geo, mat);

      // 2줄로 배치 (5개씩)
      const row = Math.floor(i / 5);
      const col = i % 5;
      mesh.position.set((col-2)*4, (row===0?2:-2)*4, 0);

      group.add(mesh);
    });
  });

  scene.add(group);

  function animate(){
    requestAnimationFrame(animate);
    group.rotation.y += 0.002; // 전체 그룹 회전
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
