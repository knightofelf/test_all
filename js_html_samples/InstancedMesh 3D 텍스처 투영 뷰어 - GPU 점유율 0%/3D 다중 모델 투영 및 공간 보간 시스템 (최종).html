<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 다중 모델 투영 및 공간 보간 시스템 (CDN)</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #05050a; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<!-- three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<!-- OrbitControls (구버전에서만 THREE.OrbitControls 제공) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>

<script>
  // 카메라 먼저 선언
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 12);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // OrbitControls는 camera 선언 이후에!
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enablePan = false;
  controls.minDistance = 5;
  controls.maxDistance = 20;

  // 중앙 모델 예시
  const model = new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.3, 128, 32), new THREE.MeshNormalMaterial());
  scene.add(model);

  function animate(){
    requestAnimationFrame(animate);
    model.rotation.x += 0.01;
    model.rotation.y += 0.01;
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
</script>
</body>
</html>
