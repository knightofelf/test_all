<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>모델 투영만 보기</title>
  <style>canvas { display:block; background:#000; }</style>
</head>
<body>
<!-- r152까지 지원되는 three.min.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  camera.position.z = 10;

  const loader = new THREE.TextureLoader();
  const textures = [
    "https://threejs.org/examples/textures/brick_diffuse.jpg",
    "https://threejs.org/examples/textures/uv_grid_opengl.jpg",
    "https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg",
    "https://threejs.org/examples/textures/terrain/grasslight-big.jpg",
    "https://threejs.org/examples/textures/water.jpg"
  ];

  // 모델 5개 (렌더링하지 않고 좌표만 사용)
  const models = [];
  for (let i=0; i<5; i++) {
    const geometry = new THREE.BoxGeometry(1,1,1);
    const material = new THREE.MeshBasicMaterial({ map: loader.load(textures[i]) });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.x = i*2 - 4;
    scene.add(mesh); // 실제 화면에는 안 보이게 할 수도 있음
    models.push(mesh);
  }

  // Canvas2D로 원과 투영된 점 표시
  const canvas = document.createElement("canvas");
  canvas.width = 500; canvas.height = 500;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");

  function projectToCircle(mesh, radius) {
    const vector = mesh.position.clone();
    vector.project(camera);
    const x = vector.x * radius + canvas.width/2;
    const y = vector.y * radius + canvas.height/2;
    return {x,y};
  }


  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // 원 3겹
    [100, 150, 200].forEach(r => {
      ctx.beginPath();
      ctx.arc(canvas.width/2, canvas.height/2, r, 0, Math.PI*2);
      ctx.strokeStyle = "white";
      ctx.stroke();
    });


    // 모델 투영
    models.forEach(m => {
      [100,150,200].forEach(r => {
        const pos = projectToCircle(m, r);
        ctx.fillStyle = "red";
        ctx.fillRect(pos.x-2, pos.y-2, 4, 4);
      });
    });
  }

  function animate() {
    requestAnimationFrame(animate);
    models.forEach(m => {
      m.rotation.x += 0.01;
      m.rotation.y += 0.01;
    });
    draw();
  }
  animate();
</script>
</body>
</html>
