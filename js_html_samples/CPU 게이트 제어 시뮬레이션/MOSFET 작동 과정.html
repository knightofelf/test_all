<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MOSFET 작동 과정</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    .chip {
      position: relative;
      width: 400px;
      height: 250px;
      margin: 30px auto;
      background: #f0f0f0;
      border: 2px solid #333;
      border-radius: 10px;
    }
    .source, .drain {
      position: absolute;
      width: 80px;
      height: 60px;
      background: #4CAF50;
      color: white;
      line-height: 60px;
      text-align: center;
      font-weight: bold;
    }
    .source { left: 20px; top: 80px; }
    .drain { right: 20px; top: 80px; }
    .channel {
      position: absolute;
      left: 100px;
      right: 100px;
      top: 100px;
      height: 20px;
      background: #ccc;
      transition: background 0.5s;
    }
    .gate {
      position: absolute;
      left: 150px;
      right: 150px;
      top: 40px;
      height: 30px;
      background: #2196F3;
      color: white;
      text-align: center;
      line-height: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .substrate {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #795548;
      color: white;
      text-align: center;
      line-height: 40px;
      font-weight: bold;
    }
    .on .channel {
      background: #ff9800; /* 채널이 열리면 주황색으로 표시 */
    }
  </style>
</head>
<body>
  <h2>MOSFET 트랜지스터 작동 과정</h2>
  <p>게이트(Gate)를 클릭하면 채널이 열리고 Source → Drain으로 전류가 흐릅니다.</p>
  <div class="chip" id="mosfet">
    <div class="source">Source</div>
    <div class="drain">Drain</div>
    <div class="channel"></div>
    <div class="gate" onclick="toggleGate()">Gate</div>
    <div class="substrate">Substrate</div>
  </div>

  <script>
    function toggleGate() {
      const chip = document.getElementById("mosfet");
      chip.classList.toggle("on");
    }
  </script>
</body>
</html>
