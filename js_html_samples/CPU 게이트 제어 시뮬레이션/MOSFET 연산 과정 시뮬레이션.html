<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MOSFET 연산 과정 시뮬레이션</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    .chip {
      position: relative;
      width: 500px;
      height: 300px;
      margin: 30px auto;
      background: #f0f0f0;
      border: 2px solid #333;
      border-radius: 10px;
    }
    .source {
      position: absolute;
      width: 80px;
      height: 40px;
      background: #4CAF50;
      color: white;
      line-height: 40px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }
    .sourceA { left: 20px; top: 80px; }
    .sourceB { left: 20px; top: 140px; }
    .drain {
      position: absolute;
      right: 20px;
      top: 110px;
      width: 80px;
      height: 60px;
      background: #9C27B0;
      color: white;
      line-height: 60px;
      text-align: center;
      font-weight: bold;
    }
    .channel {
      position: absolute;
      left: 120px;
      right: 120px;
      top: 120px;
      height: 20px;
      background: #ccc;
      transition: background 0.5s;
    }
    .gate {
      position: absolute;
      left: 200px;
      right: 200px;
      top: 40px;
      height: 30px;
      background: #2196F3;
      color: white;
      text-align: center;
      line-height: 30px;
      font-weight: bold;
      cursor: pointer;
    }
    .substrate {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #795548;
      color: white;
      text-align: center;
      line-height: 40px;
      font-weight: bold;
    }
    .on .channel {
      background: #ff9800;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>MOSFET 연산 과정 (AND 연산 예시)</h2>
  <p>Source A, Source B를 클릭해 입력을 ON/OFF하고, Gate를 열면 Drain에 결과가 표시됩니다.</p>
  <div class="chip" id="mosfet">
    <div class="source sourceA" onclick="toggleInput('A')">A=0</div>
    <div class="source sourceB" onclick="toggleInput('B')">B=0</div>
    <div class="channel"></div>
    <div class="gate" onclick="toggleGate()">Gate</div>
    <div class="drain">Drain</div>
    <div class="substrate">Substrate</div>
  </div>
  <div id="result">결과: OFF</div>

  <script>
    let inputA = 0;
    let inputB = 0;
    let gateOn = false;

    function toggleInput(which) {
      if (which === 'A') {
        inputA = inputA ? 0 : 1;
        document.querySelector('.sourceA').textContent = "A=" + inputA;
      } else {
        inputB = inputB ? 0 : 1;
        document.querySelector('.sourceB').textContent = "B=" + inputB;
      }
      updateResult();
    }

    function toggleGate() {
      const chip = document.getElementById("mosfet");
      gateOn = !gateOn;
      chip.classList.toggle("on");
      updateResult();
    }

    function updateResult() {
      const resultBox = document.getElementById("result");
      if (gateOn) {
        // 간단한 AND 연산
        const output = inputA && inputB;
        resultBox.textContent = "결과: " + (output ? "ON (1)" : "OFF (0)");
      } else {
        resultBox.textContent = "결과: OFF (Gate 닫힘)";
      }
    }
  </script>
</body>
</html>
