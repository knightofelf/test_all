<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>확장된 가상 8비트 게임기</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; }
    canvas { border: 2px solid #555; background: #000; }
    button { margin: 10px; padding: 10px; }
  </style>
</head>
<body>
  <h2>확장된 가상 8비트 게임기</h2>
  <canvas id="screen" width="256" height="240"></canvas><br>
  <button onclick="runCPUs()">멀티 CPU 실행</button>
  <button onclick="drawScene()">팔레트 컬러 출력</button>
  
  <script>
    // 가상의 8비트 CPU 여러 개
    const cpuCount = 4; // CPU 4대 병렬
    let cpuRegisters = new Array(cpuCount).fill(0);

    // 팔레트 (8비트 → RGB 매핑)
    const palette = [
      "#000000", "#FF0000", "#00FF00", "#0000FF",
      "#FFFF00", "#FF00FF", "#00FFFF", "#FFFFFF"
    ];

    // CPU 실행: 각 CPU가 독립적으로 레지스터 증가
    function runCPUs() {
      for (let i = 0; i < cpuCount; i++) {
        cpuRegisters[i] = (cpuRegisters[i] + (i+1)) & 0xFF; // CPU마다 다른 속도로 증가
      }
      alert("CPU 레지스터 값들: " + cpuRegisters.join(", "));
    }

    // 팔레트 기반 화면 출력
    function drawScene() {
      let ctx = document.getElementById("screen").getContext("2d");
      ctx.clearRect(0, 0, 256, 240);

      // 각 CPU 레지스터 값에 따라 다른 색상 블록 출력
      for (let i = 0; i < cpuCount; i++) {
        let colorIndex = cpuRegisters[i] % palette.length;
        ctx.fillStyle = palette[colorIndex];
        ctx.fillRect(50 * i + 20, 100, 40, 40);
      }
    }
  </script>
</body>
</html>
