<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>10대 8비트 CPU → 80비트 확장</title>
</head>
<body>
  <h2>가상 10대 8비트 CPU 시뮬레이션</h2>
  <button onclick="simulate()">실행</button>
  
  <h3>결과:</h3>
  <pre id="output"></pre>
  
  <script>
    function simulate() {
      const cpuCount = 10; // 10대 CPU
      const valueA = 0x1234567890ABCDEFn; // BigInt로 80비트 흉내
      const valueB = 0x00000000000000FFn;

      // CPU 배열 (각각 8비트만 처리 가능)
      let cpus = new Array(cpuCount).fill(0);

      let carry = 0n;
      let resultParts = [];

      for (let i = 0; i < cpuCount; i++) {
        let aPart = Number((valueA >> BigInt(i*8)) & 0xFFn);
        let bPart = Number((valueB >> BigInt(i*8)) & 0xFFn);
        let sum = aPart + bPart + Number(carry);
        carry = 0n;
        if (sum > 0xFF) {
          carry = 1n;
          sum &= 0xFF;
        }
        cpus[i] = sum;
        resultParts.push(sum);
      }

      // 최종 결과 합치기
      let result = 0n;
      for (let i = 0; i < cpuCount; i++) {
        result |= BigInt(cpus[i]) << BigInt(i*8);
      }

      document.getElementById("output").textContent =
        `CPU 개수: ${cpuCount}\n` +
        `각 CPU 8비트 결과: ${resultParts.join(", ")}\n` +
        `최종 80비트 결과: 0x${result.toString(16).toUpperCase()}`;
    }
  </script>
</body>
</html>
