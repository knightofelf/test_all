<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>N대 병렬 베지어 렌더</title>
</head>
<body>
  <h2>가상 병렬 베지어 렌더</h2>
  <canvas id="screen" width="400" height="400"></canvas><br>
  <label>CPU 개수(N): <input type="number" id="cpuCount" value="4"></label>
  <button onclick="render()">렌더 실행</button>

  <script>
    // 제어점 (BigInt 좌표)
    const points = [
      {x: 0n, y: 0n},
      {x: 100n, y: 300n},
      {x: 300n, y: 100n},
      {x: 400n, y: 400n}
    ];

    // 이항계수 (BigInt)
    function binomial(n, k) {
      let res = 1n;
      for (let i = 0; i < k; i++) {
        res = res * BigInt(n - i) / BigInt(i + 1);
      }
      return res;
    }

    // 베지어 계산 (정수 스케일링)
    function bezier(t, scale) {
      let n = points.length - 1;
      let x = 0n, y = 0n;
      for (let i = 0; i <= n; i++) {
        let coeff = binomial(n, i) *
                    BigInt((scale - t) ** (n - i)) *
                    BigInt(t ** i);
        x += coeff * points[i].x;
        y += coeff * points[i].y;
      }
      return {
        x: Number(x / BigInt(scale ** n)),
        y: Number(y / BigInt(scale ** n))
      };
    }

    // 병렬 렌더
    function render() {
      let ctx = document.getElementById("screen").getContext("2d");
      ctx.clearRect(0,0,400,400);
      ctx.strokeStyle = "lime";
      ctx.beginPath();

      let N = parseInt(document.getElementById("cpuCount").value);
      let scale = 100;
      let chunk = Math.floor(scale / N);

      for (let c = 0; c < N; c++) {
        let startT = c * chunk;
        let endT = (c === N-1) ? scale : (c+1)*chunk;
        ctx.moveTo(...Object.values(bezier(startT, scale)));
        for (let t = startT; t <= endT; t++) {
          let p = bezier(t, scale);
          ctx.lineTo(p.x, p.y);
        }
      }
      ctx.stroke();
    }
  </script>
</body>
</html>
