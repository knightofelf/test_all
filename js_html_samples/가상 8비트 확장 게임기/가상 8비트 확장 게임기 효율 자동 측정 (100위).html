<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가상 8비트 확장 게임기 효율 100위</title>
</head>
<body>
  <h2>가상 8비트 확장 게임기 효율 자동 측정 (100위)</h2>
  <button onclick="measureEfficiency()">측정 시작</button>
  
  <h3>결과 순위 (상위 100):</h3>
  <pre id="output"></pre>
  
  <script>
    function runWorkload(cpuCount, workload) {
      let chunk = Math.floor(workload / cpuCount);
      let parResult = 0;
      for (let c = 0; c < cpuCount; c++) {
        let local = 0;
        for (let i = 0; i < chunk; i++) {
          local = (local + i) & 0xFF; // 8비트 연산
        }
        parResult ^= local;
      }
      return parResult;
    }

    function measureEfficiency() {
      let cpuOptions = [1,2,4,8,16,32]; // CPU 갯수 다양화
      let workloadOptions = [];
      for (let w = 100000; w <= 5000000; w += 100000) {
        workloadOptions.push(w); // 10만 ~ 500만까지 자동 생성
      }

      let results = [];

      for (let cpu of cpuOptions) {
        for (let work of workloadOptions) {
          let start = performance.now();
          runWorkload(cpu, work);
          let end = performance.now();
          let time = end - start;
          results.push({cpu, work, time});
        }
      }

      // 시간 기준 정렬
      results.sort((a, b) => a.time - b.time);

      // 상위 100 출력
      let text = "";
      results.slice(0, 100).forEach((r, idx) => {
        text += `${idx+1}위: CPU ${r.cpu}대, 연산 ${r.work}회 → ${r.time.toFixed(2)} ms\n`;
      });
      document.getElementById("output").textContent = text;
    }
  </script>
</body>
</html>
