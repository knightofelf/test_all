<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>숫자 분할 출력</title>
  <style>
    body { font-family: monospace; white-space: pre; }
  </style>
</head>
<body>
<script>
function splitNumber(N, k=2, steps=10) {
  let output = "";
  for (let i = 0; i < steps; i++) {
    let line = "";
    for (let j = 0; j < Math.pow(k, i); j++) {
      let q = Math.floor(N / k);
      let r = N % k;
      if (r === 0) {
        line += q.toString();
      } else {
        let frac = r / k;
        line += `${q}(+${frac.toFixed(3)}) ${q+1}(-${(1-frac).toFixed(3)})`;
      }
      line += " ".repeat(k); // 간격
    }
    output += line + "\n";
    // 화면에 바로 출력 (메모리 절약)
    document.body.textContent += line + "\n";
  }
  return output;
}

// 실행 예시
let result = splitNumber(4359873, 2, 12);

// 파일 저장 버튼
function downloadFile(content, filename) {
  const blob = new Blob([content], {type: "text/plain"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

const btn = document.createElement("button");
btn.textContent = "결과 파일 저장";
btn.onclick = () => downloadFile(result, "output.txt");
document.body.appendChild(document.createElement("br"));
document.body.appendChild(btn);
</script>
</body>
</html>
