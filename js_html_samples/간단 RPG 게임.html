<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>간단 RPG 게임</title>
  <style>
    body { font-family: Arial, sans-serif; background: #222; color: #eee; padding: 20px; }
    #log { border: 1px solid #555; padding: 10px; height: 200px; overflow-y: auto; background: #111; }
    button { margin: 5px; padding: 10px; }
  </style>
</head>
<body>
  <h2>⚔️ 간단 RPG 게임</h2>
  <div id="stats">
    <p>플레이어 HP: <span id="playerHP">100</span></p>
    <p>몬스터 HP: <span id="monsterHP">50</span></p>
  </div>

  <div>
    <button onclick="attack()">공격하기</button>
    <button onclick="heal()">회복하기</button>
  </div>

  <div id="log"></div>

  <script>
    let playerHP = 100;
    let monsterHP = 50;

    function logMessage(msg) {
      const log = document.getElementById("log");
      log.innerHTML += msg + "<br>";
      log.scrollTop = log.scrollHeight;
    }

    function updateStats() {
      document.getElementById("playerHP").textContent = playerHP;
      document.getElementById("monsterHP").textContent = monsterHP;
    }

    function attack() {
      const damage = Math.floor(Math.random() * 15) + 5;
      monsterHP -= damage;
      logMessage("👊 플레이어가 몬스터에게 " + damage + " 피해를 입혔다!");

      if (monsterHP <= 0) {
        logMessage("🎉 몬스터를 물리쳤다!");
        monsterHP = 0;
      } else {
        monsterAttack();
      }
      updateStats();
    }

    function heal() {
      const healAmount = Math.floor(Math.random() * 10) + 5;
      playerHP += healAmount;
      logMessage("💖 플레이어가 " + healAmount + " 만큼 회복했다!");
      monsterAttack();
      updateStats();
    }

    function monsterAttack() {
      const damage = Math.floor(Math.random() * 10) + 3;
      playerHP -= damage;
      logMessage("👹 몬스터가 플레이어에게 " + damage + " 피해를 입혔다!");

      if (playerHP <= 0) {
        logMessage("☠️ 플레이어가 쓰러졌다...");
        playerHP = 0;
      }
    }

    updateStats();
  </script>
</body>
</html>
