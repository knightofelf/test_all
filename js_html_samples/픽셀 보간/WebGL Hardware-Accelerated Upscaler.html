<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CPU-Based Pure JS Bicubic Upscaler</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .canvas-container { position: relative; border: 2px dashed #555; background: #1a1a1a; cursor: pointer; width: 600px; height: 600px; }
        canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        .drop-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; font-weight: bold; pointer-events: none; text-align: center; }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; background: #333; color: white; border-radius: 4px; }
        button.active { background: #007acc; }
    </style>
</head>
<body>

    <h2>CPU 픽셀 보간 업스케일러 (호환성 100% 모드)</h2>
    <div style="margin-bottom: 15px;">
        <input type="file" id="fileInput" accept="image/*">
    </div>
    
    <div class="canvas-container" id="dropZone">
        <div class="drop-text" id="dropText">이미지 파일을 드래그하거나<br>위의 버튼으로 파일을 선택하세요.</div>
        <canvas id="mainCanvas" width="600" height="600"></canvas>
    </div>
    
    <div class="controls">
        <button id="btnNearest" onclick="setFilter('NEAREST')">Nearest (도트)</button>
        <button id="btnBilinear" onclick="setFilter('BILINEAR')" class="active">Bilinear (기본 선형)</button>
        <button id="btnBicubic" onclick="setFilter('BICUBIC')">Bicubic (수학 직접 연산)</button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let originalImage = null;
        let currentMode = 'BILINEAR';

        // --- ⚙️ CPU 기반 수학적 보간 커널 알고리즘 ---
        function 후방_삼차_가중치(x) {
            const absX = Math.abs(x);
            if (absX <= 1) return 1.5 * Math.pow(absX, 3) - 2.5 * Math.pow(absX, 2) + 1;
            if (absX < 2) return -0.5 * Math.pow(absX, 3) + 2.5 * Math.pow(absX, 2) - 4 * absX + 2;
            return 0;
        }

        function cpuBicubicProcess(img) {
            // 원본 이미지 가로세로 픽셀 추출을 위한 임시 캔버스 생성
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            tempCtx.drawImage(img, 0, 0);
            
            const srcData = tempCtx.getImageData(0, 0, img.width, img.height).data;
            const dstData = ctx.createImageData(canvas.width, canvas.height);

            const xRatio = img.width / canvas.width;
            const yRatio = img.height / canvas.height;

            // 출력용 600x600 해상도 루프 순회 연산
            for (let dstY = 0; dstY < canvas.height; dstY++) {
                for (let dstX = 0; dstX < canvas.width; dstX++) {
                    
                    const srcX = dstX * xRatio;
                    const srcY = dstY * yRatio;
                    
                    const xIdx = Math.floor(srcX);
                    const yIdx = Math.floor(srcY);
                    
                    const xDiff = srcX - xIdx;
                    const yDiff = srcY - yIdx;

                    let r = 0, g = 0, b = 0, a = 0;

                    // 주변 4x4 (16개) 픽셀 가중치 계산 내부 루프
                    for (let m = -1; m <= 2; m++) {
                        const yWeight = 후방_삼차_가중치(yDiff - m);
                        const clampedY = Math.min(Math.max(yIdx + m, 0), img.height - 1);
                        
                        for (let n = -1; n <= 2; n++) {
                            const xWeight = 후방_삼차_가중치(xDiff - n);
                            const clampedX = Math.min(Math.max(xIdx + n, 0), img.width - 1);
                            
                            const srcOffset = (clampedY * img.width + clampedX) * 4;
                            const totalWeight = xWeight * yWeight;

                            r += srcData[srcOffset] * totalWeight;
                            g += srcData[srcOffset + 1] * totalWeight;
                            b += srcData[srcOffset + 2] * totalWeight;
                            a += srcData[srcOffset + 3] * totalWeight;
                        }
                    }

                    const dstOffset = (dstY * canvas.width + dstX) * 4;
                    dstData.data[dstOffset] = Math.min(Math.max(r, 0), 255);
                    dstData.data[dstOffset + 1] = Math.min(Math.max(g, 0), 255);
                    dstData.data[dstOffset + 2] = Math.min(Math.max(b, 0), 255);
                    dstData.data[dstOffset + 3] = Math.min(Math.max(a, 0), 255);
                }
            }
            ctx.putImageData(dstData, 0, 0);
        }

        // --- 🎨 렌더링 제어 및 브라우저 자체 내장 필터 분기 ---
        function render() {
            if (!originalImage) return;
            document.getElementById('dropText').style.display = 'none';

            // 캔버스 잔상 클리어
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentMode === 'NEAREST') {
                ctx.imageSmoothingEnabled = false; // 브라우저 스무딩 끄기 -> Nearest Neighbor 작동
                ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            } 
            else if (currentMode === 'BILINEAR') {
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'low'; // 브라우저 내장 선형 보간 엔진 가동
                ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            } 
            else if (currentMode === 'BICUBIC') {
                // 연산량이 많으므로 "계산 중..." 텍스트 노출 후 비동기 연산
                document.getElementById('dropText').style.display = 'block';
                document.getElementById('dropText').innerText = 'Bicubic 픽셀 연산 중...';
                
                setTimeout(() => {
                    cpuBicubicProcess(originalImage);
                    document.getElementById('dropText').style.display = 'none';
                }, 50);
            }
        }

        // --- 📂 파일 입력 파이프라인 ---
        function handleFile(file) {
            if (!file || !file.type.match('image.*')) return;
            
            const img = new Image();
            img.onload = function() {
                originalImage = img;
                render();
            };
            img.src = URL.createObjectURL(file);
        }

        document.getElementById('fileInput').addEventListener('change', (e) => handleFile(e.target.files[0]));

        const dropZone = document.getElementById('dropZone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#007acc'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#555'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#555';
            if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
        });

        function setFilter(mode) {
            currentMode = mode;
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            if(mode === 'NEAREST') document.getElementById('btnNearest').classList.add('active');
            if(mode === 'BILINEAR') document.getElementById('btnBilinear').classList.add('active');
            if(mode === 'BICUBIC') document.getElementById('btnBicubic').classList.add('active');
            render();
        }
    </script>
</body>
</html>
