<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>JS 비교 출력</title>
</head>
<body>
  <div id="result1"></div>
  <div id="result2"></div>

  <script>
    // 첫 번째 비교: ==
    if (1.1 + 0.1 == 1.2) {
      document.getElementById("result1").innerText = "1.1 + 0.1 == 1.2 → true";
    } else {
      document.getElementById("result1").innerText = "1.1 + 0.1 == 1.2 → false";
    }

    // 두 번째 비교: >
    if (1.1 + 0.1 > 1.2) {
      document.getElementById("result2").innerText = "1.1 + 0.1 > 1.2 → true";
    } else {
      document.getElementById("result2").innerText = "1.1 + 0.1 > 1.2 → false";
    }
  </script>
</body>
</html>
