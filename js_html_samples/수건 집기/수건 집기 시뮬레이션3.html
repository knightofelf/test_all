<!DOCTYPE html>
<html>
<head>
  <title>수건 집기 시뮬레이션</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
<canvas id="world"></canvas>
<script>
const { Engine, Render, World, Bodies, Constraint, Mouse, MouseConstraint } = Matter;

const engine = Engine.create();
const canvas = document.getElementById("world");
const render = Render.create({
  canvas: canvas,
  engine: engine,
  options: { width: 600, height: 400, wireframes: false, background: "#f0f0f0" }
});

// 수건을 격자로 생성
let cloth = [];
let cols = 10, rows = 6, spacing = 40;
for (let y = 0; y < rows; y++) {
  for (let x = 0; x < cols; x++) {
    let particle = Bodies.circle(100 + x*spacing, 50 + y*spacing, 5, { isStatic: false });
    cloth.push(particle);
    World.add(engine.world, particle);

    // 왼쪽 연결
    if (x > 0) {
      let left = cloth[y*cols + (x-1)];
      World.add(engine.world, Constraint.create({ bodyA: particle, bodyB: left, length: spacing, stiffness: 0.9 }));
    }
    // 위쪽 연결
    if (y > 0) {
      let up = cloth[(y-1)*cols + x];
      World.add(engine.world, Constraint.create({ bodyA: particle, bodyB: up, length: spacing, stiffness: 0.9 }));
    }
    // 맨 위 줄은 고정 (수건 걸려있는 느낌)
    if (y === 0) particle.isStatic = true;
  }
}

// 마우스로 잡기
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, { mouse: mouse });
World.add(engine.world, mouseConstraint);

Engine.run(engine);
Render.run(render);
</script>
</body>
</html>
