<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>플라즈마 시뮬레이션</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="plasma"></canvas>
  <script>
    const canvas = document.getElementById("plasma");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function drawPlasma() {
      const imageData = ctx.createImageData(canvas.width, canvas.height);
      const time = Date.now() * 0.002;

      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const idx = (y * canvas.width + x) * 4;
          // 플라즈마 수학 공식 (간단한 파동 합성)
          const value = Math.sin(x / 40 + time) +
                        Math.sin(y / 30 + time) +
                        Math.sin((x + y) / 50 + time);

          const color = Math.floor((value + 3) * 42); // 0~255 범위
          imageData.data[idx] = color;     // R
          imageData.data[idx + 1] = color; // G
          imageData.data[idx + 2] = 255;   // B
          imageData.data[idx + 3] = 255;   // Alpha
        }
      }
      ctx.putImageData(imageData, 0, 0);
      requestAnimationFrame(drawPlasma);
    }

    drawPlasma();
  </script>
</body>
</html>
