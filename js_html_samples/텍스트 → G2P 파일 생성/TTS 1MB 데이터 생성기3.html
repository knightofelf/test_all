<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1MB 원문 텍스트 G2P 변환기 (복원 가능 구조)</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background-color: #f5f5f5; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 150px; margin: 10px 0; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; color: white; border: none; padding: 12px; font-size: 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-sample { background-color: #6c757d; }
        .btn-sample:hover { background-color: #5a6268; }
        .btn-convert { background-color: #007bff; }
        .btn-convert:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; color: #28a745; }
        .info { font-size: 13px; color: #666; margin-top: 20px; text-align: left; background: #eee; padding: 12px; border-radius: 5px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>1MB 텍스트 기반 G2P 고속 변환기</h2>
    <p>텍스트를 입력하거나 파일(약 1MB)을 붙여넣은 뒤 변환하세요.<br><strong>word2ph.json</strong>에 원문이 보존되어 추후 복원이 가능합니다.</p>
    
    <textarea id="inputText" placeholder="여기에 대량의 한국어 텍스트를 입력하거나 파일을 붙여넣으세요..."></textarea>
    
    <div class="btn-group">
        <button class="btn-sample" onclick="loadSampleData()">테스트용 1MB 더미데이터 채우기</button>
        <button class="btn-convert" onclick="processG2P()">G2P 변환 및 3개 파일 다운로드</button>
    </div>
    
    <div id="status"></div>

    <div class="info">
        <strong>💡 데이터 보존 및 복원 안내:</strong>
        <ul>
            <li><strong>phone.txt</strong>: 자소 분리된 발음열 데이터 (공백 구분)</li>
            <li><strong>tone.txt</strong>: 악센트/성조를 모사한 더미 바이너리 피치 데이터</li>
            <li><strong>word2ph.json</strong>: <span style="color:#d9534f; font-weight:bold;">{"text": "원문", "word2ph": [...]}</span> 형태로 원문을 포함하여 완전 복원 가능</li>
        </ul>
    </div>
</div>

<script>
// 테스트 편의를 위해 정확히 1MB(1,048,576 바이트) 규격의 한국어 문장을 채워주는 함수
function loadSampleData() {
    const statusDiv = document.getElementById('status');
    statusDiv.style.color = '#6c757d';
    statusDiv.innerText = "1MB 샘플 텍스트 생성 중...";
    
    setTimeout(() => {
        const baseSentence = "대한민국의 주권은 국민에게 있고 모든 권력은 국민으로부터 나온다. ";
        let generatedText = "";
        
        // UTF-8 기준 한국어 한 글자는 대략 3바이트 연산 처리
        // 1MB 크기에 근접할 때까지 베이스 문장을 무한 복사배치
        while (new Blob([generatedText]).size < 1024 * 1024) {
            generatedText += baseSentence;
        }
        
        document.getElementById('inputText').value = generatedText;
        statusDiv.innerText = "1MB 샘플 데이터 로드 완료! (실제 바이트: " + new Blob([generatedText]).size + " bytes)";
    }, 50);
}

// 한글 한 글자를 초성/중성/종성 음소로 분리하는 고속 오프셋 알고리즘
function tokenizeKorean(char) {
    const code = char.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return [char]; // 한글이 아니면 그대로 반환

    const cho = [ "ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ" ];
    const jung = [ "ㅏ", "ㅐ", "ㅑ", "ㅒ", "ㅓ", "ㅔ", "ㅕ", "ㅖ", "ㅗ", "ㅘ", "ㅙ", "ㅚ", "ㅛ", "ㅜ", "ㅝ", "ㅞ", "ㅟ", "ㅠ", "ㅡ", "ㅢ", "ㅣ" ];
    const jong = [ "", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ" ];

    const choIdx = Math.floor(code / 588);
    const jungIdx = Math.floor((code % 588) / 28);
    const jongIdx = code % 28;

    let result = [cho[choIdx], jung[jungIdx]];
    if (jong[jongIdx] !== "") {
        result.push(jong[jongIdx]);
    }
    return result;
}

function triggerDownload(content, fileName, contentType) {
    const blob = new Blob([content], { type: contentType });
    const element = document.createElement('a');
    element.href = URL.createObjectURL(blob);
    element.download = fileName;
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
}

function processG2P() {
    const text = document.getElementById('inputText').value.trim();
    const statusDiv = document.getElementById('status');
    
    if (!text) {
        alert("텍스트를 입력하거나 샘플 데이터를 먼저 생성해 주세요.");
        return;
    }

    statusDiv.style.color = '#007bff';
    statusDiv.innerText = "초고속 G2P 변환 및 매핑 데이터 연산 중...";

    // 공백(띄어쓰기) 기준으로 단어 쪼개기
    const words = text.split(/\s+/);
    
    let phoneLines = [];
    let toneLines = [];
    let word2phArray = [];

    // 대용량 처리를 위해 최적화된 단일 단어 루프 구동 (압축 프로세스 제외로 인한 노렉 방식)
    words.forEach((word) => {
        if (!word) return;

        let wordPhones = [];
        let word2phSegments = [];

        // 단어 내부의 글자 단위 분리
        for (let i = 0; i < word.length; i++) {
            const charPhones = tokenizeKorean(word[i]);
            wordPhones = wordPhones.concat(charPhones);
            word2phSegments.push(charPhones.length); // 각 글자별 음소 개수 저장
        }

        if (wordPhones.length === 0) return;

        // phone 구조: 음소 사이 공백 구분
        phoneLines.push(wordPhones.join(" "));
        
        // tone 구조: 음소 개수만큼 0 고정 (표준 평조값 빌드)
        toneLines.push(Array(wordPhones.length).fill(0).join(" "));
        
        // word2ph 구조: ★ text 필드에 원문을 그대로 주입하여 나중에 100% 역복원 가능하도록 설계 ★
        word2phArray.push({
            "text": word,
            "word2ph": word2phSegments
        });
    });

    // 텍스트 파이프라인 출력 및 파일 즉시 생성
    const finalPhoneText = phoneLines.join("\n");
    const finalToneText = toneLines.join("\n");
    const finalJsonText = JSON.stringify(word2phArray);

    triggerDownload(finalPhoneText, "phone.txt", "text/plain;charset=utf-8");
    triggerDownload(finalToneText, "tone.txt", "text/plain;charset=utf-8");
    triggerDownload(finalJsonText, "word2ph.json", "application/json;charset=utf-8");

    statusDiv.style.color = '#28a745';
    statusDiv.innerText = "변환 완료! 3개 파일이 브라우저에서 각각 즉시 다운로드되었습니다.";
}
</script>

</body>
</html>
