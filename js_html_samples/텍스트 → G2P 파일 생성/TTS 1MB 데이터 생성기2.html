<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS 고속 데이터 생성기</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background-color: #f5f5f5; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background-color: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background-color: #218838; }
        #status { margin-top: 15px; font-weight: bold; color: #007bff; }
        .info { font-size: 13px; color: #666; margin-top: 20px; text-align: left; background: #eee; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>초고속 TTS 데이터 생성기</h2>
    <p>압축 과정 없이 브라우저 렉 없이 즉시 실행됩니다.<br>클릭 시 3개 파일이 개별 다운로드됩니다.</p>
    <button onclick="generateFast()">1MB 데이터 즉시 생성 및 다운로드</button>
    <div id="status"></div>

    <div class="info">
        <strong>최적화 내역:</strong>
        <ul>
            <li>무거운 외부 ZIP 라이브러리 제거</li>
            <li>실시간 크기 체크용 중복 루프 삭제</li>
            <li>블로킹 없는 즉각적인 3개 파일 동시 다운로드</li>
        </ul>
    </div>
</div>

<script>
function triggerDownload(content, fileName, contentType) {
    const blob = new Blob([content], { type: contentType });
    const element = document.createElement('a');
    element.href = URL.createObjectURL(blob);
    element.download = fileName;
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
}

function generateFast() {
    const statusDiv = document.getElementById('status');
    statusDiv.innerText = "생성 중...";

    const phones = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ', 'ㅏ', 'ㅑ', 'ㅓ', 'ㅕ', 'ㅗ', 'ㅛ', 'ㅜ', 'ㅠ', 'ㅡ', 'ㅣ', 'æ', 'p', 'l', 'k', 't', 's'];
    
    let phoneLines = [];
    let toneLines = [];
    let word2phArray = [];
    
    // 대략적인 1MB 크기를 맞추기 위한 고속 고정 루프 횟수 산정 (약 6000줄 반복 시 1MB 도달)
    const totalLines = 6200; 

    for (let index = 0; index < totalLines; index++) {
        const w1Len = Math.floor(Math.random() * 3) + 2; 
        const w2Len = Math.floor(Math.random() * 3) + 2; 
        
        let p1 = Array.from({length: w1Len}, () => phones[Math.floor(Math.random() * phones.length)]);
        let p2 = Array.from({length: w2Len}, () => phones[Math.floor(Math.random() * phones.length)]);
        
        let t1 = Array.from({length: w1Len}, () => Math.floor(Math.random() * 2));
        let t2 = Array.from({length: w2Len}, () => Math.floor(Math.random() * 2));
        
        phoneLines.push(p1.concat(p2).join(" "));
        toneLines.push(t1.concat(t2).join(" "));
        word2phArray.push({ "text": `word_${index}`, "word2ph": [w1Len, w2Len] });
    }

    // 파일별 텍스트 변환 및 다운로드 실행
    const finalPhoneText = phoneLines.join("\n");
    const finalToneText = toneLines.join("\n");
    const finalJsonText = JSON.stringify(word2phArray);

    triggerDownload(finalPhoneText, "phone.txt", "text/plain;charset=utf-8");
    triggerDownload(finalToneText, "tone.txt", "text/plain;charset=utf-8");
    triggerDownload(finalJsonText, "word2ph.json", "application/json;charset=utf-8");
    
    statusDiv.innerText = "3개 파일 개별 다운로드 완료!";
}
</script>

</body>
</html>
