<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>1MB 랜덤 데이터 → 3개의 G2P 파일</title>
</head>
<body>
  <h2>1MB 랜덤 데이터 → phone/tone/word2ph 형식</h2>
  <button id="generateBtn">파일 생성</button>

  <script>
    // 랜덤 텍스트 생성
    function generateRandomText(size) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let result = "";
      for (let i = 0; i < size; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // 의사 G2P 변환
    function pseudoG2P(line) {
      const phones = line.split("").join(" ");
      const tones = line.split("").map(() => Math.round(Math.random())).join(" ");
      const word2ph = line.split("").map(() => "1").join(" ");
      return `word: ${line}\tphone: ${phones}\ttone: ${tones}\tword2ph: ${word2ph}`;
    }

    // 파일 다운로드
    function downloadFile(content, filename) {
      const blob = new Blob([content], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    // 3개 파일 생성
    function generateFiles() {
      const totalSize = 1024 * 1024; // 1MB
      const groupSize = Math.floor(totalSize / 3); // 3등분
      const randomText = generateRandomText(totalSize);

      for (let g = 0; g < 3; g++) {
        const chunk = randomText.slice(g * groupSize, (g + 1) * groupSize);
        let output = "";
        const lineLength = 100; // 줄 단위
        for (let i = 0; i < chunk.length; i += lineLength) {
          const line = chunk.slice(i, i + lineLength);
          output += pseudoG2P(line) + "\n";
        }
        downloadFile(output, `group${g + 1}.g2p`);
      }
    }

    document.getElementById("generateBtn").addEventListener("click", generateFiles);
  </script>
</body>
</html>
