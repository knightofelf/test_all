<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Original vs Mirror Single Points</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h3>원본과 대칭을 하나의 숫자로 비교 (점 2개)</h3>
<canvas id="chart" width="600" height="400"></canvas>

<script>
const size = 16;
let data = [];

// 랜덤 32바이트 생성
for (let i = 0; i < size*2; i++) {
  data.push(Math.floor(Math.random() * 256));
}

// 원본 큰 수
let originalHex = data.map(b => b.toString(16).padStart(2,"0")).join("");
let originalBig = BigInt("0x" + originalHex);

// 대칭 큰 수
let mirrorHex = data.slice().reverse().map(b => b.toString(16).padStart(2,"0")).join("");
let mirrorBig = BigInt("0x" + mirrorHex);

// 차이
let diff = originalBig - mirrorBig;

// 좌표 데이터: 점 2개만 표시 (원본, 대칭)
let points = [
  {x: 0, y: Number(originalBig % BigInt(1000000))}, // mod로 줄여서 표시
  {x: 1, y: Number(mirrorBig % BigInt(1000000))}
];

// Chart.js로 scatter 그래프
const ctx = document.getElementById("chart").getContext("2d");
new Chart(ctx, {
  type: 'scatter',
  data: {
    datasets: [{
      label: 'Original vs Mirror (mod 1,000,000)',
      data: points,
      backgroundColor: ['blue','red']
    }]
  },
  options: {
    responsive: false,
    scales: {
      x: {
        type: 'linear',
        position: 'bottom',
        title: {display: true, text: 'Index (0=Original, 1=Mirror)'},
        ticks: {stepSize: 1}
      },
      y: {
        title: {display: true, text: 'Value'}
      }
    }
  }
});

// 콘솔에 실제 큰 수 출력
console.log("Original Big:", originalBig.toString());
console.log("Mirror Big:", mirrorBig.toString());
console.log("Difference Big:", diff.toString());
</script>
</body>
</html>
