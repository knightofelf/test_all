<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>1MB Random Data Difference Export</title>
</head>
<body>
<h3>1MB 랜덤 데이터 평균 위치 차이값 파일 저장</h3>
<button id="saveBtn">파일 저장하기</button>

<script>
const dataSize = 1024 * 1024; // 1MB = 1,048,576 bytes
let data = new Uint8Array(dataSize);

// 랜덤 데이터 생성
for (let i = 0; i < dataSize; i++) {
  data[i] = Math.floor(Math.random() * 256);
}

// 평균 위치 (중앙값)
const avgPos = dataSize / 2;

// 버튼 클릭 시 파일 저장
document.getElementById("saveBtn").addEventListener("click", () => {
  let lines = [];
  // CSV 헤더
  lines.push("Index,Value,DifferenceFromAvgPos");
  
  for (let i = 0; i < dataSize; i++) {
    let diff = i - avgPos;
    lines.push(`${i},${data[i]},${diff}`);
  }

  // 문자열로 합치기
  let content = lines.join("\n");

  // Blob 생성 후 다운로드
  let blob = new Blob([content], {type: "text/csv"});
  let url = URL.createObjectURL(blob);

  let a = document.createElement("a");
  a.href = url;
  a.download = "random_data_diff.csv";
  a.click();

  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
