<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Byte Array Difference</title>
</head>
<body>
<script>
const size = 16;
let data = [];

// 랜덤 16x16 바이트 배열 생성 (32바이트)
for (let i = 0; i < size*2; i++) {
  data.push(Math.floor(Math.random() * 256));
}

// 원본을 하나의 큰 숫자로
let originalHex = data.map(b => b.toString(16).padStart(2,"0")).join("");
let originalBig = BigInt("0x" + originalHex);

// 대칭 배열 (바이트 순서 뒤집기)
let mirrorHex = data.slice().reverse().map(b => b.toString(16).padStart(2,"0")).join("");
let mirrorBig = BigInt("0x" + mirrorHex);

// 차이 계산
let diff = originalBig - mirrorBig;

console.log("Original:", originalBig.toString());
console.log("Mirror:", mirrorBig.toString());
console.log("Difference:", diff.toString());
</script>
</body>
</html>
