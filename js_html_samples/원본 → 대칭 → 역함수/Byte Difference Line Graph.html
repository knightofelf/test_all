<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Byte Difference Line Graph</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h3>원본 vs 대칭 차이 라인 그래프</h3>
<canvas id="chart" width="600" height="400"></canvas>

<script>
const size = 16;
let data = [];

// 랜덤 32바이트 생성
for (let i = 0; i < size*2; i++) {
  data.push(Math.floor(Math.random() * 256));
}

// 좌표 데이터 만들기 (각 바이트 차이를 점으로 표시)
let points = data.map((val, idx) => {
  let mirrorVal = data[data.length - 1 - idx];
  return {x: idx, y: val - mirrorVal};
});

// Chart.js로 라인 그래프 그리기
const ctx = document.getElementById("chart").getContext("2d");
new Chart(ctx, {
  type: 'line',
  data: {
    datasets: [{
      label: 'Byte Difference',
      data: points,
      borderColor: 'blue',
      backgroundColor: 'lightblue',
      fill: false,
      tension: 0.3, // 곡선 부드럽게
      pointRadius: 4, // 점 크기
      pointBackgroundColor: 'red'
    }]
  },
  options: {
    responsive: false,
    scales: {
      x: {
        type: 'linear',
        position: 'bottom',
        title: {display: true, text: 'Byte Index'}
      },
      y: {
        title: {display: true, text: 'Difference (Original - Mirror)'}
      }
    }
  }
});
</script>
</body>
</html>
