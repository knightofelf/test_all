<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>((x+1)/(x-1))^x 극한 시각화</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #0f172a; margin-bottom: 5px; }
        p { color: #475569; margin-top: 0; margin-bottom: 25px; font-size: 14px; }
        .canvas-container {
            background-color: white;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border-radius: 12px;
            padding: 24px;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <h2>f(x) = ((x+1)/(x-1))<sup>x</sup> 극한 공식 구현</h2>
    <p>x가 양의 무한대와 음의 무한대로 갈 때, 모두 수평 점근선 y = e² (≈ 7.389)에 수렴하는 구조</p>

    <div class="canvas-container">
        <canvas id="limitCanvas" width="850" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('limitCanvas');
        const ctx = canvas.getContext('2d');

        // 여백 설정 (점근선 라벨 공간 확보)
        const padding = { top: 60, right: 160, bottom: 60, left: 60 };
        const graphWidth = canvas.width - padding.left - padding.right;
        const graphHeight = canvas.height - padding.top - padding.bottom;

        // 양수와 음수 영역을 모두 보기 위한 전체 x, y 좌표 범위 설정
        const minX = -20, maxX = 20;
        const minY = -2, maxY = 14;

        // 수학적 좌표 -> Canvas 픽셀 변환 함수
        function toPixelX(x) {
            return padding.left + ((x - minX) / (maxX - minX)) * graphWidth;
        }
        function toPixelY(y) {
            return padding.top + graphHeight - ((y - minY) / (maxY - minY)) * graphHeight;
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 배경 격자선 (Grid) 그리기
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            ctx.font = '11px sans-serif';
            ctx.fillStyle = '#94a3b8';

            for (let x = minX; x <= maxX; x += 5) {
                if (x === 0) continue;
                let px = toPixelX(x);
                ctx.beginPath(); ctx.moveTo(px, padding.top); ctx.lineTo(px, padding.top + graphHeight); ctx.stroke();
                ctx.fillText(x, px - 8, padding.top + graphHeight + 18);
            }
            for (let y = 0; y <= maxY; y += 2) {
                if (y === 0) continue;
                let py = toPixelY(y);
                ctx.beginPath(); ctx.moveTo(padding.left, py); ctx.lineTo(padding.left + graphWidth, py); ctx.stroke();
                ctx.fillText(y, padding.left - 22, py + 4);
            }

            // 2. 메인 기준 축 (X축, Y축 원점선)
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(padding.left, toPixelY(0)); ctx.lineTo(padding.left + graphWidth, toPixelY(0)); // X축
            ctx.moveTo(toPixelX(0), padding.top); ctx.lineTo(toPixelX(0), padding.top + graphHeight); // Y축
            ctx.stroke();

            // 3. 수평 점근선 (y = e²) 표시
            const eSquared = Math.E ** 2;
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 4]); // 점선 효과
            ctx.beginPath();
            ctx.moveTo(padding.left, toPixelY(eSquared));
            ctx.lineTo(padding.left + graphWidth, toPixelY(eSquared));
            ctx.stroke();
            ctx.setLineDash([]); // 점선 해제
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(`y = e² ≈ ${eSquared.toFixed(3)}`, padding.left + graphWidth + 10, toPixelY(eSquared) + 4);

            // 4. 수직 점근선 (x = 1 불연속 경계선)
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(toPixelX(1), padding.top);
            ctx.lineTo(toPixelX(1), padding.top + graphHeight);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#22c55e';
            ctx.fillText('x = 1', toPixelX(1) - 15, padding.top - 10);

            // 5. 함수 f(x) = ((x+1)/(x-1))^x 곡선 그리기
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 2.5;
            
            // x = 1 전후로 나누어 연산하여 끊김 현상 방지
            const segments = [
                { start: minX, end: 0.95 },
                { start: 1.05, end: maxX }
            ];

            segments.forEach(seg => {
                ctx.beginPath();
                let first = true;

                for (let px = toPixelX(seg.start); px <= toPixelX(seg.end); px++) {
                    let x = minX + ((px - padding.left) / graphWidth) * (maxX - minX);
                    
                    // 밑이 음수일 때 허수(NaN) 처리를 막기 위한 예외 처리 조건
                    if ((x + 1) / (x - 1) <= 0) continue; 
                    
                    let y = Math.pow((x + 1) / (x - 1), x);

                    if (isNaN(y) || !isFinite(y) || y > maxY || y < minY) continue;

                    let py = toPixelY(y);
                    if (first) {
                        ctx.moveTo(px, py);
                        first = false;
                    } else {
                        ctx.lineTo(px, py);
                    }
                }
                ctx.stroke();
            });

            // 우측 범례 및 방향 기호 추가
            ctx.fillStyle = '#2563eb';
            ctx.font = '13px sans-serif';
            ctx.fillText('■ f(x) = ((x+1)/(x-1))ˣ', padding.left + 20, padding.top + 30);
            ctx.fillStyle = '#64748b';
            ctx.fillText('x ➔', padding.left + graphWidth - 25, toPixelY(0) + 15);
        }

        drawGraph();
    </script>
</body>
</html>
