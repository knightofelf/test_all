<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>랜덤 1MB 파일 + 인덱스 파일 생성</title>
</head>
<body>
  <button id="downloadData">랜덤 1MB 데이터 파일</button>
  <button id="downloadIndex">인덱스 파일</button>

  <script>
    // 랜덤 데이터 생성 함수
    function generateRandomData(size) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      let result = "";
      for (let i = 0; i < size; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // 인덱스 데이터 생성 함수 (랜덤 1~4)
    function generateIndexData(count) {
      let result = "";
      for (let i = 0; i < count; i++) {
        result += (Math.floor(Math.random() * 4) + 1) + "\n";
      }
      return result;
    }

    // 1MB = 1024 * 1024 바이트
    const size = 1024 * 1024;
    const randomData = generateRandomData(size);
    const indexData = generateIndexData(392); // 예: F1~F98, 각 4개 인덱스 → 총 392개

    // 랜덤 데이터 파일 다운로드
    document.getElementById("downloadData").addEventListener("click", () => {
      const blob = new Blob([randomData], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "random_1MB_file.txt";
      link.click();
    });

    // 인덱스 파일 다운로드
    document.getElementById("downloadIndex").addEventListener("click", () => {
      const blob = new Blob([indexData], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "index_file.txt";
      link.click();
    });
  </script>
</body>
</html>
