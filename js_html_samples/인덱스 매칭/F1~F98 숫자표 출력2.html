<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>F1~F98 숫자표 출력</title>
</head>
<body>
  <pre id="output"></pre>

  <script>
    function generateNumberTable() {
      let result = "";
      for (let f = 1; f <= 98; f++) {
        result += `F${f}\n`;
        for (let row = 1; row <= 4; row++) {
          let line = [];
          for (let col = 1; col <= 4; col++) {
            // F번호를 11부터 시작 → 최소값 1111 보장
            let prefix = (10 + f).toString(); 
            let value = parseInt(`${prefix}${row}${col}`);
            if (value >= 1111 && value <= 4444) {
              line.push(value);
            }
          }
          result += line.join(" ") + "\n";
        }
        result += "\n";
      }
      return result;
    }

    document.getElementById("output").textContent = generateNumberTable();
  </script>
</body>
</html>
