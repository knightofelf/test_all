<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>F1~F98 인덱스 매칭</title>
</head>
<body>
  <button id="downloadIndex">F1~F98 인덱스 매칭 파일 다운로드</button>

  <script>
    // 인덱스 배열을 순서대로 들여쓰기 적용
    function formatIndexes(order) {
      let result = "";
      for (let i = 0; i < order.length; i++) {
        if (order[i] !== null) {
          result += " ".repeat(i * 6) + order[i] + "\n";
        } else {
          result += "\n"; // 공백 처리
        }
      }
      return result;
    }

    // F1~F98 전체 생성
    function generateIndexData() {
      let result = "";
      // 예시 패턴: 일부 값만 출력하거나 공백 포함
      const patterns = [
        [null, null, 3, null],      // F1
        [4, 2, null, null],         // F2
        [null, null, 2, 4],         // F3
        [1, 4, 2, 3],               // F4 (풀 출력)
        [4, 2, 1, 3],               // F5
        [2, 3, 4, 1],               // F6
        [3, 1, 4, 2]                // F7
      ];
      for (let f = 1; f <= 98; f++) {
        result += `F${f}\n`;
        let order = patterns[(f-1) % patterns.length]; // 패턴 반복
        result += formatIndexes(order) + "\n";
      }
      return result;
    }

    const indexData = generateIndexData();

    document.getElementById("downloadIndex").addEventListener("click", () => {
      const blob = new Blob([indexData], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "F1_F98_index_mapping.txt";
      link.click();
    });
  </script>
</body>
</html>
