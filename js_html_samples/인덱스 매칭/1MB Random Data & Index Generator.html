<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1MB Random Data & Index Generator</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 30px; background-color: #f4f6f9; }
        .card { background: white; padding: 25px; border-radius: 8px; border: 1px solid #dee2e6; max-width: 550px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        button { padding: 12px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background-color: #218838; }
        .info { font-size: 13px; color: #6c757d; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h2>1MB Random Data & Index Generator</h2>
        <p>더미 패딩 없이, 1111~4444 조건의 <strong>무작위 랜덤 행 데이터와 역추적 인덱스</strong>로만 가득 채운 정확히 1MB 규격의 파일을 생성합니다.</p>
        <button onclick="generate1MBRandomIndexFile()">💾 1MB 랜덤 인덱스 파일 다운로드</button>
        <div class="info">
            • 상단: F1 ~ F96 고유 인덱스 매핑 테이블<br>
            • 하단: 1MB 도달 시까지 실시간 생성된 랜덤 데이터 행 및 원본 추적 인덱스
        </div>
    </div>

    <script>
        // 4! 순열 연산 함수
        function getPermutations(arr) {
            let result = [];
            function permute(current, remaining) {
                if (remaining.length === 0) { result.push(current); return; }
                for (let i = 0; i < remaining.length; i++) {
                    permute([...current, remaining[i]], remaining.filter((_, idx) => idx !== i));
                }
            }
            permute([], arr);
            return result;
        }

        function generate1MBRandomIndexFile() {
            // 1. F1 ~ F96 마스터 맵 및 빠른 역추적용 딕셔너리 구축
            let rowLookupTable = {}; 
            let indexSection = "=== [PART 1] F1 ~ F96 원본 구조 인덱스 마스터 테이블 ===\n\n";
            let fIndex = 1;

            for (let i = 1; i <= 4; i++) {
                for (let j = 1; j <= 4; j++) {
                    let r1 = `${i}${j}11 ${i}${j}12 ${i}${j}13 ${i}${j}14`;
                    let r2 = `${i}${j}21 ${i}${j}22 ${i}${j}23 ${i}${j}24`;
                    let r3 = `${i}${j}31 ${i}${j}32 ${i}${j}33 ${i}${j}34`;
                    let r4 = `${i}${j}41 ${i}${j}42 ${i}${j}43 ${i}${j}44`;
                    
                    let baseRows = [r1, r2, r3, r4];
                    let allPermutations = getPermutations(baseRows);
                    
                    for (let k = 0; k < 6; k++) {
                        let selectedRows = allPermutations[k * 4]; 
                        let fName = `F${fIndex}`;
                        
                        indexSection += `[${fName}]\n`;
                        selectedRows.forEach((rowStr, lineIdx) => {
                            indexSection += `  Line_${lineIdx + 1} ➔ ${rowStr}\n`;
                            // 역추적용 사전에 등록
                            if (!rowLookupTable[rowStr]) rowLookupTable[rowStr] = [];
                            rowLookupTable[rowStr].push(`${fName}(L${lineIdx + 1})`);
                        });
                        indexSection += "\n";
                        fIndex++;
                    }
                }
            }

            // 2. 랜덤 데이터를 실시간 생성하며 1MB가 될 때까지 본문 채우기
            let dataSection = "=== [PART 2] 1MB 분량의 무작위 랜덤 데이터 & 인덱스 매칭 추적 ===\n\n";
            let allValidRows = Object.keys(rowLookupTable);
            
            const TARGET_SIZE = 1024 * 1024; // 정확히 1,048,576 바이트
            let encoder = new TextEncoder();
            
            // 초기 고정부 용량 계산
            let currentBytes = encoder.encode(indexSection + dataSection).length;
            let sampleCounter = 1;

            // 바이트 크기를 실시간 검사하며 대량의 무작위 매칭 데이터를 동적으로 생성
            while (currentBytes < TARGET_SIZE) {
                // 유효한 1111~4444 행 조합 중 무작위로 하나 추출
                let randomRow = allValidRows[Math.floor(Math.random() * allValidRows.length)];
                let matchedInfo = rowLookupTable[randomRow].join(" / ");
                
                // 파일에 기록할 한 줄의 문자열 구조 생성
                let lineToAdd = `[Data_${String(sampleCounter).padStart(5, '0')}] ${randomRow} ➔ 매칭:[${matchedInfo}]\n`;
                let lineBytes = encoder.encode(lineToAdd).length;

                // 다음 줄을 추가했을 때 1MB를 완벽히 맞추거나 넘지 않도록 정밀 제어
                if (currentBytes + lineBytes <= TARGET_SIZE) {
                    dataSection += lineToAdd;
                    currentBytes += lineBytes;
                    sampleCounter++;
                } else {
                    // 남은 아주 미세한 용량(바이트 단위)이 있다면 줄바꿈이나 공백 문자로 오차 보정
                    let finalDiff = TARGET_SIZE - currentBytes;
                    dataSection += "\n".repeat(finalDiff);
                    break;
                }
            }

            // 최종 결과물 병합
            const finalFileContent = indexSection + dataSection;

            // 파일 다운로드 실행
            const blob = new Blob([finalFileContent], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "random_data_index_1MB.txt");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
