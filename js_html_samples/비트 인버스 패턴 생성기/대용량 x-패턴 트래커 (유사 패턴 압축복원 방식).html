<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대용량 x-패턴 트래커 (유사 패턴 압축/복원 방식)</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 95%;
            max-width: 1400px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            width: 100%;
        }
        textarea {
            background-color: #222;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            font-size: 14px;
            font-family: inherit;
            width: 70%;
            height: 60px;
            resize: vertical;
            box-sizing: border-box;
        }
        .btn-group {
            width: 30%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        button {
            background-color: #222;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 8px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover {
            background-color: #00ff66;
            color: #121212;
        }
        pre {
            background-color: #1a1a1a;
            border: 1px dashed #00ff66;
            padding: 20px;
            overflow: auto;
            max-height: 500px;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre;
        }
        .summary-box {
            background-color: #1a1a1a;
            border: 1px solid #00ff66;
            padding: 15px;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>대용량 x-패턴 트래커 (유사 패턴 압축 및 복원 기술)</h2>
    
    <div class="controls">
        <textarea id="bitInput" placeholder="2진수 비트를 입력하세요."></textarea>
        <div class="btn-group">
            <button onclick="generateRandomBits(10000)">1만개 비트 무작위 생성</button>
            <button onclick="runCompressedPattern()">패턴 연산 & 압축</button>
            <button onclick="downloadCompressedFile()" style="background-color: #00ff66; color: #121212; font-weight: bold;">💾 압축 패턴 파일 저장 (.txt)</button>
        </div>
    </div>

    <div class="output-container">
        <!-- 렌더링 부하를 줄이기 위해 상위 100줄만 미리보기 형태로 제공 -->
        <h3>🔍 패턴 시각적 복원 미리보기 (상위 100줄만 렌더링)</h3>
        <pre id="output">연산 및 압축을 진행해주세요.</pre>
    </div>

    <div id="summary" class="summary-box">여기에 압축 통계 정보가 표시됩니다.</div>
</div>

<script>
// 압축 데이터 저장 전역 배열 (용량이 매우 작음)
let compressedPatternData = [];
let originalInputBit = "";

function generateRandomBits(count) {
    let res = "";
    for(let i=0; i<count; i++) {
        res += Math.random() > 0.5 ? "1" : "0";
    }
    document.getElementById('bitInput').value = res;
}

function runCompressedPattern() {
    const input = document.getElementById('bitInput').value.trim();
    if (!input) {
        alert("비트를 먼저 입력하거나 생성해주세요.");
        return;
    }
    
    let isValid = true;
    for(let i=0; i<input.length; i++) {
        if(input[i] !== '0' && input[i] !== '1') {
            isValid = false;
            break;
        }
    }
    if (!isValid) {
        alert("0과 1로 구성된 2진수만 입력 가능합니다.");
        return;
    }

    originalInputBit = input;
    document.getElementById('output').textContent = "유사 패턴 압축 분석 연산 중...";

    setTimeout(() => {
        compressedPatternData = []; // 초기화
        let bitTracker = input.split('');
        const len = bitTracker.length;

        let leftBoundary = 0;
        let rightBoundary = len - 1;
        let rowCount = 1;

        // [핵심 변경] 거대한 공백 문자열을 배열에 담지 않고 오직 x의 '위치값' 좌표만 숫자로 매핑해 압축
        while (leftBoundary <= rightBoundary) {
            let targetIdx = -1;
            for (let i = leftBoundary; i <= rightBoundary; i++) {
                if (bitTracker[i] === '1') {
                    targetIdx = i;
                    break;
                }
            }

            if (targetIdx === -1) break;

            let currentLeftX = targetIdx;
            let currentRightX = rightBoundary - (currentLeftX - leftBoundary);

            if (currentLeftX > currentRightX) break;

            // 내부 계산기만 반전 수행
            for (let i = currentLeftX; i <= currentRightX; i++) {
                bitTracker[i] = bitTracker[i] === '1' ? '0' : '1';
            }

            // [압축 기록] 좌측X좌표, 우측X좌표, 우측날개인덱스 정보만 숫자로 밀어넣음 (한 행당 단 몇 바이트)
            compressedPatternData.push({
                L: currentLeftX,
                R: currentRightX,
                W: rowCount
            });

            leftBoundary = currentLeftX + 1;
            rightBoundary = currentRightX - 1;
            rowCount++;
        }

        // --- 화면 복원 및 미리보기 렌더링 단계 ---
        // 1만 개를 전부 그리면 브라우저가 느려지므로, 압축 데이터를 기반으로 상위 100줄만 가볍게 실시간 복원해 줍니다.
        let previewLines = [];
        previewLines.push(`[Line 1 - 원본비트 데이터 생략]`);
        
        let maxPreview = Math.min(100, compressedPatternData.length);
        for(let i=0; i<maxPreview; i++) {
            let p = compressedPatternData[i];
            let visualLineArr = new Array(len).fill(' ');
            visualLineArr[p.L] = 'x';
            visualLineArr[p.R] = 'x';
            let wing = " ".repeat(p.W * 2) + "x" + " ".repeat(p.W * 4) + "x";
            previewLines.push(visualLineArr.join('') + wing);
        }
        if(compressedPatternData.length > 100) {
            previewLines.push(`\n... (이하 대용량 노이즈 스킵: 총 ${compressedPatternData.length}줄의 압축 데이터 연산 완료) ...`);
        }
        
        document.getElementById('output').textContent = previewLines.join('\n');

        // 압축률 계산 결과 출력
        let totalLines = compressedPatternData.length;
        let estimatedRawSize = (totalLines * len) / 1024 / 1024; // MB 단위 환산
        let compressedSize = (JSON.stringify(compressedPatternData).length) / 1024; // KB 단위 환산

        let summaryHTML = `
            <strong>📊 유사 패턴 좌표 압축 통계 정보</strong><br>
            <ul>
                <li><strong>총 패턴 생성 라인 수:</strong> ${totalLines} 줄</li>
                <li><strong>원본 아스키 복원 시 예상 파일 크기:</strong> <span style="color:#ff0055">${estimatedRawSize.toFixed(2)} MB</span></li>
                <li><strong>현재 유사 패턴 알고리즘 압축 크기:</strong> <span style="color:#00ff66">${compressedSize.toFixed(2)} KB</span></li>
                <li><strong>압축 효율성:</strong> 원본 대비 약 <strong style="color:#00ff66">${((compressedSize / (estimatedRawSize * 1024)) * 100).toFixed(4)}%</strong> 크기로 초경량화 완료!</li>
            </ul>
        `;
        document.getElementById('summary').innerHTML = summaryHTML;

    }, 50);
}

// [압축 데이터 파일 내보내기]
function downloadCompressedFile() {
    if (compressedPatternData.length === 0) {
        alert("압축 연산된 데이터가 없습니다.");
        return;
    }

    // 파일 내부에 확장/복원용 가이드 포맷 구조화
    let outputText = `=== BIT PATTERN TRACKER COMPRESSED FILE ===\n`;
    outputText += `ORIGINAL_BIT_LENGTH:${originalInputBit.length}\n`;
    outputText += `DATA_FORMAT:[ROW_NUMBER],[LEFT_X_COORD],[RIGHT_X_COORD],[WING_COUNT]\n`;
    outputText += `===========================================\n`;
    
    compressedPatternData.forEach((p, idx) => {
        outputText += `${idx + 2},${p.L},${p.R},${p.W}\n`;
    });

    const blob = new Blob([outputText], { type: 'text/plain;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `compressed_x_pattern_${compressedPatternData.length}_lines.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

window.onload = function() {
    document.getElementById('bitInput').value = "11011000011110011";
    runCompressedPattern();
};
</script>

</body>
</html>
