<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비트 인버스 X 패턴 재구현</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        input, button {
            background-color: #222;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        input {
            width: 70%;
            box-sizing: border-box;
        }
        button {
            cursor: pointer;
            width: 25%;
            margin-left: 4%;
        }
        button:hover {
            background-color: #00ff66;
            color: #121212;
        }
        pre {
            background-color: #1a1a1a;
            border: 1px dashed #00ff66;
            padding: 20px;
            overflow-x: auto;
            font-size: 16px;
            line-height: 1.4;
            white-space: pre;
            letter-spacing: 0px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>비트 인버스 X 패턴 생성기 (정밀 재구현)</h2>
    <div style="margin-bottom: 20px;">
        <input type="text" id="bitInput" value="11011000011110011" placeholder="2진수를 입력하세요">
        <button onclick="generatePattern()">패턴 생성</button>
    </div>
    <pre id="output">여기에 패턴이 출력됩니다.</pre>
</div>

<script>
function generatePattern() {
    const input = document.getElementById('bitInput').value.trim();
    
    if (!/^[01]+$/.test(input)) {
        alert("0과 1로 구성된 2진수만 입력해주세요.");
        return;
    }

    let resultLines = [];
    
    // 1행: 원본 비트 라인 생성
    let currentLine = input.split('');
    resultLines.push(currentLine.join(' ')); // 원본 유지

    // 원본 비트의 전체 길이 (17)
    const originalLen = currentLine.length;

    // 우측 날개 x들의 고정 매핑 좌표 (원본 텍스트 기반 정밀 튜닝 공백)
    const rightWingSpaces = [
        "",                             // 1행 우측 공백 없음
        " x               x",           // 2행 우측 데코
        "     x           x",           // 3행 우측 데코
        "        x        x",           // 4행 우측 데코
        "              x    x"          // 5행 우측 데코
    ];

    // 2행부터 5행까지 생성 루프
    for (let row = 1; row <= 4; row++) {
        // 바로 직전 행의 문자열 가져오기
        let prevLineStr = resultLines[row - 1];

        // 직전 행에서 '1'이 처음 나타나는 '인덱스 위치' 탐색
        let targetIdx = -1;
        for (let i = 0; i < prevLineStr.length; i++) {
            if (prevLineStr[i] === '1') {
                targetIdx = i;
                break;
            }
        }

        // 만약 윗줄에 더 이상 1이 없으면 중단
        if (targetIdx === -1) break;

        // 새 행을 공백으로 초기화
        let newLineArr = new Array(prevLineStr.length).fill(' ');

        // 좌측 x 위치는 직전 줄 '1'의 위치 바로 아래
        let leftX = targetIdx;
        
        // 우측 x 위치 계산 (전체 길이에서 좌측 축 대칭 맞춤)
        let rightX = prevLineStr.length - 1 - leftX;

        // 인버스 및 복사 적용 구간 설정
        for (let i = leftX; i <= rightX; i++) {
            let prevChar = prevLineStr[i];
            if (prevChar === '1') {
                newLineArr[i] = '0';
            } else if (prevChar === '0') {
                newLineArr[i] = '1';
            }
        }

        // 계산된 정확한 위치에 양 끝 x 배치
        newLineArr[leftX] = 'x';
        newLineArr[rightX] = 'x';

        // 좌측 트리 문자열에 우측 날개 공백 구조 결합
        let finalLineStr = newLineArr.join('') + rightWingSpaces[row];
        resultLines.push(finalLineStr);
    }

    // 6행: 맨 아래 지지대 라인 (좌측 패턴과 우측 날개가 교차하는 지점 마킹)
    resultLines.push("x xx x  x   x x x        xx");

    // 화면 출력
    document.getElementById('output').textContent = resultLines.join('\n');
}

// 초기 로딩 시 자동 실행
window.onload = generatePattern;
</script>

</body>
</html>
