<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>랜덤 비트 패턴 출력</title>
<style>
  body { font-family: monospace; background: #111; color: #0f0; }
  .line { white-space: pre; }
</style>
</head>
<body>
<h2>랜덤 비트 패턴 (1000줄)</h2>
<div id="output"></div>

<script>
const rMAX = 8; // 8바이트
const lines = 1000; // 출력 줄 수

function fn_rand_length_fixed() {
    let used = Array(rMAX).fill(0);
    let vv = [];
    let i = 0;
    while (i < rMAX) {
        let data = Math.floor(Math.random() * rMAX);
        if (!used[data]) {
            used[data] = 1;
            vv[i++] = data;
        }
    }
    return vv;
}

function byteToBits(byte) {
    return byte.toString(2).padStart(8, '0');
}

function generatePattern() {
    const out = document.getElementById("output");
    for (let l = 0; l < lines; l++) {
        let vv = fn_rand_length_fixed();
        // 8바이트를 랜덤하게 출력
        let bits = vv.map(v => byteToBits(v)).join(" ");
        let div = document.createElement("div");
        div.className = "line";
        div.textContent = bits;
        out.appendChild(div);
    }
}

generatePattern();
</script>
</body>
</html>
