<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>C++ 로직 기반 1MB 난수 파일 생성기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 40px; text-align: center; background-color: #f4f6f9; }
        .box { max-width: 550px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        button { padding: 15px 25px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        #output { margin-top: 25px; font-size: 14px; color: #333; line-height: 1.6; text-align: left; background: #eee; padding: 15px; border-radius: 4px; font-family: monospace; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>C++ mt19937 매핑 1MB 파일 생성기</h2>
    <p><code>fn_true_rand()</code> 구조를 반복 호출하여 1MB 파일을 구성합니다.</p>
    <button onclick="generate1MBFile()">1MB 난수 파일 다운로드</button>
    <div id="output"></div>
</div>

<script>
    // #define rMAX 8
    const rMAX = 8;
    
    // 전역 바이트 배열 (C++의 unsigned char rand_data[rMAX] 역할)
    let rand_data = new Uint8Array(rMAX);

    /**
     * C++의 fn_true_rand() 구조를 그대로 구현한 함수
     * 0~255 범위의 완전히 독립적인 random 바이트 8개를 생성하여 rand_data에 채웁니다.
     */
    function fn_true_rand() {
        // std::mt19937에 대응하는 암호학적 독립 난수 생성 API 사용
        // rMAX(8)만큼의 독립적인 무작위 바이트(0~255)를 rand_data에 채움
        window.crypto.getRandomValues(rand_data); 
        return rMAX;
    }

    function generate1MBFile() {
        const outputDiv = document.getElementById('output');
        outputDiv.style.display = 'block';
        outputDiv.innerHTML = "⏳ 파일 생성 중... (fn_true_rand 반복 호출)";

        // 1MB = 1024 * 1024 = 1,048,576 Bytes
        const TARGET_SIZE = 1024 * 1024; 
        const fileBuffer = new Uint8Array(TARGET_SIZE);
        
        let bytesWritten = 0;

        // 1MB가 채워질 때까지 fn_true_rand()를 루프 내에서 계속 호출
        while (bytesWritten < TARGET_SIZE) {
            // 1. 8바이트 난수 생성 (rand_data 갱신)
            const generatedCount = fn_true_rand(); 
            
            // 2. 생성된 8바이트를 전체 파일 버퍼에 순차적으로 복사 (C++의 파일 스트림 저장 대응)
            for (let i = 0; i < generatedCount; i++) {
                if (bytesWritten >= TARGET_SIZE) break;
                fileBuffer[bytesWritten] = rand_data[i];
                bytesWritten++;
            }
        }

        // 3. 파일화(Blob) 및 다운로드 트리거
        const blob = new Blob([fileBuffer], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = 'generated_mt19937_1mb.bin';
        document.body.appendChild(a);
        a.click();

        // 메모리 해제 및 결과 출력
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        outputDiv.innerHTML = `✅ <strong>파일 생성 완료!</strong><br>` +
                              `• 파일명: generated_mt19937_1mb.bin<br>` +
                              `• 총 루프 횟수: ${(TARGET_SIZE / rMAX).toLocaleString()} 번 호출<br>` +
                              `• 파일 크기: ${bytesWritten.toLocaleString()} Bytes (정확히 1MB)`;
    }
</script>

</body>
</html>
