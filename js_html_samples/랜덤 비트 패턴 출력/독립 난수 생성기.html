<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>독립 난수 생성기</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>

    <h2>Random Byte Generator</h2>
    <button onclick="displayRandomBytes()">난수 생성 (8 Bytes)</button>
    <div id="result"></div>

    <script>
        // C++의 #define rmax 8 대응
        const RMAX = 8; 
        
        // 전역 난수 데이터 배열 생성 (C++의 rand_data 변수 역할)
        let rand_data = new Uint8Array(RMAX);

        /**
         * 0~255 범위의 완전히 독립적인 random 바이트를 생성합니다.
         * @returns {number} 생성된 바이트 수 (RMAX)
         */
        function fn_true_rand() {
            // 암호학적으로 안전하고 독립적인 난수를 rand_data 배열에 직접 채웁니다.
            // C++의 std::mt19937이나 Crypto-API 모두 완전한 독립 시행을 보장합니다.
            window.crypto.getRandomValues(rand_data);
            return RMAX;
        }

        // 화면에 결과를 출력하는 함수
        function displayRandomBytes() {
            const byteCount = fn_true_rand();
            const resultDiv = document.getElementById('result');
            
            // 배열 내용을 보기 좋게 문자열로 변환
            const byteArrayString = Array.from(rand_data).join(', ');
            
            resultDiv.innerHTML = `
                <strong>생성된 바이트 수:</strong> ${byteCount} <br>
                <strong>rand_data 결과:</strong> [ ${byteArrayString} ]
            `;
        }
    </script>

</body>
</html>
