<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로컬 100% 무설치 가청화 & 시각화</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; transition: background 0.1s; }
        .container { max-width: 600px; margin: 30px auto; background: #222; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; }
        button:hover { background: #218838; }
        .monitor { display: flex; justify-content: space-between; margin: 20px 0; }
        .box { background: #333; padding: 15px; border-radius: 6px; width: 45%; text-align: center; }
        .box div { font-size: 28px; font-weight: bold; font-family: monospace; margin-top: 5px; }
        .log-area { background: #000; padding: 15px; border-radius: 6px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔊 100% 로컬 구동 가청화 & 시각화</h2>
    <p style="color: #aaa; font-size: 13px;">보안 오류가 없는 첫 번째 전통적 방식으로 구현되어, .html 파일을 더블클릭하면 즉시 소리와 화면이 연동됩니다.</p>
    <button id="toggleBtn">대시보드 시작</button>
    
    <div class="monitor">
        <div class="box">
            <span style="color: #007bff;">현재 CPU</span>
            <div id="cpuText">0%</div>
        </div>
        <div class="box">
            <span style="color: #dc3545;">에러 상태</span>
            <div id="errorText" style="color: #28a745;">NORMAL</div>
        </div>
    </div>

    <div class="log-area" id="logArea">버튼을 눌러 대시보드를 켜주세요.</div>
</div>

<script>
let audioCtx = null;
let isRunning = false;
let dataLoop = null;

document.getElementById('toggleBtn').addEventListener('click', async () => {
    if (isRunning) {
        // 엔진 정지
        clearInterval(dataLoop);
        if (audioCtx) await audioCtx.suspend();
        document.body.style.background = "#111";
        document.getElementById('toggleBtn').innerText = "대시보드 시작";
        document.getElementById('toggleBtn').style.background = "#28a745";
        isRunning = false;
        return;
    }

    // [전통적 첫 번째 방식] 보안 차단이 없는 표준 오디오 장치 생성
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } else {
        await audioCtx.resume();
    }

    isRunning = true;
    document.getElementById('toggleBtn').innerText = "대시보드 중지";
    document.getElementById('toggleBtn').style.background = "#dc3545";

    // 0.5초 주기로 실시간 데이터 연동 시작
    dataLoop = setInterval(runDashboard, 500);
});

function runDashboard() {
    // 1. 실시간 데이터 스트림 모사
    const cpu = Math.floor(Math.random() * 100);
    const error = Math.random() < 0.15; // 15% 에러 확률

    // 2. [시각화 구현] 화면 숫자 및 배경색 제어
    document.getElementById('cpuText').innerText = `${cpu}%`;
    const errNode = document.getElementById('errorText');
    const logArea = document.getElementById('logArea');
    const time = new Date().toLocaleTimeString();

    let logLine = `[${time}] CPU Usage: ${cpu}%`;

    if (error) {
        document.body.style.background = "#2a0808"; // 배경 빨갛게 번쩍 시각화
        errNode.innerText = "⚠️ ERROR";
        errNode.style.color = "#dc3545";
        logLine += ` <span style="color:#ffc107; font-weight:bold;">[ERR]</span>`;
    } else {
        document.body.style.background = "#111";
        errNode.innerText = "NORMAL";
        errNode.style.color = "#28a745";
    }
    logArea.innerHTML = logLine + "<br>" + logArea.innerHTML;

    // 3. [가청화 구현] 보안 필터를 거치지 않는 첫 번째 메인 오실레이터 호출
    if (audioCtx) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (error) {
            // 에러 발생 시: 찢어지는 굉음 (sawtooth 파형, 높은 볼륨, 고정 주파수)
            osc.type = 'sawtooth';
            osc.frequency.value = 440; 
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        } else {
            // 정상 작동 시: 부드러운 기계음 (sine 파형, 낮은 볼륨, CPU 연동 주파수)
            osc.type = 'sine';
            osc.frequency.value = 100 + (cpu * 3); // 100Hz ~ 400Hz
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        }

        // 팝 노이즈 방지 페이드 아웃 엔벨로프
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    }
}
</script>

</body>
</html>
