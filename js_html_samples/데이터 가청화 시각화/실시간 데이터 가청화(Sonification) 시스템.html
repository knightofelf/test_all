<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 데이터 가청화(Sonification) 시스템</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #2a2a2a; padding: 20px; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; margin-bottom: 15px;}
        button:hover { background: #0056b3; }
        .data-display { background: #000; padding: 15px; border-radius: 4px; font-family: monospace; height: 120px; overflow-y: auto; margin-top: 15px; font-size: 13px; }
        .status { color: #28a745; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 실시간 데이터 가청화 대시보드</h2>
    <p>가상의 실시간 데이터(CPU/Traffic/Error) 흐름을 소리로 변환합니다.</p>
    <button id="startBtn">시스템 시작 (오디오 활성화)</button>
    <div class="status" id="statusText">상태: 중지됨</div>
    
    <div class="data-display" id="logDisplay">--- 데이터 모니터링 로그 ---</div>
</div>

<script>
let audioCtx = null;
let isRunning = false;
let dataInterval = null;

document.getElementById('startBtn').addEventListener('click', () => {
    if (isRunning) {
        // 시스템 중지
        clearInterval(dataInterval);
        document.getElementById('statusText').innerText = "상태: 중지됨";
        document.getElementById('startBtn').innerText = "시스템 시작 (오디오 활성화)";
        isRunning = false;
        return;
    }

    // [6. 장치/참조] 브라우저 내장 오디오 장치(컨텍스트) 및 오디오 버퍼 활성화
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    isRunning = true;
    document.getElementById('statusText').innerText = "상태: 가청화 가동 중...";
    document.getElementById('startBtn').innerText = "시스템 중지";

    // 1초마다 가상의 데이터 스트림 수집 시작
    dataInterval = setInterval(processDataStream, 1000);
});

// 가상의 실시간 데이터 수집 및 가청화 엔진
function processDataStream() {
    // [3. 압축] 무거운 원본 상태를 수치(매개변수 데이터)로만 최소화하여 수집
    const rawData = {
        cpuUsage: Math.floor(Math.random() * 100),       // 0 ~ 100 %
        traffic: Math.floor(Math.random() * 1000),      // 0 ~ 1000 pps
        hasError: Math.random() < 0.15                  // 15% 확률로 에러 발생
    };

    // 로그 출력
    logToScreen(rawData);

    // --- 6대 가속 프레임워크 기반 사운드 합성 분기 ---

    // [5. 분산 / 트랙 1] CPU 사용량 -> 베이스 우웅거리는 서브 사운드로 분산 처리
    // [1. 정렬] 0~100% 수치를 인간이 듣기 좋은 100Hz ~ 300Hz 주파수 규격으로 정렬
    const cpuHz = 100 + (rawData.cpuUsage * 2); 
    playTone(cpuHz, 'sine', 0.1, 0.2); // (주파수, 파형, 볼륨, 지속시간)

    // [5. 분산 / 트랙 2] 트래픽 데이터 -> 템포와 높은 음의 삑 소리로 분산 처리
    if (rawData.traffic > 500) {
        // [1. 정렬] 트래픽 강도를 800Hz ~ 1500Hz 고음으로 정렬
        const trafficHz = 800 + (rawData.traffic / 2);
        playTone(trafficHz, 'triangle', 0.05, 0.05);
    }

    // [4. 중복 / 트랙 3] 에러 발생 -> 다채널 입체음향 및 날카로운 경고음으로 중복 처리
    if (rawData.hasError) {
        // 왼쪽과 오른쪽 채널에 시차를 두고 날카로운 톱니파형(sawtooth)을 중복 전송하여 공간감 형성
        playStereoTone(350, 'sawtooth', 0.2, 0.3);
    }
}

// 단일 모노 톤 발생 함수
function playTone(frequency, type, volume, duration) {
    if (!audioCtx) return;

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    // 볼륨 제어 및 엔벨로프(소리가 서서히 줄어들게 하여 뚝 끊기는 팝 노이즈 방지)
    gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination); // 최종 출력 장치 연결

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
}

// 입체 음향(Stereo) 경고음 발생 함수 [4. 중복 구현]
function playStereoTone(frequency, type, volume, duration) {
    if (!audioCtx) return;

    // 채널 분리를 위한 StereoPanner 장치 생성
    const panner = audioCtx.createStereoPanner();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;
    
    // 에러 발생 시 왼쪽(-1)에서 오른쪽(1)으로 소리가 찢어지며 이동하도록 설정 (패닝 중복 효과)
    panner.pan.setValueAtTime(-1, audioCtx.currentTime);
    panner.pan.linearRampToValueAtTime(1, audioCtx.currentTime + duration);

    gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    oscillator.connect(gainNode);
    gainNode.connect(panner);
    panner.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
}

// 화면 로그 출력 함수
function logToScreen(data) {
    const display = document.getElementById('logDisplay');
    const time = new Date().toLocaleTimeString();
    let logMsg = `[${time}] CPU: ${data.cpuUsage}% | Traffic: ${data.traffic}pps`;
    
    if (data.hasError) {
        logMsg += ` <span style="color:#ffc107;">⚠️ [ERROR DETECTED]</span>`;
    }
    
    display.innerHTML = logMsg + "<br>" + display.innerHTML;
}
</script>

</body>
</html>
