<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초거대 거리 던지기 계산기 (BigInt 지원)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #007bff;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-all; /* 숫자가 길어도 줄바꿈이 되도록 설정 */
        }
    </style>
</head>
<body>

    <h2>🌌 우주 스케일 거리 던지기 계산기</h2>
    
    <div class="input-group">
        <label for="targetDistance">🎯 목표 거리 (m) - 지수 표기법 가능:</label>
        <!-- 예시로 올려주신 3.067567567567555e+21 값을 기본값으로 넣었습니다. -->
        <input type="text" id="targetDistance" value="3.067567567567555e+21">
    </div>

    <hr>

    <div class="input-group">
        <label for="fixedAngle">1) 각도를 고정할 때 (도, °):</label>
        <input type="number" id="fixedAngle" value="45" min="1" max="89">
    </div>
    
    <div class="input-group">
        <label for="fixedVelocity">2) 속도를 고정할 때 (m/s):</label>
        <input type="text" id="fixedVelocity" value="200000000000">
    </div>

    <div class="btn-container">
        <button onclick="calculateRequiredVelocity()">필요한 속도 구하기</button>
        <button onclick="calculateRequiredAngle()">필요한 각도 구하기</button>
    </div>

    <div id="resultBox" class="result-box" style="display:none;"></div>

    <script>
        const g = 9.81; // 중력 가속도

        // 지수 표기법(e+)을 온전한 정수 형태의 BigInt로 안전하게 변환하는 함수
        function parseToBigInt(inputValue) {
            const num = Number(inputValue);
            if (isNaN(num)) return null;
            // 소수점을 버리고 거대한 정수 문자열을 만든 뒤 BigInt로 변환
            return BigInt(num.toFixed(0));
        }

        // 1. 필요한 '초기 속도' 계산
        function calculateRequiredVelocity() {
            const distanceInput = document.getElementById('targetDistance').value;
            const angleDegrees = parseInt(document.getElementById('fixedAngle').value, 10);

            // 입력값을 BigInt로 변환하여 문자열 출력용으로 보관
            const targetDistanceBig = parseToBigInt(distanceInput);
            // 정밀 연산을 위해 실수(Number)로도 변환
            const R = Number(distanceInput);

            if (!targetDistanceBig || isNaN(angleDegrees) || angleDegrees <= 0 || angleDegrees >= 90) {
                showResult("올바른 거리와 각도를 입력해주세요.");
                return;
            }

            const angleRadians = angleDegrees * (Math.PI / 180);
            const sin2Theta = Math.sin(2 * angleRadians);
            
            // 공식 계산
            const velocity = Math.sqrt((R * g) / sin2Theta);
            // 결과를 BigInt로 변환하여 지수 표기(e+) 현상 차단
            const velocityBig = BigInt(velocity.toFixed(0));

            showResult(`📢 <b>${angleDegrees}°</b> 각도로 <br><b>${targetDistanceBig.toString()}m</b>를 날리려면:<br>➡️ 필요한 초기 속도: 약 <b>${velocityBig.toString()} m/s</b>`);
        }

        // 2. 필요한 '던지는 각도' 계산
        function calculateRequiredAngle() {
            const distanceInput = document.getElementById('targetDistance').value;
            const velocityInput = document.getElementById('fixedVelocity').value;

            const targetDistanceBig = parseToBigInt(distanceInput);
            const velocityBig = parseToBigInt(velocityInput);

            const R = Number(distanceInput);
            const v = Number(velocityInput);

            if (!targetDistanceBig || !velocityBig || v <= 0) {
                showResult("올바른 거리와 속도를 입력해주세요.");
                return;
            }

            const sin2Theta = (R * g) / Math.pow(v, 2);

            if (sin2Theta > 1) {
                const maxDistance = Math.pow(v, 2) / g;
                const maxDistanceBig = BigInt(maxDistance.toFixed(0));
                showResult(`❌ 현재 속도(<b>${velocityBig.toString()} m/s</b>)로는 <br>최대 약 <b>${maxDistanceBig.toString()}m</b>까지만 던질 수 있습니다. 더 빠른 속도를 입력하세요.`);
                return;
            }

            const angle2Radians = Math.asin(sin2Theta);
            const angle1 = (angle2Radians * (180 / Math.PI)) / 2;
            const angle2 = 90 - angle1;

            const finalAngle1 = Math.round(angle1);
            const finalAngle2 = Math.round(angle2);

            showResult(`📢 <b>${velocityBig.toString()} m/s</b> 속도로 <br><b>${targetDistanceBig.toString()}m</b>를 날리려면:<br>➡️ 필요한 각도: 약 <b>${finalAngle1}°</b> 또는 <b>${finalAngle2}°</b>`);
        }

        function showResult(text) {
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = "block";
            resultBox.innerHTML = text;
        }
    </script>

</body>
</html>
