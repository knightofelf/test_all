<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 스케일 고릴라 부메랑 던지기 (최대 높이 지정)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', Arial, sans-serif;
            background-color: #1a1a24;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            background-color: #0c0c14;
            border: 4px solid #34495e;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .ui-panel {
            display: grid;
            grid-template-columns: 1fr 120px 150px 100px;
            gap: 12px;
            background: #2c3e50;
            padding: 15px;
            width: 774px;
            box-sizing: border-box;
            border-bottom: 2px solid #34495e;
            align-items: center;
        }
        .input-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .input-box label {
            font-size: 11px;
            font-weight: bold;
            color: #bdc3c7;
        }
        .input-box input {
            padding: 6px;
            border: none;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-weight: bold;
        }
        button {
            padding: 10px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            height: 38px;
            margin-top: 14px;
        }
        button:hover { background-color: #c0392b; }
        .physics-log {
            margin-top: 15px;
            background: #2c3e50;
            width: 774px;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            border-left: 6px solid #3498db;
            word-break: break-all;
        }
        .turn-indicator {
            font-size: 16px;
            font-weight: bold;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <h2>🦍 우주 스케일 고릴라 부메랑 던지기 게임 🪃</h2>
    <p style="margin-top:-10px; color:#aaa; font-size:13px;">목표로 하는 최대 높이를 지정하면 역학 공식에 의해 필요한 초기 속도가 BigInt로 자동 계산됩니다.</p>

    <div id="gameContainer">
        <!-- 상단 컨트롤 UI -->
        <div class="ui-panel">
            <div id="turnText" class="turn-indicator">📢 플레이어 1 턴</div>
            <div class="input-box">
                <label>📐 던질 각도 (°)</label>
                <input type="number" id="angleInput" value="45" min="1" max="89">
            </div>
            <div class="input-box">
                <label>🎯 목표 최대 높이 (m)</label>
                <input type="text" id="targetHeightInput" value="50000">
            </div>
            <button onclick="fireBoomerang()">던지기!</button>
        </div>
        <!-- 게임 화면 -->
        <canvas id="gameCanvas" width="774" height="400"></canvas>
    </div>

    <!-- 실시간 BigInt 물리 정보서 -->
    <div id="physicsLog" class="physics-log">
        🎯 <b>[실시간 고정밀 물리 정보서]</b> 던지기 버튼을 누르면 입력한 최대 높이에 도달하기 위한 역산 데이터가 정수로 출력됩니다.
    </div>

    <!-- 자바스크립트 파일 로드 -->
    <script src="game2.js"></script>
</body>
</html>
