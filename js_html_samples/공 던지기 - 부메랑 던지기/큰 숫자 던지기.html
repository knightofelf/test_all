<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>큰 숫자 던지기</title>
  <style>
    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    .chunk {
      display: inline-block;
      margin: 5px;
      padding: 8px;
      background: #f0f0f0;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h2>큰 숫자 던지기 구현</h2>
  
  <input type="text" id="bigNumber" value="23590903502935020350235235" size="40">
  <br><br>
  <label for="chunkSize">분할 단위(자리수):</label>
  <input type="number" id="chunkSize" value="5" min="1">
  <button onclick="prepareChunks()">준비하기</button>
  <button onclick="throwChunk()">던지기</button>
  
  <h3>던진 결과:</h3>
  <div id="result"></div>
  
  <script>
    let chunks = [];
    let currentIndex = 0;

    function prepareChunks() {
      const numStr = document.getElementById("bigNumber").value.trim();
      const chunkSize = parseInt(document.getElementById("chunkSize").value, 10);
      chunks = [];
      currentIndex = 0;

      for (let i = 0; i < numStr.length; i += chunkSize) {
        chunks.push(numStr.substring(i, i + chunkSize));
      }

      document.getElementById("result").innerHTML = "준비 완료! 던지기를 눌러보세요.";
    }

    function throwChunk() {
      if (currentIndex < chunks.length) {
        const chunk = chunks[currentIndex];
        const div = document.createElement("div");
        div.className = "chunk";
        div.textContent = chunk;
        document.getElementById("result").appendChild(div);
        currentIndex++;
      } else {
        alert("모든 숫자를 다 던졌습니다!");
      }
    }
  </script>
</body>
</html>
