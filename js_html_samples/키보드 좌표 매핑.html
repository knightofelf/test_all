<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>키보드 좌표 매핑</title>
  <style>
    .keyboard { display: inline-block; }
    .row { display: flex; }
    .key {
      border: 1px solid #333;
      padding: 10px;
      margin: 2px;
      text-align: center;
      width: 30px;
    }
  </style>
</head>
<body>
  <h2>키보드 좌표 매핑</h2>
  <div id="keyboard" class="keyboard"></div>
  <p id="output"></p>

  <script>
// 기본 키보드 배열
const baseLayout = {
  normal: [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M']
  ],
  shift: [
    ['!','@','#','$','%','^','&','*','(',')'],
    ['A','S','D','F','G','H','J','K','L'], // 대문자
    ['Z','X','C','V','B','N','M']          // 대문자
  ]
};

// Caps Lock 상태
let capsLock = false;

// 입력 함수
function getChar(row, col, shift=false) {
  const layout = shift ? baseLayout.shift : baseLayout.normal;
  let char = layout[row][col];
  if (!shift && capsLock && /[a-z]/i.test(char)) {
    char = char.toUpperCase();
  }
  return char;
}



    // 키보드 배열 정의 (간단히 QWERTY 상단 3줄만 예시)
    const keyboardLayout = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['Z','X','C','V','B','N','M']
    ];

    // 중심 키: F (1행, 3열)
    const center = { row: 1, col: 3 };

    // 키보드 출력
    const keyboardDiv = document.getElementById('keyboard');
    keyboardLayout.forEach(row => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row';
      row.forEach(key => {
        const keyDiv = document.createElement('div');
        keyDiv.className = 'key';
        keyDiv.textContent = key;
        rowDiv.appendChild(keyDiv);
      });
      keyboardDiv.appendChild(rowDiv);
    });

    // 좌표 계산 함수
    function getKeyFromOffset(dx, dy) {
      const targetRow = center.row + dy;
      const targetCol = center.col + dx;
      if (keyboardLayout[targetRow] && keyboardLayout[targetRow][targetCol]) {
        return keyboardLayout[targetRow][targetCol];
      }
      return null;
    }

    // 예시: F 기준으로 +1,0 → G
    const example1 = getKeyFromOffset(+1,0); // 오른쪽
    const example2 = getKeyFromOffset(-1,0); // 왼쪽
    const example3 = getKeyFromOffset(0,+1); // 아래
    const example4 = getKeyFromOffset(0,-1); // 위

    document.getElementById('output').textContent =
      `F(+1,0) → ${example1}, F(-1,0) → ${example2}, F(0,+1) → ${example3}, F(0,-1) → ${example4}`;
  </script>
</body>
</html>
