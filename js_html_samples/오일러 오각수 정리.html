<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Euler Pentagonal Number Theorem Demo</title>
</head>
<body>
  <h2>오일러 오각수 정리</h2>
  <label>항 개수 입력: <input type="number" id="num" value="20"></label>
  <button onclick="calculate()">계산하기</button>
  <div id="result"></div>

  <script>
    // 오각수 공식: k(3k-1)/2
    function pentagonal(k) {
      return (k * (3 * k - 1)) / 2;
    }

    function calculate() {
      const n = parseInt(document.getElementById("num").value);
      let series = [];
      for (let k = -n; k <= n; k++) {
        const p = pentagonal(k);
        if (p >= 0) {
          series.push({k, value: p, sign: (k % 2 === 0 ? "+" : "-")});
        }
      }
      let html = "<h3>오각수 항 전개</h3><ul>";
      series.forEach(s => {
        html += `<li>k=${s.k}, 값=${s.value}, 부호=${s.sign}</li>`;
      });
      html += "</ul>";
      document.getElementById("result").innerHTML = html;
    }
  </script>
</body>
</html>
