<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>책장 넘기기</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #eee;
      font-family: sans-serif;
    }

    .book {
      width: 400px;
      height: 300px;
      perspective: 1500px;
      position: relative;
    }

    .page {
      width: 100%;
      height: 100%;
      background: white;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: left center;
      transition: transform 1s ease;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    .page img {
      max-width: 90%;
      max-height: 80%;
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    .controls {
      margin-top: 20px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      margin: 0 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="book">
    <div class="page" id="page1">
      <img src="https://via.placeholder.com/300x200?text=첫+페이지" alt="첫 페이지">
    </div>
    <div class="page" id="page2">
      <img src="https://via.placeholder.com/300x200?text=두번째+페이지" alt="두번째 페이지">
    </div>
  </div>

  <div class="controls">
    <button onclick="flipPage('page1')">첫 페이지 넘기기</button>
    <button onclick="flipPage('page2')">두번째 페이지 넘기기</button>
  </div>

  <script>
    function flipPage(id) {
      const page = document.getElementById(id);
      page.classList.toggle("flipped");
    }
  </script>
</body>
</html>
