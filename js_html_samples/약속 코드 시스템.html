<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>약속 코드 시스템</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    label { display: block; margin-top: 10px; }
    .result { margin-top: 20px; font-weight: bold; color: darkblue; }
  </style>
</head>
<body>
  <h2>약속 코드 입력</h2>

  <!-- 조건 선택 -->
  <label>
    조건:
    <select id="condition">
      <option value="만두">만두</option>
      <option value="찐빵">찐빵</option>
    </select>
  </label>

  <!-- 시간 선택 -->
  <label>
    시간:
    <select id="time">
      <option value="10시">10시</option>
      <option value="11시">11시</option>
    </select>
  </label>

  <!-- 헤더/데이터 입력 -->
  <label>
    헤더:
    <input type="text" id="header" value="1">
  </label>
  <label>
    데이터:
    <input type="text" id="data" value="1 1 1">
  </label>

  <button onclick="checkCode()">결과 확인</button>

  <div class="result" id="result"></div>

  <script>
    function checkCode() {
      const condition = document.getElementById('condition').value;
      const time = document.getElementById('time').value;
      const header = document.getElementById('header').value.trim();
      const data = document.getElementById('data').value.trim();

      let resultText = "알맞은 코드가 없습니다.";

      // 약속된 코드 매핑
      if (condition === "만두" && time === "10시" && header === "1" && data === "1 1 1") {
        resultText = "🚂 기차가 달려 간다.";
      } else if (condition === "찐빵" && time === "11시" && header === "1" && data === "1 1 1") {
        resultText = "🐎 마차를 몰고 간다.";
      }

      document.getElementById('result').textContent = resultText;
    }
  </script>
</body>
</html>
