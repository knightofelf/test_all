<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>그림자 길이 계산기</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    label { display: block; margin-top: 10px; }
    input { padding: 5px; margin-top: 5px; width: 200px; }
    button { margin-top: 15px; padding: 8px 12px; }
    #result { margin-top: 20px; font-weight: bold; color: darkblue; }
  </style>
</head>
<body>
  <h2>그림자 길이 계산기</h2>
  
  <label>물체 높이 (m):</label>
  <input type="number" id="objectHeight" value="5982437598274359872345">

  <label>빛-물체 거리 (m):</label>
  <input type="number" id="lightToObject" value="3">

  <label>빛-바닥 거리 (m):</label>
  <input type="number" id="lightToGround" value="9">

  <button onclick="calculateShadow()">계산하기</button>

  <div id="result"></div>

  <script>
    function calculateShadow() {
      const h = Number(document.getElementById('objectHeight').value);
      const d1 = Number(document.getElementById('lightToObject').value);
      const d2 = Number(document.getElementById('lightToGround').value);

      if (d1 === 0) {
        document.getElementById('result').innerText = "빛-물체 거리는 0이 될 수 없습니다.";
        return;
      }

      const shadowLength = h * (d2 / d1);
      document.getElementById('result').innerText = 
        "그림자 길이: " + shadowLength.toExponential(5) + " m";
    }
  </script>
</body>
</html>
