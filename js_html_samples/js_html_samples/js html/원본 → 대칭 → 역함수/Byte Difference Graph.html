<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Byte Difference Graph</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h3>원본 vs 대칭 차이 그래프</h3>
<canvas id="chart" width="600" height="400"></canvas>

<script>
const size = 16;
let data = [];

// 랜덤 32바이트 생성
for (let i = 0; i < size*2; i++) {
  data.push(Math.floor(Math.random() * 256));
}

// 원본을 하나의 큰 숫자로
let originalHex = data.map(b => b.toString(16).padStart(2,"0")).join("");
let originalBig = BigInt("0x" + originalHex);

// 대칭 배열 (바이트 순서 뒤집기)
let mirrorHex = data.slice().reverse().map(b => b.toString(16).padStart(2,"0")).join("");
let mirrorBig = BigInt("0x" + mirrorHex);

// 차이 계산
let diff = originalBig - mirrorBig;

// 그래프 데이터 준비 (상대적 크기 비교)
let values = [
  Number(originalBig % BigInt(1000000)), // 큰 수라서 mod로 줄임
  Number(mirrorBig % BigInt(1000000)),
  Number(diff % BigInt(1000000))
];

let labels = ["Original", "Mirror", "Difference"];

// Chart.js 그래프 그리기
const ctx = document.getElementById("chart").getContext("2d");
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '값 비교 (mod 1,000,000)',
      data: values,
      backgroundColor: ['blue','orange','green']
    }]
  },
  options: {
    responsive: false,
    scales: {
      y: {
        beginAtZero: true
      }
    }
  }
});
</script>
</body>
</html>
