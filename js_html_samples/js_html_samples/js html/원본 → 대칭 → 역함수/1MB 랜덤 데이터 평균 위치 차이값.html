<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>1MB Random Data Difference Graph</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h3>1MB 랜덤 데이터 평균 위치 차이값</h3>
<canvas id="chart" width="800" height="400"></canvas>

<script>
const dataSize = 1024 * 1024; // 1MB = 1,048,576 bytes
let data = new Uint8Array(dataSize);

// 랜덤 데이터 생성
for (let i = 0; i < dataSize; i++) {
  data[i] = Math.floor(Math.random() * 256);
}

// 평균 위치 (중앙값)
const avgPos = dataSize / 2;

// 차이값 계산 (인덱스 - 평균 위치)
let points = [];
const step = 4096; // 너무 많으니 샘플링 (4096마다 하나씩)
for (let i = 0; i < dataSize; i += step) {
  let diff = i - avgPos;
  points.push({x: i, y: diff});
}

// Chart.js 라인 그래프
const ctx = document.getElementById("chart").getContext("2d");
new Chart(ctx, {
  type: 'line',
  data: {
    datasets: [{
      label: 'Index - Average Position',
      data: points,
      borderColor: 'blue',
      backgroundColor: 'lightblue',
      fill: false,
      tension: 0.1,
      pointRadius: 0
    }]
  },
  options: {
    responsive: false,
    scales: {
      x: {
        type: 'linear',
        title: {display: true, text: 'Index'}
      },
      y: {
        title: {display: true, text: 'Difference from Avg Position'}
      }
    }
  }
});
</script>
</body>
</html>
