<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Original vs Mirror Difference Graph</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h3>전체를 하나의 숫자로 보고 뺀 결과 (좌표 그래프)</h3>
<canvas id="chart" width="600" height="400"></canvas>

<script>
const size = 16;
let data = [];

// 랜덤 32바이트 생성
for (let i = 0; i < size*2; i++) {
  data.push(Math.floor(Math.random() * 256));
}

// 원본 큰 수
let originalHex = data.map(b => b.toString(16).padStart(2,"0")).join("");
let originalBig = BigInt("0x" + originalHex);

// 대칭 큰 수
let mirrorHex = data.slice().reverse().map(b => b.toString(16).padStart(2,"0")).join("");
let mirrorBig = BigInt("0x" + mirrorHex);

// 차이
let diff = originalBig - mirrorBig;

// 좌표 데이터: 각 바이트 자리별 차이를 점으로 표시
let points = data.map((val, idx) => {
  let mirrorVal = data[data.length - 1 - idx];
  return {x: idx, y: val - mirrorVal};
});

// Chart.js 라인 그래프
const ctx = document.getElementById("chart").getContext("2d");
new Chart(ctx, {
  type: 'line',
  data: {
    datasets: [{
      label: 'Byte Difference (Original - Mirror)',
      data: points,
      borderColor: 'green',
      backgroundColor: 'lightgreen',
      fill: false,
      tension: 0.3,
      pointRadius: 4,
      pointBackgroundColor: 'black'
    }]
  },
  options: {
    responsive: false,
    scales: {
      x: {
        type: 'linear',
        position: 'bottom',
        title: {display: true, text: 'Byte Index'}
      },
      y: {
        title: {display: true, text: 'Difference'}
      }
    }
  }
});

// 콘솔에 전체 큰 수와 차이 출력
console.log("Original Big:", originalBig.toString());
console.log("Mirror Big:", mirrorBig.toString());
console.log("Difference Big:", diff.toString());
</script>
</body>
</html>
