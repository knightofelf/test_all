<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>1MB 비트열 생성</title>
</head>
<body>
  <h3>1MB 비트열 생성기</h3>
  <button onclick="generateBits()">생성하기</button>
  <div id="output"></div>

  <script>
    function generateBits() {
      const size = 1024 * 1024; // 1MB = 1,048,576 바이트
      let bits = "";
      for (let i = 0; i < size; i++) {
        bits += Math.random() > 0.5 ? "1" : "0";
      }
      document.getElementById("output").textContent =
        "생성된 비트열 길이: " + bits.length + " 문자";
      // 필요하다면 파일 다운로드 기능 추가
      const blob = new Blob([bits], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "bits_1MB.txt";
      link.textContent = "다운로드";
      document.getElementById("output").appendChild(document.createElement("br"));
      document.getElementById("output").appendChild(link);
    }
  </script>
</body>
</html>
