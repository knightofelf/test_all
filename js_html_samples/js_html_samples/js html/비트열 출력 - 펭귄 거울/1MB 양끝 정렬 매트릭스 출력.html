<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1MB 양끝 정렬 매트릭스 출력</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        #controls {
            margin-bottom: 20px;
            position: fixed;
            top: 20px;
            background: rgba(17, 17, 17, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        button {
            background-color: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        #progress {
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
            color: #00ff00;
        }

        /* 출력 컨테이너 */
        #matrix {
            background-color: #111;
            padding: 20px;
            width: 400px;
            margin-top: 100px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }

        /* 가변 줄맞춤 행 */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 20px;
            font-size: 14px;
        }

        .left-wall { color: #00ff00; font-weight: bold; width: 20px; }
        .right-wall { color: #00ff00; font-weight: bold; width: 20px; text-align: right; }
        
        /* 가운데 x 정렬 영역 */
        .content-area {
            flex-grow: 1;
            text-align: center;
            color: #ff3366;
            font-weight: bold;
            letter-spacing: 3px;
            overflow: hidden;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="startBtn" onclick="generateAndRender()">1MB 데이터 출력 시작</button>
        <div id="progress">대기 중...</div>
    </div>

    <!-- 데이터가 출력될 공간 -->
    <div id="matrix"></div>

    <script>
        const TARGET_SIZE = 1048576; // 정확히 1MB (Bytes)
        const matrixContainer = document.getElementById('matrix');
        const progressDiv = document.getElementById('progress');
        const startBtn = document.getElementById('startBtn');

        function generateAndRender() {
            startBtn.disabled = true;
            matrixContainer.innerHTML = '';
            progressDiv.textContent = "데이터 생성 중...";

            // 1. 백그라운드에서 1MB 규칙 기반 텍스트 생성 (화면 멈춤 방지)
            const blobCode = `
                self.onmessage = function() {
                    const target = ${TARGET_SIZE};
                    let generated = 0;
                    let lines = [];
                    
                    while (generated < target) {
                        // 중간 x의 개수를 1~10개 사이로 랜덤 생성
                        const xCount = Math.floor(Math.random() * 10) + 1;
                        const xString = "x".repeat(xCount);
                        
                        // 원본 형태의 문자열 조립 (앞뒤 공백 추가로 가변성 극대화)
                        const line = "1 " + xString + "   0";
                        const bytes = line + "\\n";
                        
                        if (generated + bytes.length > target) {
                            const remaining = target - generated;
                            lines.push(line.substring(0, remaining));
                            break;
                        }
                        
                        lines.push(line);
                        generated += bytes.length;
                    }
                    self.postMessage(lines);
                };
            `;

            const blob = new Blob([blobCode], { type: 'application/javascript' });
            const worker = new Worker(URL.createObjectURL(blob));

            worker.postMessage(null);

            worker.onmessage = function(e) {
                const allLines = e.data;
                progressDiv.textContent = "화면 출력 중 (분할 렌더링)...";
                
                // 2. 대량의 데이터를 브라우저가 버틸 수 있게 쪼개서 출력 (Chunk Rendering)
                let index = 0;
                const chunkSize = 200; // 한 번에 그릴 행의 수

                function renderChunk() {
                    const fragment = document.createDocumentFragment();
                    const end = Math.min(index + chunkSize, allLines.length);

                    for (let i = index; i < end; i++) {
                        const line = allLines[i];
                        if (!line) continue;

                        // 구조 파싱 ('1'과 '0' 사이 추출 및 공백 제거)
                        const leftWall = line.charAt(0);
                        const rightWall = line.charAt(line.length - 1);
                        const middleContent = line.substring(1, line.length - 1).trim();

                        // DOM 객체 생성 및 속성 부여
                        const rowDiv = document.createElement('div');
                        rowDiv.classList.add('row');

                        const leftSpan = document.createElement('span');
                        leftSpan.classList.add('left-wall');
                        leftSpan.textContent = leftWall;

                        const contentSpan = document.createElement('span');
                        contentSpan.classList.add('content-area');
                        contentSpan.textContent = middleContent;

                        const rightSpan = document.createElement('span');
                        rightSpan.classList.add('right-wall');
                        rightSpan.textContent = rightWall;

                        rowDiv.appendChild(leftSpan);
                        rowDiv.appendChild(contentSpan);
                        rowDiv.appendChild(rightSpan);
                        fragment.appendChild(rowDiv);
                    }

                    matrixContainer.appendChild(fragment);
                    index += chunkSize;

                    // 진척도 표시
                    const percent = Math.min(100, Math.floor((index / allLines.length) * 100));
                    progressDiv.textContent = `출력 진행률: ${percent}%`;

                    if (index < allLines.length) {
                        // 브라우저 렌더링 프레임에 맞춰 다음 청크 실행
                        requestAnimationFrame(renderChunk);
                    } else {
                        progressDiv.textContent = "1MB 출력 완료! (정확히 1,048,576 바이트)";
                        startBtn.disabled = false;
                    }
                }

                renderChunk();
            };
        }
    </script>
</body>
</html>
