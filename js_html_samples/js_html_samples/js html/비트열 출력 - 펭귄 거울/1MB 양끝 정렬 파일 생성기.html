<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1MB 양끝 정렬 파일 생성기</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #111;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,255,0,0.2);
        }
        button {
            background-color: #00ff00;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #00cc00;
        }
        #status {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>양끝 정렬 1MB 파일 생성기</h2>
        <p>1 xxx 0 형태의 랜덤 패턴 파일(txt)을 다운로드합니다.</p>
        <button onclick="generateFile()">파일 생성 및 다운로드</button>
        <div id="status">준비 완료</div>
    </div>

    <script>
        function generateFile() {
            const status = document.getElementById('status');
            status.textContent = "파일 생성 중...";
            
            const TARGET_SIZE = 1048576; // 정확히 1MB (Bytes)
            let fileContent = '';
            let currentSize = 0;

            while (currentSize < TARGET_SIZE) {
                // 1. 중간 x의 개수를 1~10개 사이로 랜덤 설정
                const xCount = Math.floor(Math.random() * 10) + 1;
                const xString = "x".repeat(xCount);
                
                // 2. 요청하신 형태의 문자열 구조 조립
                // 가변적인 공백 크기를 주어 줄마다 다르게 구성
                const leftSpace = " ";
                const rightSpace = "   ";
                const line = "1" + leftSpace + xString + rightSpace + "0";
                
                // 3. 줄바꿈 기호(\n = 1바이트) 결합
                const fullLine = line + "\n"; 

                // 4. 1MB를 초과하지 않도록 남은 용량 체크 후 정밀 커팅
                if (currentSize + fullLine.length > TARGET_SIZE) {
                    const remaining = TARGET_SIZE - currentSize;
                    fileContent += fullLine.substring(0, remaining);
                    break;
                }

                fileContent += fullLine;
                currentSize += fullLine.length;
            }

            // 5. 다운로드 가능한 파일 객체(Blob)로 변환
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `matrix_pattern_1MB.txt`;
            
            // 6. 가상 링크 다운로드 트리거
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            status.textContent = `다운로드 완료! (실제 크기: ${blob.size.toLocaleString()} 바이트)`;
        }
    </script>
</body>
</html>
