<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Data Sonification & Visualization</title>
  <style>
    canvas { border: 1px solid #333; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>데이터 → 음성 변환 + 시각화</h2>
  <button id="play">재생</button>
  <button id="stop">정지</button>
  <canvas id="visual" width="600" height="200"></canvas>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let oscillators = [];
    let analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    const canvas = document.getElementById("visual");
    const ctx = canvas.getContext("2d");

    // 예시 데이터
    const dataSets = [
      [100, 200, 300], // 데이터1
      [400, 500, 600]  // 데이터2
    ];

    function playData() {
      dataSets.forEach((data, index) => {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const panNode = audioCtx.createStereoPanner();

        const freq = data.reduce((a, b) => a + b) / data.length;
        osc.frequency.value = freq;

        panNode.pan.value = index === 0 ? -1 : 1;

        osc.connect(gainNode).connect(panNode).connect(analyser).connect(audioCtx.destination);
        osc.start();
        oscillators.push(osc);
      });

      drawVisualization();
    }

    function stopData() {
      oscillators.forEach(osc => osc.stop());
      oscillators = [];
    }

    function drawVisualization() {
      requestAnimationFrame(drawVisualization);
      analyser.getByteFrequencyData(dataArray);

      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = dataArray[i];
        ctx.fillStyle = "rgb(" + (barHeight + 100) + ",50,150)";
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }

    document.getElementById("play").onclick = playData;
    document.getElementById("stop").onclick = stopData;
  </script>
</body>
</html>
