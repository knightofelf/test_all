<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Data Sonification Demo</title>
</head>
<body>
  <h2>데이터 → 음성 변환 / 합성 / 분리</h2>
  <button id="play">재생</button>
  <button id="stop">정지</button>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let oscillators = [];

    // 예시 데이터 (숫자 배열)
    const dataSets = [
      [100, 200, 300], // 데이터1
      [400, 500, 600]  // 데이터2
    ];

    function playData() {
      dataSets.forEach((data, index) => {
        // 각 데이터셋을 주파수로 변환
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        // 데이터 평균값을 주파수로 매핑
        const freq = data.reduce((a, b) => a + b) / data.length;
        osc.frequency.value = freq;

        // 각 데이터셋을 다른 채널로 분리 (좌/우)
        const panNode = audioCtx.createStereoPanner();
        panNode.pan.value = index === 0 ? -1 : 1; // 왼쪽/오른쪽

        osc.connect(gainNode).connect(panNode).connect(audioCtx.destination);
        osc.start();
        oscillators.push(osc);
      });
    }

    function stopData() {
      oscillators.forEach(osc => osc.stop());
      oscillators = [];
    }

    document.getElementById("play").onclick = playData;
    document.getElementById("stop").onclick = stopData;
  </script>
</body>
</html>
