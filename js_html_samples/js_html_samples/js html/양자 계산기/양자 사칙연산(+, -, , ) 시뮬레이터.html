<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>양자 사칙연산(+, -, *, /) 시뮬레이터</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f5f6fa; }
        .container { max-width: 700px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 0 auto; }
        h2 { color: #2f3640; border-bottom: 2px solid #718093; padding-bottom: 10px; margin-top: 0; }
        .control-panel { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e1e8ed; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; align-items: center; }
        label { font-weight: bold; min-width: 70px; }
        select, button { padding: 8px 12px; font-size: 15px; border-radius: 6px; border: 1px solid #dcdde1; }
        button { background-color: #4b7bec; color: white; border: none; cursor: pointer; font-weight: bold; flex-grow: 1; }
        button:hover { background-color: #3867d6; }
        .result-box { background-color: #ffffff; padding: 15px; border-left: 5px solid #4b7bec; margin-top: 20px; border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        .state-list { font-family: 'Courier New', monospace; font-size: 14px; color: #2f3640; white-space: pre-line; line-height: 1.6; }
        .circuit-desc { font-size: 13px; color: #7f8c8d; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔮 양자 사칙연산 전체 시뮬레이터</h2>
    <p>양자 비트(Qubit)의 중첩 상태와 회로 연산을 통해 정수 사칙연산을 수행합니다.</p>
    
    <div class="control-panel">
        <div class="row">
            <label>Input A:</label>
            <select id="inputA">
                <option value="0">|00⟩ (0)</option>
                <option value="1">|01⟩ (1)</option>
                <option value="2">|10⟩ (2)</option>
                <option value="3">|11⟩ (3)</option>
                <option value="super">|01⟩+|10⟩ (1과 2의 양자 중첩)</option>
            </select>

            <label>Input B:</label>
            <select id="inputB">
                <option value="0">|00⟩ (0)</option>
                <option value="1">|01⟩ (1)</option>
                <option value="2">|10⟩ (2)</option>
                <option value="3">|11⟩ (3)</option>
            </select>
        </div>
        
        <div class="row">
            <label>연산 선택:</label>
            <select id="operator" style="flex-grow: 1;">
                <option value="add">더하기 (+) - 양자 리플 캐리 가산기 회로</option>
                <option value="sub">빼기 (-) - 양자 보수 변환 및 역행 가산 회로</option>
                <option value="mul">곱하기 (*) - 조건부 양자 제어 시프트 가산 회로</option>
                <option value="div">나누기 (/) - 복제 큐비트 기반 양자 제법 회로</option>
            </select>
        </div>
        
        <div class="row">
            <button onclick="runQuantumArithmetic()">양자 사칙연산 실행</button>
        </div>
    </div>

    <div class="result-box">
        <h3>📊 양자 회로 측정 결과</h3>
        <div id="output" class="state-list">원하는 연산을 선택한 후 버튼을 누르세요.</div>
    </div>
</div>

<script>
function runQuantumArithmetic() {
    const valA = document.getElementById('inputA').value;
    const valB = parseInt(document.getElementById('inputB').value);
    const op = document.getElementById('operator').value;
    
    // 입력을 시뮬레이션하기 위한 상태 배열 생성
    // 데이터 포맷: [ {a: 값, b: 값, prob: 확률} ]
    let inputs = [];
    
    if (valA === "super") {
        // 1과 2가 동시에 존재하는 양자 중첩 상태 표현 (확률 각 50%)
        inputs.push({ a: 1, b: valB, prob: 0.5 });
        inputs.push({ a: 2, b: valB, prob: 0.5 });
    } else {
        inputs.push({ a: parseInt(valA), b: valB, prob: 1.0 });
    }

    let outputHtml = "";

    // 각 중첩된 상태 노드별로 양자 회로 게이트 연산 시뮬레이션
    inputs.forEach(state => {
        let resultText = "";
        let circuitCode = "";
        
        if (op === "add") {
            // 덧셈 회로: CNOT 및 Toffoli 게이트 처리
            let sum = state.a + state.b;
            circuitCode = `[H] -> [Toffoli(Carry)] -> [CNOT(Sum)]`;
            resultText = `계산 결과(Sum): ${sum}`;
            
        } else if (op === "sub") {
            // 뺄셈 회로: 양자 보수법(2's complement) 변환 후 가산 게이트 통과
            let sub = state.a - state.b;
            circuitCode = `[X 게이트(보수변환)] -> [Inverse 가산기] -> [Sign 비트 체크]`;
            if (sub < 0) {
                resultText = `계산 결과(Sub): ${sub} (양자 음수 상태 비트 활성화)`;
            } else {
                resultText = `계산 결과(Sub): ${sub}`;
            }
            
        } else if (op === "mul") {
            // 곱셈 회로: 큐비트 자리 이동 및 조건부 가산 게이트(CCNOT 연쇄)
            let mul = state.a * state.b;
            circuitCode = `[Qubit Shift] -> [Controlled-CNOT 누적 가산]`;
            resultText = `계산 결과(Mul): ${mul}`;
            
        } else if (op === "div") {
            // 나눗셈 회로: 분모가 0인 경우 예외처리 및 몫/나머지 큐비트 분리
            circuitCode = `[상태 비교 게이트] -> [안전 감산 회로]`;
            if (state.b === 0) {
                resultText = `계산 불능: Zero Division (양자 중첩 붕괴 에러 상태)`;
            } else {
                let quotient = Math.floor(state.a / state.b);
                let remainder = state.a % state.b;
                resultText = `계산 결과(Div) ➔ 몫: ${quotient}, 나머지: ${remainder}`;
            }
        }

        // 결과를 2진수 양자 브라켓(|⟩) 형태로 변환하여 시각화
        let binA = state.a.toString(2).padStart(2, '0');
        let binB = state.b.toString(2).padStart(2, '0');
        
        outputHtml += `<b>[양자 상태 관측 확률: ${(state.prob * 100).toFixed(0)}%]</b>\n`;
        outputHtml += `  입력 큐비트: |A⟩=|${binA}⟩(${state.a}), |B⟩=|${binB}⟩(${state.b})\n`;
        outputHtml += `  통과한 게이트 회로: <span class="circuit-desc">${circuitCode}</span>\n`;
        outputHtml += `  <b>🔮 최종 측정: ${resultText}</b>\n\n`;
    });

    document.getElementById('output').innerHTML = outputHtml;
}
</script>

</body>
</html>
