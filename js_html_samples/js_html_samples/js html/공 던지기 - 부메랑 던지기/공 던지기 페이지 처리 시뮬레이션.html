<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공 던지기 페이지 처리 시뮬레이션</title>
  <style>
    canvas { border: 1px solid black; }
    #info { margin-top: 10px; white-space: pre-line; font-family: Arial; }
  </style>
</head>
<body>
  <h1>공 던지기 페이지 처리 시뮬레이션</h1>
  
  <label>초기 속도 (m/s): <input type="number" id="velocity" value="50"></label><br>
  <label>던진 각도 (도): <input type="number" id="angle" value="45"></label><br>
  <label>페이지 크기 (예: 20): <input type="number" id="pageSize" value="20"></label><br>
  <button onclick="start()">시작하기</button>
  
  <canvas id="canvas" width="600" height="400"></canvas>
  <div id="info"></div>
  
  <script>
    let v0, theta, P, g = 9.8;
    let t, dt = 0.1;
    let running = false;

    function start() {
      v0 = parseFloat(document.getElementById('velocity').value);
      theta = parseFloat(document.getElementById('angle').value) * Math.PI / 180;
      P = BigInt(document.getElementById('pageSize').value);
      t = 0;
      running = true;
      draw();
    }

    function draw() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 위치 계산
      const x = v0 * Math.cos(theta) * t;
      const y = v0 * Math.sin(theta) * t - 0.5 * g * t * t;

      // 화면 좌표 변환
      const screenX = x;
      const screenY = canvas.height - y;

      // 공 그리기
      ctx.beginPath();
      ctx.arc(screenX, screenY, 5, 0, Math.PI * 2);
      ctx.fill();

      // 페이지 처리
      const X = BigInt(Math.floor(x));
      const N = X / P;
      const delta = X % P;

      document.getElementById('info').innerText =
        `시간 t: ${t.toFixed(1)} s\n` +
        `거리 x: ${x.toFixed(2)} m\n높이 y: ${y.toFixed(2)} m\n` +
        `페이지 번호 N: ${N}\n페이지 오프셋 δ: ${delta}`;

      t += dt;
      if (screenY < canvas.height && running) {
        requestAnimationFrame(draw);
      }
    }
  </script>
</body>
</html>
