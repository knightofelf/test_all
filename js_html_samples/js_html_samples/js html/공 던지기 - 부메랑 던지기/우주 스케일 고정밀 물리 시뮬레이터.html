<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 스케일 고정밀 물리 시뮬레이터</title>
    <style>
        body {
            font-family: 'Malgun Gothic', Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f4f6f9;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
        }
        .hint {
            font-size: 11px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #1e3799;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0c2461; }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 6px solid #1e3799;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.8;
            word-break: break-all;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #2980b9;
            margin-top: 10px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🌌 고정밀 포물선 역학 시뮬레이터</h2>
    <p style="font-size: 12px; color: #7f8c8d; margin-top: -10px;">시간, 높이, 속도 벡터를 지수 표기 없이 밀리 정밀도 정수로 산출합니다.</p>
    <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">

    <div class="input-group">
        <label for="vIn">⚡ 초기 속도 (m/s):</label>
        <div class="hint">초거대 우주 속도 혹은 일반 속도를 정수로 입력 가능</div>
        <input type="text" id="vIn" value="173468516000">
    </div>

    <div class="input-group">
        <label for="aIn">📐 던지는 각도 (°):</label>
        <div class="hint">0도(수평 0 도달) ~ 90도(수직 제자리 낙하)</div>
        <input type="number" id="aIn" value="45" min="0" max="90">
    </div>

    <div class="input-group">
        <label for="gIn">🪐 중력 가속도 (m/s²):</label>
        <div class="hint">지구 환경은 10 (소수점은 버려집니다)</div>
        <input type="text" id="gIn" value="10">
    </div>

    <button onclick="runPhysicsSimulation()">종합 역학 데이터 산출</button>

    <div id="resultBox" class="result-box" style="display:none;"></div>
</div>

<script>
    function parseToBigIntStr(val) {
        let str = val.trim().toLowerCase();
        if (!str) return null;
        if (str.includes('e')) {
            let [base, expStr] = str.split('e');
            let exp = parseInt(expStr, 10);
            let dotIdx = base.indexOf('.');
            if (dotIdx !== -1) {
                let s1 = base.substring(0, dotIdx);
                let s2 = base.substring(dotIdx + 1);
                return exp >= s2.length ? s1 + s2 + '0'.repeat(exp - s2.length) : s1 + s2.substring(0, exp);
            }
            return base + '0'.repeat(exp);
        }
        let dotIdx = str.indexOf('.');
        return dotIdx !== -1 ? str.substring(0, dotIdx) : str;
    }

    function runPhysicsSimulation() {
        const vStr = parseToBigIntStr(document.getElementById('vIn').value);
        const gStr = parseToBigIntStr(document.getElementById('gIn').value);
        const deg = parseInt(document.getElementById('aIn').value, 10);

        if (!vStr || !gStr || isNaN(deg) || deg < 0 || deg > 90) {
            alert("정확한 수치를 입력해주세요.");
            return;
        }

        const v = BigInt(vStr);
        const g = BigInt(gStr);
        const rad = deg * (Math.PI / 180);

        // 정밀 삼각함수 스케일러 (1,000,000 배율 정수화)
        const SCALE = 1000000n;
        const sinVal = BigInt(Math.round(Math.sin(rad) * Number(SCALE)));
        const cosVal = BigInt(Math.round(Math.cos(rad) * Number(SCALE)));
        const sin2Theta = BigInt(Math.round(Math.sin(2 * rad) * Number(SCALE)));

        // 1. 총 비행 시간 계산 (밀리초 단위 정수형 확장)
        // t = (2 * v * sin) / g
        let tMs = 0n;
        if (g > 0n) {
            tMs = (2n * v * sinVal * 1000n) / (g * SCALE); // 1000n을 곱해 초 단위를 밀리초로 변환
        }

        // 2. 최종 수평 비행 거리 계산 (m)
        let totalDist = 0n;
        if (g > 0n) {
            totalDist = (v * v * sin2Theta) / (g * SCALE);
        }

        // 3. 최고 도달 높이 계산 (m)
        // H = (v * sin)^2 / (2 * g)
        let maxHeight = 0n;
        if (g > 0n) {
            const vSinScaled = (v * sinVal) / SCALE;
            maxHeight = (vSinScaled * vSinScaled) / (2n * g);
        }

        // 4. 중간 지점(정점)에서의 시간 흐름 위치 연산 (t_half)
        const tHalfMs = tMs / 2n;
        const tHalfSecFraction = Number(tHalfMs) / 1000;
        
        // 정점 위치 x, y 계산
        const xHalf = (v * cosVal * tHalfMs) / (SCALE * 1000n);
        const yHalf = maxHeight; // 최고 높이와 동일

        // 출력 양식 설정
        let html = `
            <div style="font-size: 16px; font-weight: bold; color: #1e3799; border-bottom: 2px solid #1e3799; padding-bottom: 5px;">📊 포물선 물리 정보서</div>
            
            <div class="section-title">⏱️ 시간 역학 데이터</div>
            • <b>총 비행 시간:</b> ${tMs.toLocaleString()} 밀리초 (약 ${(Number(tMs)/1000).toFixed(2)} 초)<br>
            • <b>최고점 도달 시간:</b> ${tHalfMs.toLocaleString()} 밀리초 (약 ${tHalfSecFraction.toFixed(2)} 초)<br>

            <div class="section-title">📐 공간 좌표 데이터</div>
            • <b>최종 비행 거리 (X축):</b> <span style="color:#007BFF; font-weight:bold;">${totalDist.toLocaleString()}</span> m<br>
            • <b>최고 도달 높이 (Y축):</b> <span style="color:#e74c3c; font-weight:bold;">${maxHeight.toLocaleString()}</span> m<br>

            <div class="section-title">📍 비행 정점(Peak)에서의 순간 위치</div>
            • <b>수평 이동 거리:</b> ${xHalf.toLocaleString()} m 지점<br>
            • <b>수직 도달 높이:</b> ${yHalf.toLocaleString()} m 지점
        `;

        const resBox = document.getElementById('resultBox');
        resBox.innerHTML = html;
        resBox.style.display = "block";
    }
</script>

</body>
</html>
