<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초정밀 우주 포물선 계산기 (실시간 반영 버전)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 550px;
            margin: 0 auto;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .btn-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            padding: 12px;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .btn-blue { background-color: #007BFF; }
        .btn-blue:hover { background-color: #0056b3; }
        .btn-green { background-color: #28a745; }
        .btn-green:hover { background-color: #218838; }
        
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #007bff;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>🌌 초정밀 우주 포물선 계산기</h2>
    
    <div class="input-group">
        <label for="inputDistance">🎯 거리 (m) - 지수/정수 모두 가능:</label>
        <input type="text" id="inputDistance" value="3.067567567567555e+21">
    </div>

    <div class="input-group">
        <label for="inputVelocity">⚡ 초기 속도 (m/s) - 지수/정수 모두 가능:</label>
        <input type="text" id="inputVelocity" value="173468516000">
    </div>

    <div class="input-group">
        <label for="inputAngle">📐 던지는 각도 (도, °):</label>
        <input type="number" id="inputAngle" value="45" min="1" max="89">
    </div>

    <hr>

    <div class="btn-container">
        <button class="btn-blue" onclick="calculateDistance()">1. 비행 거리 구하기 (속도 + 각도 기준)</button>
        <button class="btn-green" onclick="calculateRequiredVelocity()">2. 필요한 속도 구하기 (거리 + 각도 기준)</button>
        <button class="btn-green" onclick="calculateRequiredAngle()">3. 필요한 각도 구하기 (거리 + 속도 기준)</button>
    </div>

    <div id="resultBox" class="result-box" style="display:none;"></div>

    <script>
        const g = 9.81;

        // [핵심] 소수점을 포함한 거대 지수 문자열을 BigInt 연산이 가능한 큰 문자열 정수로 변환하는 함수
        function parseToExactIntegerString(inputValue) {
            let str = inputValue.trim().toLowerCase();
            if (!str) return null;

            // 1. 지수 표기법(e) 처리
            if (str.includes('e')) {
                let [base, expStr] = str.split('e');
                let exp = parseInt(expStr, 10);
                if (isNaN(exp)) return null;

                let dotIdx = base.indexOf('.');
                if (dotIdx !== -1) {
                    let integerPart = base.substring(0, dotIdx);
                    let fractionalPart = base.substring(dotIdx + 1);
                    
                    if (exp >= fractionalPart.length) {
                        return integerPart + fractionalPart + '0'.repeat(exp - fractionalPart.length);
                    } else {
                        return integerPart + fractionalPart.substring(0, exp);
                    }
                } else {
                    return base + '0'.repeat(exp);
                }
            }

            // 2. 일반 소수점 표기 처리
            let dotIdx = str.indexOf('.');
            if (dotIdx !== -1) {
                return str.substring(0, dotIdx);
            }
            return str;
        }

        // 1. 비행 거리 구하기 (버그 전면 수정)
        function calculateDistance() {
            const velocityInput = document.getElementById('inputVelocity').value;
            const angleDegrees = parseInt(document.getElementById('inputAngle').value, 10);

            const vStr = parseToExactIntegerString(velocityInput);
            if (!vStr || isNaN(angleDegrees) || angleDegrees <= 0 || angleDegrees >= 90) {
                showResult("올바른 속도와 각도를 입력해주세요.");
                return;
            }

            // 속도를 BigInt로 거대 정수화한 뒤 제곱 연산 (Number 유실 방지)
            const vBig = BigInt(vStr);
            const vSquaredBig = vBig * vBig; // v^2 계산

            // 삼각함수와 중력 부분 처리 (소수점 정밀도 유지 보정)
            const angleRadians = angleDegrees * (Math.PI / 180);
            const sin2Theta = Math.sin(2 * angleRadians);
            
            // 비율 계산 (sin(2theta) / g)을 고정밀 소수점으로 처리
            const ratio = sin2Theta / g; 

            // 매우 큰 정수(v^2)에 실수 비율을 곱해 최종 거리를 정수로 도출
            // 정밀도 향상을 위해 BigInt를 숫자로 바꾼 뒤 연산하지 않고, 비율을 나누어 처리
            const scale = 1000000; // 정밀도 배율 보정값
            const ratioScaled = BigInt(Math.round(ratio * scale));
            const distanceBig = (vSquaredBig * ratioScaled) / BigInt(scale);

            showResult(`
                📢 <b>속도:</b> ${vBig.toLocaleString()} m/s <br>
                📐 <b>각도:</b> ${angleDegrees}°<br>
                ➡️ <b>날아간 거리:</b> 약 <b style="color: #007BFF;">${distanceBig.toString()}</b> m
            `);
        }

        // 2. 필요한 초기 속도 구하기
        function calculateRequiredVelocity() {
            const distanceInput = document.getElementById('inputDistance').value;
            const angleDegrees = parseInt(document.getElementById('inputAngle').value, 10);

            const rStr = parseToExactIntegerString(distanceInput);
            if (!rStr || isNaN(angleDegrees) || angleDegrees <= 0 || angleDegrees >= 90) {
                showResult("올바른 거리와 각도를 입력해주세요.");
                return;
            }

            const RBig = BigInt(rStr);
            const angleRadians = angleDegrees * (Math.PI / 180);
            const sin2Theta = Math.sin(2 * angleRadians);
            
            // 공식: v = sqrt( (R * g) / sin(2theta) )
            // 자릿수 보전을 위해 분자를 먼저 계산
            const numerator = Number(RBig) * g;
            const velocity = Math.sqrt(numerator / sin2Theta);
            const velocityBig = BigInt(Math.round(velocity));

            showResult(`
                📢 <b>목표 거리:</b> ${RBig.toLocaleString()} m <br>
                📐 <b>각도:</b> ${angleDegrees}°<br>
                ➡️ <b>필요한 초기 속도:</b> 약 <b style="color: #28a745;">${velocityBig.toString()}</b> m/s
            `);
        }

        // 3. 필요한 던지는 각도 구하기
        function calculateRequiredAngle() {
            const distanceInput = document.getElementById('inputDistance').value;
            const velocityInput = document.getElementById('inputVelocity').value;

            const rStr = parseToExactIntegerString(distanceInput);
            const vStr = parseToExactIntegerString(velocityInput);

            if (!rStr || !vStr) {
                showResult("올바른 거리와 속도를 입력해주세요.");
                return;
            }

            const RBig = BigInt(rStr);
            const vBig = BigInt(vStr);

            // sin(2theta) = (R * g) / v^2
            const vSquared = Number(vBig * vBig);
            const sin2Theta = (Number(RBig) * g) / vSquared;

            if (sin2Theta > 1) {
                const maxDistanceBig = (vBig * vBig * 100n) / 981n; // g=9.81 역산 보정
                showResult(`❌ 현재 속도로는 최대 약 <b>${maxDistanceBig.toString()}</b> m 까지만 던질 수 있습니다.`);
                return;
            }

            const angle2Radians = Math.asin(sin2Theta);
            const angle1 = (angle2Radians * (180 / Math.PI)) / 2;
            const angle2 = 90 - angle1;

            showResult(`
                📢 <b>속도:</b> ${vBig.toLocaleString()} m/s <br>
                🎯 <b>목표 거리:</b> ${RBig.toLocaleString()} m <br>
                ➡️ <b>필요한 각도:</b> 약 <b style="color: #28a745;">${Math.round(angle1)}°</b> 또는 <b style="color: #28a745;">${Math.round(angle2)}°</b>
            `);
        }

        function showResult(text) {
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = "block";
            resultBox.innerHTML = text;
        }
    </script>

</body>
</html>
