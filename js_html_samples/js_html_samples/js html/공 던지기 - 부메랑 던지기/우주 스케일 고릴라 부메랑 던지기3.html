<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 스케일 고릴라 부메랑 (자동 조준 명중)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', Arial, sans-serif;
            background-color: #1a1a24;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #gameContainer {
            position: relative;
            background-color: #0c0c14;
            border: 4px solid #34495e;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .ui-panel {
            display: grid;
            grid-template-columns: 1fr 100px 140px 90px 110px;
            gap: 10px;
            background: #2c3e50;
            padding: 15px;
            width: 774px;
            box-sizing: border-box;
            border-bottom: 2px solid #34495e;
            align-items: center;
        }
        .input-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .input-box label {
            font-size: 11px;
            font-weight: bold;
            color: #bdc3c7;
        }
        .input-box input {
            padding: 6px;
            border: none;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-weight: bold;
        }
        button {
            padding: 10px;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            height: 38px;
            margin-top: 14px;
        }
        .btn-fire { background-color: #e74c3c; }
        .btn-fire:hover { background-color: #c0392b; }
        .btn-auto { background-color: #2ecc71; color: #111; }
        .btn-auto:hover { background-color: #27ae60; }
        
        .physics-log {
            margin-top: 15px;
            background: #2c3e50;
            width: 774px;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            border-left: 6px solid #3498db;
            word-break: break-all;
        }
        .turn-indicator {
            font-size: 16px;
            font-weight: bold;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <h2>🦍 우주 스케일 고릴라 부메랑 던지기 (자동 맞추기) 🪃</h2>
    <p style="margin-top:-10px; color:#aaa; font-size:13px;">지형 높낮이와 상관없이 상대방을 정밀 저격할 수 있는 물리 궤적 연산 알고리즘이 탑재되었습니다.</p>

    <div id="gameContainer">
        <!-- 상단 컨트롤 UI -->
        <div class="ui-panel">
            <div id="turnText" class="turn-indicator">📢 플레이어 1 턴</div>
            <div class="input-box">
                <label>📐 수동 각도 (°)</label>
                <input type="number" id="angleInput" value="45" min="1" max="89">
            </div>
            <div class="input-box">
                <label>🎯 목표 최대 높이 (m)</label>
                <input type="text" id="targetHeightInput" value="50000">
            </div>
            <button class="btn-fire" onclick="fireBoomerang(false)">수동 던지기</button>
            <button class="btn-auto" onclick="fireBoomerang(true)">🤖 자동 맞추기</button>
        </div>
        <!-- 게임 화면 -->
        <canvas id="gameCanvas" width="774" height="400"></canvas>
    </div>

    <!-- 실시간 BigInt 물리 정보서 -->
    <div id="physicsLog" class="physics-log">
        🎯 <b>[실시간 고정밀 물리 정보서]</b> 자동 맞추기를 누르면 인공지능이 상대방과의 물리적 거리를 계산하여 저격 수치를 정수로 출력합니다.
    </div>

    <!-- 자바스크립트 파일 로드 -->
    <script src="game3.js"></script>
</body>
</html>
