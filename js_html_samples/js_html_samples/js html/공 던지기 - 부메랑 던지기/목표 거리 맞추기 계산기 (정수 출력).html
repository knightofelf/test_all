<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목표 거리 맞추기 계산기 (정수 출력)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #007bff;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2>🎯 목표 거리 던지기 계산기</h2>
    
    <div class="input-group">
        <label for="targetDistance">🎯 목표 거리 (m):</label>
        <!-- 정수 입력을 유도하기 위해 step="1" 지정 -->
        <input type="number" id="targetDistance" placeholder="예: 30" value="30" step="1">
    </div>

    <hr>

    <div class="input-group">
        <label for="fixedAngle">1) 각도를 고정할 때 (도, °):</label>
        <input type="number" id="fixedAngle" value="45" step="1">
    </div>
    
    <div class="input-group">
        <label for="fixedVelocity">2) 속도를 고정할 때 (m/s):</label>
        <input type="number" id="fixedVelocity" value="20" step="1">
    </div>

    <div class="btn-container">
        <button onclick="calculateRequiredVelocity()">필요한 속도 구하기</button>
        <button onclick="calculateRequiredAngle()">필요한 각도 구하기</button>
    </div>

    <div id="resultBox" class="result-box" style="display:none;"></div>

    <script>
        const g = 9.81; // 중력 가속도

        // 1. 필요한 '초기 속도'를 정수로 계산
        function calculateRequiredVelocity() {
            // 입력값을 소수점이 없는 정수로 강제 변환 (parseInt)
            const R = parseInt(document.getElementById('targetDistance').value, 10);
            const angleDegrees = parseInt(document.getElementById('fixedAngle').value, 10);

            if (isNaN(R) || isNaN(angleDegrees) || angleDegrees <= 0 || angleDegrees >= 90) {
                showResult("올바른 거리와 각도(0~90도 사이)를 입력해주세요.");
                return;
            }

            const angleRadians = angleDegrees * (Math.PI / 180);
            const sin2Theta = Math.sin(2 * angleRadians);
            const velocity = Math.sqrt((R * g) / sin2Theta);

            // Math.round()를 통해 최종 연산 값을 정수로 반올림
            const finalVelocity = Math.round(velocity);

            showResult(`📢 <b>${angleDegrees}°</b> 각도로 <b>${R}m</b>를 날리려면:<br>➡️ 필요한 초기 속도: 약 <b>${finalVelocity} m/s</b>`);
        }

        // 2. 필요한 '던지는 각도'를 정수로 계산
        function calculateRequiredAngle() {
            const R = parseInt(document.getElementById('targetDistance').value, 10);
            const v = parseInt(document.getElementById('fixedVelocity').value, 10);

            if (isNaN(R) || isNaN(v) || v <= 0) {
                showResult("올바른 거리와 속도를 입력해주세요.");
                return;
            }

            const sin2Theta = (R * g) / Math.pow(v, 2);

            if (sin2Theta > 1) {
                // 최대 거리 출력도 정수로 반올림 처리
                const maxDistance = Math.round(Math.pow(v, 2) / g);
                showResult(`❌ 현재 속도(<b>${v} m/s</b>)로는 최대 약 <b>${maxDistance}m</b>까지만 던질 수 있습니다. 더 빠른 속도를 입력하세요.`);
                return;
            }

            const angle2Radians = Math.asin(sin2Theta);
            const angle1 = (angle2Radians * (180 / Math.PI)) / 2;
            const angle2 = 90 - angle1;

            // 두 가지 각도 결과를 모두 정수로 반올림
            const finalAngle1 = Math.round(angle1);
            const finalAngle2 = Math.round(angle2);

            showResult(`📢 <b>${v} m/s</b> 속도로 <b>${R}m</b>를 날리려면:<br>➡️ 필요한 각도: 약 <b>${finalAngle1}°</b> 또는 <b>${finalAngle2}°</b>`);
        }

        function showResult(text) {
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = "block";
            resultBox.innerHTML = text;
        }
    </script>

</body>
</html>
