<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>x와 마지막 값만 출력</title>
</head>
<body>
  <h2>Inverse Bit 1D 1MB 결과 파일 (간격 적용, x와 마지막 값만)</h2>
  <button onclick="runDemo()">결과 파일 만들기</button>

  <script>
    function runDemo() {
      const totalSize = 1024 * 1024 * 8; // 1MB = 8,388,608 비트
      let prev = Math.random() < 0.5 ? "0" : "1";
      let lastValue = prev;
      let lines = [];

      // 랜덤 데이터 생성하면서 변화 지점은 'x'로만 기록
      for (let i = 1; i < totalSize; i++) {
        const bit = Math.random() < 0.5 ? "0" : "1";
        if (bit !== prev) {
          // 간격(띄우기) 적용: 위치만큼 공백 후 x 출력
          lines.push(" ".repeat(i % 80) + "x");
        }
        prev = bit;
        lastValue = bit;
      }

      // 마지막 값 출력
      lines.push(" ".repeat(10) + lastValue);

      // 결과 파일 내용
      const outputData = lines.join("\n");

      const blob = new Blob([outputData], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "InverseBit1D_1MB_X_Spaced.txt";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
