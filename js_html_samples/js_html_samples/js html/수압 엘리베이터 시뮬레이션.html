<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수압 엘리베이터 시뮬레이션</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f0f0; }
    .shaft {
      width: 200px; height: 400px; border: 4px solid #333; position: relative; background:#ddd;
    }
    .car {
      width: 180px; height: 80px; background:#4a90e2; position: absolute; bottom:0; left:10px;
      display:flex; justify-content:center; align-items:center; color:#fff; font-weight:bold;
      transition: bottom 2s ease;
    }
    .piston {
      width: 40px; height: 100%; background:#999; position:absolute; bottom:0; left:-50px;
    }
    .controls { margin-left:30px; display:flex; flex-direction:column; gap:10px; }
    button { padding:10px; font-size:16px; }
  </style>
</head>
<body>
  <div class="shaft">
    <div class="car" id="car">엘리베이터</div>
    <div class="piston"></div>
  </div>
  <div class="controls">
    <button onclick="moveUp()">상승</button>
    <button onclick="moveDown()">하강</button>
  </div>

  <script>
    const car = document.getElementById("car");
    function moveUp() {
      car.style.bottom = "300px"; // 상승
    }
    function moveDown() {
      car.style.bottom = "0px"; // 하강
    }
  </script>
</body>
</html>
