<!DOCTYPE html>
<html>
<head>
  <title>수건 집기 시뮬레이션</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
</head>
<body>
<script>
let cols = 15, rows = 10;
let spacing = 30;
let particles = [];

function setup() {
  createCanvas(600, 400);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      particles.push({
        x: x * spacing + 100,
        y: y * spacing + 50,
        px: x * spacing + 100,
        py: y * spacing + 50,
        pinned: (y === 0) // 맨 위 줄 고정
      });
    }
  }
}

function draw() {
  background(240);
  stroke(0);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let i = y * cols + x;
      let p = particles[i];
      ellipse(p.x, p.y, 5, 5);

      if (x < cols-1) {
        let right = particles[i+1];
        line(p.x, p.y, right.x, right.y);
      }
      if (y < rows-1) {
        let down = particles[i+cols];
        line(p.x, p.y, down.x, down.y);
      }
    }
  }
}

function mouseDragged() {
  particles.forEach(p => {
    let d = dist(mouseX, mouseY, p.x, p.y);
    if (d < 20) {
      p.x = mouseX;
      p.y = mouseY;
    }
  });
}
</script>
</body>
</html>
