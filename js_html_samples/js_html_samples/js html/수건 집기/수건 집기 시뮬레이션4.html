<!DOCTYPE html>
<html>
<head>
  <title>3D 수건 집기 시뮬레이션</title>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Cannon.js (UMD 버전) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
<script>
/* === 기본 세팅 === */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 조명
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(0, 10, 10);
scene.add(light);

// 물리 엔진
const world = new CANNON.World();
world.gravity.set(0, -9.82, 0);

/* === 바닥 === */
const groundBody = new CANNON.Body({ mass: 0 });
groundBody.addShape(new CANNON.Plane());
groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0); // 바닥 방향 맞추기
world.addBody(groundBody);

const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.MeshPhongMaterial({ color: 0x888888 })
);
groundMesh.rotation.x = -Math.PI/2;
scene.add(groundMesh);

/* === 수건(천) === */
const particles = [];
const cols = 12, rows = 8, spacing = 0.5;
const clothGeometry = new THREE.PlaneGeometry(6, 4, cols-1, rows-1);
const clothMaterial = new THREE.MeshPhongMaterial({ color: 0x00aaff, side: THREE.DoubleSide, wireframe:true });
const clothMesh = new THREE.Mesh(clothGeometry, clothMaterial);
scene.add(clothMesh);

// Cannon.js 파티클 생성
for (let y=0; y<rows; y++) {
  for (let x=0; x<cols; x++) {
    const body = new CANNON.Body({ mass: 0.1, position: new CANNON.Vec3(x*spacing, 5, y*spacing) });
    body.addShape(new CANNON.Sphere(0.05));
    world.addBody(body);
    particles.push(body);

    if (x>0) {
      const left = particles[particles.length-2];
      world.addConstraint(new CANNON.DistanceConstraint(body, left, spacing));
    }
    if (y>0) {
      const up = particles[(y-1)*cols + x];
      world.addConstraint(new CANNON.DistanceConstraint(body, up, spacing));
    }
  }
}

/* === 카메라 위치 === */
camera.position.set(0, 6, 12);
camera.lookAt(0,0,0);

/* === 마우스로 Body 잡기 === */
let selectedBody = null;
document.addEventListener("mousedown", e => {
  selectedBody = particles[Math.floor(Math.random()*particles.length)]; // 간단히 랜덤 선택
});
document.addEventListener("mousemove", e => {
  if (selectedBody) {
    selectedBody.position.x = (e.clientX / 50);
    selectedBody.position.y = 5;
    selectedBody.position.z = (e.clientY / 50);
  }
});
document.addEventListener("mouseup", () => { selectedBody = null; });

/* === 애니메이션 루프 === */
function animate() {
  requestAnimationFrame(animate);
  world.step(1/60);

  // 수건 Mesh 업데이트
  let i=0;
  for (let y=0; y<rows; y++) {
    for (let x=0; x<cols; x++) {
      clothGeometry.attributes.position.setXYZ(i,
        particles[i].position.x,
        particles[i].position.y,
        particles[i].position.z
      );
      i++;
    }
  }
  clothGeometry.attributes.position.needsUpdate = true;
  clothGeometry.computeVertexNormals();

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
