<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페르마의 마지막 정리 - 높이(Z축) 추가 시각화</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --primary: #2563eb;
            --border: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }
        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .desc { color: var(--text-sub); font-size: 14px; margin-bottom: 25px; }
        
        .control-panel {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .radio-group { display: flex; gap: 15px; align-items: center; }
        .radio-label { font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        .formula {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
            font-family: 'Courier New', monospace;
        }
        .explanation {
            font-size: 14px;
            color: var(--text-sub);
            background: #fdf2f2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ef4444;
            text-align: left;
            line-height: 1.5;
        }
        .explanation.success {
            background: #f0fdf4;
            border-left-color: #22c55e;
        }
        canvas {
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>페르마의 정리: 높이 차원 추가</h1>
        <p class="desc">3제곱을 누르면 평면 사각형에 <b>수직 높이(Z축)</b>가 더해지며 입체 부피로 변합니다.</p>
        
        <div class="control-panel">
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="dimension" value="2" checked> n = 2 (2D 평면 면적)
                </label>
                <label class="radio-label">
                    <input type="radio" name="dimension" value="3"> n = 3 (3D 높이 차원 추가)
                </label>
            </div>
        </div>

        <div class="formula" id="formulaText">3² + 4² = 5²</div>
        <div class="explanation success" id="explainBox"></div>

        <canvas id="renderCanvas" width="600" height="420"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        const formulaText = document.getElementById('formulaText');
        const explainBox = document.getElementById('explainBox');
        const radios = document.querySelectorAll('input[name="dimension"]');

        let currentDim = 2;
        let heightProgress = 0; // 높이가 자라나는 애니메이션 진행도 (0 ~ 1)
        let animationFrameId = null;

        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentDim = parseInt(e.target.value);
                triggerAnimation();
            });
        });

        // 3D 등각 투영 좌표 변환 함수
        function project(x, y, z, scale) {
            const isoX = (x - y) * Math.cos(Math.PI / 6) * scale;
            const isoY = (x + y) * Math.sin(Math.PI / 6) * scale - z * scale;
            return { x: isoX, y: isoY };
        }

        // 3D 단일 면 그리기 함수
        function drawFace(bx, by, pts, indices, fillColor, strokeColor) {
            ctx.fillStyle = fillColor;
            ctx.strokeStyle = strokeColor;
            ctx.beginPath();
            indices.forEach((idx, i) => {
                const pt = pts[idx];
                if (i === 0) ctx.moveTo(pt.x + bx, pt.y + by);
                else ctx.lineTo(pt.x + bx, pt.y + by);
            });
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // 실시간으로 변하는 높이(h_dim)를 반영한 입체 큐브 드로잉
        function drawExtrudedCube(bx, by, w, l, h_dim, scale, topCol, leftCol, rightCol, strokeCol) {
            const v = [];
            // 아래 바닥면 (z=0) 꼭짓점 4개
            v.push(project(0, 0, 0, scale));
            v.push(project(w, 0, 0, scale));
            v.push(project(w, l, 0, scale));
            v.push(project(0, l, 0, scale));
            // 솟아오른 윗면 (z=h_dim) 꼭짓점 4개
            v.push(project(0, 0, h_dim, scale));
            v.push(project(w, 0, h_dim, scale));
            v.push(project(w, l, h_dim, scale));
            v.push(project(0, l, h_dim, scale));

            // 입체 렌더링 (옆면 -> 윗면 순서)
            drawFace(bx, by, v, [0, 1, 5, 4], leftCol, strokeCol);  // 앞 왼쪽 면
            drawFace(bx, by, v, [1, 2, 6, 5], rightCol, strokeCol); // 앞 오른쪽 면
            drawFace(bx, by, v, [4, 5, 6, 7], topCol, strokeCol);   // 뚜껑 윗면
        }

        // 애니메이션 루프 및 실시간 렌더링 마스터
        function renderLoop() {
            // 애니메이션 진행도 조절
            if (currentDim === 3 && heightProgress < 1) {
                heightProgress += 0.05;
                if (heightProgress > 1) heightProgress = 1;
            } else if (currentDim === 2 && heightProgress > 0) {
                heightProgress -= 0.05;
                if (heightProgress < 0) heightProgress = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1.5;
            const cy = canvas.height / 2 + 30;

            // 보정용 높이값 (애니메이션 상태에 따라 0에서 정수까지 자라남)
            const h3 = 3 * heightProgress;
            const h4 = 4 * heightProgress;
            const h5_fake = 4.5 * heightProgress; // 부피 91일 때의 애매한 소수점 높이

            const sc = 15; // 공통 3D 투영 스케일

            if (heightProgress === 0) {
                // 완전히 평면일 때 (n=2 모드 수식 및 안내)
                formulaText.innerHTML = "3² + 4² = 5²";
                explainBox.className = "explanation success";
                explainBox.innerHTML = `<b>[2D 평면 결합]</b> 면적 9(3×3)와 16(4×4)을 더하면 빈틈없이 딱 들어맞는 정수 한 변을 가진 25(5×5) 정사각형이 완성됩니다.`;
            } else {
                // 높이가 추가되는 중이거나 완료되었을 때 (n=3 모드 수식 및 안내)
                formulaText.innerHTML = "3³ + 4³ = 91 ≠ z³";
                explainBox.className = "explanation";
                explainBox.innerHTML = `<b>[3D 높이 축 추가 결과]</b> 평면에 <b>수직 높이</b>가 생성되었습니다! 부피 27(3×3×3)과 64(4×4×4)를 녹여서 밑면이 5×5인 상자에 부으면, 높이가 <b>정수(5)가 되지 못하고 3.64... 라는 애매한 높이</b>에서 멈추어 완벽한 정육면체가 만들어지지 않습니다!`;
            }

            // 1. X 도형 (밑면 3x3)
            drawExtrudedCube(100, cy, 3, 3, h3, sc, '#93c5fd', '#3b82f6', '#1d4ed8', '#1e40af');
            ctx.fillStyle = '#1d4ed8'; ctx.font = 'bold 12px sans-serif';
            ctx.fillText(`밑면: 3×3 / 높이: ${h3.toFixed(1)}`, 55, cy + 45);

            // 기호 '+'
            ctx.fillStyle = '#475569'; ctx.font = 'bold 24px sans-serif'; ctx.fillText("+", 175, cy - 20);

            // 2. Y 도형 (밑면 4x4)
            drawExtrudedCube(270, cy, 4, 4, h4, sc, '#fca5a5', '#ef4444', '#b91c1c', '#991b1b');
            ctx.fillStyle = '#b91c1c'; ctx.font = 'bold 12px sans-serif';
            ctx.fillText(`밑면: 4×4 / 높이: ${h4.toFixed(1)}`, 220, cy + 55);

            // 기호 '➔'
            ctx.fillStyle = '#475569'; ctx.font = 'bold 24px sans-serif'; ctx.fillText("➔", 380, cy - 20);

            // 3. 결합 결과물 (밑면 5x5 공간에 채워지는 부피)
            // n=2일 땐 높이가 0이라 바닥면 5x5만 깔끔하게 보이고, n=3이 되면 높이가 애매하게 차오르는 액체/진흙 기둥 연출
            drawExtrudedCube(490, cy, 5, 5, h5_fake, sc, '#e9d5ff', '#a855f7', '#7e22ce', '#581c87');
            ctx.fillStyle = '#7e22ce'; ctx.font = 'bold 12px sans-serif';
            ctx.fillText(`밑면: 5×5 / 높이: ${h5_fake.toFixed(2)}`, 430, cy + 65);

            if (heightProgress > 0) {
                ctx.fillStyle = '#ef4444'; ctx.font = 'bold 11px sans-serif';
                ctx.fillText(`(정수 높이 5에 도달 실패!)`, 435, cy + 85);
            }

            // 애니메이션 진행 중이면 프레임 계속 요청
            if ((currentDim === 3 && heightProgress < 1) || (currentDim === 2 && heightProgress > 0)) {
                animationFrameId = requestAnimationFrame(renderLoop);
            }
        }

        function triggerAnimation() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            renderLoop();
        }

        // 최초 실행
        triggerAnimation();
    </script>
</body>
</html>
