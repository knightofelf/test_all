<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>무한 분기 공간 & 벡터 발사 시뮬레이터</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050508; color: #fff; font-family: sans-serif; }
        #canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: none; }
        h1 { margin: 0 0 10px 0; font-size: 16px; color: #00ffcc; }
        p { margin: 5px 0; font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>무한 분기 영역 시뮬레이션</h1>
        <p>🖱️ 마우스 클릭: 해당 위치로 <b>벡터 발사</b></p>
        <p>⌨️ WASD / 방향키: 무한 공간 <b>카메라 이동</b></p>
    </div>
    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 화면 크기 맞춤
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 시스템 상태 (카메라 및 발사체)
const camera = { x: 0, y: 0, speed: 5 };
const keys = {};
const lasers = [];

// 마우스 클릭 시 해당 좌표로 벡터 발사
window.addEventListener('click', (e) => {
    // 1. 월드 좌표계 기준으로 시작점(화면 중앙)과 목표점 계산
    const startX = camera.x + canvas.width / 2;
    const startY = camera.y + canvas.height / 2;
    const targetX = camera.x + e.clientX;
    const targetY = camera.y + e.clientY;

    // 2. 방향 벡터 계산 (목표 - 시작)
    const dirX = targetX - startX;
    const dirY = targetY - startY;

    // 3. 벡터 정규화 (크기를 1로 생성)
    const len = Math.hypot(dirX, dirY);
    if (len === 0) return;
    
    const vx = (dirX / len) * 15; // 속도 15 곱하기
    const vy = (dirY / len) * 15;

    // 레이저 오브젝트 생성
    lasers.push({ x: startX, y: startY, vx: vx, vy: vy, life: 100 });
});

// 키보드 입력 감지
window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

function updateControls() {
    if (keys['w'] || keys['arrowup']) camera.y -= camera.speed;
    if (keys['s'] || keys['arrowdown']) camera.y += camera.speed;
    if (keys['a'] || keys['arrowleft']) camera.x -= camera.speed;
    if (keys['d'] || keys['arrowright']) camera.x += camera.speed;
}

// 4. 의사 난수 함수 (동일 좌표에서 항상 같은 분기 공간을 보장 - 무한 맵 핵심)
function seededRandom(x, y) {
    const sx = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453123;
    return sx - Math.floor(sx);
}

// 5. 무한 분기 영역(공간 격자형 트리 노드) 그리기
function drawInfiniteBranches() {
    const gridSize = 200; // 분기 노드 격자 크기
    
    // 현재 카메라 시야에 보이는 격자 범위만 계산 (최적화)
    const startGridX = Math.floor(camera.x / gridSize) - 1;
    const endGridX = Math.ceil((camera.x + canvas.width) / gridSize) + 1;
    const startGridY = Math.floor(camera.y / gridSize) - 1;
    const endGridY = Math.ceil((camera.y + canvas.height) / gridSize) + 1;

    for (let gx = startGridX; gx <= endGridX; gx++) {
        for (let gy = startGridY; gy <= endGridY; gy++) {
            // 각 격자 노드의 시드 생성
            const seed = seededRandom(gx, gy);
            
            // 시드값이 기준을 넘으면 그 자리에 분기 노드(트리 구조) 시각화
            if (seed > 0.4) {
                const nodeWorldX = gx * gridSize + (seed * 50);
                const nodeWorldY = gy * gridSize + (seed * 50);
                
                // 화면 좌표로 변환
                const screenX = nodeWorldX - camera.x;
                const screenY = nodeWorldY - camera.y;

                // 분기선 그리기 (트리 노드 표현)
                ctx.strokeStyle = `rgba(0, 255, 204, ${0.2 + seed * 0.5})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(screenX, screenY);
                // 난수 기반으로 사방으로 뻗는 가지 연산
                ctx.lineTo(screenX + Math.cos(seed * 6.28) * 40, screenY + Math.sin(seed * 6.28) * 40);
                ctx.lineTo(screenX - Math.sin(seed * 6.28) * 30, screenY + Math.cos(seed * 6.28) * 30);
                ctx.stroke();

                // 노드 중심점
                ctx.fillStyle = '#00ffcc';
                ctx.beginPath();
                ctx.arc(screenX, screenY, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
}

// 메인 루프 애니메이션
function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    updateControls();
    drawInfiniteBranches();

    // 중심 원점 표시 (화면 중앙 캐릭터 대용)
    ctx.fillStyle = '#ff0055';
    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2, 6, 0, Math.PI * 2);
    ctx.fill();

    // 레이저 벡터 업데이트 및 그리기
    for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.vx;
        l.y += l.vy;
        l.life--;

        // 화면 좌표 변환 후 그리기
        const sX = l.x - camera.x;
        const sY = l.y - camera.y;

        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(sX, sY);
        ctx.lineTo(sX - l.vx * 1.5, sY - l.vy * 1.5); // 잔상 효과
        ctx.stroke();

        // 수명이 다하면 삭제
        if (l.life <= 0) lasers.splice(i, 1);
    }

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
