<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>해안 침식·퇴적 시뮬레이션</title>
  <style>
    canvas { border: 1px solid #333; background: #cceeff; }
  </style>
</head>
<body>
  <h2>해안 침식·퇴적 시뮬레이션</h2>
  <canvas id="coast" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("coast");
    const ctx = canvas.getContext("2d");

    // 해안선 (y=300 기준)
    const coastY = 300;

    // 모래 입자 배열
    let particles = [];
    for (let i = 0; i < 200; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: coastY - Math.random() * 50,
        color: "sandybrown"
      });
    }

    function drawCoast() {
      ctx.fillStyle = "green";
      ctx.fillRect(0, coastY, canvas.width, canvas.height - coastY);
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
    }

    function updateParticles() {
      particles.forEach(p => {
        // 파도 효과: 좌우 랜덤 이동
        p.x += (Math.random() - 0.5) * 2;
        p.y += (Math.random() - 0.5) * 2;

        // 침식: 해안선 아래로 내려가면 바다로 사라짐
        if (p.y > coastY) {
          p.y = coastY - Math.random() * 50;
          p.x = Math.random() * canvas.width;
        }

        // 퇴적: 일정 확률로 해안선 근처에 고정
        if (Math.random() < 0.001) {
          p.y = coastY - 2;
          p.color = "peru";
        }
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCoast();
      updateParticles();
      drawParticles();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
