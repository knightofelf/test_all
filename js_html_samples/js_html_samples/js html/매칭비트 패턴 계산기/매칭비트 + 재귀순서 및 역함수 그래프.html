<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>매칭비트 + 재귀순서 및 역함수 그래프</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 5px; max-height: 500px; overflow-y: auto; width: 320px; }
    canvas { border: 1px solid #ccc; background: #fafafa; }
    .legend { display: flex; gap: 15px; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>
  <h2>매칭비트와 재귀순서로 숫자 찾기 (+ 역함수 그래프)</h2>
  <label>검색 범위 끝: <input id="end" type="number" value="40"></label>
  <button onclick="generatePattern()">출력 및 그래프 그리기</button>

  <div class="container">
    <div>
      <h3>텍스트 결과</h3>
      <pre id="output">버튼을 누르면 결과가 출력됩니다.</pre>
    </div>
    <div>
      <h3>역함수 기하학 그래프 (Log Scale)</h3>
      <div class="legend">
        <div class="legend-item"><span style="color:gray;">--</span> y = x 대칭축</div>
        <div class="legend-item"><span style="color:blue;">●</span> 원본 함수 (n → 매칭비트)</div>
        <div class="legend-item"><span style="color:red;">●</span> 역함수 (매칭비트 → n)</div>
      </div>
      <canvas id="graphCanvas" width="500" height="500"></canvas>
    </div>
  </div>

  <script>
    function getMatchBit(n) {
      if (n === 0n) return "0";
      if (n % 2n === 1n) return "1";
      const trailingZeros = n.toString(2).match(/0+$/)[0].length;
      return "1" + "0".repeat(trailingZeros);
    }

    function getRecursionLevel(n) {
      if (n === 0n) return 1;
      return n.toString(2).length;
    }

    function generatePattern() {
      const end = BigInt(document.getElementById("end").value);
      let result = "";
      let dataPoints = [];

      // 1. 데이터 계산 및 텍스트 출력 생성
      for (let n = 0n; n <= end; n++) {
        const match = getMatchBit(n);
        const recursionLevel = getRecursionLevel(n);
        result += `${n.toString().padStart(2,"0")} → ${match} (재귀 단계: ${recursionLevel})\n`;
        
        // 그래프에 사용하기 위해 숫자형태로 데이터 저장
        dataPoints.push({ n: Number(n), match: Number(match) });
      }
      document.getElementById("output").textContent = result;

      // 2. 역함수 그래프 그리기 호출
      drawInverseGraph(dataPoints);
    }

    // HTML Canvas를 이용한 역함수 시각화 함수
    function drawInverseGraph(data) {
      const canvas = document.getElementById("graphCanvas");
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const padding = 50;

      // 캔버스 초기화
      ctx.clearRect(0, 0, width, height);

      // 값이 너무 커지므로 로그 스케일 변환 함수 정의 (0 처리를 위해 최소치 적용)
      function logScale(val) {
        if (val <= 0) return 0;
        return Math.log10(val);
      }

      // 최대 범위 산정 (입력값 n의 최대값과 매칭비트 결과의 최대값 중 큰 쪽 기준)
      const maxN = Math.max(...data.map(d => d.n), 1);
      const maxMatch = Math.max(...data.map(d => d.match), 1);
      const maxLog = Math.max(logScale(maxN), logScale(maxMatch));

      // 데이터 좌표를 캔버스 픽셀 좌표로 변환하는 헬퍼 함수
      function getPos(xVal, yVal) {
        const logX = logScale(xVal);
        const logY = logScale(yVal);
        
        // 0부터 maxLog까지를 패딩 공간 제외한 화면 영역에 매핑
        const x = padding + (logX / maxLog) * (width - 2 * padding);
        // Canvas는 Y축이 아래로 갈수록 커지므로 뒤집어줌
        const y = height - padding - (logY / maxLog) * (height - 2 * padding);
        return { x, y };
      }

      // 1) 축 및 모눈눈금 그리기
      ctx.strokeStyle = "#e0e0e0";
      ctx.lineWidth = 1;
      for (let i = 0; i <= Math.ceil(maxLog); i++) {
        const val = Math.pow(10, i);
        const pos = getPos(val, val);
        
        // 세로선
        ctx.beginPath(); ctx.moveTo(pos.x, padding); ctx.lineTo(pos.x, height - padding); ctx.stroke();
        // 가로선
        ctx.beginPath(); ctx.moveTo(padding, pos.y); ctx.lineTo(width - padding, pos.y); ctx.stroke();

        // 축 레이블 문자열
        ctx.fillStyle = "#666";
        ctx.font = "10px sans-serif";
        ctx.fillText(val, pos.x - 10, height - padding + 15);
        ctx.fillText(val, padding - 30, pos.y + 4);
      }

      // 2) y = x 대칭축 가이드라인 그리기
      ctx.strokeStyle = "gray";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      const startPos = getPos(1, 1);
      const endPos = getPos(Math.pow(10, maxLog), Math.pow(10, maxLog));
      ctx.moveTo(padding, height - padding);
      ctx.lineTo(width - padding, padding);
      ctx.stroke();
      ctx.setLineDash([]); // 대시 초기화

      // 3) 데이터 점 찍기
      data.forEach(pt => {
        // 원래 함수: X축이 n, Y축이 매칭비트 (파란색)
        const orig = getPos(pt.n, pt.match);
        ctx.fillStyle = "rgba(0, 0, 255, 0.7)";
        ctx.beginPath();
        ctx.arc(orig.x, orig.y, 4, 0, 2 * Math.PI);
        ctx.fill();

        // 역함수 그래프: X축이 매칭비트, Y축이 n (빨간색) - 원래 점의 X, Y를 뒤집어 대입
        const inv = getPos(pt.match, pt.n);
        ctx.fillStyle = "rgba(255, 0, 0, 0.7)";
        ctx.beginPath();
        ctx.arc(inv.x, inv.y, 4, 0, 2 * Math.PI);
        ctx.fill();
      });
    }
  </script>
</body>
</html>
