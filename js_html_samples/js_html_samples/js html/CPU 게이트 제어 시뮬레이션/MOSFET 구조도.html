<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MOSFET 구조도</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    .chip {
      position: relative;
      width: 400px;
      height: 250px;
      margin: 30px auto;
      background: #f0f0f0;
      border: 2px solid #333;
      border-radius: 10px;
    }
    .source, .drain {
      position: absolute;
      width: 80px;
      height: 60px;
      background: #4CAF50;
      color: white;
      line-height: 60px;
      text-align: center;
      font-weight: bold;
    }
    .source { left: 20px; top: 80px; }
    .drain { right: 20px; top: 80px; }
    .channel {
      position: absolute;
      left: 100px;
      right: 100px;
      top: 100px;
      height: 20px;
      background: #ccc;
    }
    .gate {
      position: absolute;
      left: 150px;
      right: 150px;
      top: 40px;
      height: 30px;
      background: #2196F3;
      color: white;
      text-align: center;
      line-height: 30px;
      font-weight: bold;
    }
    .substrate {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #795548;
      color: white;
      text-align: center;
      line-height: 40px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>MOSFET 트랜지스터 구조도</h2>
  <div class="chip">
    <div class="source">Source</div>
    <div class="drain">Drain</div>
    <div class="channel"></div>
    <div class="gate">Gate</div>
    <div class="substrate">Substrate</div>
  </div>
</body>
</html>
