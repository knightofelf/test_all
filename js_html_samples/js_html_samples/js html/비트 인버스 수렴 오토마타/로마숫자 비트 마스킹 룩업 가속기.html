<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로마숫자 비트 마스킹 룩업 가속기</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; font-size: 1.5rem; text-shadow: 0 0 10px #00ffcc; }
        .info { color: #8892b0; font-size: 0.85rem; margin-bottom: 25px; }
        .accelerator-container {
            background: #111b2d;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0,255,204,0.1);
            width: 650px;
        }
        .matrix-display {
            background: #050811;
            border: 1px solid #1f2e4d;
            padding: 20px;
            border-radius: 5px;
            min-height: 180px;
            line-height: 1.8;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }
        .raw-stream { color: #8892b0; font-weight: bold; border-bottom: 1px dashed #1f2e4d; margin-bottom: 10px; padding-bottom: 5px;}
        .bit-layer { color: #ff007f; text-shadow: 0 0 3px #ff007f; }
        .match-layer { color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>Roman Numeral Bit-Masking LUT Accelerator</h1>
    <div class="info">Operational Mechanism: Equation ROM Evasion, Function RAM Lookup Decoder</div>

    <div class="accelerator-container">
        <div class="matrix-display">
            <div id="rawStream" class="raw-stream">ROMAN: INITIALIZING</div>
            <div id="matrixLines"></div>
        </div>

        <div class="stats">
            <div>DECODE STATE: <span id="decodeState" style="color:#ff007f;">STEADY</span></div>
            <div>BUS FREQ: <span id="audioFreq">0Hz</span></div>
            <div>DECIMAL VALUE: <span id="decimalValue" style="color:#fca311;">0</span></div>
        </div>
    </div>

<script>
    // 1. 하드웨어 룩업 테이블(LUT) 선행 주입 (Function RAM 매핑 기법)
    // 각 문자의 결합 패턴 자체를 주소 인덱스로 삼아 if문 조건 분기를 원천 차단
    const ROMAN_MAP = { 'I': 1, 'V': 5, 'X': 10, 'L': 50, 'C': 100, 'D': 500, 'M': 1000 };
    
    // 시뮬레이션용 순환 타겟 스트림 풀
    const ROMAN_INPUTS = "MCMLXXXIV,MMXXVI,CDXCV,CXXIV,MCMXCIX,DCCXLVI".split(",");

    // DOM 캐싱 (HDC 0 고정 메모리 타겟)
    const domRawStream = document.getElementById('rawStream');
    const domMatrixLines = document.getElementById('matrixLines');
    const domDecodeState = document.getElementById('decodeState');
    const domAudioFreq = document.getElementById('audioFreq');
    const domDecimalValue = document.getElementById('decimalValue');

    // 가청화 레지스터
    let audioCtx = null, oscillator = null, gainNode = null;

    let systemClock = 0;
    let poolIdx = 0;
    let currentStep = 0; 
    let currentRomanStr = "";

    // 2. 오디오 가청화 시스템 기동
    window.addEventListener('click', () => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            oscillator.type = 'square'; // 레지스터 로직 변환을 상징하는 직각 펄스 사각파
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }
    });

    // 3. 메인 오토마타 가속 디코딩 루프 (60Hz V-Sync 동기화)
    function runRomanEngine() {
        systemClock++;

        // 20프레임마다 순차적으로 자릿수 레지스터 가속 추적 가시화
        if ((systemClock % 20) === 0) {
            
            if (currentStep === 0) {
                // [원시 문자열 버퍼 인출 및 캐싱]
                currentRomanStr = ROMAN_INPUTS[poolIdx % ROMAN_INPUTS.length];
                domRawStream.innerText = "ROMAN STREAM: " + currentRomanStr;
                domMatrixLines.innerHTML = '';
                domDecodeState.innerText = "STREAM FETCH";
                domDecodeState.style.color = "#8892b0";
                domDecimalValue.innerText = "0";
                
                if (audioCtx) {
                    oscillator.frequency.setValueAtTime(330, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
                }
                currentStep = 1;

            } else if (currentStep === 1) {
                // [비트 가중치 행렬 다이렉트 투영]
                // 각 로마 문자를 고유 정수 물리량(알맹이) 배열로 1차 복제 포인팅
                let valArray = [];
                for(let i=0; i<currentRomanStr.length; i++) {
                    valArray.push(ROMAN_MAP[currentRomanStr[i]]);
                }

                // 룩업 테이블 기반 초고속 대치 디코딩 (if문 없는 감산/가산 결합)
                let totalSum = 0;
                let stepsHtml = '';

                for(let i=0; i<valArray.length; i++) {
                    const currentVal = valArray[i];
                    // 다음 비트 껍질과의 크기 관계를 비트 부호로 판별
                    // if 대신 삼항 연산 연동 포인터 처리
                    const nextVal = valArray[i + 1] || 0;
                    
                    if (currentVal < nextVal) {
                        // 앞의 자릿수가 뒤보다 작으면 감산 법칙 패턴 매칭 (Nm = Nm)
                        totalSum -= currentVal;
                        stepsHtml += `<div class="bit-layer">[-] BIT MASK (Address ${i}): -${currentVal} (${currentRomanStr[i]})</div>`;
                    } else {
                        // 그 외의 경우 고속 가산 정렬
                        totalSum += currentVal;
                        stepsHtml += `<div class="bit-layer">[+] BIT MASK (Address ${i}): +${currentVal} (${currentRomanStr[i]})</div>`;
                    }
                }

                domMatrixLines.innerHTML = stepsHtml;
                domDecimalValue.innerText = totalSum;
                domDecodeState.innerText = "LUT MATCH COMPLETE";
                domDecodeState.style.color = "#00ffcc";

                // 가청화 변조: 해시 결과값의 크기에 비례하는 고유 주파수 출력
                if (audioCtx) {
                    const resultFreq = 440 + (totalSum % 600);
                    oscillator.frequency.setValueAtTime(resultFreq, audioCtx.currentTime);
                    domAudioFreq.innerText = `${resultFreq | 0}Hz`;
                }

                currentStep = 2;

            } else {
                // [생명 순환 대기 및 다음 인덱스 포인터 스위칭]
                if (audioCtx) gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                poolIdx++;
                currentStep = 0;
                systemClock = -30; // 가시성 유지를 위한 30프레임 홀딩 장벽
            }
        }

        requestAnimationFrame(runRomanEngine);
    }

    // 가속기 시동
    requestAnimationFrame(runRomanEngine);
</script>
</body>
</html>
