<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1MB Pure Matching Info File Generator</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 30px; background-color: #f4f6f9; }
        .card { background: white; padding: 25px; border-radius: 8px; border: 1px solid #dee2e6; max-width: 550px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        button { padding: 12px 20px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-purple { background-color: #6f42c1; }
        .btn-purple:hover { background-color: #593b99; }
        .info { font-size: 13px; color: #6c757d; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pure Matching Info Generator (1MB)</h2>
        <p>숫자 데이터와 레이블을 모두 제외하고, 오직 <strong>요청하신 매칭 포맷의 인덱스 기록</strong>으로만 가득 채운 1MB 파일을 생성합니다.</p>
        
        <!-- 새롭게 추가된 전용 버튼 -->
        <button class="btn-purple" onclick="generate1MBPureMatchingFile()">💾 순수 매칭 포맷 1MB 파일 다운로드</button>
        
        <div class="info">
            • <strong>출력 형식 예시:</strong> 매칭:[F7(L1) / F8(L2) / F15(L4)]<br>
            • 정확히 1,048,576 바이트 크기가 될 때까지 무작위 조합 행이 끊임없이 연결되어 생성됩니다.
        </div>
    </div>

    <script>
        // 4! 순열 연산 유틸 함수
        function getPermutations(arr) {
            let result = [];
            function permute(current, remaining) {
                if (remaining.length === 0) { result.push(current); return; }
                for (let i = 0; i < remaining.length; i++) {
                    permute([...current, remaining[i]], remaining.filter((_, idx) => idx !== i));
                }
            }
            permute([], arr);
            return result;
        }

        function generate1MBPureMatchingFile() {
            // 1. 역추적을 위한 가상 풀(Pool) 사전 구성
            let rowLookupTable = {}; 
            let fIndex = 1;

            for (let i = 1; i <= 4; i++) {
                for (let j = 1; j <= 4; j++) {
                    let r1 = `${i}${j}11 ${i}${j}12 ${i}${j}13 ${i}${j}14`;
                    let r2 = `${i}${j}21 ${i}${j}22 ${i}${j}23 ${i}${j}24`;
                    let r3 = `${i}${j}31 ${i}${j}32 ${i}${j}33 ${i}${j}34`;
                    let r4 = `${i}${j}41 ${i}${j}42 ${i}${j}43 ${i}${j}44`;
                    
                    let baseRows = [r1, r2, r3, r4];
                    let allPermutations = getPermutations(baseRows);
                    
                    for (let k = 0; k < 6; k++) {
                        let selectedRows = allPermutations[k * 4]; 
                        let fName = `F${fIndex}`;
                        
                        selectedRows.forEach((rowStr, lineIdx) => {
                            if (!rowLookupTable[rowStr]) rowLookupTable[rowStr] = [];
                            rowLookupTable[rowStr].push(`${fName}(L${lineIdx + 1})`);
                        });
                        fIndex++;
                    }
                }
            }

            // 2. 무작위 매칭 포맷 텍스트 배열 빌드 (1MB 제한)
            let fileContent = "";
            let allValidRows = Object.keys(rowLookupTable);
            const TARGET_SIZE = 1024 * 1024; // 1,048,576 바이트
            let encoder = new TextEncoder();
            let currentBytes = 0;

            while (currentBytes < TARGET_SIZE) {
                // 임의의 유효 데이터를 선정하여 그것의 매칭 리스트 문자열을 추출
                let randomRow = allValidRows[Math.floor(Math.random() * allValidRows.length)];
                let matchedInfo = rowLookupTable[randomRow].join(" / ");
                
                // 요청하신 포맷 형식 고정 : 매칭:[Fxx(Lx) / Fxx(Lx)]
                let lineToAdd = `매칭:[${matchedInfo}]\n`;
                let lineBytes = encoder.encode(lineToAdd).length;

                if (currentBytes + lineBytes <= TARGET_SIZE) {
                    fileContent += lineToAdd;
                    currentBytes += lineBytes;
                } else {
                    // 미세하게 남는 여백 바이트는 개행문자로 채워 단위를 정확하게 보정
                    let finalDiff = TARGET_SIZE - currentBytes;
                    fileContent += "\n".repeat(finalDiff);
                    break;
                }
            }

            // 파일 다운로드 작동
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "pure_matching_format_1MB.txt");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
