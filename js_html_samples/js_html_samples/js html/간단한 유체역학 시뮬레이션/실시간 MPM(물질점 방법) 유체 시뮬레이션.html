<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가로 세로 양방향 균형 MPM 시뮬레이션</title>
    <style>
        body { margin: 0; background: #0c0d14; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
        canvas { display: block; margin: 20px auto; background: #05060c; border: 2px solid #00ffcc; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); }
        h1 { margin-top: 20px; font-size: 22px; color: #00ffcc; }
        p { color: #8f95d3; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>2D 가로·세로 완전 독립형 MPM 시뮬레이션</h1>
    <p>Y축 응력 수식을 완벽히 매핑하여, 가로뿐만 아니라 세로 방향으로도 겹치지 않고 탱탱하게 튕깁니다.</p>
    <canvas id="mpmCanvas"></canvas>

<script>
const canvas = document.getElementById('mpmCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 500;
canvas.height = 500;

//--- 시뮬레이션 환경 변수 ---
const GRID_SIZE = 40;                       
const CELL_SIZE = canvas.width / GRID_SIZE; 
const DT = 0.1;                            
const GRAVITY = 0.25; 

//--- 비압축성 및 응집 균형 파라미터 ---
const REST_DENSITY = 2.0;                   
const BULK_MODULUS = 22.0; // 비압축성 복원력 조정
const COHESION = 3.5;      // 인력 밸런싱
const DAMPING = 0.02;                       

const grid = [];
for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
    grid.push({ mass: 0, vx: 0, vy: 0 });
}

function nodeIdx(x, y) { 
    let gx = Math.max(0, Math.min(GRID_SIZE - 1, x));
    let gy = Math.max(0, Math.min(GRID_SIZE - 1, y));
    return gx + gy * GRID_SIZE; 
}

const particles = [];
const startX = 12;
const startY = 8;
const numP_X = 20;
const numP_Y = 20;

for (let i = 0; i < numP_X; i++) {
    for (let j = 0; j < numP_Y; j++) {
        particles.push({
            x: startX + i * 0.45 + (Math.random() - 0.5) * 0.05,
            y: startY + j * 0.45 + (Math.random() - 0.5) * 0.05,
            vx: 0, vy: 0,
            mass: 1.0,
            stress: 0,
            density: 0
        });
    }
}

let isMouseDown = false;
let mouseGridX = -1000;
let mouseGridY = -1000;

function simulateMPM() {
    for (let i = 0; i < grid.length; i++) {
        grid[i].mass = 0; grid[i].vx = 0; grid[i].vy = 0;
    }

    // [고착 방지 1단계] 가로/세로(dx, dy) 모든 방향 점대점 척력 배타 처리
    for (let i = 0; i < particles.length; i++) {
        let p1 = particles[i];
        for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dx = p1.x - p2.x;
            let dy = p1.y - p2.y;
            let dist2 = dx * dx + dy * dy;
            let minDist = 0.35; // 최소 독립 보장 반경 확장
            
            if (dist2 < minDist * minDist && dist2 > 0.0001) {
                let dist = Math.sqrt(dist2);
                let push = (minDist - dist) * 0.2; 
                let pushX = (dx / dist) * push;
                let pushY = (dy / dist) * push;
                
                // 가로 세로 위치 및 속도 벡터에 동일 가중치 배분 분리
                p1.x += pushX; p1.y += pushY;
                p2.x -= pushX; p2.y -= pushY;
                p1.vx += pushX * 0.5; p1.vy += pushY * 0.5;
                p2.vx -= pushX * 0.5; p2.vy -= pushY * 0.5;
            }
        }
    }

    // 1단계: P2G
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        
        p.x = Math.max(3, Math.min(GRID_SIZE - 4, p.x));
        p.y = Math.max(3, Math.min(GRID_SIZE - 4, p.y));

        // 마우스 파괴력 (사방 구형 척력 밀어내기)
        if (isMouseDown) {
            let dx = p.x - mouseGridX;
            let dy = p.y - mouseGridY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let forceRadius = 5.0; 

            if (dist < forceRadius && dist > 0.01) {
                let pushForce = (1.0 - (dist / forceRadius)) * 15.0;
                p.vx += (dx / dist) * pushForce;
                p.vy += (dy / dist) * pushForce;
            }
        }

        let cx = Math.round(p.x);
        let cy = Math.round(p.y);

        let wx = [1 - Math.abs(cx - p.x), Math.max(0, 1 - Math.abs(cx + 1 - p.x)), Math.max(0, 1 - Math.abs(cx - 1 - p.x))];
        let wy = [1 - Math.abs(cy - p.y), Math.max(0, 1 - Math.abs(cy + 1 - p.y)), Math.max(0, 1 - Math.abs(cy - 1 - p.y))];

        let density = 0;
        for (let sx = 0; sx < 3; sx++) {
            for (let sy = 0; sy < 3; sy++) {
                density += (wx[sx] || 0) * (wy[sy] || 0);
            }
        }
        p.density = Math.max(0.1, density);

        // 비압축 체적 상태 방정식
        let p_repulsion = BULK_MODULUS * Math.pow(p.density / REST_DENSITY, 4); 
        let p_cohesion = -COHESION * p.density; 
        p.stress = -(p_repulsion + p_cohesion);

        // 3x3 격자로 정보 분산 투사
        for (let sx = -1; sx <= 1; sx++) {
            for (let sy = -1; sy <= 1; sy++) {
                let weight = (wx[sx + 1] || 0) * (wy[sy + 1] || 0);
                if (weight <= 0) continue;

                let nIdx = nodeIdx(cx + sx, cy + sy);
                let node = grid[nIdx];
                if (!node) continue;

                node.mass += weight * p.mass;
                node.vx += weight * p.mass * p.vx;
                node.vy += weight * p.mass * p.vy;

                // ★ [핵심 버그 수정] 가로(vx)와 세로(vy) 격자 힘 텐서에 응력을 고르게 가산
                // 기존 코드는 가로축에만 격자 응력을 더해 세로 압축 저항이 제대로 걸리지 않았음
                let boundedStress = Math.max(-12, Math.min(12, p.stress));
                node.vx += DT * boundedStress * weight;
                node.vy += DT * boundedStress * weight; 
            }
        }
    }

    // 2단계: 격자 연산
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            let idx = x + y * GRID_SIZE;
            let node = grid[idx];

            if (node && node.mass > 0) {
                node.vx /= node.mass;
                node.vy /= node.mass;
                node.vy += GRAVITY * DT;

                // 벽면 반발 및 마찰 고도화
                if (x < 3 && node.vx < 0) node.vx = -node.vx * 0.3;
                if (x > GRID_SIZE - 4 && node.vx > 0) node.vx = -node.vx * 0.3;
                
                if (y < 3 && node.vy < 0) node.vy = 0;
                if (y > GRID_SIZE - 4 && node.vy > 0) {
                    node.vy = -node.vy * 0.05; 
                    node.vx *= 0.8; 
                }
            }
        }
    }

    // 3단계: G2P
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        
        let cx = Math.round(p.x);
        let cy = Math.round(p.y);

        let wx = [1 - Math.abs(cx - p.x), Math.max(0, 1 - Math.abs(cx + 1 - p.x)), Math.max(0, 1 - Math.abs(cx - 1 - p.x))];
        let wy = [1 - Math.abs(cy - p.y), Math.max(0, 1 - Math.abs(cy + 1 - p.y)), Math.max(0, 1 - Math.abs(cy - 1 - p.y))];

        let new_vx = 0;
        let new_vy = 0;

        for (let sx = -1; sx <= 1; sx++) {
            for (let sy = -1; sy <= 1; sy++) {
                let weight = (wx[sx + 1] || 0) * (wy[sy + 1] || 0);
                if (weight <= 0) continue;

                let nIdx = nodeIdx(cx + sx, cy + sy);
                let node = grid[nIdx];
                if (node) {
                    new_vx += weight * node.vx;
                    new_vy += weight * node.vy;
                }
            }
        }

        p.vx = Math.max(-12, Math.min(12, new_vx * (1 - DAMPING)));
        p.vy = Math.max(-12, Math.min(12, new_vy * (1 - DAMPING)));
        
        // 가로/세로 성분 대칭 무작위 열진동 분산
        p.x += p.vx * DT + (Math.random() - 0.5) * 0.003;
        p.y += p.vy * DT + (Math.random() - 0.5) * 0.003;

        p.x = Math.max(3, Math.min(GRID_SIZE - 4, p.x));
        p.y = Math.max(3, Math.min(GRID_SIZE - 4, p.y));
    }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 입자 드로잉
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        ctx.beginPath();
        // 알알이 알갱이들이 잘 식별되도록 둥글고 뚜렷하게 렌더링
        ctx.arc(p.x * CELL_SIZE, p.y * CELL_SIZE, 3.8, 0, Math.PI * 2);
        
        if(p.density > REST_DENSITY + 0.4) {
            ctx.fillStyle = "#ffff00"; // 가로세로 압축 방어가 강하게 걸린 중심부
        } else {
            ctx.fillStyle = "#00ffcc"; // 안정 상태 영역
        }
        ctx.fill();
    }

    if (isMouseDown) {
        ctx.beginPath();
        ctx.arc(mouseGridX * CELL_SIZE, mouseGridY * CELL_SIZE, 5.0 * CELL_SIZE, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(0, 255, 204, 0.4)"; 
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

function loop() {
    simulateMPM();
    render();
    requestAnimationFrame(loop);
}

function updateMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    mouseGridX = (e.clientX - rect.left) / CELL_SIZE;
    mouseGridY = (e.clientY - rect.top) / CELL_SIZE;
}

canvas.addEventListener('mousedown', (e) => {
    isMouseDown = true;
    updateMousePos(e);
});
canvas.addEventListener('mousemove', (e) => {
    updateMousePos(e); 
});
window.addEventListener('mouseup', () => {
    isMouseDown = false;
    mouseGridX = -1000;
    mouseGridY = -1000;
});

loop();
</script>
</body>
</html>
