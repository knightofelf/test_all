<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Offline HDR Renderer</title>
  <style>
    body { margin:0; overflow:hidden; background:#000; }
    canvas { display:block; }
  </style>
</head>
<body>
<div id="loading">엔진 초기화 중...</div>

<script>
  // 최소 THREE 객체 직접 정의 (렌더링에 필요한 부분만)
  const THREE = {
    Scene: function(){ this.objects=[]; this.add=o=>this.objects.push(o); this.background=null; this.environment=null; },
    PerspectiveCamera: function(fov,aspect,near,far){ this.aspect=aspect; this.updateProjectionMatrix=function(){}; },
    WebGLRenderer: function(){ 
      this.domElement=document.createElement('canvas'); 
      this.ctx=this.domElement.getContext('2d'); 
      this.setSize=(w,h)=>{this.domElement.width=w;this.domElement.height=h}; 
      this.render=(scene,camera)=>{
        const ctx=this.ctx;
        ctx.fillStyle='#000'; ctx.fillRect(0,0,this.domElement.width,this.domElement.height);
        // 단순 구체 반사 시뮬레이션
        const cx=this.domElement.width/2, cy=this.domElement.height/2, r=Math.min(cx,cy)*0.4;
        let grad=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.05,cx,cy,r);
        grad.addColorStop(0,'#fff');
        grad.addColorStop(0.2,'#aaa');
        grad.addColorStop(0.6,'#333');
        grad.addColorStop(1,'#000');
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
      };
    }
  };

  // 씬/카메라/렌더러 초기화
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 렌더 루프
  function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
    document.getElementById('loading').style.display='none';
  }
  animate();

  window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
</script>
</body>
</html>
