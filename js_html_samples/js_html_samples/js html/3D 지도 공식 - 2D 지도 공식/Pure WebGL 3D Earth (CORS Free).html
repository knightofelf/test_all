<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Pure WebGL 3D Earth (CORS Free)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>

    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');

        if (!gl) {
            alert('WebGL을 지원하지 않는 브라우저입니다.');
        }

        // 1. 버텍스 셰이더
        const vsSource = `
            attribute vec4 aPosition;
            attribute vec2 aTexCoord;
            varying vec2 vTexCoord;
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            void main() {
                gl_Position = uProjectionMatrix * uModelViewMatrix * aPosition;
                vTexCoord = aTexCoord;
            }
        `;

        // 2. 프래그먼트 셰이더
        const fsSource = `
            precision mediump float;
            varying vec2 vTexCoord;
            uniform sampler2D uSampler;
            void main() {
                gl_FragColor = texture2D(uSampler, vTexCoord);
            }
        `;

        // 셰이더 프로그램 초기화 함수
        function initShaderProgram(gl, vsSource, fsSource) {
            const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
            const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);
            const shaderProgram = gl.createProgram();
            gl.attachShader(shaderProgram, vertexShader);
            gl.attachShader(shaderProgram, fragmentShader);
            gl.linkProgram(shaderProgram);
            return shaderProgram;
        }

        function loadShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            return shader;
        }

        const shaderProgram = initShaderProgram(gl, vsSource, fsSource);
        gl.useProgram(shaderProgram);

        // 3. 3D 구체(지구) 데이터 생성 (수학적 맵핑)
        const positions = [];
        const textureCoords = [];
        const indices = [];

        const latitudeBands = 40;
        const longitudeBands = 40;
        const radius = 2.2;

        for (let latNumber = 0; latNumber <= latitudeBands; latNumber++) {
            let theta = latNumber * Math.PI / latitudeBands;
            let sinTheta = Math.sin(theta);
            let cosTheta = Math.cos(theta);

            for (let longNumber = 0; longNumber <= longitudeBands; longNumber++) {
                let phi = longNumber * 2 * Math.PI / longitudeBands;
                let sinPhi = Math.sin(phi);
                let cosPhi = Math.cos(phi);

                let x = cosPhi * sinTheta;
                let y = cosTheta;
                let z = sinPhi * sinTheta;
                let u = 1 - (longNumber / longitudeBands);
                let v = 1 - (latNumber / latitudeBands);

                positions.push(radius * x, radius * y, radius * z);
                textureCoords.push(u, v);
            }
        }

        for (let latNumber = 0; latNumber < latitudeBands; latNumber++) {
            for (let longNumber = 0; longNumber < longitudeBands; longNumber++) {
                let first = (latNumber * (longitudeBands + 1)) + longNumber;
                let second = first + longitudeBands + 1;
                indices.push(first, second, first + 1);
                indices.push(second, second + 1, first + 1);
            }
        }

        function createBuffer(gl, target, data) {
            const buffer = gl.createBuffer();
            gl.bindBuffer(target, buffer);
            gl.bufferData(target, data, gl.STATIC_DRAW);
            return buffer;
        }

        const positionBuffer = createBuffer(gl, gl.ARRAY_BUFFER, new Float32Array(positions));
        const textureCoordBuffer = createBuffer(gl, gl.ARRAY_BUFFER, new Float32Array(textureCoords));
        const indexBuffer = createBuffer(gl, gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices));

        const aPosition = gl.getAttribLocation(shaderProgram, 'aPosition');
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(aPosition);

        const aTexCoord = gl.getAttribLocation(shaderProgram, 'aTexCoord');
        gl.bindBuffer(gl.ARRAY_BUFFER, textureCoordBuffer);
        gl.vertexAttribPointer(aTexCoord, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(aTexCoord);

        // 4. [해결책] 자바스크립트로 가상 지도 이미지(텍스처) 내부 생성
        // 외부 이미지를 안 쓰고 직접 캔버스에 세계 지도를 그려서 텍스처로 사용합니다.
        const textCanvas = document.createElement('canvas');
        textCanvas.width = 1024;
        textCanvas.height = 512;
        const ctx = textCanvas.getContext('2d');

        // 바다 색상 배경 채우기
        ctx.fillStyle = '#1a3c73';
        ctx.fillRect(0, 0, 1024, 512);

        // 대륙 형태 그리기 (수학적 노이즈를 간소화한 임의 대륙 생성 패턴)
        ctx.fillStyle = '#2d7a47';
        // 아시아/유럽/아프리카 덩어리
        ctx.beginPath(); ctx.arc(400, 200, 160, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(320, 280, 120, 0, Math.PI * 2); ctx.fill();
        // 아메리카 대륙
        ctx.beginPath(); ctx.arc(800, 180, 110, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(850, 340, 100, 0, Math.PI * 2); ctx.fill();
        // 오세아니아 대륙
        ctx.beginPath(); ctx.arc(520, 380, 70, 0, Math.PI * 2); ctx.fill();
        
        // 지도 격자 선 추가 (지구본 느낌 연출)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        for(let i=0; i<1024; i+=128) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,512); ctx.stroke(); }
        for(let j=0; j<512; j+=64) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(1024,j); ctx.stroke(); }

        // 생성한 캔버스 이미지를 WebGL 텍스처로 바인딩
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
        gl.generateMipmap(gl.TEXTURE_2D);

        // 5. 투영 행렬 연산 유틸리티
        function getPerspectiveMatrix(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            const nf = 1 / (near - far);
            return [
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) * nf, -1,
                0, 0, (2 * far * near) * nf, 0
            ];
        }

        // 6. 애니메이션 렌더 룹
        let rotationY = 0;
        const uProjectionMatrix = gl.getUniformLocation(shaderProgram, 'uProjectionMatrix');
        const uModelViewMatrix = gl.getUniformLocation(shaderProgram, 'uModelViewMatrix');

        function render() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);

            gl.clearColor(0.0, 0.0, 0.0, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);

            const projectionMatrix = getPerspectiveMatrix(45 * Math.PI / 180, canvas.width / canvas.height, 0.1, 100.0);
            
            // 지구 자동 자전 연산
            rotationY += 0.004;
            const c = Math.cos(rotationY);
            const s = Math.sin(rotationY);
            const modelViewMatrix = [
                c, 0, -s, 0,
                0, 1,  0, 0,
                s, 0,  c, 0,
                0, 0, -6, 1
            ];

            gl.uniformMatrix4fv(uProjectionMatrix, false, new Float32Array(projectionMatrix));
            gl.uniformMatrix4fv(uModelViewMatrix, false, new Float32Array(modelViewMatrix));

            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
            gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
