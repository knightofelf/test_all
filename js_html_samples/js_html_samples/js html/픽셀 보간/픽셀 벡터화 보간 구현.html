<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>픽셀 벡터화 보간 구현</title>
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .canvas-container { display: flex; gap: 40px; margin-top: 20px; }
        canvas { border: 2px solid #555; background: #000; image-rendering: pixelated; }
        .label { text-align: center; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Pixel Vectorization Interpolation</h1>
    <div class="canvas-container">
        <div>
            <canvas id="srcCanvas" width="16" height="16"></canvas>
            <div class="label">원본 픽셀 (16x16)</div>
        </div>
        <div>
            <canvas id="destCanvas" width="512" height="512"></canvas>
            <div class="label">벡터화 보간 확대 (512x512)</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
