<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Euler Pentagonal Number Theorem Vertical</title>
  <style>
    canvas { border: 1px solid #333; }
  </style>
</head>
<body>
  <h2>오각수 항 세로 시각화</h2>
  <label>항 개수 입력: <input type="number" id="num" value="20"></label>
  <button onclick="draw()">그리기</button>
  <canvas id="canvas" width="400" height="800"></canvas>

  <script>
    function pentagonal(k) {
      return (k * (3 * k - 1)) / 2;
    }

    function draw() {
      const n = parseInt(document.getElementById("num").value);
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // y축 그리기
      ctx.beginPath();
      ctx.moveTo(200, 20);
      ctx.lineTo(200, 780);
      ctx.stroke();

      // 항들을 점으로 표시
      for (let k = -n; k <= n; k++) {
        const p = pentagonal(k);
        if (p >= 0 && p < 750) {
          const y = 30 + p; // 지수 값에 따라 y 위치
          const x = 200 + (k % 2 === 0 ? -50 : 50); // 부호에 따라 좌/우
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, 2 * Math.PI);
          ctx.fillStyle = (k % 2 === 0 ? "blue" : "red");
          ctx.fill();
          ctx.fillText(p, x + 10, y + 5);
        }
      }
    }
  </script>
</body>
</html>
