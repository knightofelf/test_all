<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>동적 RGB 변형/복원 + 원본 BigInt 검증</title>
  <style>
    .logo {
      display: grid;
      grid-template-columns: repeat(auto-fill, 100px);
      grid-auto-rows: 100px;
      gap: 5px;
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>BigInt → RGB 변형/복원 + 원본 전체 검증</h3>
  <input id="bigVal" type="text" 
         value="587439857094370597203475092374509843750943" 
         size="80">
  <button onclick="applyTransform()">변형 적용</button>
  <button onclick="restoreTransform()">복원</button>
  <button onclick="recoverBigInt()">원본 BigInt 구하기</button>

  <div id="logo" class="logo"></div>

  <script>
    let extractedColors = null;

    // BigInt → RGB 배열 (동적 셀 개수)
    function decodeDynamic(val) {
      const bitLength = val.toString(2).length;
      const cellCount = Math.ceil(bitLength / 24); // 필요한 셀 개수
      let colors = [];
      for (let i = 0; i < cellCount; i++) {
        const r = Number((val >> BigInt(24*i)) & 0xFFn);
        const g = Number((val >> BigInt(24*i+8)) & 0xFFn);
        const b = Number((val >> BigInt(24*i+16)) & 0xFFn);
        colors.push([r,g,b]);
      }
      return colors;
    }

    // RGB 배열 → BigInt
    function encodeDynamic(colors) {
      let val = 0n;
      for (let i = 0; i < colors.length; i++) {
        const [r,g,b] = colors[i];
        val |= (BigInt(r) << BigInt(24*i)) |
               (BigInt(g) << BigInt(24*i+8)) |
               (BigInt(b) << BigInt(24*i+16));
      }
      return val;
    }

    function applyTransform() {
      const val = BigInt(document.getElementById("bigVal").value);
      extractedColors = decodeDynamic(val);

      const logo = document.getElementById("logo");
      logo.innerHTML = ""; // 초기화
      extractedColors.forEach((c,i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.style.background = `rgb(${c.join(",")})`;
        cell.textContent = `(${c.join(",")})`;
        logo.appendChild(cell);
      });

      console.log("변형 적용 시 추출된 RGB 배열:", extractedColors);
    }

    function restoreTransform() {
      if (!extractedColors) {
        console.log("먼저 변형을 적용하세요.");
        return;
      }

      const logo = document.getElementById("logo");
      logo.innerHTML = "";
      extractedColors.forEach((c,i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.style.background = `rgb(${c.join(",")})`;
        cell.textContent = `(${c.join(",")})`;
        logo.appendChild(cell);
      });

      console.log("복원된 RGB 배열:", extractedColors);
    }

    function recoverBigInt() {
      if (!extractedColors) {
        console.log("먼저 변형을 적용하세요.");
        return;
      }

      const recoveredVal = encodeDynamic(extractedColors);
      console.log("복원된 BigInt:", recoveredVal.toString());
      console.log("원본과 동일한지:", 
                  recoveredVal.toString() === document.getElementById("bigVal").value);
    }
  </script>
</body>
</html>
