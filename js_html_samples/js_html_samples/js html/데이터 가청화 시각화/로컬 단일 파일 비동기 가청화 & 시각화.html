<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로컬 단일 파일 비동기 가청화 & 시각화</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; transition: background 0.1s; }
        .container { max-width: 600px; margin: 30px auto; background: #222; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #007bff; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; }
        button:hover { background: #0056b3; }
        .monitor { display: flex; justify-content: space-between; margin: 20px 0; }
        .box { background: #333; padding: 15px; border-radius: 6px; width: 45%; text-align: center; }
        .box div { font-size: 28px; font-weight: bold; font-family: monospace; margin-top: 5px; }
        .log-area { background: #000; padding: 15px; border-radius: 6px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ 로컬 무설치 비동기 가청화 & 시각화</h2>
    <p style="color: #aaa; font-size: 13px;">보안 서버(HTTP) 없이 로컬 파일(.html)을 더블클릭하는 것만으로 오디오 백그라운드 스레드가 작동합니다.</p>
    <button id="toggleBtn">시스템 엔진 가동</button>
    
    <div class="monitor">
        <div class="box">
            <span style="color: #007bff;">현재 CPU</span>
            <div id="cpuText">0%</div>
        </div>
        <div class="box">
            <span style="color: #dc3545;">에러 상태</span>
            <div id="errorText" style="color: #28a745;">NORMAL</div>
        </div>
    </div>

    <div class="log-area" id="logArea">엔진을 시작해 주세요.</div>
</div>

<script>
let audioCtx = null;
let sonifierNode = null;
let isRunning = false;
let dataLoop = null;

// [보안 우회 핵심] 오디오 스레드 내부에서 실행될 코드를 별도 파일 대신 문자열로 정의합니다.
const workerCode = `
class DataSonifierProcessor extends AudioWorkletProcessor {
    constructor() {
        super();
        this.phase = 0;
        this.currentHz = 150;
        this.volume = 0.1;

        this.port.onmessage = (event) => {
            const { cpu, error } = event.data;
            this.currentHz = 100 + (cpu * 3); // 100Hz ~ 400Hz

            if (error) {
                this.volume = 0.25;
                this.currentHz = 440; // 에러 경보음 주파수
            } else {
                this.volume = 0.08;
            }
        };
    }

    process(inputs, outputs, parameters) {
        const output = outputs[0];
        const channel = output[0]; // 모노 채널

        if (!channel) return true;

        for (let i = 0; i < channel.length; i++) {
            channel[i] = Math.sin(this.phase) * this.volume;
            this.phase += (2 * Math.PI * this.currentHz) / sampleRate;
        }
        return true;
    }
}
registerProcessor('data-sonifier-processor', DataSonifierProcessor);
`;

document.getElementById('toggleBtn').addEventListener('click', async () => {
    if (isRunning) {
        // 엔진 정지
        clearInterval(dataLoop);
        if (audioCtx) await audioCtx.suspend();
        document.body.style.background = "#111";
        document.getElementById('toggleBtn').innerText = "시스템 엔진 가동";
        document.getElementById('toggleBtn').style.background = "#007bff";
        isRunning = false;
        return;
    }

    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 💡 핵심 로컬 우회 기법: 자바스크립트 문자열을 가상 파일(Blob) URL로 변환하여 브라우저 CORS 보안 정책을 통과합니다.
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const moduleUrl = URL.createObjectURL(blob);
        
        try {
            await audioCtx.audioWorklet.addModule(moduleUrl);
            sonifierNode = new AudioWorkletNode(audioCtx, 'data-sonifier-processor');
            sonifierNode.connect(audioCtx.destination);
        } catch (e) {
            console.error(e);
            alert('오디오 가속 스레드 생성에 실패했습니다.');
            return;
        }
    } else {
        await audioCtx.resume();
    }

    isRunning = true;
    document.getElementById('toggleBtn').innerText = "엔진 정지";
    document.getElementById('toggleBtn').style.background = "#dc3545";

    // 0.5초 주기로 데이터 스트리밍 및 가청화 시작
    dataLoop = setInterval(streamData, 500);
});

function streamData() {
    const cpu = Math.floor(Math.random() * 100);
    const error = Math.random() < 0.15; // 15% 에러 확률

    // 오디오 백그라운드 스레드로 비동기 데이터 전달
    if (sonifierNode) {
        sonifierNode.port.postMessage({ cpu, error });
    }

    // 시각화 처리
    document.getElementById('cpuText').innerText = `${cpu}%`;
    const errNode = document.getElementById('errorText');
    const logArea = document.getElementById('logArea');
    const time = new Date().toLocaleTimeString();

    let logLine = `[${time}] CPU Usage: ${cpu}%`;

    if (error) {
        document.body.style.background = "#2a0808"; // 화면 빨갛게 번쩍
        errNode.innerText = "⚠️ ERROR";
        errNode.style.color = "#dc3545";
        logLine += ` <span style="color:#ffc107; font-weight:bold;">[ERR]</span>`;
    } else {
        document.body.style.background = "#111";
        errNode.innerText = "NORMAL";
        errNode.style.color = "#28a745";
    }

    logArea.innerHTML = logLine + "<br>" + logArea.innerHTML;
}
</script>

</body>
</html>
