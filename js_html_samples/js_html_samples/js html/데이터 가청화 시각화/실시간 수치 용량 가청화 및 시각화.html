<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 수치 용량 가청화 및 시각화</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; transition: background 0.1s; }
        .container { max-width: 650px; margin: 30px auto; background: #222; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { background: #28a745; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; }
        button:hover { background: #218838; }
        
        /* 메인 대시보드 격자 배치 */
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .box { background: #333; padding: 15px; border-radius: 6px; text-align: center; box-shadow: inset 0 0 8px rgba(0,0,0,0.3); }
        .box span { font-size: 13px; color: #aaa; font-weight: bold; }
        .box div { font-size: 24px; font-weight: bold; font-family: monospace; margin-top: 5px; }
        
        /* 대용량 데이터 전용 강조 박스 */
        .box.highlight { background: #1a2936; border: 1px solid #007bff; }
        .log-area { background: #000; padding: 15px; border-radius: 6px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 실시간 데이터 용량 모니터링 시스템</h2>
    <p style="color: #aaa; font-size: 13px;">I/O 가속 스케일에 맞춘 실시간 데이터 처리율(TPS) 및 누적 데이터 용량을 계산합니다.</p>
    <button id="toggleBtn">모니터링 시작</button>
    
    <div class="dashboard">
        <div class="box">
            <span style="color: #007bff;">현재 CPU 사용량</span>
            <div id="cpuText">0%</div>
        </div>
        <div class="box">
            <span style="color: #17a2b8;">실시간 처리율 (Throughput)</span>
            <div id="tpsText" style="color: #17a2b8;">0 TPS</div>
        </div>
        <div class="box highlight">
            <span style="color: #ffc107;">실시간 I/O 대역폭 (Bandwidth)</span>
            <div id="speedText" style="color: #ffc107;">0.00 KB/s</div>
        </div>
        <div class="box highlight">
            <span style="color: #28a745;">누적 처리 데이터 용량</span>
            <div id="totalSizeText" style="color: #28a745;">0.00 KB</div>
        </div>
    </div>

    <div class="box" style="width: 95%; margin-bottom: 20px; background: #2b1818;" id="errBox">
        <span style="color: #dc3545;">시스템 에러 상태</span>
        <div id="errorText" style="color: #28a745;">NORMAL</div>
    </div>

    <div class="log-area" id="logArea">버튼을 눌러 대시보드를 활성화해 주세요.</div>
</div>

<script>
let audioCtx = null;
let isRunning = false;
let dataLoop = null;

// 용량 계산을 위한 전역 변수
let totalBytesProcessed = 0; 

document.getElementById('toggleBtn').addEventListener('click', async () => {
    if (isRunning) {
        clearInterval(dataLoop);
        if (audioCtx) await audioCtx.suspend();
        document.body.style.background = "#111";
        document.getElementById('toggleBtn').innerText = "모니터링 시작";
        document.getElementById('toggleBtn').style.background = "#28a745";
        isRunning = false;
        return;
    }

    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } else {
        await audioCtx.resume();
    }

    isRunning = true;
    document.getElementById('toggleBtn').innerText = "모니터링 중지";
    document.getElementById('toggleBtn').style.background = "#dc3545";

    // 0.5초 주기로 데이터 연동 시작 (초당 2건 처리 구조)
    dataLoop = setInterval(runDashboard, 500);
});

function runDashboard() {
    // 1. 실시간 데이터 조건 설정
    const cpu = Math.floor(Math.random() * 100);
    const error = Math.random() < 0.15; // 15% 에러 확률
    
    // [수치 용량 계산] 1건당 발생하는 가상의 패킷 바이트 용량 무작위 생성 (1,500 ~ 65,535 바이트)
    const currentPacketBytes = Math.floor(Math.random() * (65535 - 1500 + 1)) + 1500;
    
    // 누적 총 용량 업데이트
    totalBytesProcessed += currentPacketBytes;

    // 2. [시각화] UI 수치 데이터 업데이트 및 포맷 변환
    document.getElementById('cpuText').innerText = `${cpu}%`;
    document.getElementById('tpsText').innerText = `2 TPS`; // 0.5초당 1건이므로 초당 2건 고정
    
    // 초당 대역폭 계산 (0.5초당 데이터이므로 * 2를 하여 초당 전송률 KB/s 환산)
    const speedKBs = ((currentPacketBytes * 2) / 1024).toFixed(2);
    document.getElementById('speedText').innerText = `${speedKBs} KB/s`;
    
    // 누적 데이터 표시 형식 변환 (KB 혹은 MB 단위)
    document.getElementById('totalSizeText').innerText = formatBytes(totalBytesProcessed);

    // 에러 UI 및 로그 업데이트
    const errNode = document.getElementById('errorText');
    const logArea = document.getElementById('logArea');
    const time = new Date().toLocaleTimeString();
    let logLine = `[${time}] CPU: ${cpu}% | 처리용량: +${(currentPacketBytes/1024).toFixed(1)}KB`;

    if (error) {
        document.body.style.background = "#2a0808";
        errNode.innerText = "⚠️ SYSTEM ERROR";
        errNode.style.color = "#dc3545";
        logLine += ` <span style="color:#ffc107; font-weight:bold;">[ERR]</span>`;
    } else {
        document.body.style.background = "#111";
        errNode.innerText = "NORMAL";
        errNode.style.color = "#28a745";
    }
    logArea.innerHTML = logLine + "<br>" + logArea.innerHTML;

    // 3. [가청화] 오디오 신호 발생
    if (audioCtx) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        if (error) {
            osc.type = 'sawtooth';
            osc.frequency.value = 440; 
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        } else {
            osc.type = 'sine';
            // 수치 정렬: 패킷 용량이 클수록 더 높은 주파수의 웅 소리가 나도록 연동
            osc.frequency.value = 100 + (currentPacketBytes / 200); 
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        }

        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    }
}

// 바이트 용량을 보기 좋게 가독성 높은 단위로 변환해 주는 함수
function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " Bytes";
    else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + " KB";
    else return (bytes / 1048576).toFixed(2) + " MB";
}
</script>

</body>
</html>
