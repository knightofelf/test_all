<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D Points Render</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // 기본 장면, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 중심 좌표
    const center = {x: 0, y: 0, z: 0};
    const r = 10; // 거리(반지름)
    const numPoints = 200;

    // 점들을 담을 Geometry
    const geometry = new THREE.BufferGeometry();
    const positions = [];

    for (let i = 0; i < numPoints; i++) {
      const theta = Math.random() * 2 * Math.PI;
      const phi = (Math.random() - 0.5) * Math.PI; // -π/2 ~ π/2
      const x = center.x + r * Math.cos(phi) * Math.cos(theta);
      const y = center.y + r * Math.cos(phi) * Math.sin(theta);
      const z = center.z + r * Math.sin(phi);
      positions.push(x, y, z);
    }

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

    // 점 재질
    const material = new THREE.PointsMaterial({ color: 0xff0000, size: 0.2 });
    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // 카메라 위치
    camera.position.z = 30;

    // 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);
      points.rotation.y += 0.002; // 회전 효과
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
