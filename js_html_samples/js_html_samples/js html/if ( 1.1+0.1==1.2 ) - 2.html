<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>소수점 1자리 출력</title>
</head>
<body>
  <div id="result1"></div>
  <div id="result2"></div>
  <div id="result3"></div>

  <script>
    let a = 1.1;
    let b = 0.1;
    let c = 1.2;

    let sum = a + b;

    // 소수점 1자리까지 반올림 (toFixed)
    let fixedSum = sum.toFixed(1);

    // Math.round 활용 (소수점 1자리까지)
    let roundedSum = Math.round(sum * 10) / 10;

    // 출력
    document.getElementById("result1").innerText = "원래 계산: " + sum;
    document.getElementById("result2").innerText = "toFixed(1): " + fixedSum;
    document.getElementById("result3").innerText = "Math.round: " + roundedSum;
  </script>
</body>
</html>
