<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>60FPS 슈팅 게임</title>
  <style>
    body { margin: 0; background: black; }
    canvas { display: block; margin: auto; background: #111; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // 플레이어
    const player = { x: 180, y: 550, width: 40, height: 20, speed: 5 };

    // 총알과 적
    const bullets = [];
    const enemies = [];

    // 키 입력
    const keys = {};
    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    // 총알 발사
    function shoot() {
      bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 7 });
    }

    // 적 생성
    function spawnEnemy() {
      const x = Math.random() * (canvas.width - 40);
      enemies.push({ x: x, y: 0, width: 40, height: 20, speed: 2 });
    }
    setInterval(spawnEnemy, 2000); // 2초마다 적 등장

    // 게임 루프 (60 FPS 고정)
    function gameLoop() {
      // 화면 초기화
      ctx.fillStyle = "#111";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 플레이어 이동
      if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
      if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;
      if (keys[" "]) { shoot(); keys[" "] = false; } // 스페이스바 발사

      // 플레이어 그리기
      ctx.fillStyle = "lime";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // 총알 이동 및 그리기
      ctx.fillStyle = "yellow";
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        if (b.y < 0) bullets.splice(i, 1);
      }

      // 적 이동 및 그리기
      ctx.fillStyle = "red";
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;
        ctx.fillRect(e.x, e.y, e.width, e.height);

        // 충돌 체크 (총알 vs 적)
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (b.x < e.x + e.width && b.x + b.width > e.x &&
              b.y < e.y + e.height && b.y + b.height > e.y) {
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            break;
          }
        }

        // 플레이어와 충돌
        if (player.x < e.x + e.width && player.x + player.width > e.x &&
            player.y < e.y + e.height && player.y + player.height > e.y) {
          alert("게임 오버!");
          document.location.reload();
        }
      }
    }

    // 60 FPS 실행 (1000ms / 60 ≈ 16.67ms)
    setInterval(gameLoop, 1000 / 120);
  </script>
</body>
</html>
