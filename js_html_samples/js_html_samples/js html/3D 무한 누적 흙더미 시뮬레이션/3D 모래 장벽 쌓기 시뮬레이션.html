<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 모래 장벽 쌓기 시뮬레이션</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            pointer-events: none; background: rgba(0,0,0,0.7); 
            padding: 15px; border-radius: 6px; z-index: 10;
        }
        h3 { margin: 0 0 5px 0; font-size: 16px; color: #fff; }
        p { margin: 0 0 5px 0; font-size: 12px; color: #ccc; }
        #count { font-weight: bold; color: #dfb76c; font-size: 14px; }
    </style>
    <!-- 정상 작동하는 핵심 CDN 주소 적용 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <div id="info">
        <h3>모래 장벽 시뮬레이션 (물리 충돌 완벽 수정)</h3>
        <p>마우스 드래그: 화면 회전 | 마우스 휠: 확대/축소</p>
        <div id="count">스폰된 모래알: 0 / 2500</div>
    </div>

    <script>
        // --- 1. 전역 변수 및 시뮬레이션 세팅 ---
        let scene, camera, renderer, world;
        const clock = new THREE.Clock();
        
        const physicsBodies = [];   
        const maxParticles = 2500;  // 무너지지 않는 벽을 쌓을 만큼의 충분한 입자 수
        let instancedMesh;          
        const dummy = new THREE.Object3D();

        // 흙더미 장벽의 둘레 범위 및 입자 설정
        const wallRadius = 2.0;      // 장벽 원 반지름
        const wallThickness = 0.5;   // 장벽 두께 변동폭
        const particleSize = 0.08;   // 모래알 반지름 크기

        // 고유 마찰 재질 명시 선언
        let sandMaterial, floorMaterial;

        // 마우스 화면 제어 변수
        let theta = 0, phi = Math.PI / 4, radius = 8;
        let isDragging = false, previousMousePosition = { x: 0, y: 0 };

        // --- 2. 초기화 함수 ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x141414);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 입체감을 위해 조명 배치 설정
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // [Cannon.js] 물리 엔진 초기화
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0); 

            // ** [버그 수정 완료] 재질 정의 및 명확한 접촉(Contact) 등록 **
            sandMaterial = new CANNON.Material('sandMat');
            floorMaterial = new CANNON.Material('floorMat');

            // 1) 모래 알갱이끼리 부딪힐 때의 마찰 성질 (서로 붙잡아 장벽을 이룸)
            const sandContact = new CANNON.ContactMaterial(sandMaterial, sandMaterial, {
                friction: 2.5,        // 마찰력을 대폭 강화하여 미끄러져 평평해짐 방지
                restitution: 0.0,     // 통통 튕기는 성질 차단
                contactEquationStiffness: 1e7,
                contactEquationRelaxation: 3
            });
            world.addContactMaterial(sandContact);

            // 2) 모래가 바닥 평면에 닿았을 때 미끄러지지 않게 고정
            const floorContact = new CANNON.ContactMaterial(floorMaterial, sandMaterial, {
                friction: 1.5,
                restitution: 0.0
            });
            world.addContactMaterial(floorContact);

            // 시각적/물리적 바닥 설치
            const floorGeo = new THREE.PlaneGeometry(30, 30);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            const floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            const floorBody = new CANNON.Body({
                mass: 0, 
                shape: new CANNON.Plane(),
                material: floorMaterial // 고유 바닥 재질 지정
            });
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);

            // 고성능 입자 렌더링용 InstancedMesh 생성
            const sandGeo = new THREE.SphereGeometry(particleSize, 4, 4); 
            const sandMat = new THREE.MeshStandardMaterial({ color: 0xc2a677, roughness: 1.0 }); // 황토/모래색
            instancedMesh = new THREE.InstancedMesh(sandGeo, sandMat, maxParticles);
            instancedMesh.castShadow = true;
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(instancedMesh);

            // 마우스 조작 리스너
            window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('wheel', onWindowWheel);
            window.addEventListener('resize', onWindowResize);
        }

        // --- 3. 원형 둘레 영역 낙하 유도 함수 ---
        function spawnSand() {
            if (physicsBodies.length >= maxParticles) return;

            // 삼각함수로 중앙을 완전히 비워둔 바깥 원형 테두리 좌표 생성
            const angle = Math.random() * Math.PI * 2;
            const r = wallRadius + (Math.random() * wallThickness - (wallThickness / 2));
            
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const y = 3.5 + (Math.random() * 2.0); // 균일 낙하를 위한 약간의 스폰 높이 편차

            const shape = new CANNON.Sphere(particleSize);
            const body = new CANNON.Body({
                mass: 0.2, // 입자 무게감 강화
                shape: shape,
                position: new CANNON.Vec3(x, y, z),
                material: sandMaterial // ** 핵심 조치: 생성되는 강체에 고마찰 모래 재질 명시 **
            });

            // ** [버그 수정 완료] 알갱이 무한 구름 현상을 잡는 회전/직선 제동(Damping) **
            body.linearDamping = 0.5;
            body.angularDamping = 0.7; // 높은 회전 댐핑으로 흘러내리는 흙더미 안정을 유도

            world.addBody(body);
            physicsBodies.push(body);

            document.getElementById('count').innerText = `스폰된 모래알: ${physicsBodies.length} / ${maxParticles}`;
        }

        // --- 4. 메인 시뮬레이션 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = Math.min(clock.getDelta(), 0.1);
            
            // 물리 시뮬레이션 프레임 전진
            world.step(1 / 60, deltaTime, 3);

            // 일시 과부하 방지를 위해 매 프레임당 5개씩 순차 스폰
            if (physicsBodies.length < maxParticles) {
                for(let i = 0; i < 5; i++) {
                    spawnSand();
                }
            }

            // 물리 좌표를 렌더링 행렬에 덮어쓰기
            for (let i = 0; i < physicsBodies.length; i++) {
                const body = physicsBodies[i];
                dummy.position.copy(body.position);
                dummy.quaternion.copy(body.quaternion);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            
            if (physicsBodies.length > 0) {
                instancedMesh.instanceMatrix.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        // --- 5. 화면 조작 보조 함수 부 ---
        function updateCameraPosition() {
            camera.position.x = radius * Math.sin(theta) * Math.cos(phi);
            camera.position.y = radius * Math.sin(phi);
            camera.position.z = radius * Math.cos(theta) * Math.cos(phi);
            camera.lookAt(0, 0.8, 0);
        }

        function onMouseMove(e) {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            theta -= deltaX * 0.007;
            phi = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, phi + deltaY * 0.007));

            previousMousePosition = { x: e.clientX, y: e.clientY };
            updateCameraPosition();
        }

        function onWindowWheel(e) {
            radius = Math.max(3, Math.min(20, radius + e.deltaY * 0.01));
            updateCameraPosition();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
    </script>
</body>
</html>
