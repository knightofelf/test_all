<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>그림자 계산기</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    label { display: block; margin-top: 10px; }
    input { padding: 5px; margin-top: 5px; width: 300px; }
    button { margin-top: 15px; padding: 8px 12px; }
    #result { margin-top: 20px; font-weight: bold; color: darkblue; }
  </style>
</head>
<body>
  <h2>그림자 계산기 (BigInt + Number 지원)</h2>
  
  <label>물체 높이 (m):</label>
  <input type="text" id="objectHeight" value="5982437598274359872345">

  <label>빛-물체 거리 (m):</label>
  <input type="text" id="lightToObject" value="3">

  <label>빛-바닥 거리 (m):</label>
  <input type="text" id="lightToGround" value="9">

  <label>그림자 길이 (m) [역계산용]:</label>
  <input type="text" id="shadowLength" value="0">

  <button onclick="calculateShadow()">그림자 길이 계산</button>
  <button onclick="calculateObject()">물체 높이 역계산</button>

  <div id="result"></div>

  <script>
    // 그림자 길이 계산 (물체 → 그림자)
    function calculateShadow() {
      const hStr = document.getElementById('objectHeight').value;
      const d1Str = document.getElementById('lightToObject').value;
      const d2Str = document.getElementById('lightToGround').value;

      try {
        // BigInt 모드
        const h = BigInt(hStr);
        const d1 = BigInt(d1Str);
        const d2 = BigInt(d2Str);

        if (d1 === 0n) {
          document.getElementById('result').innerText = "빛-물체 거리는 0이 될 수 없습니다.";
          return;
        }

        const shadowLength = (h * d2) / d1;
        document.getElementById('result').innerText =
          "그림자 길이(BigInt): " + shadowLength.toString() + " m";
      } catch {
        // Number 모드
        const h = Number(hStr);
        const d1 = Number(d1Str);
        const d2 = Number(d2Str);

        if (d1 === 0) {
          document.getElementById('result').innerText = "빛-물체 거리는 0이 될 수 없습니다.";
          return;
        }

        const shadowLength = (h * d2) / d1;
        document.getElementById('result').innerText =
          "그림자 길이(Number): " + Math.round(shadowLength) + " m";
      }
    }

    // 물체 높이 역계산 (그림자 → 물체)
    function calculateObject() {
      const sStr = document.getElementById('shadowLength').value;
      const d1Str = document.getElementById('lightToObject').value;
      const d2Str = document.getElementById('lightToGround').value;

      try {
        // BigInt 모드
        const s = BigInt(sStr);
        const d1 = BigInt(d1Str);
        const d2 = BigInt(d2Str);

        if (d2 === 0n) {
          document.getElementById('result').innerText = "빛-바닥 거리는 0이 될 수 없습니다.";
          return;
        }

        const objectHeight = (s * d1) / d2;
        document.getElementById('result').innerText =
          "물체 높이(BigInt): " + objectHeight.toString() + " m";
      } catch {
        // Number 모드
        const s = Number(sStr);
        const d1 = Number(d1Str);
        const d2 = Number(d2Str);

        if (d2 === 0) {
          document.getElementById('result').innerText = "빛-바닥 거리는 0이 될 수 없습니다.";
          return;
        }

        const objectHeight = (s * d1) / d2;
        document.getElementById('result').innerText =
          "물체 높이(Number): " + Math.round(objectHeight) + " m";
      }
    }
  </script>
</body>
</html>
