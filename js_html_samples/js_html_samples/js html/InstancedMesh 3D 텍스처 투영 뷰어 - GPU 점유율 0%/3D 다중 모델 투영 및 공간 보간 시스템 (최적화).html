<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 다중 모델 투영 및 공간 보간 시스템 (최적화)</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #05050a; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>


<script>
  // 기본 씬/카메라/렌더러
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 12);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 중앙 모델 그룹 (5개)
  const modelGroup = new THREE.Group();
  const geometries = [
    new THREE.TorusKnotGeometry(0.7, 0.22, 64, 16),
    new THREE.BoxGeometry(0.9, 0.9, 0.9),
    new THREE.SphereGeometry(0.6, 24, 24),
    new THREE.ConeGeometry(0.6, 1.1, 24),
    new THREE.CylinderGeometry(0.5, 0.5, 1.1, 24)
  ];
  const positions = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0, 1.8, 0),
    new THREE.Vector3(0, -1.8, 0),
    new THREE.Vector3(-1.8, 0, 0),
    new THREE.Vector3(1.8, 0, 0)
  ];
  geometries.forEach((geo, i) => {
    const mesh = new THREE.Mesh(geo, new THREE.MeshNormalMaterial());
    mesh.position.copy(positions[i]);
    modelGroup.add(mesh);
  });
  scene.add(modelGroup);

  // 렌더타겟 (해상도 최적화: 512x512)
  const renderTarget = new THREE.WebGLRenderTarget(512, 512);

  // 셰이더 (카메라 시각 투영 + 3겹 보간)
  const customVertexShader = `
    varying vec3 vWorldPosition;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;
  const customFragmentShader = `
    uniform sampler2D tex;
    uniform float uInnerRadius;
    uniform float uOuterRadius;
    uniform float uCurrentRadius;
    varying vec3 vWorldPosition;
    varying vec2 vUv;
    void main() {
      // 카메라 시각에 맞춘 투영 (구면 좌표 변환)
      vec3 radialDir = normalize(vWorldPosition);
      float phi = atan(radialDir.z, radialDir.x);
      float theta = acos(radialDir.y);
      vec2 projectedUv = vec2((phi / (3.141592*2.0)) + 0.5, theta / 3.141592);

      vec4 projectedColor = texture2D(tex, projectedUv);
      if(projectedColor.a < 0.1) projectedColor = vec4(0.02,0.02,0.05,0.1);

      // 거리 기반 보간
      float spaceDistance = uOuterRadius - uInnerRadius;
      float currentOffset = uCurrentRadius - uInnerRadius;
      float f = clamp(currentOffset / spaceDistance, 0.0, 1.0);
      vec4 innerColor = vec4(projectedColor.rgb, 0.9);
      vec4 outerColor = vec4(projectedColor.rgb*0.3, 0.2);
      vec4 finalColor = mix(innerColor, outerColor, f);

      // 경계선 강조
      if(abs(length(vUv-0.5)-0.25)<0.01) finalColor = vec4(0.0,1.0,0.6,1.0);

      gl_FragColor = finalColor;
    }
  `;

  // 3겹 구 레이어
  const layerRadii = [3.5, 5.5, 7.5];
  const layers = [];
  for(let i=0;i<3;i++){
    const r = layerRadii[i];
    const inner = (i===0)?0.0:layerRadii[i-1];
    const outer = (i===2)?r+2.0:layerRadii[i+1];
    const geo = new THREE.SphereGeometry(r, 32, 32); // 세그먼트 최적화
    const mat = new THREE.ShaderMaterial({
      uniforms:{
        tex:{value:renderTarget.texture},
        uInnerRadius:{value:inner},
        uOuterRadius:{value:outer},
        uCurrentRadius:{value:r}
      },
      vertexShader:customVertexShader,
      fragmentShader:customFragmentShader,
      side:THREE.DoubleSide,
      transparent:true
    });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);
    layers.push(mesh);
  }

  // 애니메이션 루프
  function animate(){
    requestAnimationFrame(animate);
    modelGroup.children.forEach(m=>{
      m.rotation.x += 0.005;
      m.rotation.y += 0.008;
    });

    // 모델만 렌더타겟에 굽기
    layers.forEach(l=>l.visible=false);
    renderer.setRenderTarget(renderTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    layers.forEach(l=>l.visible=true);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
</script>
</body>
</html>
