<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WEBGL loseContext Auto Toggle</title>
</head>
<body>
<canvas id="glcanvas" width="300" height="300"></canvas>
<button id="start">Start Auto Toggle</button>
<button id="stop">Stop Auto Toggle</button>

<script>
  const canvas = document.getElementById("glcanvas");
  const gl = canvas.getContext("webgl");
  let ext, intervalId;

  if (!gl) {
    alert("WebGL을 지원하지 않는 환경입니다.");
  } else {
    ext = gl.getExtension("WEBGL_lose_context");
    if (!ext) {
      alert("WEBGL_lose_context 확장을 지원하지 않습니다.");
    } else {
      // 자동 토글 시작
      document.getElementById("start").onclick = () => {
        if (!intervalId) {
          intervalId = setInterval(() => {
            ext.loseContext();
            console.log("컨텍스트 해제됨");
            setTimeout(() => {
              ext.restoreContext();
              console.log("컨텍스트 복구됨");
            }, 1500); // 1.5초 후 복구
          }, 3000); // 3초마다 반복
        }
      };

      // 자동 토글 중지
      document.getElementById("stop").onclick = () => {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
          console.log("자동 토글 중지됨");
        }
      };
    }
  }
</script>
</body>
</html>
