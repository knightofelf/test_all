<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 모델 투영</title>
  <style>body { margin:0; }</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script>
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // 메인 장면과 카메라
  const scene = new THREE.Scene();
  const mainCamera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  mainCamera.position.z = 10;

  // 소스 모델 장면
  const sourceScene = new THREE.Scene();
  const sourceCamera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
  sourceCamera.position.set(0, 2, 5);
  sourceCamera.lookAt(0,0,0);

  // 소스 모델 (박스)
  const sourceGeometry = new THREE.BoxGeometry(1,1,1);
  const sourceMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
  const sourceMesh = new THREE.Mesh(sourceGeometry, sourceMaterial);
  sourceScene.add(sourceMesh);

  // 렌더 타겟 생성
  const renderTarget = new THREE.WebGLRenderTarget(512, 512);

  // 타겟 모델 (구)
  const targetGeometry = new THREE.SphereGeometry(3, 64, 64);
  const targetMaterial = new THREE.MeshBasicMaterial({ map: renderTarget.texture });
  const targetMesh = new THREE.Mesh(targetGeometry, targetMaterial);
  scene.add(targetMesh);

  // 애니메이션 루프
  function animate() {
    requestAnimationFrame(animate);

    // 소스 모델 회전
    sourceMesh.rotation.x += 0.01;
    sourceMesh.rotation.y += 0.01;

    // 소스 장면을 렌더 타겟에 렌더링
    renderer.setRenderTarget(renderTarget);
    renderer.render(sourceScene, sourceCamera);
    renderer.setRenderTarget(null);

    // 메인 장면 렌더링
    targetMesh.rotation.y += 0.005;
    renderer.render(scene, mainCamera);
  }
  animate();
</script>
</body>
</html>
