<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Multi OFF Timer Example</title>
  <style>
    body { margin:0; overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const geometry = new THREE.BoxGeometry();
  const material = new THREE.MeshNormalMaterial();
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);

  let running = true;

  function animate(){
    requestAnimationFrame(animate);
    if (running) {
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
  }
  animate();

  // OFF 타이머들: 서로 다른 간격으로 running=false 실행
  setInterval(()=>{ running = false; }, 1);     // 1ms
  setInterval(()=>{ running = false; }, 10);    // 10ms
  setInterval(()=>{ running = false; }, 100);   // 100ms
  setInterval(()=>{ running = false; }, 1000);  // 1000ms
</script>
</body>
</html>
