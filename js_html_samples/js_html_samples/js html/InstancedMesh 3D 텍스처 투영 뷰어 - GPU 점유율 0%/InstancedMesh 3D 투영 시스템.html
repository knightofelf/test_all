<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstancedMesh 3D Texture Projection Viewer (점유율 최적화)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020205; color: #fff; font-family: sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #control-panel {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: rgba(5, 5, 12, 0.94); padding: 18px; border-radius: 8px;
            border: 1px solid rgba(0, 255, 170, 0.3); max-width: 360px; pointer-events: none;
        }
        h2 { margin: 0 0 10px 0; font-size: 14px; color: #00ffaa; text-transform: uppercase; letter-spacing: 0.5px; }
        p { margin: 0 0 6px 0; font-size: 12px; color: #ccc; line-height: 1.4; }
        .tag { display: inline-block; background: #ff0055; padding: 2px 5px; border-radius: 3px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="control-panel">
        <h2>InstancedMesh 3D 투영 시스템</h2>
        <p><span class="tag">GPU 0% OPTIMIZED</span> 단일 드로우콜 인스턴싱 기법을 적용하여 자원 소모를 극한으로 낮췄습니다.</p>
        <p><span class="tag" style="background:#0077ff;">PAGE 1 : STRUCT</span> Three.js WebGL 렌더러 파이프라인 및 360도 원근 트랙볼 구동</p>
        <p><span class="tag" style="background:#ffee00; color:#000;">PAGE 2 : GRAPHICS</span> shader5.js 기반의 가상 텍스처 매핑 및 3겹 사이 공간 보간 셰이더 연동</p>
    </div>

    <!-- 동일 폴더 내의 shader5.js 코어를 불러옵니다 -->
    <script src="./shader6.js"></script>
    <!-- Three.js 엔진 로컬 다운로드 오류 방지를 위한 임베디드 백업용 CDN 설정 -->
    <script src="https://jsdelivr.net"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof GL_INSTANCED_SHADERS === 'undefined') {
                document.body.innerHTML = "<h2 style='padding:20px; color:#fff;'>⚠️ shader5.js 로드 실패<br><span style='font-size:14px; color:#ccc;'>index.html과 동일한 폴더에 shader5.js 파일이 존재하는지 확인해 주세요.</span></h2>";
                return;
            }

            // 1. 기본 씬 및 하드웨어 가속 최적화 렌더러 설정
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 4.0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 픽셀 과부하 억제
            document.body.appendChild(renderer.domElement);

            // 2. [최적화 핵심] InstancedMesh 구조 설계 (단 1회의 드로우콜)
            // 가상 다면체를 표현할 경량 정점 데이터 지오메트리 셋업
            const baseGeometry = new THREE.BoxGeometry(0.18, 0.18, 0.18);
            
            // shader5.js의 알고리즘 코어를 주입한 맞춤형 ShaderMaterial 바인딩
            const instancedMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uTime: { value: 0 },
                    uCameraRot: { value: new THREE.Vector2(0.6, 0.3) }
                },
                vertexShader: GL_INSTANCED_SHADERS.vertex,
                fragmentShader: GL_INSTANCED_SHADERS.fragment,
                transparent: true,
                depthWrite: false
            });

            // 5개의 인스턴스 모델을 한 번에 그리는 물리적 커널 마운트
            const instanceCount = 5;
            const instancedMesh = new THREE.InstancedMesh(baseGeometry, instancedMaterial, instanceCount);

            // 각 인스턴스의 공간 고정 위치 행렬 주입 (CPU 오버헤드 0)
            const dummy = new THREE.Object3D();
            const positions = [
                [0.0, 0.0, 0.0],    // 1. 정중앙
                [0.0, 0.31, 0.0],   // 2. 상단
                [0.0, -0.31, 0.0],  // 3. 하단
                [-0.31, 0.0, 0.0],  // 4. 좌측
                [0.31, 0.0, 0.0]    // 5. 우측
            ];

            for (let i = 0; i < instanceCount; i++) {
                dummy.position.set(positions[i][0], positions[i][1], positions[i][2]);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedMesh);

            // 360도 인터랙션 카메라 트랙볼
            let isDragging = false;
            let rotX = 0.6, rotY = 0.3;
            let targetRotX = 0.6, targetRotY = 0.3;
            let prevX = 0, prevY = 0;

            window.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dX = e.clientX - prevX; const dY = e.clientY - prevY;
                targetRotX += dX * 0.005; targetRotY += dY * 0.005;
                targetRotY = Math.max(-1.4, Math.min(1.4, targetRotY));
                prevX = e.clientX; prevY = e.clientY;
            });
            window.addEventListener('mouseup', () => isDragging = false);

            // 3. 고성능 저부하 프레임 가동 루프
            function animate(now) {
                requestAnimationFrame(animate);

                rotX += (targetRotX - rotX) * 0.15;
                rotY += (targetRotY - rotY) * 0.15;

                // 유니폼 변수를 다이렉트로 업데이트하여 GPU 버퍼 갱신 최소화 (점유율 소거)
                instancedMaterial.uniforms.uTime.value = now * 0.001;
                instancedMaterial.uniforms.uCameraRot.value.set(rotX, rotY);

                renderer.render(scene, camera);
            }
            requestAnimationFrame(animate);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                instancedMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
