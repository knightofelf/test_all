<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>랜덤 데이터 그라데이션</title>
  <style>
    canvas { border:1px solid #ccc; margin:10px; }
  </style>
</head>
<body>
  <h2>랜덤 데이터 → 그라데이션 이미지</h2>
  <button onclick="generate()">랜덤 생성</button>
  <div>
    <canvas id="mainCanvas" width="256" height="256"></canvas>
    <canvas id="rCanvas" width="256" height="256"></canvas>
    <canvas id="gCanvas" width="256" height="256"></canvas>
    <canvas id="bCanvas" width="256" height="256"></canvas>
  </div>

<script>
function generate() {
  const size = 256;
  const mainCtx = document.getElementById("mainCanvas").getContext("2d");
  const rCtx = document.getElementById("rCanvas").getContext("2d");
  const gCtx = document.getElementById("gCanvas").getContext("2d");
  const bCtx = document.getElementById("bCanvas").getContext("2d");

  let imgData = mainCtx.createImageData(size, size);
  let rData = rCtx.createImageData(size, size);
  let gData = gCtx.createImageData(size, size);
  let bData = bCtx.createImageData(size, size);

  for (let i=0; i < imgData.data.length; i+=4) {
    // 랜덤 데이터 → RGB 값
    let r = Math.floor(Math.random()*256);
    let g = Math.floor(Math.random()*256);
    let b = Math.floor(Math.random()*256);

    // 메인 이미지
    imgData.data[i]   = r;
    imgData.data[i+1] = g;
    imgData.data[i+2] = b;
    imgData.data[i+3] = 255;

    // R 채널
    rData.data[i]   = r;
    rData.data[i+1] = 0;
    rData.data[i+2] = 0;
    rData.data[i+3] = 255;

    // G 채널
    gData.data[i]   = 0;
    gData.data[i+1] = g;
    gData.data[i+2] = 0;
    gData.data[i+3] = 255;

    // B 채널
    bData.data[i]   = 0;
    bData.data[i+1] = 0;
    bData.data[i+2] = b;
    bData.data[i+3] = 255;
  }

  mainCtx.putImageData(imgData,0,0);
  rCtx.putImageData(rData,0,0);
  gCtx.putImageData(gData,0,0);
  bCtx.putImageData(bData,0,0);
}

// 저장 예시: document.getElementById("mainCanvas").toDataURL("image/png")
</script>
</body>
</html>
