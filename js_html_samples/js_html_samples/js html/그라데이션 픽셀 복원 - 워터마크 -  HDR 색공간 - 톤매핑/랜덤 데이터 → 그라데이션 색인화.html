<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>랜덤 데이터 그라데이션 색인화</title>
  <style>
    canvas { border:1px solid #ccc; margin:10px; }
  </style>
</head>
<body>
  <h2>랜덤 데이터 → 그라데이션 색인화</h2>
  <button onclick="generate()">랜덤 그라데이션 생성</button>
  <canvas id="gradCanvas" width="256" height="256"></canvas>

<script>
function generate() {
  const size = 256;
  const ctx = document.getElementById("gradCanvas").getContext("2d");
  let imgData = ctx.createImageData(size, size);

  // 그라데이션 팔레트 생성 (0~255 단계)
  let palette = [];
  for (let i=0; i<256; i++) {
    palette.push([i, 255-i, (i*2)%256]); // 예시: R은 증가, G는 감소, B는 반복
  }

  for (let i=0; i<imgData.data.length; i+=4) {
    // 랜덤 값 → 팔레트 인덱스
    let rnd = Math.floor(Math.random()*256);
    let [r,g,b] = palette[rnd];

    imgData.data[i]   = r;
    imgData.data[i+1] = g;
    imgData.data[i+2] = b;
    imgData.data[i+3] = 255;
  }

  ctx.putImageData(imgData,0,0);
}
</script>
</body>
</html>
