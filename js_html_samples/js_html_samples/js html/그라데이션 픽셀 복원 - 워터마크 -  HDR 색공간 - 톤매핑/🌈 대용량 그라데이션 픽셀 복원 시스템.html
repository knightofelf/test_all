<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대용량 그라데이션 픽셀 완전 복원 시스템</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #111; color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; }
        .btn-group { margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-gen { background: #4caf50; color: white; }
        .btn-vis { background: #00bcd4; color: white; }
        .btn-res { background: #e91e63; color: white; }
        button:hover { filter: brightness(1.2); }
        .status-box { background: #222; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-family: monospace; line-height: 1.6; }
        .canvas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #222; padding: 15px; border-radius: 8px; text-align: center; }
        canvas { background: #000; width: 100%; max-width: 400px; height: 400px; display: block; margin: 10px auto 0; image-rendering: auto; }
        .highlight { color: #00bcd4; font-weight: bold; }
        .success { color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌈 대용량 그라데이션 픽셀 복원 시스템</h2>
    <p>1MB 대용량 숫자를 연속적인 흐름으로 배치하여 아름다운 <b>2차원 그라데이션 맵</b>을 형성하고, 이를 다시 숫자로 역산합니다.</p>

    <div class="status-box">
        <div>• 현재 데이터 크기: <span id="dataSizeStatus" class="highlight">0 Bytes</span></div>
        <div>• 그라데이션 생성 속도: <span id="visTimeStatus">-</span></div>
        <div>• 픽셀 복원 검증 상태: <span id="resStatus">-</span></div>
    </div>

    <div class="btn-group">
        <button class="btn-gen" onclick="generateGradientData(1024)">1) 1KB 그라데이션 생성</button>
        <button class="btn-gen" onclick="generateGradientData(10240)">10KB 그라데이션 생성</button>
        <button class="btn-gen" onclick="generateGradientData(102400)">100KB 그라데이션 생성</button>
        <button class="btn-gen" onclick="generateGradientData(1024 * 1024)">1MB 그라데이션 생성 (1,048,576개)</button>
    </div>

    <div class="btn-group">
        <button class="btn-vis" onclick="visualizeGradient()">2. 부드러운 그라데이션 시각화 🎨</button>
        <button class="btn-res" onclick="restoreFromGradient()">3. 그라데이션 픽셀 전체 복원 🔍</button>
    </div>

    <div class="canvas-grid">
        <div class="card">
            <h3>대용량 2D/3D 고밀도 그라데이션 매핑</h3>
            <p style="font-size:12px; color:#aaa;">좌상단에서 우하단으로 갈수록 숫자가 커지며 색상이 신비롭게 변합니다.</p>
            <canvas id="gradientCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    let originalData = []; // 원본 데이터 배열

    // 1. 그라데이션 시각화를 위해 연속적이고 매끄러운 대용량 숫자 데이터 생성
    function generateGradientData(size) {
        originalData = [];
        const buffer = new Uint8Array(size);
        
        // 0부터 255까지의 숫자가 공간 전체에 부드럽게 점진적으로 배치되도록 수학적 설계
        for (let i = 0; i < size; i++) {
            // 위치(i)에 비례하여 0~255 사이의 값이 순차적/파동형으로 흐르도록 설정
            buffer[i] = Math.floor((i / size) * 256); 
        }
        originalData = Array.from(buffer);
        
        let sizeText = size >= 1024 * 1024 ? (size / (1024*1024)).toFixed(0) + " MB" : (size / 1024).toFixed(0) + " KB";
        document.getElementById('dataSizeStatus').innerText = `${sizeText} (${originalData.length.toLocaleString()} 개의 그라데이션 숫자)`;
        document.getElementById('resStatus').innerText = "-";
        document.getElementById('visTimeStatus').innerText = "-";
    }

    // 2. 데이터를 컬러 채널에 정밀 분산하여 부드러운 그라데이션 화면으로 출력
    function visualizeGradient() {
        if (originalData.length === 0) return alert("데이터를 먼저 생성해주세요.");

        const startTime = performance.now();
        const canvas = document.getElementById('gradientCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // 데이터 수 기반 정사각형 면적 해상도 연산 (1MB = 1024x1024)
        const side = Math.ceil(Math.sqrt(originalData.length));
        canvas.width = side;
        canvas.height = side;

        const imgData = ctx.createImageData(side, side);
        const dataBuffer = imgData.data;

        for (let i = 0; i < originalData.length; i++) {
            const val = originalData[i]; // 0 ~ 255
            const pixelIndex = i * 4;

            // [그라데이션 인코딩 매핑 공식]
            // 원본 숫자(val)를 고스란히 R 채널에 보존하면서, 
            // G와 B 채널에 수학적 사인/코사인 파동을 주어 눈이 편안한 청록-자해빛 고급 그라데이션 구현
            dataBuffer[pixelIndex]     = val;                                         // R (원본 데이터 1:1 보존)
            dataBuffer[pixelIndex + 1] = Math.floor(Math.sin(val / 255 * Math.PI) * 150); // G (중간 영역을 밝게)
            dataBuffer[pixelIndex + 2] = 255 - Math.floor(val * 0.7);                 // B (점진적 감소)
            dataBuffer[pixelIndex + 3] = 255;                                         // A (투명도 100%)
        }

        ctx.putImageData(imgData, 0, 0);
        
        const endTime = performance.now();
        document.getElementById('visTimeStatus').innerText = `${(endTime - startTime).toFixed(2)} ms (그라데이션 렌더링 완료)`;
    }

    // 3. 그라데이션 화면의 픽셀들을 전부 뜯어내어 100% 무손실 복원
    function restoreFromGradient() {
        const canvas = document.getElementById('gradientCanvas');
        const ctx = canvas.getContext('2d');
        
        if (canvas.width === 0 || originalData.length === 0) {
            return alert("시각화된 그라데이션 픽셀이 없습니다.");
        }

        const startTime = performance.now();

        // 캔버스 화면의 전 영역 픽셀 추출
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const dataBuffer = imgData.data;
        
        let restoredArray = [];
        const totalTargetCount = originalData.length;

        // 전체 픽셀 버퍼를 고속 순회하며 원본 숫자가 심어진 Red 채널 데이터 수집
        for (let i = 0; i < totalTargetCount; i++) {
            const pixelIndex = i * 4;
            const r = dataBuffer[pixelIndex]; // 숨겨진 오리지널 데이터 추출
            restoredArray.push(r);
        }

        const endTime = performance.now();
        const executionTime = (endTime - startTime).toFixed(2);

        // 검증 알고리즘: 원본 데이터와 픽셀 추출 데이터가 단 1의 오차도 없는지 전수 대조
        let isPerfect = true;
        for (let i = 0; i < originalData.length; i++) {
            if (originalData[i] !== restoredArray[i]) {
                isPerfect = false;
                break;
            }
        }

        if (isPerfect) {
            document.getElementById('resStatus').innerHTML = 
                `<span class="success">그라데이션 100% 복원 성공! ✅</span> (스캔 소요 시간: ${executionTime} ms)<br>` + 
                `• 검증 결과: 그라데이션의 모든 미세 픽셀 색상이 원본 숫자와 완벽히 대조·일치합니다.<br>` +
                `• 복원 데이터 샘플(앞 10개): [${restoredArray.slice(0, 10).join(', ')}...]`;
        } else {
            document.getElementById('resStatus').innerText = "복원 오류 발생 ❌";
        }
    }

    // 초기 상태 실행
    window.onload = () => {
        generateGradientData(1024);
    };
</script>

</body>
</html>
