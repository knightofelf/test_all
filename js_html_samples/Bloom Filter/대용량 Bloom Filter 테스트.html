<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대용량 Bloom Filter</title>
</head>
<body>
  <h2>대용량 Bloom Filter 테스트</h2>
  <button onclick="insertMany()">100만 개 삽입</button>
  <button onclick="checkSample()">샘플 확인</button>
  <pre id="output"></pre>

  <script>
    class BloomFilter {
      constructor(size = 1_000_000, hashCount = 5) {
        this.size = size;
        this.hashCount = hashCount;
        this.bits = new Uint8Array(size); // 메모리 효율적
      }

      hash(value, seed) {
        let hash = 0;
        for (let char of value) {
          hash = (hash * seed + char.charCodeAt(0)) % this.size;
        }
        return hash;
      }

      add(value) {
        for (let i = 1; i <= this.hashCount; i++) {
          const h = this.hash(value, 17 + i * 2);
          this.bits[h] = 1;
        }
      }

      contains(value) {
        for (let i = 1; i <= this.hashCount; i++) {
          const h = this.hash(value, 17 + i * 2);
          if (this.bits[h] === 0) return false;
        }
        return true; // false positive 가능성 있음
      }

      efficiency() {
        let setBits = 0;
        for (let b of this.bits) if (b === 1) setBits++;
        const usage = (setBits / this.size) * 100;
        return `비트 사용률: ${usage.toFixed(2)}%`;
      }
    }

    const bloom = new BloomFilter();

    function insertMany() {
      for (let i = 0; i < 1_000_000; i++) {
        bloom.add("item" + i);
      }
      document.getElementById('output').textContent = "100만 개 삽입 완료!\n" + bloom.efficiency();
    }

    function checkSample() {
      const test1 = bloom.contains("item500000") ? "존재할 가능성 있음 ✅" : "없음 ❌";
      const test2 = bloom.contains("randomValue") ? "존재할 가능성 있음 ✅" : "없음 ❌";
      document.getElementById('output').textContent =
        `item500000: ${test1}\nrandomValue: ${test2}\n${bloom.efficiency()}`;
    }
  </script>
</body>
</html>
