<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RSA Demo</title>
</head>
<body>
  <h2>RSA 문자열 암호화/복호화</h2>
  <input id="message" placeholder="메시지 입력">
  <button onclick="encrypt()">Encrypt</button>
  <button onclick="decrypt()">Decrypt</button>
  
  <p>암호문: <span id="cipher"></span></p>
  <p>복호문: <span id="plain"></span></p>
<script>
  // 큰 소수 사용 (예시용, 보안에는 부족)
  const p = 211, q = 223;
  const n = p * q;              // 47053
  const phi = (p - 1) * (q - 1);
  const e = 17;
  // d는 e*d ≡ 1 mod phi 를 만족하는 값
  function modInverse(e, phi) {
    let [a, b] = [phi, e];
    let [x0, x1] = [0, 1];
    while (b !== 0) {
      let q = Math.floor(a / b);
      [a, b] = [b, a % b];
      [x0, x1] = [x1, x0 - q * x1];
    }
    return (x0 + phi) % phi;
  }
  const d = modInverse(e, phi);

  function modPow(base, exp, mod) {
    let result = 1n;
    let b = BigInt(base);
    let eBig = BigInt(exp);
    let m = BigInt(mod);
    while (eBig > 0) {
      if (eBig % 2n === 1n) result = (result * b) % m;
      b = (b * b) % m;
      eBig = eBig / 2n;
    }
    return result;
  }

  let cipherArray = [];

  function encrypt() {
    const msg = document.getElementById("message").value;
    const encoder = new TextEncoder(); // UTF-8
    const bytes = encoder.encode(msg);

    cipherArray = [];
    for (let b of bytes) {
      const cipher = modPow(b, e, n);
      cipherArray.push(cipher.toString());
    }
    document.getElementById("cipher").innerText = cipherArray.join(" ");
  }

  function decrypt() {
    const decoder = new TextDecoder();
    let bytes = [];
    for (let c of cipherArray) {
      const m = Number(modPow(BigInt(c), d, n));
      bytes.push(m);
    }
    const plain = decoder.decode(new Uint8Array(bytes));
    document.getElementById("plain").innerText = plain;
  }
</script>


</body>
</html>

<!--
### 🔑 RSA 기본 흐름
1. 두 개의 큰 소수 \(p, q\) 선택  
2. \(n = p \cdot q\), \(\varphi(n) = (p-1)(q-1)\) 계산  
3. 공개키 \(e\) 선택 (보통 65537)  
4. 개인키 \(d\) 계산 (\(d \cdot e \equiv 1 \pmod{\varphi(n)}\))  
5. 암호화: \(c = m^e \mod n\)  
6. 복호화: \(m = c^d \mod n\)  
//-->
