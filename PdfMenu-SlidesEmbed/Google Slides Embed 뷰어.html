<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Google Slides Embed 뷰어</title>
  <style>
    #doc-menu { list-style:none; display:flex; gap:10px; }
    #doc-menu li { cursor:pointer; padding:5px 10px; border:1px solid #007bff; border-radius:4px; }
    #doc-menu li.active { background:#007bff; color:white; }
    #doc-viewer { margin-top:20px; }
  </style>
</head>
<body>
  <ul id="doc-menu">
    <li data-slide="0" class="active">소개</li>
    <li data-slide="1">알고리즘</li>
  </ul>

  <!-- 구글 슬라이드 공식 embed iframe -->
  <div id="doc-viewer">
    <iframe id="slide-frame"
      src="https://docs.google.com/presentation/d/1Mvosv5mAgcLlO58Yd2VqXmsvEkrpsi7itTeD_kUlqPc/edit?usp=sharing"
      frameborder="0" width="960" height="569" allowfullscreen="true"></iframe>
  </div>

  <script>
    document.querySelectorAll('#doc-menu li').forEach(function(item){
      item.addEventListener('click', function(){
        document.querySelectorAll('#doc-menu li').forEach(li => li.classList.remove('active'));
        this.classList.add('active');
        // 슬라이드 전환은 embed URL의 slide=id 파라미터를 바꿔야 함
        // 실제로는 구글 슬라이드에서 "웹에 게시" 후 얻은 embed URL을 사용해야 합니다.
      });
    });
  </script>
</body>
</html>
