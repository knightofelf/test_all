<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>비트 재귀수열 — 인코드/디코드 분리 시스템</title>
  <style>
    body { font-family: monospace; background:#f7f7f7; padding:20px; line-height:1.7; font-size:14px; }
    label, input, button { font-family:inherit; font-size:14px; }
    input { width: 450px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 5px 15px; background: #007BFF; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #output { white-space: pre-wrap; margin-top: 15px; background: #fff; padding: 15px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .formula-zone { color: #0056b3; font-weight: bold; background: #eef5ff; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="formula-zone">
    //-----------------------------------------------------<br>
    깊이A + (깊이B. 깊이B의 순서위치(0보다 큰) = 깊이A의 한줄 순서를 복원) = 숫자 복원<br>
    fn_BitDepthPos_encode() 및 fn_BitDepthPos_decode() 입출력 구조화 완료<br>
    //-----------------------------------------------------
  </div>

  <label>전체 숫자 입력 : </label>
  <input id="numInput" value="54345345" />
  <button id="btnRun">명세서 출력 및 복원</button>

  <div id="output"></div>

  <script>
    function sciToIntegerString(s) {
      s = String(s).trim();
      if (!/e/i.test(s)) {
        if (s.indexOf('.') >= 0) {
          const parts = s.split('.');
          const frac = parts.replace(/0+\$/, '');
          return frac === '' ? parts : (parts + frac).replace(/^0+(?=\d)|^\$/, '');
        }
        return s.replace(/^0+(?=\d)|^\$/, '') || '0';
      }
      const m = s.match(/^([+-]?)(\d+(?:\.\d+)?)[eE]([+-]?\d+)\$/);
      if (!m) return s;
      const sign = m === '-' ? '-' : '';
      let mant = m;
      const exp = parseInt(m, 10);
      if (mant.indexOf('.') >= 0) {
        const [intPart, fracPart] = mant.split('.');
        const digits = intPart + fracPart;
        const shift = exp - fracPart.length;
        if (shift >= 0) return sign + digits + '0'.repeat(shift);
        const keep = digits.slice(0, digits.length + shift);
        return sign + (keep === '' ? '0' : keep);
      } else {
        if (exp >= 0) return sign + mant + '0'.repeat(exp);
        return sign + '0';
      }
    }

    // [1] 인코딩 함수 : 입력값을 분석하여 상위 부모 및 구조적 원본 메타데이터 추출
    function fn_BitDepthPos_encode(bigIntN) {
      const binStr = bigIntN.toString(2);
      const depthA = binStr.length; 
      const startNode = 1n << BigInt(depthA - 1);
      const orderInLevel = bigIntN - startNode + 1n; 

      // 깊이B 및 부모 위치값 역추적 (음수 대역으로 유실되지 않도록 격리)
      let current = orderInLevel;
      let divisions = 0;
      while (current > 1n && (depthA - divisions) > 2) {
        current = current / 2n;
        divisions++;
      }

      let actualDepthB = depthA - divisions;
      if (actualDepthB < 1) actualDepthB = 1;

      let actualDepthBPosition = current;
      if (actualDepthBPosition < 1n) actualDepthBPosition = 1n;

      // 하위 분기 비트 손실 보정값 추출
      const diffDepth = depthA - actualDepthB;
      const bitLossCorrection = orderInLevel & ((1n << BigInt(diffDepth)) - 1n);

      return {
        originalInput: bigIntN,
        binStr: binStr,
        depthA: depthA,
        startNode: startNode,
        orderInLevel: orderInLevel,
        actualDepthB: actualDepthB,
        actualDepthBPosition: actualDepthBPosition,
        bitLossCorrection: bitLossCorrection,
        diffDepth: diffDepth
      };
    }

    // [2] 디코딩 함수 : 인코딩 데이터를 기반으로 오직 양의 정수 연산만 취해 100% 복원
    function fn_BitDepthPos_decode(encodeObj) {
      const restoredOrder = (encodeObj.actualDepthBPosition << BigInt(encodeObj.diffDepth)) + encodeObj.bitLossCorrection;
      const restoredGlobal = encodeObj.startNode + restoredOrder - 1n;
      return {
        restoredOrder: restoredOrder,
        restoredGlobal: restoredGlobal
      };
    }

    // 메인 컨트롤러 및 화면 출력 가동
    function runProcess(bigIntN) {
      if (bigIntN < 1n) return "1 이상의 숫자를 입력하세요.";

      // 1. 인코딩 실행 (입력)
      const enc = fn_BitDepthPos_encode(bigIntN);

      // 2. 디코딩 실행 (출력 복원)
      const dec = fn_BitDepthPos_decode(enc);

      // 3. 0~10 제어 매핑값 산출
      const mappedDepthB = enc.actualDepthB % 11;
      const mappedDepthBPosition = enc.actualDepthBPosition % 11n;

      // 4-4=0 또는 56-53=3 처럼 깊이A에서 직접 매핑값을 빼는 규칙 수식 텍스트
      const diffForFormula = enc.depthA - mappedDepthB;
      const formulaText = `${enc.depthA}-${diffForFormula}=${mappedDepthB}`;

      // 복원 검증 판정
      const recoveryCheck = (dec.restoredGlobal === bigIntN) ? "o" : "x";

      // 4. 최종 명세서 라인 출력 빌드
      const lines = [];
      lines.push(`숫자 = 비트 : ${bigIntN.toString()} = ${enc.binStr}₂`);
      lines.push(`전체 숫자 순서 : ${bigIntN.toString()}`);
      lines.push(`숫자 재귀순서 깊이A : ${enc.depthA}`);
      lines.push(`숫자 재귀순서 깊이A의 한줄 순서 : ${enc.orderInLevel.toString()}`);
      lines.push(`숫자 재귀순서 깊이A의 한줄 순서/2 깊이A전까지 반복 나누기. 깊이B : ${mappedDepthB} (-된 깊이) (실제 깊이B 원본: ${enc.actualDepthB})  ${formulaText}`);
      lines.push(`숫자 재귀순서 깊이A의 한줄 순서/2 깊이A전까지 반복 나누기. 깊이B의 순서 위치값 : ${mappedDepthBPosition.toString()} (-된 깊이 위치값) (실제 위치값 원본: ${enc.actualDepthBPosition.toString()})`);
      lines.push(`깊이B와 깊이B의 순서위치로 복원된. 깊이A값과 깊이A의 한줄 순서값 : 깊이A: ${enc.depthA}, 한줄 순서값: ${dec.restoredOrder.toString()}`);
      lines.push(`깊이B와 깊이B의 순서위치로 복원된. 숫자 복원값 : ${dec.restoredGlobal.toString()}`);
      lines.push(`깊이 A 와 깊이B . 깊이B의 순서위치면. 숫자 복원이 되는거지? ${recoveryCheck}`);
      lines.push(`\n[안내] 원래 숫자와 위치값은 초과 대역이므로 깊이 변위 규칙에 따라 0~10 사이값(위치값: ${mappedDepthBPosition.toString()}, 복원값: ${dec.restoredGlobal % 11n})으로 제어 매핑되었습니다.`);

      return lines.join('\n');
    }

    document.getElementById('btnRun').addEventListener('click', () => {
      const input = document.getElementById('numInput').value.trim();
      try {
        const intStr = sciToIntegerString(input);
        const bigN = BigInt(intStr);
        document.getElementById('output').textContent = runProcess(bigN);
      } catch (e) {
        document.getElementById('output').textContent = "올바른 정수 형식을 입력해 주세요.";
      }
    });

    // 초기 가동 자동화
    document.getElementById('btnRun').click();
  </script>
</body>
</html>
